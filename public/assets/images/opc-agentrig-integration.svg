<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">OpenKnowledge Orca and AgentRig integration</title>
  <desc id="desc">A dark integration diagram showing OpenKnowledge as company memory, Orca as fleet coordination, Agent CLI as execution, and AgentRig as the project-local task and review layer.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.memory{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.orca{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.cli{fill:#17263b;stroke:#587692;stroke-width:2}.rig{fill:#332b1d;stroke:#e2b866;stroke-width:2}.work{fill:#17343a;stroke:#7ee0d1;stroke-width:2}.text{fill:#e7eef6;font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.purple{stroke:#ba79c7;stroke-width:3;fill:none;marker-end:url(#arrow)}.yellow{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="820"/><text class="text" x="65" y="68" font-size="36" font-weight="700">Keep memory, coordination, execution, and review separate</text><text class="small" x="65" y="103">The OPC stack works when each tool owns one clear boundary.</text>
  <rect class="memory" x="65" y="220" width="315" height="220" rx="20"/><text class="label" x="105" y="265">OPENKNOWLEDGE</text><text class="text" x="105" y="315">Company memory</text><text class="small" x="105" y="360">Markdown · search · graph</text><text class="small" x="105" y="395">roles · BAU · guardrails</text>
  <rect class="orca" x="500" y="220" width="315" height="220" rx="20"/><text class="label" x="540" y="265">ORCA</text><text class="text" x="540" y="315">Fleet coordination</text><text class="small" x="540" y="360">assigns role agents</text><text class="small" x="540" y="395">parallel runtime</text>
  <rect class="cli" x="935" y="150" width="260" height="140" rx="16"/><text class="label" x="975" y="195">EXECUTION</text><text class="text" x="975" y="240">Claude / Codex</text><text class="small" x="975" y="270">OpenCode / Antigravity</text><rect class="cli" x="1250" y="150" width="260" height="140" rx="16"/><text class="label" x="1290" y="195">EXECUTION</text><text class="text" x="1290" y="240">Role agent</text><text class="small" x="1290" y="270">skills and tools</text>
  <path class="purple" d="M380 315 L500 315"/><path class="line" d="M815 300 L935 220"/><path class="line" d="M815 350 L1250 220"/>
  <rect class="rig" x="500" y="555" width="315" height="190" rx="20"/><text class="label" x="540" y="600">AGENTRIG</text><text class="text" x="540" y="650">Project workflow</text><text class="small" x="540" y="690">tasks · handoffs · review</text><text class="small" x="540" y="720">local durable evidence</text>
  <rect class="work" x="935" y="555" width="575" height="190" rx="20"/><text class="label" x="975" y="600">OUTPUT</text><text class="text" x="975" y="650">Business work and project changes</text><text class="small" x="975" y="695">approved result → write back to wiki</text>
  <path class="yellow" d="M650 440 L650 555"/><path class="line" d="M815 650 L935 650"/><path class="purple" d="M935 700 C800 780 500 780 380 395"/>
  <rect class="memory" x="65" y="555" width="315" height="190" rx="20"/><text class="label" x="105" y="600">FEEDBACK</text><text class="text" x="105" y="650">New company memory</text><text class="small" x="105" y="695">reviewed outcome and state</text>
</svg>
