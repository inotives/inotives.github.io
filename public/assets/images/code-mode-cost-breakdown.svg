<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">What 18 runs cost, and where the money went</title>
  <desc id="desc">Two stacked bars. Code Mode off: $2.74 total, cache writes $2.3, cache reads $0.257, output $0.187. Code Mode on: $2.12 total, cache writes $1.771, cache reads $0.151, output $0.201.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="370" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">What 18 runs cost, and where the money went</text>
<text x="45" y="85" fill="#a9bdd0" font-size="16">All six tasks × 3 runs per mode at Sonnet 5.5 list prices ($2/$10 per M tokens, cache read $0.10, 1-hour cache write $4)</text>
<line x1="300" y1="120" x2="300" y2="290" stroke="#22344a"/><text x="300" y="308" fill="#6f8aa3" font-size="12" text-anchor="middle">$0</text><line x1="560" y1="120" x2="560" y2="290" stroke="#22344a"/><text x="560" y="308" fill="#6f8aa3" font-size="12" text-anchor="middle">$1</text><line x1="820" y1="120" x2="820" y2="290" stroke="#22344a"/><text x="820" y="308" fill="#6f8aa3" font-size="12" text-anchor="middle">$2</text><line x1="1080" y1="120" x2="1080" y2="290" stroke="#22344a"/><text x="1080" y="308" fill="#6f8aa3" font-size="12" text-anchor="middle">$3</text><text x="45" y="164" fill="#f6f9fc" font-size="16" font-weight="700">Code Mode off</text><text x="45" y="184" fill="#6f8aa3" font-size="13">$2.74 total</text><rect x="300.0" y="140" width="598.0" height="50" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><text x="310" y="170" fill="#0b1522" font-size="13" font-weight="700">cache writes $2.30</text><rect x="900.0" y="140" width="66.8" height="50" rx="4" fill="#8a7fe0" fill-opacity="0.55"/><rect x="968.8" y="140" width="48.6" height="50" rx="4" fill="#8a7fe0" fill-opacity="0.3"/><text x="1027.44" y="162" fill="#a9bdd0" font-size="12">reads $0.26</text><text x="1027.44" y="180" fill="#a9bdd0" font-size="12">output $0.19</text>
<text x="45" y="244" fill="#f6f9fc" font-size="16" font-weight="700">Code Mode on</text><text x="45" y="264" fill="#6f8aa3" font-size="13">$2.12 total</text><rect x="300.0" y="220" width="460.5" height="50" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><text x="310" y="250" fill="#0b1522" font-size="13" font-weight="700">cache writes $1.77</text><rect x="762.5" y="220" width="39.3" height="50" rx="4" fill="#2fa9a0" fill-opacity="0.55"/><rect x="803.7" y="220" width="52.3" height="50" rx="4" fill="#2fa9a0" fill-opacity="0.3"/><text x="865.9799999999999" y="242" fill="#a9bdd0" font-size="12">reads $0.15</text><text x="865.9799999999999" y="260" fill="#a9bdd0" font-size="12">output $0.20</text>
<text x="45" y="340" fill="#f6f9fc" font-size="14">Cache writes are ~80% of the bill in both modes. Code Mode writes a smaller prefix (25k vs 32k tokens a session), so it saves 23% overall.</text>
  </g>
</svg>
