<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">A mirror beats a carrot</title>
  <desc id="desc">Results from a preregistered experiment with 704 participants learning fraction arithmetic with an LLM assistant. Share of items where people asked for the full answer: AI only 18 percent, metacognitive feedback 13 percent, effort reward 15 percent, both 10 percent. Unaided test score afterwards: no AI 65 percent, AI only 62 percent, feedback 67 percent, reward 58 percent, both 64 percent. Feedback lowered offloading and improved test scores; the points reward had no detectable effect.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">A mirror beats a carrot</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">Showing people how they used the assistant worked. Paying them points for effort did not.</text>

    <!-- Left panel: offloading -->
    <rect x="45" y="110" width="540" height="330" rx="16" fill="#17283d" stroke="#75a8d5" stroke-opacity=".5"/>
    <text x="67" y="142" fill="#fff" font-size="18" font-weight="700">Asked for the full answer</text>
    <text x="67" y="163" fill="#a8cdec" font-size="13">share of learning items, lower is better</text>
    <g font-size="14">
      <text x="67" y="205" fill="#d4e6f7">AI only</text>
      <rect x="200" y="190" width="306" height="22" rx="4" fill="#6f8aa3"/>
      <text x="514" y="206" fill="#fff">18%</text>

      <text x="67" y="257" fill="#d4e6f7" font-weight="700">+ Feedback</text>
      <rect x="200" y="242" width="221" height="22" rx="4" fill="#5fc7a6"/>
      <text x="429" y="258" fill="#fff" font-weight="700">13%</text>

      <text x="67" y="309" fill="#d4e6f7">+ Points reward</text>
      <rect x="200" y="294" width="255" height="22" rx="4" fill="#e2a76f"/>
      <text x="463" y="310" fill="#fff">15%</text>

      <text x="67" y="361" fill="#d4e6f7">+ Both</text>
      <rect x="200" y="346" width="170" height="22" rx="4" fill="#a99bf0"/>
      <text x="378" y="362" fill="#fff">10%</text>
    </g>
    <text x="67" y="418" fill="#cdeee2" font-size="14">Feedback: odds of offloading × 0.47</text>

    <!-- Right panel: unaided test -->
    <rect x="615" y="110" width="540" height="330" rx="16" fill="#17283d" stroke="#75a8d5" stroke-opacity=".5"/>
    <text x="637" y="142" fill="#fff" font-size="18" font-weight="700">Unaided test score afterwards</text>
    <text x="637" y="163" fill="#a8cdec" font-size="13">share correct, higher is better</text>
    <g font-size="14">
      <text x="637" y="200" fill="#d4e6f7">No AI</text>
      <rect x="770" y="186" width="316" height="20" rx="4" fill="#3d5266"/>
      <text x="1094" y="201" fill="#fff">65%</text>

      <text x="637" y="242" fill="#d4e6f7">AI only</text>
      <rect x="770" y="228" width="301" height="20" rx="4" fill="#6f8aa3"/>
      <text x="1079" y="243" fill="#fff">62%</text>

      <text x="637" y="284" fill="#d4e6f7" font-weight="700">+ Feedback</text>
      <rect x="770" y="270" width="326" height="20" rx="4" fill="#5fc7a6"/>
      <text x="1104" y="285" fill="#fff" font-weight="700">67%</text>

      <text x="637" y="326" fill="#d4e6f7">+ Points reward</text>
      <rect x="770" y="312" width="282" height="20" rx="4" fill="#e2a76f"/>
      <text x="1060" y="327" fill="#fff">58%</text>

      <text x="637" y="368" fill="#d4e6f7">+ Both</text>
      <rect x="770" y="354" width="311" height="20" rx="4" fill="#a99bf0"/>
      <text x="1089" y="369" fill="#fff">64%</text>
    </g>
    <text x="637" y="418" fill="#cdeee2" font-size="14">Feedback: odds of a correct answer × 1.51</text>

    <text x="45" y="474" fill="#d4e6f7" font-size="15">The feedback was short: how you used the assistant, what that means for your practice, and a cue to check yourself.</text>
    <text x="45" y="502" fill="#7f95aa" font-size="12">Maier, Schwabe, Schneider &amp; Feuerriegel, "Designing Against Deskilling" (arXiv 2609.20143, Sep 2026). Preregistered, N = 704, fraction arithmetic, immediate test only.</text>
  </g>
</svg>
