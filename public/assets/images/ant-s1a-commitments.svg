<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Compute commitments in the amended S-1</title>
  <desc id="desc">Three stacked bars of the 895.4 billion dollar total. By counterparty: Google 121.3, SpaceXAI up to 120.5, Amazon 110.0, Microsoft 44.9, other 498.7. By timing: 69.8 in the next 12 months, 377.7 more through 2030, 447.9 from 2031 to 2045. By firmness: 681.6 firm and 213.8 contingent or terminable. Reference lines mark cash of 131.8 billion and the 417 billion figure in the playground.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#2a3a4d"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8fa6ba" stroke-width="3"/></pattern></defs>
  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="40" y="56" fill="#f6f9fc" font-size="28" font-weight="700">$895.4 billion of compute, three ways</text><text x="40" y="85" fill="#a9bdd0" font-size="16">The amendment’s first full figure for compute and infrastructure commitments, US$ billions.</text><text x="40" y="162" fill="#fff" font-size="15" font-weight="700">By counterparty</text><text x="40" y="182" fill="#8fa6ba" font-size="12">named minimums</text><rect x="260.0" y="140" width="117.2" height="50" rx="3" fill="#3987e5"/><text x="268" y="162" fill="#fff" font-size="12" font-weight="700">Google</text><text x="268" y="180" fill="#fff" font-size="12">$121.3B</text><rect x="379.2" y="140" width="116.4" height="50" rx="3" fill="#d95926"/><text x="387.2137592137592" y="162" fill="#fff" font-size="12" font-weight="700">SpaceXAI (up to)</text><text x="387.2137592137592" y="180" fill="#fff" font-size="12">$120.5B</text><rect x="497.6" y="140" width="106.1" height="50" rx="3" fill="#199e70"/><text x="505.6412776412776" y="162" fill="#fff" font-size="12" font-weight="700">Amazon</text><text x="505.6412776412776" y="180" fill="#fff" font-size="12">$110.0B</text><rect x="605.7" y="140" width="42.1" height="50" rx="3" fill="#c98500"/><line x1="627.8" y1="138" x2="627.8" y2="130" stroke="#a9bdd0"/><text x="627.8132678132678" y="126" fill="#e6eef6" font-size="12" font-weight="700" text-anchor="middle">Microsoft $44.9B</text><rect x="649.9" y="140" width="488.1" height="50" rx="3" fill="#55677a"/><text x="657.8771498771499" y="162" fill="#fff" font-size="12" font-weight="700">Other providers and leases</text><text x="657.8771498771499" y="180" fill="#fff" font-size="12">$498.7B</text><text x="40" y="262" fill="#fff" font-size="15" font-weight="700">By timing</text><text x="40" y="282" fill="#8fa6ba" font-size="12">when it is due</text><rect x="260.0" y="240" width="66.6" height="50" rx="3" fill="#9cc3f0"/><line x1="294.3" y1="238" x2="294.3" y2="230" stroke="#a9bdd0"/><text x="294.2997542997543" y="226" fill="#e6eef6" font-size="12" font-weight="700" text-anchor="middle">Next 12 months $69.8B</text><rect x="328.6" y="240" width="369.2" height="50" rx="3" fill="#3987e5"/><text x="336.59950859950857" y="262" fill="#fff" font-size="12" font-weight="700">Oct 2027 to 2030</text><text x="336.59950859950857" y="280" fill="#fff" font-size="12">$377.7B</text><rect x="699.8" y="240" width="438.2" height="50" rx="3" fill="#1d4f8f"/><text x="707.8034398034397" y="262" fill="#fff" font-size="12" font-weight="700">2031 to 2045</text><text x="707.8034398034397" y="280" fill="#fff" font-size="12">$447.9B</text><text x="40" y="362" fill="#fff" font-size="15" font-weight="700">By firmness</text><text x="40" y="382" fill="#8fa6ba" font-size="12">can it be cancelled?</text><rect x="260" y="340" width="667.9" height="50" rx="3" fill="#55677a"/><text x="268" y="362" fill="#fff" font-size="12" font-weight="700">Firm</text><text x="268" y="380" fill="#fff" font-size="12">$681.6B</text><rect x="929.9" y="340" width="208.1" height="50" rx="3" fill="url(#hatch)"/><rect x="935.9" y="348" width="148" height="36" rx="4" fill="#0b1522" fill-opacity="0.85"/><text x="941.8771498771499" y="362" fill="#fff" font-size="12" font-weight="700">Contingent or</text><text x="941.8771498771499" y="378" fill="#fff" font-size="12">terminable $213.8B</text><line x1="389.5" y1="400" x2="389.5" y2="480" stroke="#f6f9fc" stroke-dasharray="4 4" stroke-width="1.3"/><polygon points="383.5,398 395.5,398 389.5,406" fill="#f6f9fc"/><text x="397.53316953316954" y="440" fill="#f6f9fc" font-size="13" font-weight="700">Cash on hand $131.8B</text><line x1="669.8" y1="400" x2="669.8" y2="480" stroke="#f6f9fc" stroke-dasharray="4 4" stroke-width="1.3"/><polygon points="663.8,398 675.8,398 669.8,406" fill="#f6f9fc"/><text x="677.8280098280098" y="440" fill="#f6f9fc" font-size="13" font-weight="700">Playground figure $417B</text><line x1="260" y1="480" x2="1140" y2="480" stroke="#3e5468"/><text x="260.0" y="498" fill="#8fa6ba" font-size="12" text-anchor="middle">$0B</text><text x="456.5601965601966" y="498" fill="#8fa6ba" font-size="12" text-anchor="middle">$200B</text><text x="653.1203931203931" y="498" fill="#8fa6ba" font-size="12" text-anchor="middle">$400B</text><text x="849.6805896805897" y="498" fill="#8fa6ba" font-size="12" text-anchor="middle">$600B</text><text x="1046.2407862407863" y="498" fill="#8fa6ba" font-size="12" text-anchor="middle">$800B</text><rect x="40" y="520" width="1120" height="64" rx="12" fill="#16222f" stroke="#3e5468"/><text x="58" y="546" fill="#c8dbee" font-size="13">Not like for like: the $417B in the playground was the new agreements signed in 2026 (a note to the financial statements);</text><text x="58" y="566" fill="#c8dbee" font-size="13">the original S-1 left the all-in total blank. The S-1/A fills it in: everything signed, including short-term deals and leases not yet started.</text><text x="40" y="612" fill="#8fa6ba" font-size="13">Source: SEC EDGAR, S-1/A, Liquidity and Capital Resources. “Other” is the remainder after the four named minimums; SpaceXAI is an upper bound.</text>
  </g>
</svg>
