<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Text embeddings in a semantic space</title>
  <desc id="desc">Different sentences with similar intent are mapped to nearby points in a high-dimensional vector space.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#151d32"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#13243d"/><stop offset="1" stop-color="#1e3150"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="68" y="68" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">An embedding maps input to a point in vector space</text>
  <text x="68" y="102" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Nearby vectors often represent related language, according to the model.</text>
  <rect x="68" y="150" width="400" height="130" rx="18" fill="url(#card)" stroke="#38bdf8"/>
  <text x="100" y="196" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">INPUT A</text>
  <text x="100" y="236" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="20">“How do I return a damaged item?”</text>
  <rect x="68" y="315" width="400" height="130" rx="18" fill="url(#card)" stroke="#a78bfa"/>
  <text x="100" y="361" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">INPUT B</text>
  <text x="100" y="401" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="20">“What is our defective-item refund process?”</text>
  <path d="M485 215H575M485 380H575" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="595" y="244" width="195" height="116" rx="18" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/>
  <text x="692" y="286" fill="#ecfeff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Embedding</text>
  <text x="692" y="320" fill="#cffafe" font-family="ui-monospace,monospace" font-size="15" text-anchor="middle">model.encode(text)</text>
  <path d="M790 302H858" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="878" y="150" width="255" height="310" rx="18" fill="#0b1220" stroke="#334155"/>
  <text x="1005" y="192" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">High-dimensional space</text>
  <path d="M925 408L1082 408M925 408L925 242M925 408L1000 452" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M940 387L1060 340M956 351L1081 298M955 276L1060 340" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="1001" cy="320" r="16" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="1027" cy="334" r="16" fill="#a78bfa" filter="url(#glow)"/>
  <circle cx="1087" cy="270" r="10" fill="#64748b"/>
  <text x="1000" y="369" fill="#7dd3fc" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">A</text>
  <text x="1030" y="365" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">B</text>
  <text x="1090" y="252" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">other text</text>
  <text x="68" y="535" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Illustration is conceptual: real embeddings may have hundreds or thousands of dimensions.</text>
  <text x="68" y="562" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Coordinates are not human-readable definitions and similarity is not proof of equivalence.</text>
</svg>
