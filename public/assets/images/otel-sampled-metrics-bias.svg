<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 516" role="img" aria-labelledby="title desc">
  <title id="title">Metrics computed after sampling lie</title>
  <desc id="desc">Two bar groups. get_price error rate: truth 13.4% (189 of 1,408 calls); gateway metrics computed before sampling 13.4%; Tempo span metrics with a 10-second decision wait 33.0% (187 of 566 kept spans); Tempo with a 45-second wait 8.3% (2 of 24 spans, because 2,064 spans were discarded as outside the metrics ingestion slack). Run failure rate: truth 1.9%; gateway 1.9%; Tempo with a 10-second wait 7.8%; Tempo with a 45-second wait 0.0% of 29 counted runs.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="516" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Metrics computed after sampling lie</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">The same 1,000 runs, measured in three places.</text>
<text x="45" y="148" fill="#f6f9fc" font-size="16" font-weight="700">get_price error rate</text><text x="45" y="179" fill="#a9bdd0" font-size="13">Truth</text><rect x="330" y="164" width="245.02857142857147" height="20" rx="4" fill="#f6f9fc" fill-opacity="0.55"/><text x="583.0285714285715" y="179" fill="#f6f9fc" font-size="13" font-weight="700">13.4%</text><text x="637.0285714285715" y="179" fill="#6f8aa3" font-size="12">189 of 1,408 calls</text><text x="45" y="207" fill="#a9bdd0" font-size="13">Gateway, before sampling</text><rect x="330" y="192" width="245.02857142857147" height="20" rx="4" fill="#4fd1c5" fill-opacity="0.85"/><text x="583.0285714285715" y="207" fill="#4fd1c5" font-size="13" font-weight="700">13.4%</text><text x="637.0285714285715" y="207" fill="#6f8aa3" font-size="12">189 of 1,408</text><text x="45" y="235" fill="#a9bdd0" font-size="13">Tempo, 10 s wait</text><rect x="330" y="220" width="603.4285714285714" height="20" rx="4" fill="#f2706b" fill-opacity="0.85"/><text x="941.4285714285714" y="235" fill="#f2706b" font-size="13" font-weight="700">33.0%</text><text x="995.4285714285714" y="235" fill="#6f8aa3" font-size="12">187 of 566 kept spans</text><text x="45" y="263" fill="#a9bdd0" font-size="13">Tempo, 45 s wait</text><rect x="330" y="248" width="151.7714285714286" height="20" rx="4" fill="#b39ddb" fill-opacity="0.85"/><text x="489.7714285714286" y="263" fill="#b39ddb" font-size="13" font-weight="700">8.3%</text><text x="543.7714285714286" y="263" fill="#6f8aa3" font-size="12">2 of 24: 2,064 spans discarded</text><text x="45" y="306" fill="#f6f9fc" font-size="16" font-weight="700">Run failure rate</text><text x="45" y="337" fill="#a9bdd0" font-size="13">Truth</text><rect x="330" y="322" width="34.74285714285713" height="20" rx="4" fill="#f6f9fc" fill-opacity="0.55"/><text x="372.74285714285713" y="337" fill="#f6f9fc" font-size="13" font-weight="700">1.9%</text><text x="426.74285714285713" y="337" fill="#6f8aa3" font-size="12">19 of 1,000 runs</text><text x="45" y="365" fill="#a9bdd0" font-size="13">Gateway, before sampling</text><rect x="330" y="350" width="34.74285714285713" height="20" rx="4" fill="#4fd1c5" fill-opacity="0.85"/><text x="372.74285714285713" y="365" fill="#4fd1c5" font-size="13" font-weight="700">1.9%</text><text x="426.74285714285713" y="365" fill="#6f8aa3" font-size="12">19 of 1,000</text><text x="45" y="393" fill="#a9bdd0" font-size="13">Tempo, 10 s wait</text><rect x="330" y="378" width="142.62857142857143" height="20" rx="4" fill="#f2706b" fill-opacity="0.85"/><text x="480.62857142857143" y="393" fill="#f2706b" font-size="13" font-weight="700">7.8%</text><text x="534.6285714285714" y="393" fill="#6f8aa3" font-size="12">19 of 244 kept runs</text><text x="45" y="421" fill="#a9bdd0" font-size="13">Tempo, 45 s wait</text><rect x="330" y="406" width="2" height="20" rx="4" fill="#b39ddb" fill-opacity="0.85"/><text x="338" y="421" fill="#b39ddb" font-size="13" font-weight="700">0.0%</text><text x="392" y="421" fill="#6f8aa3" font-size="12">0 of 29 counted</text><text x="45" y="462" fill="#a9bdd0" font-size="14">Sampling keeps every error and 10% of the rest, so after sampling errors look 3–4× more common. Wait longer and</text><text x="45" y="484" fill="#a9bdd0" font-size="14">Tempo’s metrics generator drops spans that ended more than 30 s ago. Count before you sample.</text>
  </g>
</svg>
