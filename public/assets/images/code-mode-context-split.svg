<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" role="img" aria-labelledby="title desc">
  <title id="title">Where the saving comes from</title>
  <desc id="desc">Stacked bars per task. Starting context is about 49k tokens with Code Mode off and 30k with it on in every task. Context added by the work: Lookup 11k off vs 5k on; Search 13k off vs 7k on; Rename 13k off vs 7k on; Health report 13k off vs 8k on; Lint fix 12k off vs 8k on; Trace 23k off vs 17k on.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="572" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Where the saving comes from</text>
<text x="45" y="85" fill="#a9bdd0" font-size="16">Context size of the last model call in each task: what was there before any work (solid) plus what the work added (faded)</text>
<rect x="45" y="109" width="14" height="14" rx="3" fill="#8a7fe0"/><text x="67" y="120" fill="#f6f9fc" font-size="13">Code Mode off (direct tool calls)</text><rect x="315" y="109" width="14" height="14" rx="3" fill="#2fa9a0"/><text x="337" y="120" fill="#f6f9fc" font-size="13">Code Mode on (REPL)</text><rect x="660" y="109" width="14" height="14" rx="3" fill="#a9bdd0" fill-opacity="0.9"/><text x="682" y="120" fill="#f6f9fc" font-size="13">starting context</text><rect x="820" y="109" width="14" height="14" rx="3" fill="#a9bdd0" fill-opacity="0.35"/><text x="842" y="120" fill="#f6f9fc" font-size="13">added by the work</text>
<line x1="360" y1="152" x2="360" y2="526" stroke="#22344a"/><text x="360" y="544" fill="#6f8aa3" font-size="12" text-anchor="middle">0</text>
<line x1="593.3333333333333" y1="152" x2="593.3333333333333" y2="526" stroke="#22344a"/><text x="593.3333333333333" y="544" fill="#6f8aa3" font-size="12" text-anchor="middle">25k</text>
<line x1="826.6666666666666" y1="152" x2="826.6666666666666" y2="526" stroke="#22344a"/><text x="826.6666666666666" y="544" fill="#6f8aa3" font-size="12" text-anchor="middle">50k</text>
<line x1="1060" y1="152" x2="1060" y2="526" stroke="#22344a"/><text x="1060" y="544" fill="#6f8aa3" font-size="12" text-anchor="middle">75k</text>
<text x="45" y="178" fill="#f6f9fc" font-size="15" font-weight="700">Lookup</text><text x="45" y="198" fill="#6f8aa3" font-size="12">one fact from package.json</text><rect x="360.0" y="164" width="457.2" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><rect x="819.2" y="164" width="104.4" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.35"/><text x="931.6333333333333" y="179" fill="#f6f9fc" font-size="12">49k + 11k</text><rect x="360.0" y="186" width="282.9" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><rect x="644.9" y="186" width="45.4" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.35"/><text x="698.3" y="201" fill="#f6f9fc" font-size="12">30k + 5k</text>
<text x="45" y="240" fill="#f6f9fc" font-size="15" font-weight="700">Search</text><text x="45" y="260" fill="#6f8aa3" font-size="12">8 tagged posts + word counts</text><rect x="360.0" y="226" width="464.1" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><rect x="826.1" y="226" width="117.3" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.35"/><text x="951.3919999999999" y="241" fill="#f6f9fc" font-size="12">50k + 13k</text><rect x="360.0" y="248" width="282.5" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><rect x="644.5" y="248" width="62.1" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.35"/><text x="714.568" y="263" fill="#f6f9fc" font-size="12">30k + 7k</text>
<text x="45" y="302" fill="#f6f9fc" font-size="15" font-weight="700">Rename</text><text x="45" y="322" fill="#6f8aa3" font-size="12">series slug in 6 files + rebuild</text><rect x="360.0" y="288" width="456.2" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><rect x="818.2" y="288" width="124.6" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.35"/><text x="950.804" y="303" fill="#f6f9fc" font-size="12">49k + 13k</text><rect x="360.0" y="310" width="283.8" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><rect x="645.8" y="310" width="62.4" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.35"/><text x="716.2013333333333" y="325" fill="#f6f9fc" font-size="12">30k + 7k</text>
<text x="45" y="364" fill="#f6f9fc" font-size="15" font-weight="700">Health report</text><text x="45" y="384" fill="#6f8aa3" font-size="12">4 checks over 228 posts</text><rect x="360.0" y="350" width="456.0" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><rect x="818.0" y="350" width="125.9" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.35"/><text x="951.9613333333333" y="365" fill="#f6f9fc" font-size="12">49k + 13k</text><rect x="360.0" y="372" width="281.8" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><rect x="643.8" y="372" width="74.7" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.35"/><text x="726.5426666666666" y="387" fill="#f6f9fc" font-size="12">30k + 8k</text>
<text x="45" y="426" fill="#f6f9fc" font-size="15" font-weight="700">Lint fix</text><text x="45" y="446" fill="#6f8aa3" font-size="12">6 errors in 6 files, re-verify</text><rect x="360.0" y="412" width="468.4" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><rect x="830.4" y="412" width="114.6" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.35"/><text x="952.9693333333333" y="427" fill="#f6f9fc" font-size="12">50k + 12k</text><rect x="360.0" y="434" width="281.3" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><rect x="643.3" y="434" width="76.4" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.35"/><text x="727.7560000000001" y="449" fill="#f6f9fc" font-size="12">30k + 8k</text>
<text x="45" y="488" fill="#f6f9fc" font-size="15" font-weight="700">Trace</text><text x="45" y="508" fill="#6f8aa3" font-size="12">markdown file → rendered page</text><rect x="360.0" y="474" width="458.7" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><rect x="820.7" y="474" width="211.3" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.35"/><text x="1040.0026666666668" y="489" fill="#f6f9fc" font-size="12">49k + 23k</text><rect x="360.0" y="496" width="283.4" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><rect x="645.4" y="496" width="162.1" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.35"/><text x="815.5826666666667" y="511" fill="#f6f9fc" font-size="12">30k + 17k</text>

  </g>
</svg>
