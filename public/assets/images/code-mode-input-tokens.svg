<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 562" role="img" aria-labelledby="title desc">
  <title id="title">Input tokens per task, Code Mode off vs on</title>
  <desc id="desc">Grouped bars, mean of 3 runs each. Lookup: 109k off, 65k on (-40%); Search: 132k off, 67k on (-49%); Rename: 170k off, 104k on (-39%); Health report: 172k off, 142k on (-17%); Lint fix: 236k off, 142k on (-40%); Trace: 229k off, 130k on (-43%).</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="562" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Input tokens per task, Code Mode off vs on</text>
<text x="45" y="85" fill="#a9bdd0" font-size="16">Total input tokens Claude processed per task (cache reads + cache writes + uncached), mean of 3 runs, Sonnet 5.5</text>
<rect x="45" y="107" width="14" height="14" rx="3" fill="#8a7fe0"/><text x="67" y="118" fill="#f6f9fc" font-size="13">Code Mode off (direct tool calls)</text><rect x="315" y="107" width="14" height="14" rx="3" fill="#2fa9a0"/><text x="337" y="118" fill="#f6f9fc" font-size="13">Code Mode on (REPL)</text>
<line x1="360" y1="142" x2="360" y2="516" stroke="#22344a"/><text x="360" y="534" fill="#6f8aa3" font-size="12" text-anchor="middle">0</text>
<line x1="520" y1="142" x2="520" y2="516" stroke="#22344a"/><text x="520" y="534" fill="#6f8aa3" font-size="12" text-anchor="middle">60k</text>
<line x1="680" y1="142" x2="680" y2="516" stroke="#22344a"/><text x="680" y="534" fill="#6f8aa3" font-size="12" text-anchor="middle">120k</text>
<line x1="840" y1="142" x2="840" y2="516" stroke="#22344a"/><text x="840" y="534" fill="#6f8aa3" font-size="12" text-anchor="middle">180k</text>
<line x1="1000" y1="142" x2="1000" y2="516" stroke="#22344a"/><text x="1000" y="534" fill="#6f8aa3" font-size="12" text-anchor="middle">240k</text>
<text x="45" y="168" fill="#f6f9fc" font-size="15" font-weight="700">Lookup</text><text x="45" y="188" fill="#6f8aa3" font-size="12">one fact from package.json</text><rect x="360.0" y="154" width="291.1" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><text x="659.1093333333333" y="169" fill="#f6f9fc" font-size="12">109k</text><rect x="360.0" y="176" width="174.6" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><text x="542.6266666666667" y="191" fill="#f6f9fc" font-size="12">65k</text><text x="1150" y="181" fill="#f6f9fc" font-size="18" font-weight="700" text-anchor="end">-40%</text>
<text x="45" y="230" fill="#f6f9fc" font-size="15" font-weight="700">Search</text><text x="45" y="250" fill="#6f8aa3" font-size="12">8 tagged posts + word counts</text><rect x="360.0" y="216" width="351.0" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><text x="719.0133333333333" y="231" fill="#f6f9fc" font-size="12">132k</text><rect x="360.0" y="238" width="179.2" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><text x="547.1546666666667" y="253" fill="#f6f9fc" font-size="12">67k</text><text x="1150" y="243" fill="#f6f9fc" font-size="18" font-weight="700" text-anchor="end">-49%</text>
<text x="45" y="292" fill="#f6f9fc" font-size="15" font-weight="700">Rename</text><text x="45" y="312" fill="#6f8aa3" font-size="12">series slug in 6 files + rebuild</text><rect x="360.0" y="278" width="453.7" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><text x="821.6746666666667" y="293" fill="#f6f9fc" font-size="12">170k</text><rect x="360.0" y="300" width="276.3" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><text x="644.256" y="315" fill="#f6f9fc" font-size="12">104k</text><text x="1150" y="305" fill="#f6f9fc" font-size="18" font-weight="700" text-anchor="end">-39%</text>
<text x="45" y="354" fill="#f6f9fc" font-size="15" font-weight="700">Health report</text><text x="45" y="374" fill="#6f8aa3" font-size="12">4 checks over 228 posts</text><rect x="360.0" y="340" width="457.6" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><text x="825.6213333333333" y="355" fill="#f6f9fc" font-size="12">172k</text><rect x="360.0" y="362" width="378.5" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><text x="746.5066666666667" y="377" fill="#f6f9fc" font-size="12">142k</text><text x="1150" y="367" fill="#f6f9fc" font-size="18" font-weight="700" text-anchor="end">-17%</text>
<text x="45" y="416" fill="#f6f9fc" font-size="15" font-weight="700">Lint fix</text><text x="45" y="436" fill="#6f8aa3" font-size="12">6 errors in 6 files, re-verify</text><rect x="360.0" y="402" width="629.6" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><text x="997.5786666666667" y="417" fill="#f6f9fc" font-size="12">236k</text><rect x="360.0" y="424" width="380.0" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><text x="747.9866666666667" y="439" fill="#f6f9fc" font-size="12">142k</text><text x="1150" y="429" fill="#f6f9fc" font-size="18" font-weight="700" text-anchor="end">-40%</text>
<text x="45" y="478" fill="#f6f9fc" font-size="15" font-weight="700">Trace</text><text x="45" y="498" fill="#6f8aa3" font-size="12">markdown file → rendered page</text><rect x="360.0" y="464" width="609.9" height="20" rx="4" fill="#8a7fe0" fill-opacity="0.9"/><text x="977.9066666666668" y="479" fill="#f6f9fc" font-size="12">229k</text><rect x="360.0" y="486" width="346.5" height="20" rx="4" fill="#2fa9a0" fill-opacity="0.9"/><text x="714.528" y="501" fill="#f6f9fc" font-size="12">130k</text><text x="1150" y="491" fill="#f6f9fc" font-size="18" font-weight="700" text-anchor="end">-43%</text>
<text x="1150" y="136" fill="#6f8aa3" font-size="12" text-anchor="end">change</text>
  </g>
</svg>
