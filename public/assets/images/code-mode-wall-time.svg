<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 526" role="img" aria-labelledby="title desc">
  <title id="title">Wall time: Code Mode was not faster here</title>
  <desc id="desc">Dumbbell chart of mean wall time. Lookup: 3.6s off, 3.8s on, 1 tool calls inside the script; Search: 8.5s off, 27.4s on, 229 tool calls inside the script; Rename: 8.3s off, 11.5s on, 11 tool calls inside the script; Health report: 11.5s off, 40s on, 339 tool calls inside the script; Lint fix: 13s off, 16.2s on, 14 tool calls inside the script; Trace: 16.8s off, 15.6s on, 7 tool calls inside the script. Code Mode was much slower on Search and Health, where its scripts read 228 files one at a time.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="526" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Wall time: Code Mode was not faster here</text>
<text x="45" y="85" fill="#a9bdd0" font-size="16">Seconds from prompt to final answer, mean of 3 runs. Labels show tool calls made inside Code Mode scripts.</text>
<rect x="45" y="107" width="14" height="14" rx="3" fill="#8a7fe0"/><text x="67" y="118" fill="#f6f9fc" font-size="13">Code Mode off (direct tool calls)</text><rect x="315" y="107" width="14" height="14" rx="3" fill="#2fa9a0"/><text x="337" y="118" fill="#f6f9fc" font-size="13">Code Mode on (REPL)</text>
<line x1="360" y1="142" x2="360" y2="480" stroke="#22344a"/><text x="360" y="498" fill="#6f8aa3" font-size="12" text-anchor="middle">0s</text>
<line x1="488" y1="142" x2="488" y2="480" stroke="#22344a"/><text x="488" y="498" fill="#6f8aa3" font-size="12" text-anchor="middle">10s</text>
<line x1="616" y1="142" x2="616" y2="480" stroke="#22344a"/><text x="616" y="498" fill="#6f8aa3" font-size="12" text-anchor="middle">20s</text>
<line x1="744" y1="142" x2="744" y2="480" stroke="#22344a"/><text x="744" y="498" fill="#6f8aa3" font-size="12" text-anchor="middle">30s</text>
<line x1="872" y1="142" x2="872" y2="480" stroke="#22344a"/><text x="872" y="498" fill="#6f8aa3" font-size="12" text-anchor="middle">40s</text>
<line x1="1000" y1="142" x2="1000" y2="480" stroke="#22344a"/><text x="1000" y="498" fill="#6f8aa3" font-size="12" text-anchor="middle">50s</text>
<text x="45" y="170" fill="#f6f9fc" font-size="15" font-weight="700">Lookup</text><text x="45" y="188" fill="#6f8aa3" font-size="12">one fact from package.json</text><line x1="406.08" y1="172" x2="408.64" y2="172" stroke="#a9bdd0" stroke-opacity="0.5" stroke-width="2"/><circle cx="406.08" cy="172" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="408.64" cy="172" r="7" fill="#2fa9a0" stroke="#101c2c" stroke-width="2"/><text x="422.64" y="177" fill="#a9bdd0" font-size="12">3.6s → 3.8s · 1 call in script</text>
<text x="45" y="226" fill="#f6f9fc" font-size="15" font-weight="700">Search</text><text x="45" y="244" fill="#6f8aa3" font-size="12">8 tagged posts + word counts</text><line x1="468.8" y1="228" x2="710.72" y2="228" stroke="#a9bdd0" stroke-opacity="0.5" stroke-width="2"/><circle cx="468.8" cy="228" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="710.72" cy="228" r="7" fill="#2fa9a0" stroke="#101c2c" stroke-width="2"/><text x="724.72" y="233" fill="#f6f9fc" font-size="12" font-weight="700">8.5s → 27.4s · 229 calls in script</text>
<text x="45" y="282" fill="#f6f9fc" font-size="15" font-weight="700">Rename</text><text x="45" y="300" fill="#6f8aa3" font-size="12">series slug in 6 files + rebuild</text><line x1="466.24" y1="284" x2="507.20000000000005" y2="284" stroke="#a9bdd0" stroke-opacity="0.5" stroke-width="2"/><circle cx="466.24" cy="284" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="507.20000000000005" cy="284" r="7" fill="#2fa9a0" stroke="#101c2c" stroke-width="2"/><text x="521.2" y="289" fill="#a9bdd0" font-size="12">8.3s → 11.5s · 11 calls in script</text>
<text x="45" y="338" fill="#f6f9fc" font-size="15" font-weight="700">Health report</text><text x="45" y="356" fill="#6f8aa3" font-size="12">4 checks over 228 posts</text><line x1="507.20000000000005" y1="340" x2="872" y2="340" stroke="#a9bdd0" stroke-opacity="0.5" stroke-width="2"/><circle cx="507.20000000000005" cy="340" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="872" cy="340" r="7" fill="#2fa9a0" stroke="#101c2c" stroke-width="2"/><text x="886" y="345" fill="#f6f9fc" font-size="12" font-weight="700">11.5s → 40s · 339 calls in script</text>
<text x="45" y="394" fill="#f6f9fc" font-size="15" font-weight="700">Lint fix</text><text x="45" y="412" fill="#6f8aa3" font-size="12">6 errors in 6 files, re-verify</text><line x1="526.4" y1="396" x2="567.36" y2="396" stroke="#a9bdd0" stroke-opacity="0.5" stroke-width="2"/><circle cx="526.4" cy="396" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="567.36" cy="396" r="7" fill="#2fa9a0" stroke="#101c2c" stroke-width="2"/><text x="581.36" y="401" fill="#a9bdd0" font-size="12">13s → 16.2s · 14 calls in script</text>
<text x="45" y="450" fill="#f6f9fc" font-size="15" font-weight="700">Trace</text><text x="45" y="468" fill="#6f8aa3" font-size="12">markdown file → rendered page</text><line x1="575.04" y1="452" x2="559.6800000000001" y2="452" stroke="#a9bdd0" stroke-opacity="0.5" stroke-width="2"/><circle cx="575.04" cy="452" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="559.6800000000001" cy="452" r="7" fill="#2fa9a0" stroke="#101c2c" stroke-width="2"/><text x="589.04" y="457" fill="#a9bdd0" font-size="12">16.8s → 15.6s · 7 calls in script</text>

  </g>
</svg>
