<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">The walkthrough setup</title>
  <desc id="desc">On the left, a small Python agent called crypto-desk. Inside it, three sources of telemetry: the Anthropic Python SDK, which emits one anthropic.messages.create span per model call by itself once a tracer provider is registered; about twenty lines of manual code that add an invoke_agent parent span, execute_tool spans and two gen_ai metrics; and an optional third-party Anthropic instrumentor, shown dashed because it duplicates the SDK's spans. The agent calls the Claude API and the CoinGecko price API. All telemetry leaves over OTLP/HTTP on port 4318 into a single grafana/otel-lgtm container, which holds an OpenTelemetry Collector that routes traces to Tempo, metrics to Prometheus and logs to Loki, all read by Grafana on port 3300. A local spans.jsonl file keeps a copy of every span so the numbers in the post can be checked.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7f97ad"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">The setup: one agent, one container</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">Everything runs locally. The only network calls are to the Claude API and CoinGecko.</text>

    <!-- agent box -->
    <rect x="45" y="115" width="470" height="395" rx="16" fill="#18304a" stroke="#2f4f6e"/>
    <text x="70" y="150" fill="#fff" font-size="19" font-weight="700">crypto-desk agent</text>
    <text x="70" y="172" fill="#a9bdd0" font-size="13.5">Python · Sonnet 5.5 · tools: get_price, calculate</text>

    <rect x="70" y="192" width="420" height="78" rx="10" fill="#1f2d52" stroke="#a99bf0"/>
    <text x="88" y="218" fill="#ddd7fb" font-size="15" font-weight="700">Anthropic Python SDK (built-in tracing)</text>
    <text x="88" y="240" fill="#c4bdf0" font-size="13">one anthropic.messages.create span per model call,</text>
    <text x="88" y="258" fill="#c4bdf0" font-size="13">gen_ai.* attributes, no code needed</text>

    <rect x="70" y="282" width="420" height="78" rx="10" fill="#183f3a" stroke="#5fc7a6"/>
    <text x="88" y="308" fill="#cdeee2" font-size="15" font-weight="700">~20 lines of manual instrumentation</text>
    <text x="88" y="330" fill="#a9dcc9" font-size="13">invoke_agent parent span, execute_tool spans,</text>
    <text x="88" y="348" fill="#a9dcc9" font-size="13">gen_ai.client.token.usage + operation.duration</text>

    <rect x="70" y="372" width="420" height="58" rx="10" fill="none" stroke="#7f97ad" stroke-dasharray="6 5"/>
    <text x="88" y="397" fill="#a9bdd0" font-size="15" font-weight="700">Third-party instrumentor (optional)</text>
    <text x="88" y="417" fill="#8aa1b6" font-size="13">tried in pass 1, dropped: duplicates the SDK's spans</text>

    <text x="70" y="462" fill="#7f97ad" font-size="13">also writes every span to spans.jsonl, so the</text>
    <text x="70" y="480" fill="#7f97ad" font-size="13">numbers in this post can be checked</text>

    <!-- external apis -->
    <g font-size="13">
      <rect x="560" y="122" width="190" height="44" rx="10" fill="#22364d" stroke="#3b5a78"/>
      <text x="655" y="149" fill="#d9e4ee" text-anchor="middle">Claude API</text>
      <rect x="560" y="178" width="190" height="44" rx="10" fill="#22364d" stroke="#3b5a78"/>
      <text x="655" y="205" fill="#d9e4ee" text-anchor="middle">CoinGecko (free tier)</text>
    </g>
    <path d="M515 160 H555" stroke="#7f97ad" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M515 200 H555" stroke="#7f97ad" stroke-width="2" marker-end="url(#arr)"/>

    <!-- otlp arrow -->
    <path d="M515 330 H735" stroke="#5ec4e0" stroke-width="3" marker-end="url(#arr)"/>
    <text x="625" y="318" fill="#5ec4e0" font-size="14" font-weight="700" text-anchor="middle">OTLP/HTTP :4318</text>
    <text x="625" y="352" fill="#8aa1b6" font-size="12.5" text-anchor="middle">traces + metrics</text>

    <!-- lgtm container -->
    <rect x="745" y="240" width="410" height="270" rx="16" fill="#18304a" stroke="#5ec4e0" stroke-dasharray="0"/>
    <text x="770" y="273" fill="#fff" font-size="17" font-weight="700">grafana/otel-lgtm (one docker run)</text>

    <rect x="770" y="292" width="140" height="76" rx="10" fill="#21405a" stroke="#5ec4e0"/>
    <text x="840" y="324" fill="#e3f6fb" font-size="14" font-weight="700" text-anchor="middle">OTel</text>
    <text x="840" y="344" fill="#e3f6fb" font-size="14" font-weight="700" text-anchor="middle">Collector</text>

    <g font-size="13.5">
      <rect x="950" y="292" width="180" height="34" rx="8" fill="#1f2d52" stroke="#a99bf0"/>
      <text x="1040" y="314" fill="#ddd7fb" text-anchor="middle">Tempo (traces)</text>
      <rect x="950" y="334" width="180" height="34" rx="8" fill="#183f3a" stroke="#5fc7a6"/>
      <text x="1040" y="356" fill="#cdeee2" text-anchor="middle">Prometheus (metrics)</text>
      <rect x="950" y="376" width="180" height="34" rx="8" fill="#22364d" stroke="#3b5a78"/>
      <text x="1040" y="398" fill="#a9bdd0" text-anchor="middle">Loki (logs, unused)</text>
    </g>
    <path d="M910 318 L946 309" stroke="#7f97ad" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M910 335 L946 351" stroke="#7f97ad" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M910 352 L946 390" stroke="#7f97ad" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="770" y="432" width="360" height="52" rx="10" fill="#3a2a17" stroke="#f0b35e"/>
    <text x="950" y="456" fill="#fbe3bf" font-size="15" font-weight="700" text-anchor="middle">Grafana :3300</text>
    <text x="950" y="475" fill="#e8c999" font-size="12.5" text-anchor="middle">Explore → Tempo for traces, Prometheus for metrics</text>
  </g>
</svg>
