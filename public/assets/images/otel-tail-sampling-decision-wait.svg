<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">decision_wait has to outlast your longest run</title>
  <desc id="desc">Timeline of a 26-second agent run. Chat and tool spans export in batches as they end; the root span, which carries the token totals, only arrives at the end. With a 10-second decision wait, the Collector decides at about 12.5 seconds, before the root exists, so the latency and token policies see nothing and the run is dropped. With a 45-second wait, the decision comes after the root and the run is kept. Results on the same 1,000-run workload: failed runs kept 19 of 19 both times; runs with any error span 160 of 162 versus 162 of 162; slow runs 20 of 34 versus 34 of 34; expensive runs 25 of 39 versus 39 of 39.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">decision_wait has to outlast your longest run</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">Tail sampling decides a fixed time after a trace’s first span arrives, whether or not the root has.</text>
<line x1="200" x2="1074" y1="330" y2="330" stroke="#2a3f57"/><line x1="200" x2="200" y1="326" y2="334" stroke="#6f8aa3"/><text x="200" y="352" fill="#6f8aa3" font-size="12" text-anchor="middle">0s</text><line x1="295" x2="295" y1="326" y2="334" stroke="#6f8aa3"/><text x="295" y="352" fill="#6f8aa3" font-size="12" text-anchor="middle">5s</text><line x1="390" x2="390" y1="326" y2="334" stroke="#6f8aa3"/><text x="390" y="352" fill="#6f8aa3" font-size="12" text-anchor="middle">10s</text><line x1="485" x2="485" y1="326" y2="334" stroke="#6f8aa3"/><text x="485" y="352" fill="#6f8aa3" font-size="12" text-anchor="middle">15s</text><line x1="580" x2="580" y1="326" y2="334" stroke="#6f8aa3"/><text x="580" y="352" fill="#6f8aa3" font-size="12" text-anchor="middle">20s</text><line x1="675" x2="675" y1="326" y2="334" stroke="#6f8aa3"/><text x="675" y="352" fill="#6f8aa3" font-size="12" text-anchor="middle">25s</text><line x1="770" x2="770" y1="326" y2="334" stroke="#6f8aa3"/><text x="770" y="352" fill="#6f8aa3" font-size="12" text-anchor="middle">30s</text><line x1="865" x2="865" y1="326" y2="334" stroke="#6f8aa3"/><text x="865" y="352" fill="#6f8aa3" font-size="12" text-anchor="middle">35s</text><line x1="960" x2="960" y1="326" y2="334" stroke="#6f8aa3"/><text x="960" y="352" fill="#6f8aa3" font-size="12" text-anchor="middle">40s</text><line x1="1055" x2="1055" y1="326" y2="334" stroke="#6f8aa3"/><text x="1055" y="352" fill="#6f8aa3" font-size="12" text-anchor="middle">45s</text><text x="45" y="150" fill="#f6f9fc" font-size="15" font-weight="700">A 26 s run</text><text x="45" y="170" fill="#a9bdd0" font-size="12">(8 turns, price loop)</text><rect x="200" y="180" width="45.6" height="12" rx="3" fill="#75a8d5"/><rect x="255.1" y="196" width="51.3" height="12" rx="3" fill="#75a8d5"/><rect x="315.9" y="180" width="45.60000000000001" height="12" rx="3" fill="#75a8d5"/><rect x="374.79999999999995" y="196" width="51.30000000000002" height="12" rx="3" fill="#75a8d5"/><rect x="435.6" y="180" width="49.39999999999999" height="12" rx="3" fill="#75a8d5"/><rect x="496.4" y="196" width="53.19999999999998" height="12" rx="3" fill="#75a8d5"/><rect x="561" y="180" width="49.40000000000003" height="12" rx="3" fill="#75a8d5"/><rect x="621.8" y="196" width="68.40000000000003" height="12" rx="3" fill="#75a8d5"/><rect x="200" y="150" width="494" height="14" rx="3" fill="#e3ad5a"/><text x="702" y="162" fill="#e3ad5a" font-size="12">root span (token totals) ends here</text><text x="200" y="228" fill="#a9bdd0" font-size="12">chat and tool spans export in batches as they end</text><line x1="437.5" x2="437.5" y1="135" y2="315" stroke="#f2706b" stroke-width="2" stroke-dasharray="6 4"/><text x="443.5" y="262" fill="#f2706b" font-size="13" font-weight="700">decide at 10 s wait</text><text x="443.5" y="280" fill="#a9bdd0" font-size="12">no root yet: not slow, not costly → drop</text><line x1="1083.5" x2="1083.5" y1="135" y2="315" stroke="#4fd1c5" stroke-width="2" stroke-dasharray="6 4"/><text x="1077.5" y="262" fill="#4fd1c5" font-size="13" text-anchor="end" font-weight="700">decide at 45 s wait</text><text x="1077.5" y="280" fill="#a9bdd0" font-size="12" text-anchor="end">root seen → keep</text><text x="200" y="310" fill="#6f8aa3" font-size="11">first span arrives ~2.5 s in</text><rect x="45" y="380" width="1110" height="150" rx="14" fill="#263e5b" stroke="#75a8d5"/><text x="70" y="410" fill="#f6f9fc" font-size="15" font-weight="700">Kept in Tempo</text><text x="560" y="410" fill="#f2706b" font-size="13" text-anchor="middle" font-weight="700">decision_wait 10 s</text><text x="820" y="410" fill="#4fd1c5" font-size="13" text-anchor="middle" font-weight="700">decision_wait 45 s</text><text x="70" y="438" fill="#f6f9fc" font-size="14">Failed runs</text><text x="560" y="438" fill="#f6f9fc" font-size="14" text-anchor="middle">19/19</text><text x="820" y="438" fill="#4fd1c5" font-size="14" text-anchor="middle">19/19</text><text x="70" y="462" fill="#f6f9fc" font-size="14">Any error span</text><text x="560" y="462" fill="#f2706b" font-size="14" text-anchor="middle">160/162</text><text x="820" y="462" fill="#4fd1c5" font-size="14" text-anchor="middle">162/162</text><text x="70" y="486" fill="#f6f9fc" font-size="14">Slow (≥ 20 s)</text><text x="560" y="486" fill="#f2706b" font-size="14" text-anchor="middle">20/34</text><text x="820" y="486" fill="#4fd1c5" font-size="14" text-anchor="middle">34/34</text><text x="70" y="510" fill="#f6f9fc" font-size="14">Expensive (≥ 15k tokens)</text><text x="560" y="510" fill="#f2706b" font-size="14" text-anchor="middle">25/39</text><text x="820" y="510" fill="#4fd1c5" font-size="14" text-anchor="middle">39/39</text><text x="1130" y="438" fill="#6f8aa3" font-size="12" text-anchor="end">same 1,000-run</text><text x="1130" y="456" fill="#6f8aa3" font-size="12" text-anchor="end">workload, same seed</text>
  </g>
</svg>
