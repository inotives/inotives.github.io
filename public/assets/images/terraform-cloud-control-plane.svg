<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Terraform cloud infrastructure control plane</title>
  <desc id="desc">A dark diagram showing Terraform configuration and state producing a dependency graph, provider API calls, and cloud resources for the market data lakehouse.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.code{fill:#17263b;stroke:#587692;stroke-width:2}.tf{fill:#332b1d;stroke:#e2b866;stroke-width:2}.cloud{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.state{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.secure{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#7d6fae;stroke-width:2;fill:none;stroke-dasharray:8 8;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="820"/><text class="text" x="65" y="68" font-size="36" font-weight="700">Terraform as a cloud control plane</text><text class="small" x="65" y="103">Configuration describes the desired platform. State records what Terraform believes exists.</text>
  <rect class="code" x="65" y="210" width="285" height="155" rx="16"/><text class="label" x="95" y="250">INPUT</text><text class="text" x="95" y="290">HCL configuration</text><text class="small" x="95" y="322">modules · variables · policy</text>
  <rect class="state" x="65" y="445" width="285" height="155" rx="16"/><text class="label" x="95" y="485">MEMORY</text><text class="text" x="95" y="525">Remote state</text><text class="small" x="95" y="557">lock · history · outputs</text>
  <rect class="tf" x="470" y="175" width="320" height="215" rx="18"/><text class="label" x="510" y="220">TERRAFORM CORE</text><text class="text" x="510" y="265">Refresh and plan</text><text class="text" x="510" y="305">Dependency graph</text><text class="small" x="510" y="345">create · update · destroy</text>
  <rect class="tf" x="470" y="470" width="320" height="155" rx="18"/><text class="label" x="510" y="510">APPLY</text><text class="text" x="510" y="550">Approved changes</text><text class="small" x="510" y="582">provider API calls</text>
  <path class="line" d="M350 285 L470 285"/><path class="secure" d="M350 520 L470 520"/><path class="line" d="M630 390 L630 470"/>
  <rect class="cloud" x="925" y="160" width="570" height="480" rx="22"/><text class="label" x="965" y="205">CLOUD PLATFORM</text>
  <rect class="cloud" x="965" y="245" width="220" height="105" rx="14"/><text class="text" x="995" y="285">Network</text><text class="small" x="995" y="317">VPC · endpoints · routes</text>
  <rect class="cloud" x="1215" y="245" width="220" height="105" rx="14"/><text class="text" x="1245" y="285">Lakehouse</text><text class="small" x="1245" y="317">S3 · Glue · Athena</text>
  <rect class="cloud" x="965" y="390" width="220" height="105" rx="14"/><text class="text" x="995" y="430">Runtime</text><text class="small" x="995" y="462">Mage · ECS · logs</text>
  <rect class="cloud" x="1215" y="390" width="220" height="105" rx="14"/><text class="text" x="1245" y="430">Identity</text><text class="small" x="1245" y="462">IAM · secrets · OIDC</text>
  <rect class="cloud" x="965" y="535" width="470" height="70" rx="14"/><text class="text" x="995" y="580">market_data platform resources</text>
  <path class="line" d="M790 270 L925 270"/><path class="line" d="M790 300 L925 420"/><path class="line" d="M790 340 L925 560"/>
  <rect class="code" x="65" y="690" width="1430" height="70" rx="14"/><text class="small" x="95" y="733">Terraform does not build application code. It creates the platform, permissions, and artifact references that let runtime systems execute it.</text>
</svg>
