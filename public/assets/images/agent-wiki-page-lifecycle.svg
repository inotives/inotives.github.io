<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent wiki page lifecycle</title>
  <desc id="desc">A dark lifecycle diagram showing a private draft becoming a proposed change, reviewed knowledge, searchable shared content, and eventually archived or deprecated content.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.draft{fill:#17263b;stroke:#587692;stroke-width:2}.review{fill:#332b1d;stroke:#e2b866;stroke-width:2}.shared{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.archive{fill:#30202b;stroke:#df7b86;stroke-width:2}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.yellow{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}.fail{stroke:#df7b86;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="760"/><text class="text" x="65" y="68" font-size="36" font-weight="700">A page needs a lifecycle, not just a filename</text><text class="small" x="65" y="103">Shared knowledge becomes safer when its state and owner are visible.</text>
  <rect class="draft" x="65" y="245" width="230" height="135" rx="16"/><text class="label" x="100" y="285">PRIVATE</text><text class="text" x="100" y="325">Draft</text><text class="small" x="100" y="355">working context</text>
  <rect class="review" x="370" y="245" width="230" height="135" rx="16"/><text class="label" x="405" y="285">PROPOSED</text><text class="text" x="405" y="325">Change</text><text class="small" x="405" y="355">author and scope</text>
  <rect class="review" x="675" y="245" width="230" height="135" rx="16"/><text class="label" x="710" y="285">REVIEWED</text><text class="text" x="710" y="325">Knowledge</text><text class="small" x="710" y="355">owner approval</text>
  <rect class="shared" x="980" y="245" width="230" height="135" rx="16"/><text class="label" x="1015" y="285">SHARED</text><text class="text" x="1015" y="325">Searchable</text><text class="small" x="1015" y="355">agents can reuse</text>
  <rect class="archive" x="1285" y="245" width="230" height="135" rx="16"/><text class="label" x="1320" y="285">RETIRED</text><text class="text" x="1320" y="325">Archived</text><text class="small" x="1320" y="355">history retained</text>
  <path class="line" d="M295 312 L370 312"/><path class="yellow" d="M600 312 L675 312"/><path class="line" d="M905 312 L980 312"/><path class="fail" d="M1210 312 L1285 312"/>
  <rect class="draft" x="370" y="500" width="230" height="115" rx="16"/><text class="label" x="405" y="540">RETURN</text><text class="text" x="405" y="580">Needs revision</text>
  <rect class="draft" x="980" y="500" width="230" height="115" rx="16"/><text class="label" x="1015" y="540">REFRESH</text><text class="text" x="1015" y="580">Review again</text>
  <path class="fail" d="M790 380 C790 450 485 450 485 500"/><path class="yellow" d="M1095 380 L1095 500"/><text class="small" x="65" y="690">Useful metadata: owner · status · last review · source · scope · replacement page</text>
</svg>
