<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">One shared contract, one vendor change</title>
  <desc id="desc">Four sources, Vendor A, Vendor B, Vendor C and an internal ledger, all feed one shared contract and generator base. Vendor A moves to API v3 and sends amount as a string. The shared Transaction contract has to change from v1 to v2, so all four pipelines below it must be re-tested and released, even though only Vendor A changed.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#ef7b7b" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">One shared contract, one vendor change</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">The source that changed is not the only pipeline that has to ship.</text>

    <!-- Sources -->
    <g font-size="15" text-anchor="middle">
      <rect x="95" y="115" width="170" height="58" rx="10" fill="#3d1f24" stroke="#ef7b7b" stroke-width="2"/>
      <text x="180" y="139" fill="#fff">Vendor A API</text>
      <text x="180" y="160" fill="#f3a5a5" font-size="12">v3: amount now "12.50"</text>
      <rect x="375" y="115" width="170" height="58" rx="10" fill="#263e5b" stroke="#75a8d5"/>
      <text x="460" y="139" fill="#fff">Vendor B API</text>
      <text x="460" y="160" fill="#a9bdd0" font-size="12">unchanged</text>
      <rect x="655" y="115" width="170" height="58" rx="10" fill="#263e5b" stroke="#75a8d5"/>
      <text x="740" y="139" fill="#fff">Vendor C files</text>
      <text x="740" y="160" fill="#a9bdd0" font-size="12">unchanged</text>
      <rect x="935" y="115" width="170" height="58" rx="10" fill="#263e5b" stroke="#75a8d5"/>
      <text x="1020" y="139" fill="#fff">Internal ledger</text>
      <text x="1020" y="160" fill="#a9bdd0" font-size="12">unchanged</text>
    </g>
    <g stroke="#90adc2" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <path d="M460 174 V226"/><path d="M740 174 V226"/><path d="M1020 174 V226"/>
    </g>
    <path d="M180 174 V226" stroke="#ef7b7b" stroke-width="2" fill="none" marker-end="url(#r)"/>

    <!-- Shared contract -->
    <rect x="95" y="230" width="1010" height="76" rx="14" fill="#3a2d1d" stroke="#e3ad5a" stroke-width="2"/>
    <text x="600" y="262" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">Shared contract + generator base</text>
    <text x="600" y="288" fill="#e3ad5a" font-size="14" text-anchor="middle">Transaction v1 → v2 (amount: Decimal | str), BaseApiIngestor gets a v3 branch</text>

    <g stroke="#ef7b7b" stroke-width="2" fill="none" marker-end="url(#r)">
      <path d="M180 307 V357"/><path d="M460 307 V357"/><path d="M740 307 V357"/><path d="M1020 307 V357"/>
    </g>

    <!-- Pipelines -->
    <g font-size="15" text-anchor="middle">
      <rect x="95" y="360" width="170" height="58" rx="10" fill="#3a2d1d" stroke="#e3ad5a"/>
      <text x="180" y="384" fill="#fff">Pipeline A</text>
      <text x="180" y="405" fill="#e3ad5a" font-size="12">the real fix</text>
      <rect x="375" y="360" width="170" height="58" rx="10" fill="#3d1f24" stroke="#ef7b7b"/>
      <text x="460" y="384" fill="#fff">Pipeline B</text>
      <text x="460" y="405" fill="#f3a5a5" font-size="12">re-test, redeploy</text>
      <rect x="655" y="360" width="170" height="58" rx="10" fill="#3d1f24" stroke="#ef7b7b"/>
      <text x="740" y="384" fill="#fff">Pipeline C</text>
      <text x="740" y="405" fill="#f3a5a5" font-size="12">re-test, redeploy</text>
      <rect x="935" y="360" width="170" height="58" rx="10" fill="#3d1f24" stroke="#ef7b7b"/>
      <text x="1020" y="384" fill="#fff">Pipeline D</text>
      <text x="1020" y="405" fill="#f3a5a5" font-size="12">breaks on a str amount</text>
    </g>

    <text x="600" y="455" fill="#f3a5a5" font-size="16" font-weight="600" text-anchor="middle">1 source changed. 4 pipelines in the release.</text>
  </g>
</svg>
