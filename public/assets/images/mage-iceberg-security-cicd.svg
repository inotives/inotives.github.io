<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Identity, network, and CI/CD flow for the lakehouse</title>
  <desc id="desc">A dark diagram showing GitHub OIDC to Terraform and separate IAM roles for Mage, dbt Athena, and BI. Mage runs in private subnets and reaches S3 through an endpoint.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.panel{fill:#111c2e;stroke:#2a3b54;stroke-width:2}.vpc{fill:#0d1727;stroke:#48627d;stroke-width:2;stroke-dasharray:10 8}.role{fill:#1c2940;stroke:#e2b866;stroke-width:2}.aws{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.bi{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.secure{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#667d96;stroke-width:2;fill:none;stroke-dasharray:8 8;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="760"/><text class="text" x="65" y="68" font-size="36" font-weight="700">Identity and delivery boundaries</text><text class="small" x="65" y="103">Use short-lived role assumption wherever AWS can provide it. Keep secrets out of repositories and images.</text>
  <rect class="panel" x="65" y="170" width="245" height="125" rx="16"/><text class="label" x="95" y="210">SOURCE</text><text class="text" x="95" y="250">GitHub</text><text class="small" x="95" y="278">branch and pull request</text>
  <rect class="panel" x="390" y="170" width="245" height="125" rx="16"/><text class="label" x="420" y="210">CI/CD</text><text class="text" x="420" y="250">GitHub Actions</text><text class="small" x="420" y="278">OIDC federation</text>
  <rect class="role" x="715" y="170" width="245" height="125" rx="16"/><text class="label" x="745" y="210">DEPLOY</text><text class="text" x="745" y="250">Terraform role</text><text class="small" x="745" y="278">dev or prod account</text>
  <path class="secure" d="M310 232 L390 232"/><path class="secure" d="M635 232 L715 232"/>
  <rect class="vpc" x="65" y="385" width="895" height="290" rx="20"/><text class="label" x="95" y="425">PRIVATE VPC SUBNETS</text>
  <rect class="role" x="100" y="460" width="245" height="130" rx="16"/><text class="label" x="130" y="500">RUNTIME ROLE</text><text class="text" x="130" y="540">Mage task role</text><text class="small" x="130" y="570">S3 · Glue · Athena</text>
  <rect class="role" x="390" y="460" width="245" height="130" rx="16"/><text class="label" x="420" y="500">TRANSFORM ROLE</text><text class="text" x="420" y="540">dbt-athena role</text><text class="small" x="420" y="570">read Bronze · write marts</text>
  <rect class="panel" x="680" y="460" width="245" height="130" rx="16"/><text class="label" x="710" y="500">NETWORK</text><text class="text" x="710" y="540">VPC endpoints</text><text class="small" x="710" y="570">S3 · STS · logs</text>
  <path class="dash" d="M837 295 L837 460"/>
  <rect class="aws" x="1060" y="170" width="245" height="125" rx="16"/><text class="label" x="1090" y="210">STORAGE</text><text class="text" x="1090" y="250">S3 + Iceberg</text><text class="small" x="1090" y="278">raw to gold</text>
  <rect class="aws" x="1340" y="170" width="195" height="125" rx="16"/><text class="label" x="1370" y="210">CATALOG</text><text class="text" x="1370" y="250">Glue</text><text class="small" x="1370" y="278">metadata</text>
  <path class="line" d="M960 232 L1060 232"/><path class="line" d="M1305 232 L1340 232"/>
  <rect class="aws" x="1060" y="460" width="245" height="125" rx="16"/><text class="label" x="1090" y="500">QUERY</text><text class="text" x="1090" y="540">Athena</text><text class="small" x="1090" y="568">workgroup and results</text>
  <rect class="bi" x="1340" y="460" width="195" height="125" rx="16"/><text class="label" x="1370" y="500">READ ROLE</text><text class="text" x="1370" y="540">BI tools</text><text class="small" x="1370" y="568">approved datasets</text>
  <path class="secure" d="M960 525 L1060 525"/><path class="secure" d="M1305 525 L1340 525"/>
  <rect class="panel" x="1060" y="635" width="475" height="70" rx="14"/><text class="small" x="1090" y="678">Secrets Manager: fallback for service tokens only</text>
</svg>
