<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Possible ANT entry zones</title>
  <desc id="desc">A price ladder from 40 to 190 dollars a share. Using an illustrative IPO price of 103.30 dollars, equal to a 1.75 trillion valuation, three zones are shown: chasing day one from about 123 to 174 dollars, around the IPO price from about 93 to 108 dollars, and a post-lock-up discount from about 62 to 83 dollars. Private-market marks from 58.90 to 90.80 dollars and the lows of four comparable IPOs mapped onto ANT are marked.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient></defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="40.0" y="56.0" fill="#f6f9fc" font-size="28" font-weight="700">Where an ANT entry would sit against history</text><text x="40.0" y="85.0" fill="#a9bdd0" font-size="16">Per-share prices on about 16.94B fully diluted shares. Illustrative IPO price: $1.75T, the middle of the reported range.</text><rect x="200" y="200.4" width="360" height="155.2" rx="6" fill="#d95926" fill-opacity="0.22" stroke="#d95926"/><text x="214.0" y="220.4" fill="#fff" font-size="14" font-weight="700">Chasing day one</text><text x="214.0" y="238.4" fill="#e6eef6" font-size="13">$123 to $174</text><text x="214.0" y="256.4" fill="#c8dbee" font-size="12">SpaceX-size pop (+19%) to the five-IPO median (+68%)</text><rect x="200" y="400.0" width="360" height="47.5" rx="6" fill="#3987e5" fill-opacity="0.22" stroke="#3987e5"/><text x="214.0" y="420.0" fill="#fff" font-size="14" font-weight="700">Around the IPO price</text><text x="214.0" y="438.0" fill="#e6eef6" font-size="13">$93 to $108</text><rect x="200" y="479.2" width="360" height="63.4" rx="6" fill="#199e70" fill-opacity="0.22" stroke="#199e70"/><text x="214.0" y="499.2" fill="#fff" font-size="14" font-weight="700">Post-lock-up discount</text><text x="214.0" y="517.2" fill="#e6eef6" font-size="13">$62 to $83</text><text x="214.0" y="535.2" fill="#c8dbee" font-size="12">SpaceX and Figma bottomed here; Cerebras went lower</text><line x1="192" y1="610.0" x2="200" y2="610.0" stroke="#5a7389"/><text x="188.0" y="614.0" fill="#8fa6ba" font-size="12" text-anchor="end">$40</text><line x1="192" y1="548.7" x2="200" y2="548.7" stroke="#5a7389"/><text x="188.0" y="552.7" fill="#8fa6ba" font-size="12" text-anchor="end">$60</text><line x1="192" y1="487.3" x2="200" y2="487.3" stroke="#5a7389"/><text x="188.0" y="491.3" fill="#8fa6ba" font-size="12" text-anchor="end">$80</text><line x1="192" y1="426.0" x2="200" y2="426.0" stroke="#5a7389"/><text x="188.0" y="430.0" fill="#8fa6ba" font-size="12" text-anchor="end">$100</text><line x1="192" y1="364.7" x2="200" y2="364.7" stroke="#5a7389"/><text x="188.0" y="368.7" fill="#8fa6ba" font-size="12" text-anchor="end">$120</text><line x1="192" y1="303.3" x2="200" y2="303.3" stroke="#5a7389"/><text x="188.0" y="307.3" fill="#8fa6ba" font-size="12" text-anchor="end">$140</text><line x1="192" y1="242.0" x2="200" y2="242.0" stroke="#5a7389"/><text x="188.0" y="246.0" fill="#8fa6ba" font-size="12" text-anchor="end">$160</text><line x1="192" y1="180.7" x2="200" y2="180.7" stroke="#5a7389"/><text x="188.0" y="184.7" fill="#8fa6ba" font-size="12" text-anchor="end">$180</text><line x1="200" y1="150" x2="200" y2="610" stroke="#5a7389"/><text x="600.0" y="132.0" fill="#d7e3ef" font-size="13" font-weight="700">Valuation it implies</text><line x1="200" y1="551.6" x2="592" y2="551.6" stroke="#f6f9fc" stroke-opacity="0.15" stroke-dasharray="3 4"/><text x="600.0" y="555.6" fill="#a9bdd0" font-size="13">$1T · $59.03</text><line x1="200" y1="506.4" x2="592" y2="506.4" stroke="#f6f9fc" stroke-opacity="0.15" stroke-dasharray="3 4"/><text x="600.0" y="510.4" fill="#a9bdd0" font-size="13">$1.25T · $73.79</text><line x1="200" y1="461.1" x2="592" y2="461.1" stroke="#f6f9fc" stroke-opacity="0.15" stroke-dasharray="3 4"/><text x="600.0" y="465.1" fill="#a9bdd0" font-size="13">$1.5T · $88.55</text><line x1="200" y1="415.9" x2="592" y2="415.9" stroke="#f6f9fc" stroke-opacity="0.6" stroke-dasharray="3 4"/><text x="600.0" y="419.9" fill="#fff" font-size="13" font-weight="700">$1.75T · $103.31  ← illustrative IPO price</text><line x1="200" y1="370.6" x2="592" y2="370.6" stroke="#f6f9fc" stroke-opacity="0.15" stroke-dasharray="3 4"/><text x="600.0" y="374.6" fill="#a9bdd0" font-size="13">$2T · $118.06</text><line x1="200" y1="280.1" x2="592" y2="280.1" stroke="#f6f9fc" stroke-opacity="0.15" stroke-dasharray="3 4"/><text x="600.0" y="284.1" fill="#a9bdd0" font-size="13">$2.5T · $147.58</text><line x1="200" y1="189.6" x2="592" y2="189.6" stroke="#f6f9fc" stroke-opacity="0.15" stroke-dasharray="3 4"/><text x="600.0" y="193.6" fill="#a9bdd0" font-size="13">$3T · $177.10</text><text x="900.0" y="132.0" fill="#d7e3ef" font-size="13" font-weight="700">Private-market marks</text><circle cx="900" cy="552.0" r="5" fill="#9085e9"/><text x="912.0" y="556.0" fill="#d6d0f7" font-size="13">Series H, May 2026 $58.90</text><circle cx="900" cy="513.6" r="5" fill="#9085e9"/><text x="912.0" y="517.6" fill="#d6d0f7" font-size="13">Board mark, Sep 30 $71.43</text><circle cx="900" cy="471.7" r="5" fill="#9085e9"/><text x="912.0" y="475.7" fill="#d6d0f7" font-size="13">Nasdaq Private Market $85.10</text><circle cx="900" cy="454.2" r="5" fill="#9085e9"/><text x="912.0" y="458.2" fill="#d6d0f7" font-size="13">Notice quote $90.80</text><line x1="200" y1="452.2" x2="560" y2="452.2" stroke="#199e70" stroke-width="2"/><circle cx="560" cy="452.2" r="4" fill="#199e70"/><line x1="200" y1="478.6" x2="560" y2="478.6" stroke="#3987e5" stroke-width="2"/><circle cx="560" cy="478.6" r="4" fill="#3987e5"/><line x1="200" y1="483.8" x2="560" y2="483.8" stroke="#d55181" stroke-width="2"/><circle cx="560" cy="483.8" r="4" fill="#d55181"/><line x1="200" y1="567.7" x2="560" y2="567.7" stroke="#d95926" stroke-width="2"/><circle cx="560" cy="567.7" r="4" fill="#d95926"/><text x="200.0" y="640.0" fill="#c8dbee" font-size="12">Coloured lines: where each comparable’s six-month low would land, as a % of the $103.31 price. Circle never fell below its IPO price (low +116%).</text><rect x="200" y="652" width="10" height="10" rx="2" fill="#d95926"/><text x="214.0" y="661.0" fill="#e6eef6" font-size="12">Cerebras $54 (-48%)</text><rect x="390" y="652" width="10" height="10" rx="2" fill="#d55181"/><text x="404.0" y="661.0" fill="#e6eef6" font-size="12">Figma $81 (-21%)</text><rect x="580" y="652" width="10" height="10" rx="2" fill="#3987e5"/><text x="594.0" y="661.0" fill="#e6eef6" font-size="12">SpaceX $83 (-20%)</text><rect x="770" y="652" width="10" height="10" rx="2" fill="#199e70"/><text x="784.0" y="661.0" fill="#e6eef6" font-size="12">CoreWeave $91 (-11%)</text><text x="40.0" y="694.0" fill="#f0a07a" font-size="13" font-weight="700">Not financial advice. No price range has been filed; the $1.75T price is a placeholder to make the zones concrete. Zones move with the real IPO price.</text>
  </g>
</svg>
