<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Five recent IPOs after day one</title>
  <desc id="desc">Line chart of SpaceX, Cerebras, CoreWeave, Circle and Figma over their first six months, indexed to the first-day close. CoreWeave ended about 3.1 times its first-day close and Circle about 1.05 times. SpaceX was at 0.85, Cerebras at 0.31 and Figma at 0.22, so a buyer at the day-one close lost money in three of five.</desc>
