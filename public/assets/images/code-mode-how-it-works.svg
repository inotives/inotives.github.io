<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Same task, two ways of calling tools</title>
  <desc id="desc">Left: with Code Mode off, Claude makes four separate tool calls (Grep, Read, Edit, Bash) and every full result returns into context, four model turns. Right: with Code Mode on, Claude writes one JavaScript script that runs the same tool calls in a REPL on the user's machine and returns only a small object, one model turn. A footnote says that in the author's runs, turn counts matched because Sonnet 5.5 already used shell pipelines.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="610" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Same task, two ways of calling tools</text>
<text x="45" y="85" fill="#a9bdd0" font-size="16">Task: find the retry config, change maxAttempts, run its tests. Each arrow back to Claude is a new model turn.</text>
<rect x="40" y="110" width="545" height="440" rx="12" fill="#8a7fe0" fill-opacity="0.05" stroke="#8a7fe0" stroke-width="1.5"/><text x="60" y="140" fill="#f6f9fc" font-size="17" font-weight="700">Code Mode off: direct tool calls</text><rect x="70" y="165" width="120" height="300" rx="12" fill="#8a7fe0" fill-opacity="0.18" stroke="#8a7fe0" stroke-width="1.5"/><text x="130" y="320" fill="#f6f9fc" font-size="16" font-weight="700" text-anchor="middle">Claude</text><rect x="430" y="165" width="125" height="300" rx="12" fill="#a9bdd0" fill-opacity="0.06" stroke="#a9bdd0" stroke-width="1.5"/><text x="492" y="320" fill="#f6f9fc" font-size="16" font-weight="700" text-anchor="middle">Tools</text><line x1="192" y1="190" x2="426" y2="190" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><text x="310" y="183" fill="#f6f9fc" font-size="13" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">Grep retryPolicy</text><line x1="428" y1="216" x2="194" y2="216" stroke="#90adc2" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="310" y="211" fill="#a9bdd0" font-size="12" text-anchor="middle">← 3 file paths</text><line x1="192" y1="260" x2="426" y2="260" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><text x="310" y="253" fill="#f6f9fc" font-size="13" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">Read retry.ts</text><line x1="428" y1="286" x2="194" y2="286" stroke="#90adc2" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="310" y="281" fill="#a9bdd0" font-size="12" text-anchor="middle">← the whole file</text><line x1="192" y1="330" x2="426" y2="330" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><text x="310" y="323" fill="#f6f9fc" font-size="13" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">Edit 3 → 5</text><line x1="428" y1="356" x2="194" y2="356" stroke="#90adc2" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="310" y="351" fill="#a9bdd0" font-size="12" text-anchor="middle">← diff</text><line x1="192" y1="400" x2="426" y2="400" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><text x="310" y="393" fill="#f6f9fc" font-size="13" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">Bash npm test</text><line x1="428" y1="426" x2="194" y2="426" stroke="#90adc2" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="310" y="421" fill="#a9bdd0" font-size="12" text-anchor="middle">← full test log</text><text x="60" y="495" fill="#f6f9fc" font-size="14" font-weight="700">4 model turns. Every result lands in context</text><text x="60" y="515" fill="#f6f9fc" font-size="14" font-weight="700">and is re-read on every later turn.</text><text x="60" y="538" fill="#6f8aa3" font-size="12">context:</text><rect x="120.0" y="528" width="60.0" height="14" rx="4" fill="#8a7fe0" fill-opacity="0.75"/><rect x="183.0" y="528" width="40.0" height="14" rx="4" fill="#8a7fe0" fill-opacity="0.75"/><rect x="226.0" y="528" width="30.0" height="14" rx="4" fill="#8a7fe0" fill-opacity="0.75"/><rect x="259.0" y="528" width="110.0" height="14" rx="4" fill="#8a7fe0" fill-opacity="0.75"/><rect x="615" y="110" width="545" height="440" rx="12" fill="#2fa9a0" fill-opacity="0.05" stroke="#2fa9a0" stroke-width="1.5"/><text x="635" y="140" fill="#f6f9fc" font-size="17" font-weight="700">Code Mode on: one script</text><rect x="645" y="165" width="120" height="300" rx="12" fill="#2fa9a0" fill-opacity="0.18" stroke="#2fa9a0" stroke-width="1.5"/><text x="705" y="320" fill="#f6f9fc" font-size="16" font-weight="700" text-anchor="middle">Claude</text><rect x="830" y="165" width="300" height="300" rx="12" fill="#a9bdd0" fill-opacity="0.06" stroke="#a9bdd0" stroke-width="1.5"/><text x="980" y="190" fill="#f6f9fc" font-size="14" font-weight="700" text-anchor="middle">REPL runtime (your machine)</text><rect x="848" y="205" width="264" height="120" rx="8" fill="#0b1522" fill-opacity="0.8"/><text x="858" y="228" fill="#f6f9fc" font-size="11.5" font-family="ui-monospace,Menlo,monospace">const f = await $`rg -l retry src`</text><text x="858" y="249" fill="#f6f9fc" font-size="11.5" font-family="ui-monospace,Menlo,monospace">await edit(f, 'maxAttempts: 3',</text><text x="858" y="270" fill="#f6f9fc" font-size="11.5" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">  'maxAttempts: 5')</text><text x="858" y="291" fill="#f6f9fc" font-size="11.5" font-family="ui-monospace,Menlo,monospace">const t = await $`npm test`.nothrow()</text><text x="858" y="312" fill="#c4812b" font-size="11.5" font-family="ui-monospace,Menlo,monospace">({ edited: f, pass: t.exitCode === 0 })</text><rect x="860" y="350" width="72" height="30" rx="15" fill="#a9bdd0" fill-opacity="0.15" stroke="#a9bdd0"/><text x="896" y="370" fill="#f6f9fc" font-size="12" text-anchor="middle">Bash</text><rect x="944" y="350" width="72" height="30" rx="15" fill="#a9bdd0" fill-opacity="0.15" stroke="#a9bdd0"/><text x="980" y="370" fill="#f6f9fc" font-size="12" text-anchor="middle">Edit</text><rect x="1028" y="350" width="72" height="30" rx="15" fill="#a9bdd0" fill-opacity="0.15" stroke="#a9bdd0"/><text x="1064" y="370" fill="#f6f9fc" font-size="12" text-anchor="middle">Bash</text><text x="980" y="405" fill="#a9bdd0" font-size="12" text-anchor="middle">tool calls run inside the script;</text><text x="980" y="422" fill="#a9bdd0" font-size="12" text-anchor="middle">their raw output stays here</text><line x1="767" y1="230" x2="826" y2="230" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><text x="796" y="220" fill="#f6f9fc" font-size="12" text-anchor="middle">script</text><line x1="826" y1="300" x2="769" y2="300" stroke="#90adc2" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="796" y="290" fill="#a9bdd0" font-size="12" text-anchor="middle">result</text><text x="635" y="495" fill="#f6f9fc" font-size="14" font-weight="700">1 model turn. Only the return value</text><text x="635" y="515" fill="#f6f9fc" font-size="14" font-weight="700">comes back: { edited, pass: true }.</text><text x="635" y="538" fill="#6f8aa3" font-size="12">context:</text><rect x="695.0" y="528" width="40.0" height="14" rx="4" fill="#2fa9a0" fill-opacity="0.75"/><text x="45" y="582" fill="#6f8aa3" font-size="13">That is the theory. In my runs Sonnet 5.5 already chained work in single shell pipelines, so turn counts matched; the saving came from elsewhere.</text>
  </g>
</svg>
