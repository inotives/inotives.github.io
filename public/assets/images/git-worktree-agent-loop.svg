<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Agent loop through an isolated Git worktree</title>
  <desc id="desc">The loop starts from a base commit, creates a task worktree, implements and reviews changes, fixes findings, commits accepted work, and integrates it.</desc>
  <style>
    .march { stroke-dasharray: 10 12; animation: march 3s linear infinite; }
    .active { animation: glow 2.6s ease-in-out infinite; }
    @keyframes march { to { stroke-dashoffset: -44; } }
    @keyframes glow { 0%,100% { opacity:.75; } 50% { opacity:1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#17172f"/></linearGradient>
    <linearGradient id="base" x1="0" x2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#3730a3"/></linearGradient>
    <linearGradient id="work" x1="0" x2="1"><stop stop-color="#0e7490"/><stop offset="1" stop-color="#155e75"/></linearGradient>
    <linearGradient id="review" x1="0" x2="1"><stop stop-color="#6b21a8"/><stop offset="1" stop-color="#7e22ce"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <text x="68" y="68" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">An agent task gets its own working context</text>
  <text x="68" y="102" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Each stage sees one task branch and one diff; accepted work returns to the target branch.</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <rect x="55" y="225" width="190" height="126" rx="18" fill="url(#base)" stroke="#93c5fd"/>
    <text x="150" y="273" fill="#eff6ff" font-size="18" font-weight="700">Base commit</text><text x="150" y="308" fill="#dbeafe" font-size="14">known starting point</text>
    <rect class="active" x="295" y="225" width="190" height="126" rx="18" fill="url(#work)" stroke="#67e8f9"/>
    <text x="390" y="273" fill="#ecfeff" font-size="18" font-weight="700">Task worktree</text><text x="390" y="308" fill="#cffafe" font-size="14">isolated files + branch</text>
    <rect x="535" y="225" width="190" height="126" rx="18" fill="#164e63" stroke="#22d3ee"/>
    <text x="630" y="273" fill="#ecfeff" font-size="18" font-weight="700">Worker</text><text x="630" y="308" fill="#cffafe" font-size="14">edit + verify</text>
    <rect x="775" y="225" width="170" height="126" rx="18" fill="url(#review)" stroke="#d8b4fe"/>
    <text x="860" y="273" fill="#faf5ff" font-size="18" font-weight="700">Reviewer</text><text x="860" y="308" fill="#e9d5ff" font-size="14">diff + evidence</text>
    <rect x="995" y="225" width="155" height="126" rx="18" fill="#14532d" stroke="#86efac"/>
    <text x="1072" y="273" fill="#f0fdf4" font-size="18" font-weight="700">Integrate</text><text x="1072" y="308" fill="#bbf7d0" font-size="14">commit / merge</text>
  </g>
  <path d="M245 288H285M485 288H525M725 288H765M945 288H985" fill="none" stroke="#164e63" stroke-width="10" stroke-linecap="round"/>
  <path class="march" d="M245 288H285M485 288H525M725 288H765M945 288H985" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M858 352V445H632V360" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <rect x="430" y="455" width="405" height="84" rx="16" fill="#1e1b4b" stroke="#7c3aed"/>
  <text x="632" y="489" fill="#ede9fe" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">Finding? Return to the same task worktree</text>
  <text x="632" y="516" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Fix → re-check → re-review before integration</text>
  <text x="68" y="604" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">Commit to preserve the checkpoint; remove the worktree only when the task changes are safe.</text>
</svg>
