<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Do expensive runs give better answers?</title>
  <desc id="desc">Correct-answer rate by cost quintile of 200 runs each. All 1,000 runs: 96, 92, 92, 85 and 79 percent from cheapest to most expensive. The 345 runs Tempo kept after tail sampling: 86, 75, 77, 77 and 62 percent. Within a single question type the gap almost disappears: price questions 98 percent correct in the cheaper half and 96 in the dearer half, conversions 87 and 84, portfolios 82 and 82.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="490" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Do expensive runs give better answers?</text>
<text x="45" y="85" fill="#a9bdd0" font-size="16">Share of correct answers by cost quintile (200 runs each). Higher is better.</text>
<path d="M110 380H760" stroke="#2a3d55" stroke-dasharray="4 4"/><text x="100" y="384.0" fill="#6f8aa3" font-size="12" text-anchor="end">50%</text>
<path d="M110 255H760" stroke="#2a3d55" stroke-dasharray="4 4"/><text x="100" y="259.0" fill="#6f8aa3" font-size="12" text-anchor="end">75%</text>
<path d="M110 130H760" stroke="#2a3d55" stroke-dasharray="4 4"/><text x="100" y="134.0" fill="#6f8aa3" font-size="12" text-anchor="end">100%</text>
<rect x="141" y="150.0" width="34" height="230.0" rx="4" fill="#4fd1c5" fill-opacity="0.85"/>
<text x="158" y="143.0" fill="#4fd1c5" font-size="12.5" font-weight="700" text-anchor="middle">96</text>
<rect x="179" y="200.0" width="34" height="180.0" rx="4" fill="#f2706b" fill-opacity="0.85"/>
<text x="196" y="193.0" fill="#f2706b" font-size="12.5" font-weight="700" text-anchor="middle">86</text>
<text x="177" y="402" fill="#a9bdd0" font-size="13" font-weight="700" text-anchor="middle">Q1</text><text x="177" y="420" fill="#6f8aa3" font-size="11.5" text-anchor="middle">0.34–0.49¢</text>
<rect x="271" y="170.0" width="34" height="210.0" rx="4" fill="#4fd1c5" fill-opacity="0.85"/>
<text x="288" y="163.0" fill="#4fd1c5" font-size="12.5" font-weight="700" text-anchor="middle">92</text>
<rect x="309" y="255.0" width="34" height="125.0" rx="4" fill="#f2706b" fill-opacity="0.85"/>
<text x="326" y="248.0" fill="#f2706b" font-size="12.5" font-weight="700" text-anchor="middle">75</text>
<text x="307" y="402" fill="#a9bdd0" font-size="13" font-weight="700" text-anchor="middle">Q2</text><text x="307" y="420" fill="#6f8aa3" font-size="11.5" text-anchor="middle">0.49–0.74¢</text>
<rect x="401" y="170.0" width="34" height="210.0" rx="4" fill="#4fd1c5" fill-opacity="0.85"/>
<text x="418" y="163.0" fill="#4fd1c5" font-size="12.5" font-weight="700" text-anchor="middle">92</text>
<rect x="439" y="245.0" width="34" height="135.0" rx="4" fill="#f2706b" fill-opacity="0.85"/>
<text x="456" y="238.0" fill="#f2706b" font-size="12.5" font-weight="700" text-anchor="middle">77</text>
<text x="437" y="402" fill="#a9bdd0" font-size="13" font-weight="700" text-anchor="middle">Q3</text><text x="437" y="420" fill="#6f8aa3" font-size="11.5" text-anchor="middle">0.74–0.87¢</text>
<rect x="531" y="205.0" width="34" height="175.0" rx="4" fill="#4fd1c5" fill-opacity="0.85"/>
<text x="548" y="198.0" fill="#4fd1c5" font-size="12.5" font-weight="700" text-anchor="middle">85</text>
<rect x="569" y="245.0" width="34" height="135.0" rx="4" fill="#f2706b" fill-opacity="0.85"/>
<text x="586" y="238.0" fill="#f2706b" font-size="12.5" font-weight="700" text-anchor="middle">77</text>
<text x="567" y="402" fill="#a9bdd0" font-size="13" font-weight="700" text-anchor="middle">Q4</text><text x="567" y="420" fill="#6f8aa3" font-size="11.5" text-anchor="middle">0.87–1.30¢</text>
<rect x="661" y="235.0" width="34" height="145.0" rx="4" fill="#4fd1c5" fill-opacity="0.85"/>
<text x="678" y="228.0" fill="#4fd1c5" font-size="12.5" font-weight="700" text-anchor="middle">79</text>
<rect x="699" y="320.0" width="34" height="60.0" rx="4" fill="#f2706b" fill-opacity="0.85"/>
<text x="716" y="313.0" fill="#f2706b" font-size="12.5" font-weight="700" text-anchor="middle">62</text>
<text x="697" y="402" fill="#a9bdd0" font-size="13" font-weight="700" text-anchor="middle">Q5</text><text x="697" y="420" fill="#6f8aa3" font-size="11.5" text-anchor="middle">1.30–8.24¢</text>
<rect x="110" y="440" width="14" height="14" rx="3" fill="#4fd1c5"/>
<text x="132" y="452" fill="#a9bdd0" font-size="13">All 1,000 runs (truth, Langfuse)</text>
<rect x="400" y="440" width="14" height="14" rx="3" fill="#f2706b"/>
<text x="422" y="452" fill="#a9bdd0" font-size="13">345 runs Tempo kept</text>
<text x="810" y="150" fill="#f6f9fc" font-size="15" font-weight="700">Within one question type</text>
<text x="810" y="172" fill="#a9bdd0" font-size="13">the slope almost disappears:</text>
<text x="810" y="210" fill="#f6f9fc" font-size="13.5" font-weight="700">price · mean 0.56¢</text>
<text x="810" y="232" fill="#a9bdd0" font-size="13">cheap half 98% · expensive half 96%</text>
<text x="810" y="268" fill="#f6f9fc" font-size="13.5" font-weight="700">convert · mean 0.97¢</text>
<text x="810" y="290" fill="#a9bdd0" font-size="13">cheap half 87% · expensive half 84%</text>
<text x="810" y="326" fill="#f6f9fc" font-size="13.5" font-weight="700">portfolio · mean 1.64¢</text>
<text x="810" y="348" fill="#a9bdd0" font-size="13">cheap half 82% · expensive half 82%</text>
<text x="810" y="390" fill="#6f8aa3" font-size="12.5">Most of the slope is hard questions</text>
<text x="810" y="408" fill="#6f8aa3" font-size="12.5">costing more. The rest is waste:</text>
<text x="810" y="426" fill="#6f8aa3" font-size="12.5">loops and retries buy nothing.</text>
  </g>
</svg>
