<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">What the shadcn AI SDK helper swaps out</title>
  <desc id="desc">Diagram. On the left, a chat UI (message bubbles, reasoning panel, tool cards, approve and deny buttons, sources, error and retry) sits on useChat from @ai-sdk/react. Two lanes feed its transport. Production: DefaultChatTransport to an API route, streamText and a model; in the author's test each reload took 1.3 to 8.6 seconds to the first token, cost about 0.007 dollars and gave a different answer. Design, demo, docs and CI: a createChat script from @shadcn/helpers/ai-sdk with a user message and a tool call needing approval, turned into a transport; no model, route, network call or key, first chunk in about 2 to 14 milliseconds, the same output every run, any state on demand.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">What the shadcn AI SDK helper swaps out</text><text x="45" y="85" fill="#a9bdd0" font-size="16">Your chat UI and useChat stay the same. Only the transport changes: a real backend in production, a script while you design and test.</text><rect x="45" y="120" width="330" height="380" rx="12" fill="#90adc2" fill-opacity="0.05" stroke="#90adc2" stroke-width="1.5"/><text x="65" y="150" fill="#f6f9fc" font-size="16" font-weight="700">Your chat UI (the same code)</text><rect x="65" y="168" width="290" height="28" rx="6" fill="#0b1522" fill-opacity="0.7" stroke="#22344a"/><text x="80" y="187" fill="#a9bdd0" font-size="13">Message bubbles</text><rect x="65" y="204" width="290" height="28" rx="6" fill="#0b1522" fill-opacity="0.7" stroke="#22344a"/><text x="80" y="223" fill="#a9bdd0" font-size="13">Reasoning panel</text><rect x="65" y="240" width="290" height="28" rx="6" fill="#0b1522" fill-opacity="0.7" stroke="#22344a"/><text x="80" y="259" fill="#a9bdd0" font-size="13">Tool cards</text><rect x="65" y="276" width="290" height="28" rx="6" fill="#0b1522" fill-opacity="0.7" stroke="#22344a"/><text x="80" y="295" fill="#a9bdd0" font-size="13">Approve / Deny</text><rect x="65" y="312" width="290" height="28" rx="6" fill="#0b1522" fill-opacity="0.7" stroke="#22344a"/><text x="80" y="331" fill="#a9bdd0" font-size="13">Sources</text><rect x="65" y="348" width="290" height="28" rx="6" fill="#0b1522" fill-opacity="0.7" stroke="#22344a"/><text x="80" y="367" fill="#a9bdd0" font-size="13">Error + Retry</text><rect x="65" y="390" width="290" height="62" rx="8" fill="#c4812b" fill-opacity="0.12" stroke="#c4812b" stroke-opacity="0.8"/><text x="210" y="416" fill="#f6f9fc" font-size="14" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">useChat({ transport })</text><text x="210" y="436" fill="#a9bdd0" font-size="12" text-anchor="middle">@ai-sdk/react · same state machine</text><rect x="470" y="120" width="690" height="170" rx="12" fill="#8a7fe0" fill-opacity="0.06" stroke="#8a7fe0" stroke-width="1.5"/><text x="490" y="150" fill="#f6f9fc" font-size="16" font-weight="700">Production: a real model behind an API route</text><rect x="490" y="175" width="210" height="26" rx="13" fill="#a9bdd0" fill-opacity="0.14" stroke="#a9bdd0" stroke-opacity="0.7"/><text x="595" y="192" fill="#f6f9fc" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">DefaultChatTransport</text><line x1="704" y1="188" x2="744" y2="188" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="748" y="175" width="110" height="26" rx="13" fill="#a9bdd0" fill-opacity="0.14" stroke="#a9bdd0" stroke-opacity="0.7"/><text x="803" y="192" fill="#f6f9fc" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">/api/chat</text><line x1="862" y1="188" x2="902" y2="188" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="906" y="175" width="120" height="26" rx="13" fill="#a9bdd0" fill-opacity="0.14" stroke="#a9bdd0" stroke-opacity="0.7"/><text x="966" y="192" fill="#f6f9fc" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">streamText</text><line x1="1030" y1="188" x2="1060" y2="188" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="1064" y="175" width="80" height="26" rx="13" fill="#a9bdd0" fill-opacity="0.14" stroke="#a9bdd0" stroke-opacity="0.7"/><text x="1104" y="192" fill="#f6f9fc" font-size="12" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">model</text><text x="490" y="232" fill="#f6f9fc" font-size="13">Each reload in my test: 1.3–8.6 s to the first token, ~$0.007, and a different answer every time.</text><text x="490" y="254" fill="#a9bdd0" font-size="13">Errors, timeouts and rejected tool calls happen when they happen, not when you need to style them.</text><rect x="470" y="320" width="690" height="180" rx="12" fill="#2fa9a0" fill-opacity="0.06" stroke="#2fa9a0" stroke-width="1.5"/><text x="490" y="350" fill="#f6f9fc" font-size="16" font-weight="700">Design, demo, docs, CI: a scripted conversation</text><rect x="490" y="368" width="420" height="104" rx="8" fill="#0b1522" fill-opacity="0.85"/><text x="502" y="390" fill="#f6f9fc" font-size="12" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">createChat()</text><text x="502" y="408" fill="#f6f9fc" font-size="12" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">  .user("Buy 2 SOL at market.")</text><text x="502" y="426" fill="#f6f9fc" font-size="12" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">  .assistant(({ writer }) =&gt; writer.tool(</text><text x="502" y="444" fill="#f6f9fc" font-size="12" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">    "place_order", { input, needsApproval: true }))</text><text x="502" y="462" fill="#c4812b" font-size="12" font-family="ui-monospace,Menlo,monospace" xml:space="preserve">  .transport({ delayMs: 50 })</text><text x="930" y="388" fill="#f6f9fc" font-size="13" font-weight="700">No model, route,</text><text x="930" y="406" fill="#f6f9fc" font-size="13" font-weight="700">network call or key.</text><text x="930" y="432" fill="#a9bdd0" font-size="13">First chunk in ~2–14 ms.</text><text x="930" y="450" fill="#a9bdd0" font-size="13">Same output every run.</text><text x="930" y="468" fill="#a9bdd0" font-size="13">Any state on demand.</text><line x1="468" y1="205" x2="358" y2="430" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><line x1="468" y1="420" x2="358" y2="448" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><text x="45" y="535" fill="#6f8aa3" font-size="13">@shadcn/helpers/ai-sdk returns an AI SDK ChatTransport, so switching lanes is one prop on useChat. It does not generate UI and it is not a model: it is a fixture.</text>
  </g>
</svg>
