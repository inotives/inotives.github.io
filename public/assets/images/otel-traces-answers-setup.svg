<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">One gateway, two backends, one score</title>
  <desc id="desc">The crypto-desk replay sends 1,000 runs over OTLP to a gateway Collector. The Collector redacts, counts every span with spanmetrics, then splits: a tail-sampled copy (errors, slow, expensive, bad answers and a 10 percent baseline) goes to Tempo in the grafana/otel-lgtm container, where Prometheus also stores the token metrics labelled by turn reason. An unsampled copy goes to a self-hosted Langfuse. A separate evaluator job posts one answer_check score per trace to Langfuse's REST API.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="470" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">One gateway, two backends, one score</text>
<text x="45" y="85" fill="#a9bdd0" font-size="16">Same 1,000 replayed runs as part three. Tempo gets a sample; Langfuse gets everything.</text>
<rect x="45" y="150" width="230" height="150" rx="12" fill="#f6f9fc" fill-opacity="0.12" stroke="#f6f9fc" stroke-opacity="0.7"/><text x="59" y="176" fill="#f6f9fc" font-size="15" font-weight="700">crypto-desk replay</text><text x="59" y="198" fill="#a9bdd0" font-size="12.5">1,000 runs, Sonnet 5.5 shape</text><text x="59" y="217" fill="#a9bdd0" font-size="12.5">chat spans tagged with</text><text x="59" y="236" fill="#a9bdd0" font-size="12.5">crypto_desk.turn.reason</text><text x="59" y="255" fill="#a9bdd0" font-size="12.5">answer check on the root span</text>
<rect x="345" y="120" width="300" height="200" rx="12" fill="#4fd1c5" fill-opacity="0.12" stroke="#4fd1c5" stroke-opacity="0.7"/><text x="359" y="146" fill="#f6f9fc" font-size="15" font-weight="700">Gateway Collector 0.140.1</text><text x="359" y="168" fill="#a9bdd0" font-size="12.5">1. transform/redact</text><text x="359" y="187" fill="#a9bdd0" font-size="12.5">2. spanmetrics: count every span</text><text x="359" y="206" fill="#a9bdd0" font-size="12.5">3a. tail_sampling → Tempo</text><text x="359" y="225" fill="#a9bdd0" font-size="12.5">     errors · slow · expensive</text><text x="359" y="244" fill="#a9bdd0" font-size="12.5">     bad_answer · 10% baseline</text><text x="359" y="263" fill="#a9bdd0" font-size="12.5">3b. no sampling → Langfuse</text><text x="359" y="282" fill="#a9bdd0" font-size="12.5">app metrics pass straight through</text>
<rect x="735" y="110" width="400" height="110" rx="12" fill="#b39ddb" fill-opacity="0.12" stroke="#b39ddb" stroke-opacity="0.7"/><text x="749" y="136" fill="#f6f9fc" font-size="15" font-weight="700">grafana/otel-lgtm 0.40.0</text><text x="749" y="158" fill="#a9bdd0" font-size="12.5">Tempo: sampled traces, TraceQL</text><text x="749" y="177" fill="#a9bdd0" font-size="12.5">Prometheus: token metrics by turn.reason</text>
<rect x="735" y="250" width="400" height="110" rx="12" fill="#f2706b" fill-opacity="0.12" stroke="#f2706b" stroke-opacity="0.7"/><text x="749" y="276" fill="#f6f9fc" font-size="15" font-weight="700">Langfuse 4.80.0 (self-hosted, 6 containers)</text><text x="749" y="298" fill="#a9bdd0" font-size="12.5">every trace, cost from its model price table</text><text x="749" y="317" fill="#a9bdd0" font-size="12.5">scores posted via /api/public/scores</text>
<rect x="45" y="360" width="230" height="80" rx="12" fill="#f6f9fc" fill-opacity="0.12" stroke="#f6f9fc" stroke-opacity="0.7"/><text x="59" y="386" fill="#f6f9fc" font-size="15" font-weight="700">evaluator job</text><text x="59" y="408" fill="#a9bdd0" font-size="12.5">answer_check score per trace</text>
<path d="M275 225L343 225" stroke="#90adc2" stroke-width="1.7" fill="none" marker-end="url(#a)"/><text x="290" y="215" fill="#6f8aa3" font-size="12">OTLP</text>
<path d="M645 190L733 165" stroke="#90adc2" stroke-width="1.7" fill="none" marker-end="url(#a)"/><text x="660" y="165" fill="#6f8aa3" font-size="12">sampled</text>
<path d="M645 290L733 305" stroke="#90adc2" stroke-width="1.7" fill="none" marker-end="url(#a)"/><text x="670" y="315" fill="#6f8aa3" font-size="12">100%</text>
<path d="M275 400L733 330" stroke="#90adc2" stroke-width="1.7" fill="none" marker-end="url(#a)"/><text x="480" y="382" fill="#6f8aa3" font-size="12">REST</text>
  </g>
</svg>
