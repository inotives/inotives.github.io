<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">One-person company agentic operating system</title>
  <desc id="desc">A dark architecture diagram showing an owner, Orca fleet coordination, Claude, Codex, OpenCode and Antigravity agents, OpenKnowledge memory, and business workflows.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.owner{fill:#332b1d;stroke:#e2b866;stroke-width:2}.orca{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.agent{fill:#17263b;stroke:#587692;stroke-width:2}.memory{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.work{fill:#17343a;stroke:#7ee0d1;stroke-width:2}.text{fill:#e7eef6;font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.yellow{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}.purple{stroke:#ba79c7;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="860"/><text class="text" x="65" y="68" font-size="36" font-weight="700">An agentic operating system for a one-person company</text><text class="small" x="65" y="103">One owner sets direction. Orca coordinates the fleet. OpenKnowledge keeps the memory durable.</text>
  <rect class="owner" x="65" y="215" width="260" height="155" rx="18"/><text class="label" x="105" y="260">OWNER</text><text class="text" x="105" y="305">Direction</text><text class="small" x="105" y="345">priorities · approval · override</text>
  <rect class="orca" x="455" y="170" width="330" height="245" rx="20"/><text class="label" x="495" y="215">ORCA</text><text class="text" x="495" y="260">Fleet coordination</text><text class="small" x="495" y="310">dispatch roles and tasks</text><text class="small" x="495" y="345">monitor parallel work</text><text class="small" x="495" y="380">collect results</text><path class="yellow" d="M325 292 L455 292"/>
  <rect class="agent" x="900" y="140" width="250" height="125" rx="16"/><text class="label" x="935" y="180">ROLE AGENT</text><text class="text" x="935" y="225">Strategy</text><text class="small" x="935" y="252">Claude / Codex</text><rect class="agent" x="1190" y="140" width="250" height="125" rx="16"/><text class="label" x="1225" y="180">ROLE AGENT</text><text class="text" x="1225" y="225">Operations</text><text class="small" x="1225" y="252">OpenCode / CLI</text><rect class="agent" x="900" y="315" width="250" height="125" rx="16"/><text class="label" x="935" y="355">ROLE AGENT</text><text class="text" x="935" y="400">Research</text><text class="small" x="935" y="427">web and synthesis</text><rect class="agent" x="1190" y="315" width="250" height="125" rx="16"/><text class="label" x="1225" y="355">ROLE AGENT</text><text class="text" x="1225" y="400">Finance / admin</text><text class="small" x="1225" y="427">bounded workflows</text><path class="line" d="M785 250 L900 205"/><path class="line" d="M785 285 L1190 205"/><path class="line" d="M785 345 L900 380"/><path class="line" d="M785 380 L1190 380"/>
  <rect class="memory" x="455" y="520" width="500" height="215" rx="20"/><text class="label" x="495" y="565">OPENKNOWLEDGE MEMORY</text><text class="text" x="495" y="610">Markdown wiki + agent search</text><text class="small" x="495" y="655">who · what · how · ownership</text><text class="small" x="495" y="690">current state · guardrails</text><path class="purple" d="M700 415 L700 520"/>
  <rect class="work" x="1060" y="520" width="380" height="215" rx="20"/><text class="label" x="1100" y="565">BUSINESS WORK</text><text class="text" x="1100" y="610">BAU and projects</text><text class="small" x="1100" y="655">customer · product · delivery</text><text class="small" x="1100" y="690">reviewed outcomes</text><path class="line" d="M1150 440 L1190 520"/><path class="line" d="M1300 440 L1300 520"/>
  <path class="purple" d="M955 625 L1060 625"/><rect class="owner" x="65" y="570" width="260" height="165" rx="18"/><text class="label" x="105" y="615">CONTROL</text><text class="text" x="105" y="660">Guardrails</text><text class="small" x="105" y="700">human approval for risk</text><path class="yellow" d="M325 650 L455 650"/>
</svg>
