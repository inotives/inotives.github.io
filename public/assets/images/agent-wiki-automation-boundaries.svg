<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Automation and judgment boundaries in an agent wiki</title>
  <desc id="desc">A dark diagram separating checks automation can perform from decisions that require human or domain-owner judgment.</desc>
  <defs><style>.bg{fill:#0b1220}.auto{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.human{fill:#332b1d;stroke:#e2b866;stroke-width:2}.both{fill:#17263b;stroke:#587692;stroke-width:2}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.dash{stroke:#667d96;stroke-width:3;stroke-dasharray:10 8;fill:none}</style></defs>
  <rect class="bg" width="1600" height="780"/><text class="text" x="65" y="68" font-size="36" font-weight="700">A shared wiki needs both checks and judgment</text><text class="small" x="65" y="103">Automation can make changes safer. It cannot decide whether knowledge is true or useful.</text>
  <rect class="auto" x="65" y="175" width="650" height="480" rx="22"/><text class="label" x="105" y="220">AUTOMATION CAN CHECK</text><text class="text" x="105" y="270">Structure and consistency</text><text class="small" x="105" y="325">required metadata is present</text><text class="small" x="105" y="365">links resolve and pages are discoverable</text><text class="small" x="105" y="405">duplicates and stale review dates</text><text class="small" x="105" y="445">folder and naming conventions</text><text class="small" x="105" y="485">scope and change boundaries</text><text class="small" x="105" y="525">generated output matches its source</text><text class="small" x="105" y="590">output: report, warning, or review request</text>
  <rect class="human" x="885" y="175" width="650" height="480" rx="22"/><text class="label" x="925" y="220">PEOPLE MUST DECIDE</text><text class="text" x="925" y="270">Meaning and responsibility</text><text class="small" x="925" y="325">whether the claim is correct</text><text class="small" x="925" y="365">which team owns the topic</text><text class="small" x="925" y="405">whether a change is safe to share</text><text class="small" x="925" y="445">which conflicting page wins</text><text class="small" x="925" y="485">whether old knowledge should retire</text><text class="small" x="925" y="525">whether an agent should act at all</text><text class="small" x="925" y="590">output: approval, correction, or escalation</text>
  <rect class="both" x="590" y="680" width="420" height="55" rx="14"/><text class="text" x="630" y="717">Safe sharing happens between them</text><path class="dash" d="M715 415 L885 415"/>
</svg>
