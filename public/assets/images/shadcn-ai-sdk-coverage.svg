<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">Which chat states can you put on screen when you want them?</title>
  <desc id="desc">Checklist of 11 chat UI states: streaming text, reasoning, tool running, tool output, tool error, approval requested, approved, denied, sources, stream error, and a long answer with a table. Scripted with the helper: all 11 reached on demand in one Playwright session. Real model in the author's 20 baseline calls, which had no tools: 2 of 11, streaming text and a long answer with a table.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="550" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Which chat states can you put on screen when you want them?</text><text x="45" y="85" fill="#a9bdd0" font-size="16">The 11 states the mock's components handle. Scripted: all 11 reached on demand in one Playwright session. Real model: what my 20 baseline calls produced.</text><text x="640" y="140" fill="#f6f9fc" font-size="14" font-weight="700" text-anchor="middle">Scripted</text><text x="900" y="140" fill="#f6f9fc" font-size="14" font-weight="700" text-anchor="middle">Real model, 20 calls</text><rect x="45" y="153" width="1110" height="30" rx="4" fill="#ffffff" fill-opacity="0.025"/><text x="65" y="172" fill="#f6f9fc" font-size="14">Streaming text</text><circle cx="640" cy="167" r="9" fill="#2fa9a0"/><path d="M636 167l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><circle cx="900" cy="167" r="9" fill="#8a7fe0"/><path d="M896 167l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><text x="65" y="202" fill="#f6f9fc" font-size="14">Reasoning</text><circle cx="640" cy="197" r="9" fill="#2fa9a0"/><path d="M636 197l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><circle cx="900" cy="197" r="8" fill="none" stroke="#6f8aa3" stroke-width="1.5"/><rect x="45" y="213" width="1110" height="30" rx="4" fill="#ffffff" fill-opacity="0.025"/><text x="65" y="232" fill="#f6f9fc" font-size="14">Tool running</text><circle cx="640" cy="227" r="9" fill="#2fa9a0"/><path d="M636 227l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><circle cx="900" cy="227" r="8" fill="none" stroke="#6f8aa3" stroke-width="1.5"/><text x="65" y="262" fill="#f6f9fc" font-size="14">Tool output</text><circle cx="640" cy="257" r="9" fill="#2fa9a0"/><path d="M636 257l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><circle cx="900" cy="257" r="8" fill="none" stroke="#6f8aa3" stroke-width="1.5"/><rect x="45" y="273" width="1110" height="30" rx="4" fill="#ffffff" fill-opacity="0.025"/><text x="65" y="292" fill="#f6f9fc" font-size="14">Tool error</text><circle cx="640" cy="287" r="9" fill="#2fa9a0"/><path d="M636 287l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><circle cx="900" cy="287" r="8" fill="none" stroke="#6f8aa3" stroke-width="1.5"/><text x="65" y="322" fill="#f6f9fc" font-size="14">Approval requested</text><circle cx="640" cy="317" r="9" fill="#2fa9a0"/><path d="M636 317l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><circle cx="900" cy="317" r="8" fill="none" stroke="#6f8aa3" stroke-width="1.5"/><rect x="45" y="333" width="1110" height="30" rx="4" fill="#ffffff" fill-opacity="0.025"/><text x="65" y="352" fill="#f6f9fc" font-size="14">Approved</text><circle cx="640" cy="347" r="9" fill="#2fa9a0"/><path d="M636 347l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><circle cx="900" cy="347" r="8" fill="none" stroke="#6f8aa3" stroke-width="1.5"/><text x="65" y="382" fill="#f6f9fc" font-size="14">Denied</text><circle cx="640" cy="377" r="9" fill="#2fa9a0"/><path d="M636 377l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><circle cx="900" cy="377" r="8" fill="none" stroke="#6f8aa3" stroke-width="1.5"/><rect x="45" y="393" width="1110" height="30" rx="4" fill="#ffffff" fill-opacity="0.025"/><text x="65" y="412" fill="#f6f9fc" font-size="14">Sources</text><circle cx="640" cy="407" r="9" fill="#2fa9a0"/><path d="M636 407l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><circle cx="900" cy="407" r="8" fill="none" stroke="#6f8aa3" stroke-width="1.5"/><text x="65" y="442" fill="#f6f9fc" font-size="14">Stream error</text><circle cx="640" cy="437" r="9" fill="#2fa9a0"/><path d="M636 437l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><circle cx="900" cy="437" r="8" fill="none" stroke="#6f8aa3" stroke-width="1.5"/><rect x="45" y="453" width="1110" height="30" rx="4" fill="#ffffff" fill-opacity="0.025"/><text x="65" y="472" fill="#f6f9fc" font-size="14">Long answer with a table</text><circle cx="640" cy="467" r="9" fill="#2fa9a0"/><path d="M636 467l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><circle cx="900" cy="467" r="9" fill="#8a7fe0"/><path d="M896 467l3 3 5-6" stroke="#0b1522" stroke-width="2" fill="none"/><text x="640" y="510" fill="#f6f9fc" font-size="16" font-weight="700" text-anchor="middle">11 / 11</text><text x="900" y="510" fill="#f6f9fc" font-size="16" font-weight="700" text-anchor="middle">2 / 11</text><text x="1000" y="197" fill="#a9bdd0" font-size="12.5">The baseline had no tools, so it</text><text x="1000" y="215" fill="#a9bdd0" font-size="12.5">could only produce text. A real</text><text x="1000" y="233" fill="#a9bdd0" font-size="12.5">tool backend reaches more of</text><text x="1000" y="251" fill="#a9bdd0" font-size="12.5">these, but errors, timeouts and</text><text x="1000" y="269" fill="#a9bdd0" font-size="12.5">denials still need fault injection</text><text x="1000" y="287" fill="#a9bdd0" font-size="12.5">or patience.</text>
  </g>
</svg>
