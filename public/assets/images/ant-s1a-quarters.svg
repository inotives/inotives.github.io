<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Revenue and operating result by quarter</title>
  <desc id="desc">Left: quarterly revenue of 1.4, 2.0, 4.7, 11.6 and 17.0 billion dollars from Q3 2025 to Q3 2026; growth slowed from 147 percent to 46 percent quarter on quarter. Right: operating result of minus 1.67 billion in Q1, plus 0.97 billion in Q2 and minus 0.57 billion in Q3 2026, driven by 5.0 billion of short-term compute and a 2.0 billion non-cash charge.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#2a3a4d"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8fa6ba" stroke-width="3"/></pattern></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="40" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Revenue kept climbing; the margin did not</text><text x="40" y="85" fill="#a9bdd0" font-size="16">Quarterly revenue and GAAP operating result, US$ billions.</text><text x="40" y="128" fill="#fff" font-size="17" font-weight="700">Revenue by quarter</text><line x1="80" y1="470.0" x2="560" y2="470.0" stroke="#26394d"/><text x="74" y="474.0" fill="#8fa6ba" font-size="12" text-anchor="end">$0B</text><line x1="80" y1="386.7" x2="560" y2="386.7" stroke="#26394d"/><text x="74" y="390.66666666666663" fill="#8fa6ba" font-size="12" text-anchor="end">$5B</text><line x1="80" y1="303.3" x2="560" y2="303.3" stroke="#26394d"/><text x="74" y="307.3333333333333" fill="#8fa6ba" font-size="12" text-anchor="end">$10B</text><line x1="80" y1="220.0" x2="560" y2="220.0" stroke="#26394d"/><text x="74" y="224.0" fill="#8fa6ba" font-size="12" text-anchor="end">$15B</text><rect x="100" y="447.0" width="64" height="23.0" rx="4" fill="#3987e5" fill-opacity="0.55"/><text x="132" y="438.96666666666664" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">$1.4B</text><text x="132" y="490" fill="#8fa6ba" font-size="13" text-anchor="middle">Q3 ’25</text><rect x="192" y="436.0" width="64" height="34.0" rx="4" fill="#3987e5" fill-opacity="0.55"/><text x="224" y="428.0" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">$2.0B</text><text x="224" y="490" fill="#8fa6ba" font-size="13" text-anchor="middle">Q4 ’25</text><rect x="284" y="391.7" width="64" height="78.3" rx="4" fill="#3987e5" fill-opacity="0.55"/><text x="316" y="383.66666666666663" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">$4.7B</text><text x="316" y="490" fill="#8fa6ba" font-size="13" text-anchor="middle">Q1 ’26</text><rect x="376" y="276.9" width="64" height="193.1" rx="4" fill="#3987e5" fill-opacity="0.55"/><text x="408" y="268.9" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">$11.6B</text><text x="408" y="490" fill="#8fa6ba" font-size="13" text-anchor="middle">Q2 ’26</text><rect x="468" y="187.4" width="64" height="282.6" rx="4" fill="#3987e5"/><text x="500" y="179.40000000000003" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">$17.0B</text><text x="500" y="490" fill="#c8dbee" font-size="13" font-weight="700" text-anchor="middle">Q3 ’26</text><text x="408" y="175" fill="#a9bdd0" font-size="12" text-anchor="middle">+147% q/q</text><text x="500" y="140" fill="#f1d7aa" font-size="13" font-weight="700" text-anchor="middle">+46% q/q</text><text x="40" y="520" fill="#8fa6ba" font-size="12">Bright bar: new in the amendment. Q3 and Q4 2025 derived from the filings;</text><text x="40" y="540" fill="#8fa6ba" font-size="12">the Q1/Q2 2026 split is from press coverage of the S-1.</text><text x="640" y="128" fill="#fff" font-size="17" font-weight="700">GAAP operating result by quarter</text><rect x="640" y="140" width="12" height="12" rx="2" fill="#3987e5"/><text x="658" y="151" fill="#d7e3ef" font-size="13">Profit</text><rect x="720" y="140" width="12" height="12" rx="2" fill="#d95926"/><text x="738" y="151" fill="#d7e3ef" font-size="13">Loss</text><line x1="680" y1="420.0" x2="1150" y2="420.0" stroke="#26394d"/><text x="674" y="424" fill="#8fa6ba" font-size="12" text-anchor="end">−$2B</text><line x1="680" y1="360.0" x2="1150" y2="360.0" stroke="#26394d"/><text x="674" y="364" fill="#8fa6ba" font-size="12" text-anchor="end">−$1B</text><line x1="680" y1="300.0" x2="1150" y2="300.0" stroke="#5a7389"/><text x="674" y="304" fill="#8fa6ba" font-size="12" text-anchor="end">$0B</text><line x1="680" y1="240.0" x2="1150" y2="240.0" stroke="#26394d"/><text x="674" y="244" fill="#8fa6ba" font-size="12" text-anchor="end">+$1B</text><rect x="730" y="300.0" width="80" height="100.0" rx="4" fill="#d95926" fill-opacity="0.55"/><text x="770" y="418.02" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">−$1.67B</text><text x="770" y="286" fill="#c8dbee" font-size="13" text-anchor="middle">Q1 ’26</text><rect x="870" y="241.6" width="80" height="58.4" rx="4" fill="#3987e5" fill-opacity="0.55"/><text x="910" y="233.56" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">+$0.97B</text><text x="910" y="322" fill="#c8dbee" font-size="13" text-anchor="middle">Q2 ’26</text><rect x="1010" y="300.0" width="80" height="34.0" rx="4" fill="#d95926"/><text x="1050" y="352.02" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">−$0.57B</text><text x="1050" y="286" fill="#c8dbee" font-size="13" text-anchor="middle">Q3 ’26</text><rect x="640" y="470" width="520" height="84" rx="12" fill="#16222f" stroke="#3e5468"/><text x="658" y="496" fill="#fff" font-size="14" font-weight="700">Why Q3 slipped back to a loss</text><text x="658" y="518" fill="#c8dbee" font-size="13">$5.0B of short-term compute at higher prices, and a $2.0B</text><text x="658" y="538" fill="#c8dbee" font-size="13">non-cash donation-match charge. Adjusted margin: 19% → 15%.</text><text x="40" y="590" fill="#8fa6ba" font-size="13">Source: SEC EDGAR, S-1 and S-1/A. Q1 2026 operating result = H1 operating loss minus the Q2 operating income stated in the S-1/A.</text>
  </g>
</svg>
