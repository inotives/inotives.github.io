<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 575" role="img" aria-labelledby="title desc">
  <title id="title">The bias loses to “always up” on every ticker</title>
  <desc id="desc">A dot plot with one row per ticker. NVDA: bias right 52.9% on 68 calls, always-up 58.3%. AAPL: 45.5% on 66 calls versus 57.1%. MSFT: 43.8% on 64 calls versus 52.4%. TSLA: 48.4% on 62 calls versus 54.8%. SPY: 44.2% on 52 calls versus 58.3%. Each bias dot has a shaded 95% noise band of roughly plus or minus 12 points. Every bias dot is left of its base-rate dot, but only SPY’s gap is larger than the noise band; the rest are within it.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#e3ad5a" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="575" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">The bias loses to “always up” on every ticker</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">Hit rate on the next open, against a rule that calls “up” every single day.</text>
<circle cx="70" cy="118" r="7" fill="#f2706b"/><text x="84" y="123" fill="#a9bdd0" font-size="14">Bias right (bar = ±95% noise band)</text><circle cx="380" cy="118" r="7" fill="#4fd1c5"/><text x="394" y="123" fill="#a9bdd0" font-size="14">Always “up” right (the base rate)</text><line x1="303.3333333333333" x2="303.3333333333333" y1="150" y2="460" stroke="#2a3f57"/><text x="303.3333333333333" y="482" fill="#6f8aa3" font-size="13" text-anchor="middle">30%</text><line x1="510" x2="510" y1="150" y2="460" stroke="#2a3f57"/><text x="510" y="482" fill="#6f8aa3" font-size="13" text-anchor="middle">40%</text><line x1="716.6666666666667" x2="716.6666666666667" y1="150" y2="460" stroke="#4a6684" stroke-dasharray="6 5"/><text x="716.6666666666667" y="482" fill="#6f8aa3" font-size="13" text-anchor="middle">50%</text><line x1="923.3333333333334" x2="923.3333333333334" y1="150" y2="460" stroke="#2a3f57"/><text x="923.3333333333334" y="482" fill="#6f8aa3" font-size="13" text-anchor="middle">60%</text><line x1="1130" x2="1130" y1="150" y2="460" stroke="#2a3f57"/><text x="1130" y="482" fill="#6f8aa3" font-size="13" text-anchor="middle">70%</text><text x="716.6666666666667" y="142" fill="#6f8aa3" font-size="12" text-anchor="middle">coin flip</text><text x="70" y="185" fill="#f6f9fc" font-size="16" font-weight="700">NVDA</text><text x="130" y="185" fill="#6f8aa3" font-size="13">68</text><line x1="531.4057172831724" x2="1021.7942827168275" y1="180" y2="180" stroke="#f2706b" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/><line x1="776.6" x2="888.2" y1="180" y2="180" stroke="#90adc2" stroke-width="1.5"/><circle cx="776.6" cy="180" r="8" fill="#f2706b"/><circle cx="888.2" cy="180" r="8" fill="#4fd1c5"/><text x="762.6" y="166" fill="#f2706b" font-size="13" text-anchor="end">52.9%</text><text x="902.2" y="166" fill="#4fd1c5" font-size="13">58.3%</text><text x="70" y="247" fill="#f6f9fc" font-size="16" font-weight="700">AAPL</text><text x="130" y="247" fill="#6f8aa3" font-size="13">66</text><line x1="375.37709010543404" x2="871.9562432278993" y1="242" y2="242" stroke="#f2706b" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/><line x1="623.6666666666667" x2="863.4000000000001" y1="242" y2="242" stroke="#90adc2" stroke-width="1.5"/><circle cx="623.6666666666667" cy="242" r="8" fill="#f2706b"/><circle cx="863.4000000000001" cy="242" r="8" fill="#4fd1c5"/><text x="609.6666666666667" y="228" fill="#f2706b" font-size="13" text-anchor="end">45.5%</text><text x="877.4000000000001" y="228" fill="#4fd1c5" font-size="13">57.1%</text><text x="70" y="309" fill="#f6f9fc" font-size="16" font-weight="700">MSFT</text><text x="130" y="309" fill="#6f8aa3" font-size="13">64</text><line x1="337.32055182994975" x2="839.7461148367167" y1="304" y2="304" stroke="#f2706b" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/><line x1="588.5333333333333" x2="766.2666666666667" y1="304" y2="304" stroke="#90adc2" stroke-width="1.5"/><circle cx="588.5333333333333" cy="304" r="8" fill="#f2706b"/><circle cx="766.2666666666667" cy="304" r="8" fill="#4fd1c5"/><text x="574.5333333333333" y="290" fill="#f2706b" font-size="13" text-anchor="end">43.8%</text><text x="780.2666666666667" y="290" fill="#4fd1c5" font-size="13">52.4%</text><text x="70" y="371" fill="#f6f9fc" font-size="16" font-weight="700">TSLA</text><text x="130" y="371" fill="#6f8aa3" font-size="13">62</text><line x1="426.51413858660624" x2="940.6858614133937" y1="366" y2="366" stroke="#f2706b" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/><line x1="683.6" x2="815.8666666666666" y1="366" y2="366" stroke="#90adc2" stroke-width="1.5"/><circle cx="683.6" cy="366" r="8" fill="#f2706b"/><circle cx="815.8666666666666" cy="366" r="8" fill="#4fd1c5"/><text x="669.6" y="352" fill="#f2706b" font-size="13" text-anchor="end">48.4%</text><text x="829.8666666666666" y="352" fill="#4fd1c5" font-size="13">54.8%</text><text x="70" y="433" fill="#f6f9fc" font-size="16" font-weight="700">SPY</text><text x="130" y="433" fill="#6f8aa3" font-size="13">52</text><line x1="317.83284815591645" x2="875.7671518440837" y1="428" y2="428" stroke="#f2706b" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/><line x1="596.8000000000001" x2="888.2" y1="428" y2="428" stroke="#90adc2" stroke-width="1.5"/><circle cx="596.8000000000001" cy="428" r="8" fill="#f2706b"/><circle cx="888.2" cy="428" r="8" fill="#4fd1c5"/><text x="582.8000000000001" y="414" fill="#f2706b" font-size="13" text-anchor="end">44.2%</text><text x="902.2" y="414" fill="#4fd1c5" font-size="13">58.3%</text><text x="130" y="140" fill="#6f8aa3" font-size="12">calls</text><text x="70" y="520" fill="#a9bdd0" font-size="14">Next open, equal votes, 84 sessions from 16 July to 12 November 2026. Every red dot sits left of its teal dot.</text><text x="70" y="542" fill="#a9bdd0" font-size="14">Only SPY’s gap clears the noise band; for the rest, about 65 calls can’t separate the bias from chance.</text>
  </g>
</svg>
