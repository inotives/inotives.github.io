<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Permission boundaries for a DuckDB and Parquet UI</title>
  <desc id="desc">The browser authenticates to an API. The API checks user permission and uses a read-only IAM role to query only published Gold Parquet. Separate pipeline roles can access Raw, Bronze, and Silver. Direct browser access to S3 is blocked.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#15233a"/><stop offset="1" stop-color="#0b1220"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#91a8c5" stroke-width="1.6"/></marker></defs>
  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <text x="46" y="56" fill="#fff" font-family="system-ui,sans-serif" font-size="27" font-weight="700">Permission lives at two boundaries</text>
  <text x="46" y="85" fill="#a9bad0" font-family="system-ui,sans-serif" font-size="16">The API authorizes people. IAM restricts which objects each service can open.</text>
  <g font-family="system-ui,sans-serif">
    <rect x="54" y="147" width="218" height="125" rx="16" fill="#3b3760" stroke="#a394e5"/>
    <text x="80" y="190" fill="#fff" font-size="20" font-weight="700">Browser</text><text x="80" y="221" fill="#d2caf7" font-size="15">user session</text><text x="80" y="245" fill="#d2caf7" font-size="15">no storage credential</text>
    <rect x="370" y="147" width="300" height="125" rx="16" fill="#2b405b" stroke="#6a93c2"/>
    <text x="397" y="188" fill="#fff" font-size="20" font-weight="700">Authenticated API</text><text x="397" y="219" fill="#c8daf0" font-size="15">authorize user + filter rows</text><text x="397" y="245" fill="#c8daf0" font-size="15">read-only Gold role</text>
    <rect x="787" y="147" width="353" height="125" rx="16" fill="#284d43" stroke="#64bb91"/>
    <text x="813" y="187" fill="#fff" font-size="20" font-weight="700">Published Gold</text><text x="813" y="218" fill="#c0edd8" font-size="15">current.json → versioned Parquet</text><text x="813" y="245" fill="#c0edd8" font-size="15">private storage prefix</text>
    <rect x="370" y="329" width="300" height="60" rx="14" fill="#51402c" stroke="#dfad5f"/>
    <text x="397" y="366" fill="#f6dfb3" font-size="17" font-weight="600">dlt + gate + dbt job role</text>
    <rect x="787" y="329" width="353" height="60" rx="14" fill="#24354c" stroke="#6684a6"/>
    <text x="813" y="366" fill="#d0deee" font-size="17" font-weight="600">Raw · Bronze · Silver prefixes</text>
  </g>
  <g stroke="#91a8c5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M274 210h88"/><path d="M672 210h106"/><path d="M672 359h106"/></g>
  <text x="285" y="190" fill="#c5d4e5" font-family="system-ui,sans-serif" font-size="14">HTTPS</text><text x="691" y="190" fill="#c5d4e5" font-family="system-ui,sans-serif" font-size="14">IAM read</text><text x="694" y="339" fill="#c5d4e5" font-family="system-ui,sans-serif" font-size="14">IAM write</text>
</svg>
