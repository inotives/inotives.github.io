<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 535" role="img" aria-labelledby="title desc">
  <title id="title">One gateway: redact, count, then sample</title>
  <desc id="desc">A replay of the crypto-desk agent sends 1,000 runs, 6,513 spans, to a gateway Collector. Inside the gateway, a transform processor redacts emails and API keys first. The spans then split: the spanmetrics connector counts every span, and a forward connector passes them to a tail_sampling processor that keeps errors, slow runs, costly runs and 10% of the rest. Metrics from 100% of spans go to Prometheus; Tempo receives traces for 275 of the 1,000 runs. Both backends run in one grafana/otel-lgtm container.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="535" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">One gateway: redact, count, then sample</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">The Collector config behind this note, in the order the spans pass through it.</text>
<rect x="45" y="200" width="170" height="90" rx="12" fill="#263e5b" stroke="#75a8d5"/><text x="130" y="233" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">Agent</text><text x="130" y="253" fill="#a9bdd0" font-size="12" text-anchor="middle">crypto-desk replay</text><text x="130" y="271" fill="#a9bdd0" font-size="12" text-anchor="middle">1,000 runs · 6,513 spans</text><rect x="255" y="130" width="640" height="300" rx="16" fill="#18293d" stroke="#75a8d5" stroke-dasharray="6 5"/><text x="275" y="158" fill="#f6f9fc" font-size="16" font-weight="700">Gateway Collector (contrib 0.140.1)</text><rect x="280" y="200" width="150" height="90" rx="12" fill="#3a2226" stroke="#f2706b"/><text x="355" y="233" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">transform</text><text x="355" y="253" fill="#a9bdd0" font-size="12" text-anchor="middle">redact emails</text><text x="355" y="271" fill="#a9bdd0" font-size="12" text-anchor="middle">and API keys</text><rect x="470" y="175" width="170" height="70" rx="12" fill="#173a3a" stroke="#4fd1c5"/><text x="555" y="207" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">spanmetrics</text><text x="555" y="228" fill="#a9bdd0" font-size="12" text-anchor="middle">counts every span</text><rect x="470" y="270" width="170" height="70" rx="12" fill="#263e5b" stroke="#75a8d5"/><text x="555" y="302" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">forward</text><text x="555" y="323" fill="#a9bdd0" font-size="12" text-anchor="middle">to sampling pipeline</text><rect x="690" y="270" width="180" height="70" rx="12" fill="#3a2d1d" stroke="#e3ad5a"/><text x="780" y="302" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">tail_sampling</text><text x="780" y="323" fill="#a9bdd0" font-size="12" text-anchor="middle">errors · slow · costly · 10%</text><path d="M219 245L276 245" stroke="#90adc2" stroke-width="1.7" fill="none" marker-end="url(#a)"/><path d="M434 245H452V210H466" stroke="#90adc2" stroke-width="1.7" fill="none" marker-end="url(#a)"/><path d="M452 245V305H466" stroke="#90adc2" stroke-width="1.7" fill="none" marker-end="url(#a)"/><path d="M644 305L686 305" stroke="#90adc2" stroke-width="1.7" fill="none" marker-end="url(#a)"/><text x="470" y="380" fill="#a9bdd0" font-size="13">① redact before anything is counted or stored</text><text x="470" y="400" fill="#a9bdd0" font-size="13">② count before sampling   ③ sample last</text><rect x="935" y="130" width="220" height="300" rx="16" fill="#1a2633" stroke="#6f8aa3"/><text x="955" y="158" fill="#f6f9fc" font-size="16" font-weight="700">grafana/otel-lgtm</text><rect x="955" y="180" width="180" height="80" rx="12" fill="#173a3a" stroke="#4fd1c5"/><text x="1045" y="208" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">Prometheus</text><text x="1045" y="228" fill="#a9bdd0" font-size="12" text-anchor="middle">metrics from 100%</text><text x="1045" y="246" fill="#a9bdd0" font-size="12" text-anchor="middle">of spans</text><rect x="955" y="300" width="180" height="80" rx="12" fill="#3a2d1d" stroke="#e3ad5a"/><text x="1045" y="328" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">Tempo</text><text x="1045" y="348" fill="#a9bdd0" font-size="12" text-anchor="middle">traces: 275 of</text><text x="1045" y="366" fill="#a9bdd0" font-size="12" text-anchor="middle">1,000 runs</text><path d="M644 210H900V220H951" stroke="#4fd1c5" stroke-width="1.7" fill="none" marker-end="url(#a)"/><path d="M874 305H900V340H951" stroke="#e3ad5a" stroke-width="1.7" fill="none" marker-end="url(#a)"/><text x="45" y="480" fill="#a9bdd0" font-size="14">Metrics and traces leave the gateway on separate pipelines. Dashboards and alerts read the unsampled metrics;</text><text x="45" y="502" fill="#a9bdd0" font-size="14">Tempo keeps only the runs worth opening.</text>
  </g>
</svg>
