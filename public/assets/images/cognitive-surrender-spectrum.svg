<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">The spectrum: offloading, deferral, cognitive surrender</title>
  <desc id="desc">A bar runs from green to red. At the green end is cognitive offloading, where AI output is a draft you judge and you still own the answer. In the middle is deferral, where the output becomes the input to your next step without being checked. At the red end is cognitive surrender, where the AI's output quietly becomes your answer and you have no view of your own to compare it against. The slide between them is gradual: read carefully, then skim, then glance, then just approve.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <linearGradient id="bar"><stop stop-color="#8fd16a"/><stop offset=".5" stop-color="#e3ad5a"/><stop offset="1" stop-color="#e06c6c"/></linearGradient>
  </defs>
  <rect width="1200" height="530" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Three ways to hand your thinking to AI</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">It is one spectrum, not three boxes. What changes is who owns the answer.</text>

    <rect x="45" y="112" width="1110" height="14" rx="7" fill="url(#bar)"/>
    <text x="45" y="150" fill="#a6e07f" font-size="14">you own the answer</text>
    <text x="1155" y="150" fill="#f0a0a0" font-size="14" text-anchor="end">the AI's output is your answer</text>

    <!-- Offloading -->
    <rect x="45" y="170" width="350" height="300" rx="18" fill="#1b2e22" stroke="#8fd16a" stroke-opacity=".7"/>
    <text x="67" y="205" fill="#fff" font-size="20" font-weight="700">1. Cognitive offloading</text>
    <text x="67" y="228" fill="#a6e07f" font-size="14">hand off the how, keep the what</text>
    <text x="67" y="262" fill="#8ea3b8" font-size="11" letter-spacing="1">AI OUTPUT IS</text>
    <text x="67" y="282" fill="#f6f9fc" font-size="15">a draft you judge</text>
    <text x="67" y="312" fill="#8ea3b8" font-size="11" letter-spacing="1">YOU STILL</text>
    <text x="67" y="332" fill="#f6f9fc" font-size="15">check it, own it, step in when</text>
    <text x="67" y="350" fill="#f6f9fc" font-size="15">it looks wrong</text>
    <text x="67" y="380" fill="#8ea3b8" font-size="11" letter-spacing="1">EXAMPLE</text>
    <text x="67" y="400" fill="#d3ecc2" font-size="14">a migration script you read line</text>
    <text x="67" y="418" fill="#d3ecc2" font-size="14">by line before running it</text>
    <text x="67" y="452" fill="#8fd16a" font-size="15" font-weight="700">Healthy. Do this all day.</text>

    <!-- Deferral -->
    <rect x="425" y="170" width="350" height="300" rx="18" fill="#33291a" stroke="#e3ad5a" stroke-opacity=".7"/>
    <text x="447" y="205" fill="#fff" font-size="20" font-weight="700">2. Deferral</text>
    <text x="447" y="228" fill="#f0c987" font-size="14">the output becomes your next input</text>
    <text x="447" y="262" fill="#8ea3b8" font-size="11" letter-spacing="1">AI OUTPUT IS</text>
    <text x="447" y="282" fill="#f6f9fc" font-size="15">a starting point nobody verified</text>
    <text x="447" y="312" fill="#8ea3b8" font-size="11" letter-spacing="1">YOU STILL</text>
    <text x="447" y="332" fill="#f6f9fc" font-size="15">work on top of it, but stop</text>
    <text x="447" y="350" fill="#f6f9fc" font-size="15">treating it as a hypothesis</text>
    <text x="447" y="380" fill="#8ea3b8" font-size="11" letter-spacing="1">EXAMPLE</text>
    <text x="447" y="400" fill="#f3dfbd" font-size="14">plan the next sprint from the agent's</text>
    <text x="447" y="418" fill="#f3dfbd" font-size="14">summary without opening the code</text>
    <text x="447" y="452" fill="#e3ad5a" font-size="15" font-weight="700">Warning sign. Errors stack up.</text>

    <!-- Surrender -->
    <rect x="805" y="170" width="350" height="300" rx="18" fill="#3a1f22" stroke="#e06c6c" stroke-opacity=".7"/>
    <text x="827" y="205" fill="#fff" font-size="20" font-weight="700">3. Cognitive surrender</text>
    <text x="827" y="228" fill="#f0a0a0" font-size="14">the output quietly becomes your claim</text>
    <text x="827" y="262" fill="#8ea3b8" font-size="11" letter-spacing="1">AI OUTPUT IS</text>
    <text x="827" y="282" fill="#f6f9fc" font-size="15">your answer</text>
    <text x="827" y="312" fill="#8ea3b8" font-size="11" letter-spacing="1">YOU STILL</text>
    <text x="827" y="332" fill="#f6f9fc" font-size="15">nothing. There is no view of your</text>
    <text x="827" y="350" fill="#f6f9fc" font-size="15">own to compare it against</text>
    <text x="827" y="380" fill="#8ea3b8" font-size="11" letter-spacing="1">EXAMPLE</text>
    <text x="827" y="400" fill="#f3c9c9" font-size="14">approve a 600-line PR because the</text>
    <text x="827" y="418" fill="#f3c9c9" font-size="14">tests are green</text>
    <text x="827" y="452" fill="#e06c6c" font-size="15" font-weight="700">Cognitive debt piles up here.</text>

    <text x="600" y="505" fill="#c8dbee" font-size="15" text-anchor="middle">The slide is gradual: read it carefully → skim it → glance at the outline → just approve</text>
  </g>
</svg>
