<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 495" role="img" aria-labelledby="title desc">
  <title id="title">ADX weighting doesn’t rescue the bias</title>
  <desc id="desc">Left: regime weights. Trending (ADX 25 or more) gives trend votes 1.5 times and mean-reversion votes 0.5 times; Mixed (ADX 20 to 25) leaves both at 1 times; Ranging (ADX 20 or less) gives trend 0.5 times and mean-reversion 1.5 times. Right: hit rate on the next open with equal votes and with ADX weighting. NVDA 52.9 to 53.3, AAPL 45.5 to 50.8, MSFT 43.8 to 44.3, TSLA 48.4 to 49.2, SPY 44.2 to 36.4. Base-rate ticks for always up sit to the right of every result.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#e3ad5a" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="495" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">ADX weighting doesn’t rescue the bias</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">Reweight trend and mean-reversion votes by regime, then rerun the same backtest (next open).</text>
<rect x="45" y="120" width="330" height="250" rx="14" fill="#263e5b" stroke="#75a8d5"/><text x="65" y="152" fill="#f6f9fc" font-size="17" font-weight="700">Regime weights</text><text x="65" y="182" fill="#6f8aa3" font-size="12">Regime</text><text x="240" y="182" fill="#6f8aa3" font-size="12" text-anchor="middle">Trend</text><text x="320" y="182" fill="#6f8aa3" font-size="12" text-anchor="middle">Revert</text><text x="65" y="218" fill="#f6f9fc" font-size="15" font-weight="700">Trending</text><text x="65" y="236" fill="#a9bdd0" font-size="12">ADX ≥ 25</text><text x="240" y="224" fill="#4fd1c5" font-size="18" text-anchor="middle">1.5×</text><text x="320" y="224" fill="#6f8aa3" font-size="18" text-anchor="middle">0.5×</text><text x="65" y="264" fill="#f6f9fc" font-size="15" font-weight="700">Mixed</text><text x="65" y="282" fill="#a9bdd0" font-size="12">20–25</text><text x="240" y="270" fill="#f6f9fc" font-size="18" text-anchor="middle">1×</text><text x="320" y="270" fill="#f6f9fc" font-size="18" text-anchor="middle">1×</text><text x="65" y="310" fill="#f6f9fc" font-size="15" font-weight="700">Ranging</text><text x="65" y="328" fill="#a9bdd0" font-size="12">ADX ≤ 20</text><text x="240" y="316" fill="#6f8aa3" font-size="18" text-anchor="middle">0.5×</text><text x="320" y="316" fill="#4fd1c5" font-size="18" text-anchor="middle">1.5×</text><text x="65" y="356" fill="#a9bdd0" font-size="12">Trend: MA crosses, MACD, ADX. Revert: RSI, %B.</text><circle cx="450" cy="118" r="6" fill="#90adc2"/><text x="462" y="123" fill="#a9bdd0" font-size="13">Equal votes</text><circle cx="580" cy="118" r="6" fill="#e3ad5a"/><text x="592" y="123" fill="#a9bdd0" font-size="13">ADX-weighted</text><line x1="710" x2="726" y1="118" y2="118" stroke="#4fd1c5" stroke-width="3"/><text x="734" y="123" fill="#a9bdd0" font-size="13">Always “up”</text><line x1="520" x2="520" y1="140" y2="390" stroke="#2a3f57"/><text x="520" y="412" fill="#6f8aa3" font-size="13" text-anchor="middle">30%</text><line x1="710.625" x2="710.625" y1="140" y2="390" stroke="#2a3f57"/><text x="710.625" y="412" fill="#6f8aa3" font-size="13" text-anchor="middle">40%</text><line x1="901.25" x2="901.25" y1="140" y2="390" stroke="#4a6684" stroke-dasharray="6 5"/><text x="901.25" y="412" fill="#6f8aa3" font-size="13" text-anchor="middle">50%</text><line x1="1091.875" x2="1091.875" y1="140" y2="390" stroke="#2a3f57"/><text x="1091.875" y="412" fill="#6f8aa3" font-size="13" text-anchor="middle">60%</text><text x="420" y="165" fill="#f6f9fc" font-size="15" font-weight="700">NVDA</text><line x1="1059.46875" x2="1059.46875" y1="148" y2="172" stroke="#4fd1c5" stroke-width="3"/><circle cx="956.53125" cy="160" r="6" fill="#90adc2"/><circle cx="964.15625" cy="160" r="6" fill="#e3ad5a"/><text x="1140" y="165" fill="#a9bdd0" font-size="14" text-anchor="end" font-weight="700">+0.4</text><text x="420" y="215" fill="#f6f9fc" font-size="15" font-weight="700">AAPL</text><line x1="1036.59375" x2="1036.59375" y1="198" y2="222" stroke="#4fd1c5" stroke-width="3"/><path d="M815.46875 210L907.5 210" stroke="#e3ad5a" stroke-width="1.6" marker-end="url(#aa)"/><circle cx="815.46875" cy="210" r="6" fill="#90adc2"/><circle cx="916.5" cy="210" r="6" fill="#e3ad5a"/><text x="1140" y="215" fill="#4fd1c5" font-size="14" text-anchor="end" font-weight="700">+5.3</text><text x="420" y="265" fill="#f6f9fc" font-size="15" font-weight="700">MSFT</text><line x1="947" x2="947" y1="248" y2="272" stroke="#4fd1c5" stroke-width="3"/><circle cx="783.0625" cy="260" r="6" fill="#90adc2"/><circle cx="792.59375" cy="260" r="6" fill="#e3ad5a"/><text x="1140" y="265" fill="#a9bdd0" font-size="14" text-anchor="end" font-weight="700">+0.5</text><text x="420" y="315" fill="#f6f9fc" font-size="15" font-weight="700">TSLA</text><line x1="992.75" x2="992.75" y1="298" y2="322" stroke="#4fd1c5" stroke-width="3"/><circle cx="870.75" cy="310" r="6" fill="#90adc2"/><circle cx="886" cy="310" r="6" fill="#e3ad5a"/><text x="1140" y="315" fill="#a9bdd0" font-size="14" text-anchor="end" font-weight="700">+0.8</text><text x="420" y="365" fill="#f6f9fc" font-size="15" font-weight="700">SPY</text><line x1="1059.46875" x2="1059.46875" y1="348" y2="372" stroke="#4fd1c5" stroke-width="3"/><path d="M790.6875 360L651 360" stroke="#e3ad5a" stroke-width="1.6" marker-end="url(#aa)"/><circle cx="790.6875" cy="360" r="6" fill="#90adc2"/><circle cx="642" cy="360" r="6" fill="#e3ad5a"/><text x="1140" y="365" fill="#f2706b" font-size="14" text-anchor="end" font-weight="700">-7.8</text><text x="45" y="440" fill="#a9bdd0" font-size="14">Four small gains and one large loss. Only SPY moves more than the noise, and it moves the wrong way.</text><text x="45" y="462" fill="#a9bdd0" font-size="14">No ticker gets near its base rate, so equal votes stay the default and ADX weighting is a toggle.</text>
  </g>
</svg>
