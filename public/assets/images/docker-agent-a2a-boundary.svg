<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">MCP and A2A boundaries around Docker Agent and AgentRig</title>
  <desc id="desc">A dark diagram distinguishing MCP connections from agents to tools and data, and a proposed A2A connection between opaque agent applications.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.agent{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.tool{fill:#17263b;stroke:#587692;stroke-width:2}.a2a{fill:#332b1d;stroke:#e2b866;stroke-width:2}.text{fill:#e7eef6;font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.yellow{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow);stroke-dasharray:10 8}</style></defs>
  <rect class="bg" width="1600" height="820"/><text class="text" x="65" y="68" font-size="36" font-weight="700">MCP connects agents to tools; A2A connects agents to agents</text><text class="small" x="65" y="103">Keep the protocols distinct. They solve different interoperability problems.</text>
  <rect class="agent" x="65" y="230" width="300" height="190" rx="18"/><text class="label" x="105" y="275">AGENT</text><text class="text" x="105" y="320">AgentRig worker</text><text class="small" x="105" y="365">project task context</text>
  <rect class="tool" x="545" y="150" width="300" height="150" rx="16"/><text class="label" x="585" y="195">MCP SERVER</text><text class="text" x="585" y="240">Tool or data source</text><text class="small" x="585" y="275">filesystem · search · APIs</text>
  <rect class="tool" x="545" y="390" width="300" height="150" rx="16"/><text class="label" x="585" y="435">MCP SERVER</text><text class="text" x="585" y="480">Project capability</text><text class="small" x="585" y="515">validation · deployment</text>
  <path class="line" d="M365 300 L545 225"/><path class="line" d="M365 350 L545 465"/><text class="small" x="385" y="255">MCP: use a tool</text>
  <rect class="agent" x="1090" y="230" width="300" height="190" rx="18"/><text class="label" x="1130" y="275">REMOTE AGENT</text><text class="text" x="1130" y="320">Docker Agent team</text><text class="small" x="1130" y="365">specialist capability</text>
  <path class="yellow" d="M845 545 C1000 650 1160 650 1240 420"/><text class="small" x="900" y="665">proposed A2A boundary</text>
  <rect class="a2a" x="665" y="650" width="310" height="100" rx="16"/><text class="label" x="705" y="690">A2A</text><text class="text" x="705" y="730">agent-to-agent task</text>
  <rect class="agent" x="1090" y="515" width="300" height="190" rx="18"/><text class="label" x="1130" y="560">REMOTE AGENT</text><text class="text" x="1130" y="605">Review specialist</text><text class="small" x="1130" y="650">status and artifacts</text>
  <path class="yellow" d="M975 700 L1090 610"/>
  <rect class="tool" x="65" y="570" width="450" height="135" rx="16"/><text class="label" x="105" y="615">PROTOCOL NOTE</text><text class="text" x="105" y="660">A2A is a proposed adapter seam here</text><text class="small" x="105" y="690">not a claim that Docker Agent includes A2A natively</text>
</svg>
