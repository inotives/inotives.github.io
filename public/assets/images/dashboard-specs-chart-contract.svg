<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">The chart library is a column contract</title>
  <desc id="desc">The agent writes SQL whose column names match a chart type. Stacked bars need x, series and value; ranked bars need label and value; a sankey needs source, target and value; a calendar heatmap needs date and value. The API checks the columns before the renderer draws the chart.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="540" rx="24" fill="url(#bg)"/>
  <text x="47" y="56" fill="#f6f9fc" font-family="system-ui,sans-serif" font-size="28" font-weight="700">The agent shapes the data. The library draws it.</text>
  <text x="47" y="85" fill="#a9bdd0" font-family="system-ui,sans-serif" font-size="16">Each chart type names the columns its SQL must return. Nothing else about the chart is up to the agent.</text>

  <g font-family="ui-monospace,Menlo,monospace" font-size="14">
    <rect x="43" y="124" width="430" height="370" rx="16" fill="#0e1a28" stroke="#3a5672"/>
    <text x="64" y="158" fill="#a9bdd0" font-family="system-ui,sans-serif" font-size="15">Card SQL for "Net flow by week"</text>
    <text x="64" y="196" fill="#c8dbee">select</text>
    <text x="84" y="222" fill="#c8dbee">date_trunc('week', flow_date)</text>
    <text x="104" y="246" fill="#53dfdc" font-weight="700">as x,</text>
    <text x="84" y="274" fill="#c8dbee">asset</text>
    <text x="104" y="298" fill="#e3ad5a" font-weight="700">as series,</text>
    <text x="84" y="326" fill="#c8dbee">sum(signed_amount_usd)</text>
    <text x="104" y="350" fill="#71c69a" font-weight="700">as value</text>
    <text x="64" y="378" fill="#c8dbee">from agg_daily_stablecoin_flows</text>
    <text x="64" y="402" fill="#c8dbee">where flow_date between</text>
    <text x="84" y="426" fill="#c8dbee">$period_from and $period_to</text>
    <text x="64" y="450" fill="#c8dbee">group by all order by x</text>
  </g>

  <g font-family="system-ui,sans-serif">
    <text x="540" y="140" fill="#a9bdd0" font-size="15">Chart type</text>
    <text x="720" y="140" fill="#a9bdd0" font-size="15">Columns it needs</text>

    <rect x="530" y="156" width="390" height="70" rx="14" fill="#4c3d2b" stroke="#e3ad5a" stroke-width="2"/>
    <text x="550" y="198" fill="#fff" font-size="18" font-weight="700">diverging_bars</text>
    <text x="720" y="198" fill="#f1d7aa" font-size="15" font-family="ui-monospace,Menlo,monospace">x, series, value</text>

    <rect x="530" y="238" width="390" height="56" rx="14" fill="#1b2a3c" stroke="#3a5672"/>
    <text x="550" y="272" fill="#e4ecf4" font-size="17">rank_bars</text>
    <text x="720" y="272" fill="#a9bdd0" font-size="15" font-family="ui-monospace,Menlo,monospace">label, value</text>

    <rect x="530" y="304" width="390" height="56" rx="14" fill="#1b2a3c" stroke="#3a5672"/>
    <text x="550" y="338" fill="#e4ecf4" font-size="17">sankey</text>
    <text x="720" y="338" fill="#a9bdd0" font-size="15" font-family="ui-monospace,Menlo,monospace">source, target, value</text>

    <rect x="530" y="370" width="390" height="56" rx="14" fill="#1b2a3c" stroke="#3a5672"/>
    <text x="550" y="404" fill="#e4ecf4" font-size="17">heatmap</text>
    <text x="720" y="404" fill="#a9bdd0" font-size="15" font-family="ui-monospace,Menlo,monospace">date, value</text>

    <rect x="530" y="436" width="390" height="56" rx="14" fill="#1b2a3c" stroke="#3a5672"/>
    <text x="550" y="470" fill="#e4ecf4" font-size="17">scatter</text>
    <text x="720" y="470" fill="#a9bdd0" font-size="15" font-family="ui-monospace,Menlo,monospace">x, y (+ label, size)</text>
  </g>

  <path d="M473 300 C500 300 505 191 527 191" fill="none" stroke="#90adc2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M920 191 H962" fill="none" stroke="#90adc2" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- the rendered diverging bars: inflows up, outflows down from zero -->
  <g>
    <rect x="966" y="124" width="192" height="370" rx="16" fill="#0e1a28" stroke="#3a5672"/>
    <text x="984" y="156" fill="#a9bdd0" font-family="system-ui,sans-serif" font-size="14">Rendered</text>
    <line x1="984" y1="312" x2="1142" y2="312" stroke="#90adc2"/>
    <rect x="992" y="262" width="22" height="50" fill="#53dfdc"/><rect x="992" y="238" width="22" height="24" fill="#e3ad5a"/>
    <rect x="992" y="312" width="22" height="30" fill="#53dfdc" opacity="0.55"/>
    <rect x="1030" y="248" width="22" height="64" fill="#53dfdc"/><rect x="1030" y="226" width="22" height="22" fill="#e3ad5a"/>
    <rect x="1030" y="312" width="22" height="44" fill="#53dfdc" opacity="0.55"/><rect x="1030" y="356" width="22" height="14" fill="#e3ad5a" opacity="0.55"/>
    <rect x="1068" y="276" width="22" height="36" fill="#53dfdc"/><rect x="1068" y="258" width="22" height="18" fill="#e3ad5a"/>
    <rect x="1068" y="312" width="22" height="70" fill="#53dfdc" opacity="0.55"/><rect x="1068" y="382" width="22" height="22" fill="#e3ad5a" opacity="0.55"/>
    <rect x="1106" y="242" width="22" height="70" fill="#53dfdc"/><rect x="1106" y="214" width="22" height="28" fill="#e3ad5a"/>
    <rect x="1106" y="312" width="22" height="26" fill="#53dfdc" opacity="0.55"/>
    <text x="984" y="446" fill="#c1e5e5" font-family="system-ui,sans-serif" font-size="13">■ USDT</text>
    <text x="1060" y="446" fill="#f1d7aa" font-family="system-ui,sans-serif" font-size="13">■ USDC</text>
    <text x="984" y="472" fill="#a9bdd0" font-family="system-ui,sans-serif" font-size="13">in above zero, out below</text>
  </g>
</svg>
