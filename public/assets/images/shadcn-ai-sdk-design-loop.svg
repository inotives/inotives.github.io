<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">One design iteration, two ways</title>
  <desc id="desc">Two lanes. With a real model: edit CSS, send a prompt through the API route, wait 1.3 to 8.6 seconds (median 4.1) for the first token, get a new answer (20 of 20 runs differed), and hunt for states like errors or approvals by luck. Per 100 reloads that is 0.69 dollars and about 9 minutes of waiting, with answers up to 1.55 times taller in one run than another. With a scripted conversation: edit CSS, press send, first chunk in about 2 to 14 milliseconds, the same answer (identical HTML in 30 of 30 runs), and any of 11 states on demand. Per 100 reloads: 0 dollars and zero network requests.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="510" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">One design iteration, two ways</text><text x="45" y="85" fill="#a9bdd0" font-size="16">Change a style, reload, look. Measured on the same chat UI: 20 real model calls, 60 scripted runs.</text><rect x="45" y="115" width="1110" height="170" rx="12" fill="#8a7fe0" fill-opacity="0.05" stroke="#8a7fe0" stroke-width="1.5"/><text x="65" y="145" fill="#f6f9fc" font-size="17" font-weight="700">With a real model</text><rect x="65" y="165" width="150" height="70" rx="10" fill="#0b1522" fill-opacity="0.7" stroke="#22344a"/><text x="77" y="192" fill="#f6f9fc" font-size="14" font-weight="700">Edit CSS</text><text x="77" y="214" fill="#a9bdd0" font-size="12">save, reload</text><line x1="217" y1="200" x2="237" y2="200" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="241" y="165" width="170" height="70" rx="10" fill="#0b1522" fill-opacity="0.7" stroke="#22344a"/><text x="253" y="192" fill="#f6f9fc" font-size="14" font-weight="700">Send prompt</text><text x="253" y="214" fill="#a9bdd0" font-size="12">API route → model</text><line x1="413" y1="200" x2="433" y2="200" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="437" y="165" width="220" height="70" rx="10" fill="#8a7fe0" fill-opacity="0.22" stroke="#8a7fe0"/><text x="449" y="192" fill="#f6f9fc" font-size="14" font-weight="700">Wait 1.3–8.6 s</text><text x="449" y="214" fill="#a9bdd0" font-size="12">median 4.1 s to first token</text><line x1="659" y1="200" x2="679" y2="200" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="683" y="165" width="190" height="70" rx="10" fill="#8a7fe0" fill-opacity="0.22" stroke="#8a7fe0"/><text x="695" y="192" fill="#f6f9fc" font-size="14" font-weight="700">New answer</text><text x="695" y="214" fill="#a9bdd0" font-size="12">20/20 runs differed</text><line x1="875" y1="200" x2="895" y2="200" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="899" y="165" width="220" height="70" rx="10" fill="#8a7fe0" fill-opacity="0.22" stroke="#8a7fe0"/><text x="911" y="192" fill="#f6f9fc" font-size="14" font-weight="700">Hunt for the state</text><text x="911" y="214" fill="#a9bdd0" font-size="12">errors, approvals: luck</text><text x="65" y="265" fill="#f6f9fc" font-size="13.5" font-weight="700">Per 100 reloads: $0.69 in tokens and ~9 minutes of waiting, with answers 1.44–1.55× taller in one run than another.</text><rect x="45" y="310" width="1110" height="170" rx="12" fill="#2fa9a0" fill-opacity="0.05" stroke="#2fa9a0" stroke-width="1.5"/><text x="65" y="340" fill="#f6f9fc" font-size="17" font-weight="700">With a scripted conversation</text><rect x="65" y="360" width="150" height="70" rx="10" fill="#0b1522" fill-opacity="0.7" stroke="#22344a"/><text x="77" y="387" fill="#f6f9fc" font-size="14" font-weight="700">Edit CSS</text><text x="77" y="409" fill="#a9bdd0" font-size="12">save, reload</text><line x1="217" y1="395" x2="237" y2="395" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="241" y="360" width="170" height="70" rx="10" fill="#0b1522" fill-opacity="0.7" stroke="#22344a"/><text x="253" y="387" fill="#f6f9fc" font-size="14" font-weight="700">Press send</text><text x="253" y="409" fill="#a9bdd0" font-size="12">chat.next(messages)</text><line x1="413" y1="395" x2="433" y2="395" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="437" y="360" width="220" height="70" rx="10" fill="#2fa9a0" fill-opacity="0.22" stroke="#2fa9a0"/><text x="449" y="387" fill="#f6f9fc" font-size="14" font-weight="700">First chunk ~2–14 ms</text><text x="449" y="409" fill="#a9bdd0" font-size="12">pace set by delayMs</text><line x1="659" y1="395" x2="679" y2="395" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="683" y="360" width="190" height="70" rx="10" fill="#2fa9a0" fill-opacity="0.22" stroke="#2fa9a0"/><text x="695" y="387" fill="#f6f9fc" font-size="14" font-weight="700">Same answer</text><text x="695" y="409" fill="#a9bdd0" font-size="12">identical HTML 30/30</text><line x1="875" y1="395" x2="895" y2="395" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="899" y="360" width="220" height="70" rx="10" fill="#2fa9a0" fill-opacity="0.22" stroke="#2fa9a0"/><text x="911" y="387" fill="#f6f9fc" font-size="14" font-weight="700">Pick the state</text><text x="911" y="409" fill="#a9bdd0" font-size="12">any of 11, on demand</text><text x="65" y="460" fill="#f6f9fc" font-size="13.5" font-weight="700">Per 100 reloads: $0, zero network requests, the same layout every time, and the approval or error state one click away.</text>
  </g>
</svg>
