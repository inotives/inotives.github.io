<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Terraform and data deployment responsibilities</title>
  <desc id="desc">A dark diagram separating Terraform infrastructure deployment from application and data pipeline deployment, showing Terraform creating S3, Glue, Athena, IAM, VPC, and runtime resources while other systems deploy Mage and dbt code and execute batches.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.infra{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.data{fill:#332b1d;stroke:#e2b866;stroke-width:2}.app{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.boundary{fill:#111c2e;stroke:#48627d;stroke-width:2;stroke-dasharray:10 8}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.dataline{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="780"/><text class="text" x="65" y="68" font-size="36" font-weight="700">Infrastructure deployment is not data deployment</text><text class="small" x="65" y="103">Terraform creates the stage. CI/CD and runtime systems put code and data through it.</text>
  <rect class="infra" x="65" y="200" width="420" height="460" rx="22"/><text class="label" x="105" y="245">TERRAFORM OWNS</text><text class="text" x="105" y="290">Platform and access</text><text class="small" x="105" y="340">VPC · subnets · endpoints</text><text class="small" x="105" y="380">S3 · Iceberg locations</text><text class="small" x="105" y="420">Glue Catalog · Athena</text><text class="small" x="105" y="460">IAM roles · policies</text><text class="small" x="105" y="500">Mage runtime · logging</text><text class="small" x="105" y="540">artifact and image references</text><text class="small" x="105" y="600">state and environment boundaries</text>
  <rect class="boundary" x="575" y="160" width="420" height="540" rx="22"/><text class="label" x="615" y="205">RUNNING PLATFORM</text><rect class="app" x="615" y="250" width="340" height="120" rx="16"/><text class="text" x="650" y="295">Mage / Prefect</text><text class="small" x="650" y="330">ingestion and health gate code</text><rect class="data" x="615" y="420" width="340" height="120" rx="16"/><text class="text" x="650" y="465">dbt-athena</text><text class="small" x="650" y="500">Bronze → Silver → Gold SQL</text><text class="small" x="615" y="610">runtime uses the roles and resources</text><text class="small" x="615" y="638">Terraform provisioned</text>
  <rect class="app" x="1085" y="200" width="420" height="155" rx="18"/><text class="label" x="1125" y="245">APPLICATION CI/CD</text><text class="text" x="1125" y="290">Build and release artifacts</text><text class="small" x="1125" y="325">containers · packages · pipeline code</text>
  <rect class="data" x="1085" y="430" width="420" height="155" rx="18"/><text class="label" x="1125" y="475">DATA RUNTIME</text><text class="text" x="1125" y="520">Execute batches</text><text class="small" x="1125" y="555">Raw → health gate → Bronze → BI</text>
  <path class="line" d="M485 350 L575 350"/><path class="line" d="M995 300 L1085 275"/><path class="dataline" d="M995 480 L1085 505"/>
  <rect class="boundary" x="65" y="705" width="1440" height="45" rx="12"/><text class="small" x="95" y="735">Changing a container image may be an application release. Changing the VPC, IAM policy, or S3 layout is an infrastructure change.</text>
</svg>
