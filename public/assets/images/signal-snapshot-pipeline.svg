<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc">
  <title id="title">Fetch at build time, not in the browser</title>
  <desc id="desc">Before: the browser on inotives.github.io calls Yahoo through public CORS proxies, which are dead or rate-limited, and a direct call is blocked because Yahoo sends no CORS headers. After: a GitHub Actions cron on weekdays runs npm run stocks in Node, which writes stock-signals.json with 120 bars per symbol, then npm run build deploys to GitHub Pages, and the browser shows the newer of the snapshot and its own IndexedDB copy. If Yahoo refuses, continue-on-error ships the committed snapshot. Nothing is committed back to the repo.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#e3ad5a" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="545" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Fetch at build time, not in the browser</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">A static host can’t call Yahoo from the page, but the build runs in Node, where CORS doesn’t apply.</text>
<text x="45" y="140" fill="#f2706b" font-size="16" font-weight="700">Before</text><rect x="45" y="160" width="200" height="70" rx="12" fill="#263e5b" stroke="#75a8d5"/><text x="145" y="192" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">Browser</text><text x="145" y="213" fill="#a9bdd0" font-size="12" text-anchor="middle">inotives.github.io</text><rect x="390" y="160" width="200" height="70" rx="12" fill="#1a2633" stroke="#6f8aa3"/><text x="490" y="192" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">Public CORS proxy</text><text x="490" y="213" fill="#a9bdd0" font-size="12" text-anchor="middle">allorigins, codetabs</text><rect x="735" y="160" width="200" height="70" rx="12" fill="#3a2d1d" stroke="#e3ad5a"/><text x="835" y="192" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">Yahoo chart API</text><text x="835" y="213" fill="#a9bdd0" font-size="12" text-anchor="middle">no CORS headers</text><path d="M249 195h135" stroke="#f2706b" stroke-width="1.7" stroke-dasharray="6 5"/><text x="316" y="186" fill="#f2706b" font-size="12" text-anchor="middle">dead / rate-limited</text><text x="316" y="214" fill="#f2706b" font-size="20" text-anchor="middle" font-weight="700">✕</text><path d="M594 195h135" stroke="#6f8aa3" stroke-width="1.7" stroke-dasharray="6 5"/><text x="965" y="190" fill="#a9bdd0" font-size="13">Direct from the browser:</text><text x="965" y="210" fill="#f2706b" font-size="13">blocked by CORS</text><line x1="45" x2="1155" y1="270" y2="270" stroke="#2a3f57"/><text x="45" y="310" fill="#4fd1c5" font-size="16" font-weight="700">After</text><rect x="45" y="330" width="180" height="76" rx="12" fill="#263e5b" stroke="#75a8d5"/><text x="135" y="365" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">GitHub Actions</text><text x="135" y="386" fill="#a9bdd0" font-size="12" text-anchor="middle">cron 30 22 * * 1-5</text><rect x="265" y="330" width="180" height="76" rx="12" fill="#263e5b" stroke="#75a8d5"/><text x="355" y="365" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">npm run stocks</text><text x="355" y="386" fill="#a9bdd0" font-size="12" text-anchor="middle">Node: no CORS</text><rect x="485" y="330" width="180" height="76" rx="12" fill="#3a2d1d" stroke="#e3ad5a"/><text x="575" y="365" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">stock-signals.json</text><text x="575" y="386" fill="#a9bdd0" font-size="12" text-anchor="middle">120 bars per symbol</text><rect x="705" y="330" width="180" height="76" rx="12" fill="#263e5b" stroke="#75a8d5"/><text x="795" y="365" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">npm run build</text><text x="795" y="386" fill="#a9bdd0" font-size="12" text-anchor="middle">→ GitHub Pages</text><rect x="925" y="330" width="230" height="76" rx="12" fill="#263e5b" stroke="#4fd1c5"/><text x="1040" y="365" fill="#f6f9fc" font-size="15" text-anchor="middle" font-weight="700">Browser</text><text x="1040" y="386" fill="#a9bdd0" font-size="12" text-anchor="middle">newer of snapshot / IndexedDB</text><path d="M229 368H261" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><path d="M449 368H481" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><path d="M669 368H701" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><path d="M889 368H921" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><path d="M355 410v40H575v-40" fill="none" stroke="#6f8aa3" stroke-dasharray="5 5"/><text x="465" y="470" fill="#a9bdd0" font-size="12" text-anchor="middle">continue-on-error: if Yahoo refuses, ship the committed snapshot</text><text x="45" y="510" fill="#a9bdd0" font-size="14">Weekdays after the US close. Nothing is committed back: the fresh JSON lives only in the deployed build.</text>
  </g>
</svg>
