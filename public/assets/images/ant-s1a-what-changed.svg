<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 684" role="img" aria-labelledby="title desc">
  <title id="title">What the amended S-1 changes</title>
  <desc id="desc">A table comparing the October 26 S-1 with the November 2 amendment: Q3 is added, revenue reaches 17.0 billion dollars in Q3, the operating result swings from a 0.97 billion profit in Q2 to a 0.57 billion loss in Q3, compute commitments are stated as 895.4 billion dollars, a new safety risk sentence appears, and the offering terms are still blank.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#2a3a4d"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8fa6ba" stroke-width="3"/></pattern></defs>
  <rect width="1200" height="684" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="40" y="56" fill="#f6f9fc" font-size="28" font-weight="700">What the amended S-1 changes</text><text x="40" y="85" fill="#a9bdd0" font-size="16">Anthropic’s Form S-1 of October 26 against Amendment No. 1 of November 2, 2026.</text><text x="40" y="130" fill="#d7e3ef" font-size="14" font-weight="700">Item</text><text x="330" y="130" fill="#d7e3ef" font-size="14" font-weight="700">S-1 · Oct 26 (playground data)</text><text x="640" y="130" fill="#d7e3ef" font-size="14" font-weight="700">S-1/A · Nov 2</text><text x="985" y="130" fill="#d7e3ef" font-size="14" font-weight="700">What it means</text><line x1="40" y1="142" x2="1160" y2="142" stroke="#3e5468"/><rect x="32" y="149" width="1136" height="40" rx="6" fill="#16222f" fill-opacity="0.6"/><text x="40" y="174" fill="#fff" font-size="14" font-weight="600">Period covered</text><text x="330" y="174" fill="#9fb3c7" font-size="14">Six months to Jun 30</text><text x="640" y="174" fill="#e6eef6" font-size="14">Nine months to Sep 30</text><text x="985" y="174" fill="#8cc0ec" font-size="14" font-weight="600">● Adds Q3</text><text x="40" y="214" fill="#fff" font-size="14" font-weight="600">Revenue</text><text x="330" y="214" fill="#9fb3c7" font-size="14">$16.3B in H1</text><text x="640" y="214" fill="#e6eef6" font-size="14">$33.2B in 9 months; Q3 $17.0B</text><text x="985" y="214" fill="#7fd99a" font-size="14" font-weight="600">▲ Q3 +46% on Q2</text><rect x="32" y="229" width="1136" height="40" rx="6" fill="#16222f" fill-opacity="0.6"/><text x="40" y="254" fill="#fff" font-size="14" font-weight="600">Operating result, latest quarter</text><text x="330" y="254" fill="#9fb3c7" font-size="14">Q2: +$0.97B profit</text><text x="640" y="254" fill="#e6eef6" font-size="14">Q3: −$0.57B loss</text><text x="985" y="254" fill="#f0a07a" font-size="14" font-weight="600">▼ Back to a loss</text><text x="40" y="294" fill="#fff" font-size="14" font-weight="600">Adjusted operating margin</text><text x="330" y="294" fill="#9fb3c7" font-size="14">19% in Q2</text><text x="640" y="294" fill="#e6eef6" font-size="14">15% in Q3</text><text x="985" y="294" fill="#f0a07a" font-size="14" font-weight="600">▼ −4 points</text><rect x="32" y="309" width="1136" height="40" rx="6" fill="#16222f" fill-opacity="0.6"/><text x="40" y="334" fill="#fff" font-size="14" font-weight="600">Net loss in the period</text><text x="330" y="334" fill="#9fb3c7" font-size="14">$80.7B</text><text x="640" y="334" fill="#e6eef6" font-size="14">$104.0B (Q3 alone $23.3B)</text><text x="985" y="334" fill="#a9bdd0" font-size="14" font-weight="600">■ Mostly non-cash</text><text x="40" y="374" fill="#fff" font-size="14" font-weight="600">Cash and short-term investments</text><text x="330" y="374" fill="#9fb3c7" font-size="14">$131.7B</text><text x="640" y="374" fill="#e6eef6" font-size="14">$131.8B</text><text x="985" y="374" fill="#a9bdd0" font-size="14" font-weight="600">■ Flat</text><rect x="32" y="389" width="1136" height="40" rx="6" fill="#16222f" fill-opacity="0.6"/><text x="40" y="414" fill="#fff" font-size="14" font-weight="600">Total liabilities</text><text x="330" y="414" fill="#9fb3c7" font-size="14">$117.5B</text><text x="640" y="414" fill="#e6eef6" font-size="14">$146.7B</text><text x="985" y="414" fill="#f0a07a" font-size="14" font-weight="600">▼ +$29.2B</text><text x="40" y="454" fill="#fff" font-size="14" font-weight="600">Compute commitments</text><text x="330" y="454" fill="#9fb3c7" font-size="14">Total left blank; $417B new in 2026</text><text x="640" y="454" fill="#e6eef6" font-size="14">$895.4B total; $69.8B due in 12 months</text><text x="985" y="454" fill="#8cc0ec" font-size="14" font-weight="600">● First full number</text><rect x="32" y="469" width="1136" height="40" rx="6" fill="#16222f" fill-opacity="0.6"/><text x="40" y="494" fill="#fff" font-size="14" font-weight="600">Google cloud commitment</text><text x="330" y="494" fill="#9fb3c7" font-size="14">At least $114.5B</text><text x="640" y="494" fill="#e6eef6" font-size="14">At least $121.3B</text><text x="985" y="494" fill="#f0a07a" font-size="14" font-weight="600">▼ +$6.8B</text><text x="40" y="534" fill="#fff" font-size="14" font-weight="600">AI safety risk language</text><text x="330" y="534" fill="#9fb3c7" font-size="14">Models speed up our research</text><text x="640" y="534" fill="#e6eef6" font-size="14">May “imminently” meet RSP AI R&amp;D threshold</text><text x="985" y="534" fill="#8cc0ec" font-size="14" font-weight="600">● New sentence</text><rect x="32" y="549" width="1136" height="40" rx="6" fill="#16222f" fill-opacity="0.6"/><text x="40" y="574" fill="#fff" font-size="14" font-weight="600">Price range, shares, proceeds</text><text x="330" y="574" fill="#9fb3c7" font-size="14">Blank</text><text x="640" y="574" fill="#e6eef6" font-size="14">Still blank</text><text x="985" y="574" fill="#a9bdd0" font-size="14" font-weight="600">■ Next amendment</text><text x="40" y="624" fill="#a9bdd0" font-size="13">▲ supports the valuation   ▼ adds pressure   ● new disclosure   ■ unchanged</text><text x="40" y="650" fill="#8fa6ba" font-size="13">Source: SEC EDGAR, Anthropic PBC (CIK 2130357), Form S-1 and S-1/A. Q3 figures are the nine-month totals minus the first half.</text>
  </g>
</svg>
