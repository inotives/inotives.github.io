<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid search combines lexical and semantic retrieval</title>
  <desc id="desc">Keyword search finds exact identifiers while vector search finds semantically related passages; ranked results are fused.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#171a30"/></linearGradient>
    <linearGradient id="kw" x1="0" x2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="vec" x1="0" x2="1"><stop stop-color="#7e22ce"/><stop offset="1" stop-color="#6b21a8"/></linearGradient>
    <linearGradient id="fuse" x1="0" x2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="68" y="68" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Two kinds of match, one useful result list</text>
  <text x="68" y="102" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Lexical retrieval catches exact wording; vector retrieval catches related meaning.</text>
  <rect x="70" y="180" width="270" height="310" rx="20" fill="url(#kw)" stroke="#93c5fd"/>
  <text x="205" y="226" fill="#eff6ff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">Full-text search</text>
  <text x="205" y="270" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle">“SKU-AX91”</text>
  <rect x="108" y="295" width="194" height="46" rx="10" fill="#1e3a8a"/><text x="205" y="324" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">exact product code ✓</text>
  <rect x="108" y="354" width="194" height="46" rx="10" fill="#1e3a8a"/><text x="205" y="383" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">rare name / acronym ✓</text>
  <rect x="108" y="413" width="194" height="46" rx="10" fill="#1e3a8a"/><text x="205" y="442" fill="#93c5fd" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">paraphrase may be missed</text>
  <rect x="465" y="180" width="270" height="310" rx="20" fill="url(#vec)" stroke="#d8b4fe"/>
  <text x="600" y="226" fill="#faf5ff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">Vector search</text>
  <text x="600" y="270" fill="#f3e8ff" font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle">“item arrived broken”</text>
  <rect x="503" y="295" width="194" height="46" rx="10" fill="#581c87"/><text x="600" y="324" fill="#f3e8ff" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">defective goods ✓</text>
  <rect x="503" y="354" width="194" height="46" rx="10" fill="#581c87"/><text x="600" y="383" fill="#f3e8ff" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">return workflow ✓</text>
  <rect x="503" y="413" width="194" height="46" rx="10" fill="#581c87"/><text x="600" y="442" fill="#d8b4fe" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">exact code may rank low</text>
  <rect x="860" y="230" width="270" height="210" rx="20" fill="url(#fuse)" stroke="#99f6e4"/>
  <text x="995" y="278" fill="#f0fdfa" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">Hybrid ranking</text>
  <text x="995" y="318" fill="#ccfbf1" font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle">merge ranked candidates</text>
  <text x="995" y="350" fill="#ccfbf1" font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle">apply access + freshness</text>
  <text x="995" y="382" fill="#99f6e4" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">return source-linked passages</text>
  <path d="M340 335H450M735 335H845" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M340 380C525 550 705 550 850 405" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 8" marker-end="url(#arrow)"/>
  <text x="68" y="555" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">PostgreSQL full-text search and pgvector can run side by side; result fusion is an application choice.</text>
</svg>
