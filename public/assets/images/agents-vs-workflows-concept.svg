<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">AI Workflow versus AI Agent, the core idea</title>
  <desc id="desc">Left, an AI workflow: input, extract, classify, draft and output run in a fixed line, the same path every time, with the LLM filling in steps but not choosing them. Right, an AI agent: a goal enters a loop of think, act and observe, and the loop exits only when the model judges the goal met.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Who decides the next step?</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">A workflow follows a path you wrote. An agent writes its own path while it runs.</text>

    <!-- Workflow panel -->
    <rect x="45" y="115" width="540" height="290" rx="18" fill="#1b2e22" stroke="#8fd16a" stroke-opacity=".6"/>
    <text x="70" y="152" fill="#fff" font-size="20" font-weight="700">AI Workflow</text>
    <text x="70" y="176" fill="#a6e07f" font-size="14">the code decides the path</text>

    <g font-size="14" text-anchor="middle">
      <rect x="65" y="205" width="84" height="60" rx="10" fill="#25391f" stroke="#8fd16a"/>
      <text x="107" y="240" fill="#fff">Input</text>
      <rect x="169" y="205" width="84" height="60" rx="10" fill="#25391f" stroke="#8fd16a"/>
      <text x="211" y="232" fill="#fff">Extract</text>
      <text x="211" y="251" fill="#e3ad5a" font-size="11">LLM</text>
      <rect x="273" y="205" width="84" height="60" rx="10" fill="#25391f" stroke="#8fd16a"/>
      <text x="315" y="232" fill="#fff">Classify</text>
      <text x="315" y="251" fill="#e3ad5a" font-size="11">LLM</text>
      <rect x="377" y="205" width="84" height="60" rx="10" fill="#25391f" stroke="#8fd16a"/>
      <text x="419" y="232" fill="#fff">Draft</text>
      <text x="419" y="251" fill="#e3ad5a" font-size="11">LLM</text>
      <rect x="481" y="205" width="84" height="60" rx="10" fill="#25391f" stroke="#8fd16a"/>
      <text x="523" y="240" fill="#fff">Output</text>
    </g>
    <g stroke="#90adc2" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <path d="M150 235 H167"/><path d="M254 235 H271"/><path d="M358 235 H375"/><path d="M462 235 H479"/>
    </g>
    <text x="70" y="315" fill="#d3ecc2" font-size="15">• Same steps, same order, every run</text>
    <text x="70" y="342" fill="#d3ecc2" font-size="15">• The LLM fills in a step; it never picks the next one</text>
    <text x="70" y="369" fill="#d3ecc2" font-size="15">• Goal: reliable and repeatable</text>

    <!-- Agent panel -->
    <rect x="615" y="115" width="540" height="290" rx="18" fill="#22223d" stroke="#a99bf0" stroke-opacity=".7"/>
    <text x="640" y="152" fill="#fff" font-size="20" font-weight="700">AI Agent</text>
    <text x="640" y="176" fill="#d6d0f7" font-size="14">the model decides the path</text>

    <g font-size="15" text-anchor="middle">
      <rect x="640" y="200" width="100" height="44" rx="10" fill="#263e5b" stroke="#75a8d5"/>
      <text x="690" y="227" fill="#fff">Goal</text>
      <rect x="825" y="200" width="120" height="44" rx="10" fill="#2c2f4f" stroke="#a99bf0" stroke-width="2"/>
      <text x="885" y="227" fill="#fff">Think</text>
      <rect x="925" y="300" width="120" height="44" rx="10" fill="#2c2f4f" stroke="#a99bf0" stroke-width="2"/>
      <text x="985" y="327" fill="#fff">Act</text>
      <rect x="725" y="300" width="120" height="44" rx="10" fill="#2c2f4f" stroke="#a99bf0" stroke-width="2"/>
      <text x="785" y="327" fill="#fff">Observe</text>
      <rect x="1035" y="200" width="100" height="44" rx="10" fill="#263e5b" stroke="#75a8d5"/>
      <text x="1085" y="227" fill="#fff">Done</text>
    </g>
    <g stroke="#90adc2" stroke-width="1.6" fill="none" marker-end="url(#a)">
      <path d="M741 222 H822"/>
      <path d="M930 245 L970 297"/>
      <path d="M924 322 H848"/>
      <path d="M800 299 L840 247"/>
      <path d="M946 222 H1032"/>
    </g>
    <text x="989" y="212" fill="#a9bdd0" font-size="12" text-anchor="middle">goal met?</text>
    <text x="985" y="365" fill="#c8dbee" font-size="12" text-anchor="middle">tools: search, code, APIs</text>
    <text x="785" y="365" fill="#c8dbee" font-size="12" text-anchor="middle">read the result</text>
    <text x="640" y="392" fill="#d6d0f7" font-size="15">Loops until the goal is met or the budget runs out</text>
  </g>
</svg>
