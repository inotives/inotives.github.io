<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Git worktree lifecycle</title>
  <desc id="desc">Create a linked worktree from a base, edit and commit the task branch, integrate the change, then remove the clean worktree.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#151b2f"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1200" height="590" rx="28" fill="url(#bg)"/>
  <text x="68" y="68" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">The worktree lifecycle</text>
  <text x="68" y="102" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">A directory can be temporary; a commit keeps the work in repository history.</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <rect x="65" y="190" width="240" height="205" rx="20" fill="url(#card)" stroke="#60a5fa"/>
    <text x="185" y="236" fill="#eff6ff" font-size="20" font-weight="700">1 · Create</text><text x="185" y="282" fill="#bfdbfe" font-size="15">choose a base</text><text x="185" y="314" fill="#bfdbfe" font-size="15">new branch + directory</text><text x="185" y="355" fill="#93c5fd" font-family="ui-monospace,monospace" font-size="13">git worktree add</text>
    <rect x="350" y="190" width="240" height="205" rx="20" fill="#0e7490" stroke="#67e8f9"/>
    <text x="470" y="236" fill="#ecfeff" font-size="20" font-weight="700">2 · Work</text><text x="470" y="282" fill="#cffafe" font-size="15">edit + run checks</text><text x="470" y="314" fill="#cffafe" font-size="15">keep task diff focused</text><text x="470" y="355" fill="#a5f3fc" font-size="13">independent checkout</text>
    <rect x="635" y="190" width="240" height="205" rx="20" fill="#5b21b6" stroke="#c4b5fd"/>
    <text x="755" y="236" fill="#faf5ff" font-size="20" font-weight="700">3 · Preserve</text><text x="755" y="282" fill="#ede9fe" font-size="15">review the diff</text><text x="755" y="314" fill="#ede9fe" font-size="15">commit accepted work</text><text x="755" y="355" fill="#ddd6fe" font-size="13">commit = durable point</text>
    <rect x="920" y="190" width="240" height="205" rx="20" fill="#14532d" stroke="#86efac"/>
    <text x="1040" y="236" fill="#f0fdf4" font-size="20" font-weight="700">4 · Integrate + clean</text><text x="1040" y="282" fill="#bbf7d0" font-size="15">merge / cherry-pick</text><text x="1040" y="314" fill="#bbf7d0" font-size="15">remove clean worktree</text><text x="1040" y="355" fill="#86efac" font-family="ui-monospace,monospace" font-size="13">worktree remove</text>
  </g>
  <path d="M305 292H340M590 292H625M875 292H910" fill="none" stroke="#164e63" stroke-width="10" stroke-linecap="round"/>
  <path d="M305 292H340M590 292H625M875 292H910" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="160" y="450" width="880" height="75" rx="16" fill="#111827" stroke="#334155"/>
  <text x="600" y="481" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">Before removal: check status, commit or preserve uncommitted work, and confirm the path.</text>
  <text x="600" y="507" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Git refuses to remove a dirty worktree unless forced; avoid force as a cleanup shortcut.</text>
</svg>
