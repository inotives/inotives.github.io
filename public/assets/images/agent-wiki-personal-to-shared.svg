<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">From personal agent memory to a shared team wiki</title>
  <desc id="desc">A dark diagram comparing a personal agent memory loop with a shared team wiki that adds identity, ownership, review, and publication controls.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.personal{fill:#17263b;stroke:#587692;stroke-width:2}.shared{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.control{fill:#332b1d;stroke:#e2b866;stroke-width:2}.review{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.secure{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="820"/><text class="text" x="65" y="68" font-size="36" font-weight="700">The jump from personal memory to shared knowledge</text><text class="small" x="65" y="103">A personal loop has one owner. A team wiki needs a route for trust and responsibility.</text>
  <rect class="personal" x="65" y="180" width="610" height="510" rx="22"/><text class="label" x="105" y="225">PERSONAL AGENT MEMORY</text><rect class="personal" x="110" y="280" width="230" height="105" rx="14"/><text class="text" x="145" y="325">Person</text><text class="small" x="145" y="357">one context</text><rect class="personal" x="400" y="280" width="230" height="105" rx="14"/><text class="text" x="435" y="325">Agent</text><text class="small" x="435" y="357">private drafts</text><path class="line" d="M340 332 L400 332"/><path class="line" d="M515 385 C515 470 225 470 225 385"/><text class="small" x="180" y="535">fast feedback</text><text class="small" x="180" y="570">implicit ownership</text><text class="small" x="180" y="605">local conventions</text>
  <rect class="shared" x="735" y="180" width="800" height="510" rx="22"/><text class="label" x="775" y="225">SHARED AGENT WIKI</text><rect class="shared" x="775" y="280" width="205" height="105" rx="14"/><text class="text" x="810" y="325">People</text><text class="small" x="810" y="357">many owners</text><rect class="shared" x="1035" y="280" width="205" height="105" rx="14"/><text class="text" x="1070" y="325">Agents</text><text class="small" x="1070" y="357">many contributors</text><rect class="control" x="1295" y="280" width="195" height="105" rx="14"/><text class="text" x="1325" y="325">Review</text><text class="small" x="1325" y="357">shared trust</text><path class="line" d="M980 332 L1035 332"/><path class="secure" d="M1240 332 L1295 332"/><rect class="review" x="825" y="480" width="550" height="120" rx="16"/><text class="label" x="865" y="520">NEW CONTROLS</text><text class="text" x="865" y="560">identity · ownership · lifecycle · review</text><text class="small" x="865" y="588">the wiki becomes a governed system</text>
  <path class="secure" d="M675 435 L735 435"/><text class="small" x="680" y="410">scale changes the problem</text>
</svg>
