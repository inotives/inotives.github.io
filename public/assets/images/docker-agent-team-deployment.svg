<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Deploying Docker Agent teams for AgentRig projects</title>
  <desc id="desc">A dark deployment diagram showing an OCI registry distributing a Docker Agent team to isolated project workspaces, while AgentRig keeps project tasks, context, and review records local to each project.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.source{fill:#17263b;stroke:#587692;stroke-width:2}.registry{fill:#332b1d;stroke:#e2b866;stroke-width:2}.team{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.workspace{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.text{fill:#e7eef6;font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.yellow{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="840"/><text class="text" x="65" y="68" font-size="36" font-weight="700">One team definition, many isolated project runs</text><text class="small" x="65" y="103">A shared Docker Agent configuration can travel through a registry without sharing project state.</text>
  <rect class="source" x="65" y="235" width="300" height="170" rx="18"/><text class="label" x="105" y="280">SOURCE CONTROL</text><text class="text" x="105" y="325">Team YAML</text><text class="small" x="105" y="365">roles · tools · instructions</text>
  <rect class="registry" x="500" y="235" width="330" height="170" rx="18"/><text class="label" x="540" y="280">OCI REGISTRY</text><text class="text" x="540" y="325">Shared agent team</text><text class="small" x="540" y="365">versioned artifact</text><path class="line" d="M365 320 L500 320"/>
  <rect class="team" x="965" y="150" width="520" height="530" rx="22"/><text class="label" x="1005" y="195">TEAM DEPLOYMENT</text><rect class="team" x="1005" y="235" width="205" height="130" rx="14"/><text class="text" x="1040" y="280">Project A</text><text class="small" x="1040" y="320">Docker Agent team</text><rect class="team" x="1245" y="235" width="205" height="130" rx="14"/><text class="text" x="1280" y="280">Project B</text><text class="small" x="1280" y="320">Docker Agent team</text><rect class="workspace" x="1005" y="430" width="205" height="160" rx="14"/><text class="label" x="1040" y="470">LOCAL</text><text class="text" x="1040" y="515">AgentRig</text><text class="small" x="1040" y="550">tasks · context · review</text><rect class="workspace" x="1245" y="430" width="205" height="160" rx="14"/><text class="label" x="1280" y="470">LOCAL</text><text class="text" x="1280" y="515">AgentRig</text><text class="small" x="1280" y="550">tasks · context · review</text><path class="yellow" d="M830 320 L965 280"/><path class="yellow" d="M830 320 L965 340"/>
  <rect class="source" x="65" y="520" width="765" height="160" rx="18"/><text class="label" x="105" y="565">BOUNDARY</text><text class="text" x="105" y="610">Share the team definition, not project memory</text><text class="small" x="105" y="650">Each project keeps its own files, tasks, approvals, and findings.</text>
</svg>
