<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Computing an answer versus recalling one</title>
  <desc id="desc">Auto Ontology checks whether a question is covered, retrieves terms and join candidates, builds SQL, validates values and syntax, runs it on the warehouse and returns the answer with its SQL and rows. Knowledge Grid runs a hybrid full-text and vector search, returns summaries first, reads a few pages, follows their links and lets the agent write an answer that cites page slugs.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">One computes the answer, the other recalls it</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">The same agent question takes two different paths, and each path is checked in a different way.</text>

    <text x="45" y="135" fill="#a6e07f" font-size="18" font-weight="700">Auto Ontology · “What were net deposits on Tron last week?”</text>
    <g font-size="14">
      <rect x="45" y="152" width="170" height="86" rx="14" fill="#25391f" stroke="#8fd16a"/>
      <text x="62" y="180" fill="#fff" font-weight="700">check_answerable</text>
      <text x="62" y="204" fill="#d3ecc2">Is this covered by</text>
      <text x="62" y="222" fill="#d3ecc2">the semantic layer?</text>
      <rect x="233" y="152" width="170" height="86" rx="14" fill="#25391f" stroke="#8fd16a"/>
      <text x="250" y="180" fill="#fff" font-weight="700">Retrieve</text>
      <text x="250" y="204" fill="#d3ecc2">Terms, attributes,</text>
      <text x="250" y="222" fill="#d3ecc2">join candidates</text>
      <rect x="421" y="152" width="170" height="86" rx="14" fill="#25391f" stroke="#8fd16a"/>
      <text x="438" y="180" fill="#fff" font-weight="700">Build SQL</text>
      <text x="438" y="204" fill="#d3ecc2">From approved</text>
      <text x="438" y="222" fill="#d3ecc2">terms and joins</text>
      <rect x="609" y="152" width="170" height="86" rx="14" fill="#25391f" stroke="#8fd16a"/>
      <text x="626" y="180" fill="#fff" font-weight="700">Validate</text>
      <text x="626" y="204" fill="#d3ecc2">Values, syntax,</text>
      <text x="626" y="222" fill="#d3ecc2">join paths</text>
      <rect x="797" y="152" width="170" height="86" rx="14" fill="#25391f" stroke="#8fd16a"/>
      <text x="814" y="180" fill="#fff" font-weight="700">Execute</text>
      <text x="814" y="204" fill="#d3ecc2">On the warehouse;</text>
      <text x="814" y="222" fill="#d3ecc2">check empty results</text>
      <rect x="985" y="152" width="170" height="86" rx="14" fill="#1d3d45" stroke="#53dfdc" stroke-width="2"/>
      <text x="1002" y="180" fill="#fff" font-weight="700">Answer</text>
      <text x="1002" y="204" fill="#c1e5e5">+ SQL it ran</text>
      <text x="1002" y="222" fill="#c1e5e5">+ up to 100 rows</text>
    </g>
    <g stroke="#90adc2" stroke-width="1.6" marker-end="url(#a)">
      <line x1="215" y1="195" x2="229" y2="195"/><line x1="403" y1="195" x2="417" y2="195"/>
      <line x1="591" y1="195" x2="605" y2="195"/><line x1="779" y1="195" x2="793" y2="195"/>
      <line x1="967" y1="195" x2="981" y2="195"/>
    </g>
    <path d="M694 238 C 694 268, 506 268, 506 242" fill="none" stroke="#e3ad5a" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#a)"/>
    <text x="600" y="282" fill="#f1d7aa" font-size="13" text-anchor="middle">repair and rebuild when a value or join fails</text>

    <text x="45" y="335" fill="#8cc0ec" font-size="18" font-weight="700">Knowledge Grid · “How do we count net deposits, and why?”</text>
    <g font-size="14">
      <rect x="45" y="352" width="170" height="86" rx="14" fill="#263e5b" stroke="#75a8d5"/>
      <text x="62" y="380" fill="#fff" font-weight="700">hybrid_search</text>
      <text x="62" y="404" fill="#c8dbee">Full text + vectors,</text>
      <text x="62" y="422" fill="#c8dbee">fused with RRF</text>
      <rect x="233" y="352" width="170" height="86" rx="14" fill="#263e5b" stroke="#75a8d5"/>
      <text x="250" y="380" fill="#fff" font-weight="700">Summaries first</text>
      <text x="250" y="404" fill="#c8dbee">Pick pages without</text>
      <text x="250" y="422" fill="#c8dbee">reading Markdown</text>
      <rect x="421" y="352" width="170" height="86" rx="14" fill="#263e5b" stroke="#75a8d5"/>
      <text x="438" y="380" fill="#fff" font-weight="700">Read pages</text>
      <text x="438" y="404" fill="#c8dbee">Two or three, in</text>
      <text x="438" y="422" fill="#c8dbee">full, current version</text>
      <rect x="609" y="352" width="170" height="86" rx="14" fill="#263e5b" stroke="#75a8d5"/>
      <text x="626" y="380" fill="#fff" font-weight="700">Follow links</text>
      <text x="626" y="404" fill="#c8dbee">[[entities/…]] and</text>
      <text x="626" y="422" fill="#c8dbee">backlinks as needed</text>
      <rect x="797" y="352" width="170" height="86" rx="14" fill="#263e5b" stroke="#75a8d5"/>
      <text x="814" y="380" fill="#fff" font-weight="700">Synthesize</text>
      <text x="814" y="404" fill="#c8dbee">The agent writes</text>
      <text x="814" y="422" fill="#c8dbee">the answer itself</text>
      <rect x="985" y="352" width="170" height="86" rx="14" fill="#1d3d45" stroke="#53dfdc" stroke-width="2"/>
      <text x="1002" y="380" fill="#fff" font-weight="700">Answer</text>
      <text x="1002" y="404" fill="#c1e5e5">+ page slugs and</text>
      <text x="1002" y="422" fill="#c1e5e5">versions it used</text>
    </g>
    <g stroke="#90adc2" stroke-width="1.6" marker-end="url(#a)">
      <line x1="215" y1="395" x2="229" y2="395"/><line x1="403" y1="395" x2="417" y2="395"/>
      <line x1="591" y1="395" x2="605" y2="395"/><line x1="779" y1="395" x2="793" y2="395"/>
      <line x1="967" y1="395" x2="981" y2="395"/>
    </g>

    <rect x="45" y="468" width="545" height="62" rx="12" fill="#16222f" stroke="#3e5468"/>
    <text x="65" y="494" fill="#d3ecc2" font-size="14"><tspan font-weight="700" fill="#fff">Check it by</tspan> rereading the SQL and the rows: population,</text>
    <text x="65" y="514" fill="#d3ecc2" font-size="14">grain, unit, joins, truncation. The number is live.</text>
    <rect x="610" y="468" width="545" height="62" rx="12" fill="#16222f" stroke="#3e5468"/>
    <text x="630" y="494" fill="#c8dbee" font-size="14"><tspan font-weight="700" fill="#fff">Check it by</tspan> opening the cited pages and their history.</text>
    <text x="630" y="514" fill="#c8dbee" font-size="14">The text is only as fresh as the last person or agent made it.</text>
  </g>
</svg>
