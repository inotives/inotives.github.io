<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Docker Agent and AgentRig comparison</title>
  <desc id="desc">A dark comparison diagram showing Docker Agent focused on defining and running specialized agent teams, and AgentRig focused on project workspaces, tasks, profiles, handoffs, and review loops.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.docker{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.rig{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.bridge{fill:#332b1d;stroke:#e2b866;stroke-width:2}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.yellow{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="860"/><text class="text" x="65" y="68" font-size="36" font-weight="700">Docker Agent and AgentRig solve different layers</text><text class="small" x="65" y="103">One describes and runs an agent team. The other manages project work around agents.</text>
  <rect class="docker" x="65" y="180" width="620" height="535" rx="22"/><text class="label" x="105" y="225">DOCKER AGENT</text><text class="text" x="105" y="270">Agent team runtime</text><rect class="docker" x="105" y="325" width="250" height="110" rx="14"/><text class="text" x="140" y="370">Root agent</text><text class="small" x="140" y="405">delegates work</text><rect class="docker" x="395" y="325" width="250" height="110" rx="14"/><text class="text" x="430" y="370">Sub-agents</text><text class="small" x="430" y="405">specialist roles</text><path class="line" d="M355 380 L395 380"/><text class="small" x="105" y="500">YAML configuration</text><text class="small" x="105" y="535">per-agent models and context</text><text class="small" x="105" y="570">MCP tools and delegation</text><text class="small" x="105" y="605">OCI share and pull</text><text class="small" x="105" y="660">best at packaging a reusable team</text>
  <rect class="rig" x="915" y="180" width="620" height="535" rx="22"/><text class="label" x="955" y="225">AGENTRIG</text><text class="text" x="955" y="270">Project workflow control</text><rect class="rig" x="955" y="325" width="250" height="110" rx="14"/><text class="text" x="990" y="370">Task board</text><text class="small" x="990" y="405">briefs and state</text><rect class="rig" x="1245" y="325" width="250" height="110" rx="14"/><text class="text" x="1280" y="370">Worker/reviewer</text><text class="small" x="1280" y="405">handoff loop</text><path class="line" d="M1205 380 L1245 380"/><text class="small" x="955" y="500">filesystem-first workspace</text><text class="small" x="955" y="535">profiles and shared context</text><text class="small" x="955" y="570">tasks, handoffs, findings</text><text class="small" x="955" y="605">project-local boundaries</text><text class="small" x="955" y="660">best at governed engineering work</text>
  <rect class="bridge" x="650" y="745" width="300" height="60" rx="14"/><text class="text" x="690" y="783">possible adapter seam</text><path class="yellow" d="M685 650 L800 745"/><path class="yellow" d="M915 650 L800 745"/>
</svg>
