<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenKnowledge memory structure for a one-person company</title>
  <desc id="desc">A dark folder tree showing AGENTS.md at every level and the Owner, Branding Company, Business, BAU, Skills, Roles and Memo folders.</desc>
  <defs><style>.bg{fill:#0b1220}.root{fill:#17263b;stroke:#587692;stroke-width:2}.folder{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.guard{fill:#332b1d;stroke:#e2b866;stroke-width:2}.memo{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.text{fill:#e7eef6;font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.branch{stroke:#667d96;stroke-width:3;fill:none}</style></defs>
  <rect class="bg" width="1600" height="900"/><text class="text" x="65" y="68" font-size="36" font-weight="700">The OPC memory answers six questions</text><text class="small" x="65" y="103">Who are we? What do we do? How do we work? Who owns what? Where are we now? What is forbidden?</text>
  <rect class="root" x="65" y="190" width="300" height="600" rx="22"/><text class="label" x="105" y="235">OPC WIKI</text><text class="text" x="105" y="285">company-memory/</text><text class="guard" x="105" y="335">AGENTS.md</text><text class="small" x="140" y="375">scope and rules</text><text class="small" x="105" y="430">Owner/</text><text class="small" x="105" y="470">Branding/Company/</text><text class="small" x="105" y="510">Business/</text><text class="small" x="105" y="550">BAU/</text><text class="small" x="105" y="590">Skills/</text><text class="small" x="105" y="630">Roles/</text><text class="small" x="105" y="670">Memo/</text><text class="small" x="105" y="735">every folder has its own AGENTS.md</text>
  <path class="branch" d="M365 330 L470 330 M365 430 L470 430 M365 530 L470 530 M365 630 L470 630"/>
  <rect class="folder" x="470" y="170" width="300" height="180" rx="16"/><text class="label" x="510" y="215">OWNER</text><text class="text" x="510" y="260">Boss.md · CTO.md</text><text class="small" x="510" y="305">authority and approvals</text>
  <rect class="folder" x="470" y="385" width="300" height="180" rx="16"/><text class="label" x="510" y="430">BUSINESS</text><text class="text" x="510" y="475">lines and products</text><text class="small" x="510" y="520">channels and current work</text>
  <rect class="memo" x="470" y="600" width="300" height="180" rx="16"/><text class="label" x="510" y="645">MEMO</text><text class="text" x="510" y="690">research and ideas</text><text class="small" x="510" y="735">draft knowledge and history</text>
  <path class="branch" d="M770 260 L875 260 M770 475 L875 475 M770 690 L875 690"/>
  <rect class="guard" x="875" y="170" width="300" height="180" rx="16"/><text class="label" x="915" y="215">BAU + SKILLS</text><text class="text" x="915" y="260">how work is done</text><text class="small" x="915" y="305">procedures and reusable skill catalog</text>
  <rect class="guard" x="875" y="385" width="300" height="180" rx="16"/><text class="label" x="915" y="430">ROLES</text><text class="text" x="915" y="475">what agents may do</text><text class="small" x="915" y="520">scope · tone · guardrails</text>
  <rect class="root" x="875" y="600" width="300" height="180" rx="16"/><text class="label" x="915" y="645">AGENTS.md</text><text class="text" x="915" y="690">local navigation</text><text class="small" x="915" y="735">rules apply before content</text>
  <rect class="memo" x="1280" y="300" width="250" height="330" rx="18"/><text class="label" x="1320" y="345">AGENT READ PATH</text><text class="small" x="1320" y="400">1. nearest</text><text class="small" x="1320" y="440">AGENTS.md</text><text class="small" x="1320" y="490">2. role definition</text><text class="small" x="1320" y="530">3. relevant memory</text><text class="small" x="1320" y="580">4. write back with</text><text class="small" x="1320" y="610">owner and status</text>
</svg>
