<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Replay each day with only its past</title>
  <desc id="desc">A row of daily candles. Bars from the start up to day i sit inside a dashed box labelled bars.slice(0, i + 1), which is all the replay can see. Day i + 1 is highlighted as the bar being scored, and later bars are greyed out as hidden. Below, four steps: slice bars 0 to i, recompute every indicator from scratch, vote a bias of up, down or no call, then score it against the next open and next close. This repeats from session 35 to the second-last bar, giving 84 calls from 120 sessions.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
    <marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#e3ad5a" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="540" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Replay each day with only its past</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">The track record recomputes everything from a truncated series, so no future bar can leak into a call.</text>
<rect x="62" y="130" width="708" height="240" rx="12" fill="#1c3550" stroke="#75a8d5" stroke-dasharray="5 5"/><text x="74" y="150" fill="#75a8d5" font-size="14">bars.slice(0, i + 1): all the replay is allowed to see</text><rect x="772" y="130" width="44" height="240" rx="10" fill="#3a2d1d" stroke="#e3ad5a"/><rect x="816" y="130" width="220" height="240" rx="10" fill="#141c26" stroke="#2a3f57"/><text x="828" y="150" fill="#6f8aa3" font-size="13">hidden (the future)</text><line x1="88" x2="88" y1="280.79999999999995" y2="316" stroke="#4fd1c5"/><rect x="79" y="294" width="18" height="8.8" fill="#4fd1c5" rx="2"/><line x1="132" x2="132" y1="263.2" y2="298.4" stroke="#4fd1c5"/><rect x="123" y="276.4" width="18" height="8.8" fill="#4fd1c5" rx="2"/><line x1="176" x2="176" y1="254.39999999999998" y2="302.79999999999995" stroke="#f2706b"/><rect x="167" y="267.6" width="18" height="22" fill="#f2706b" rx="2"/><line x1="220" x2="220" y1="249.99999999999997" y2="311.6" stroke="#4fd1c5"/><rect x="211" y="263.2" width="18" height="35.2" fill="#4fd1c5" rx="2"/><line x1="264" x2="264" y1="227.99999999999997" y2="267.6" stroke="#4fd1c5"/><rect x="255" y="241.2" width="18" height="13.200000000000001" fill="#4fd1c5" rx="2"/><line x1="308" x2="308" y1="219.2" y2="267.6" stroke="#f2706b"/><rect x="299" y="232.39999999999998" width="18" height="22" fill="#f2706b" rx="2"/><line x1="352" x2="352" y1="214.79999999999998" y2="276.4" stroke="#4fd1c5"/><rect x="343" y="227.99999999999997" width="18" height="35.2" fill="#4fd1c5" rx="2"/><line x1="396" x2="396" y1="206" y2="249.99999999999997" stroke="#f2706b"/><rect x="387" y="219.2" width="18" height="17.6" fill="#f2706b" rx="2"/><line x1="440" x2="440" y1="201.59999999999997" y2="241.2" stroke="#4fd1c5"/><rect x="431" y="214.79999999999998" width="18" height="13.200000000000001" fill="#4fd1c5" rx="2"/><line x1="484" x2="484" y1="210.39999999999998" y2="236.79999999999998" stroke="#4fd1c5"/><rect x="475" y="223.59999999999997" width="18" height="3" fill="#4fd1c5" rx="2"/><line x1="528" x2="528" y1="188.39999999999998" y2="227.99999999999997" stroke="#4fd1c5"/><rect x="519" y="201.59999999999997" width="18" height="13.200000000000001" fill="#4fd1c5" rx="2"/><line x1="572" x2="572" y1="175.2" y2="206" stroke="#4fd1c5"/><rect x="563" y="188.39999999999998" width="18" height="4.4" fill="#4fd1c5" rx="2"/><line x1="616" x2="616" y1="184" y2="219.2" stroke="#f2706b"/><rect x="607" y="197.2" width="18" height="8.8" fill="#f2706b" rx="2"/><line x1="660" x2="660" y1="166.39999999999998" y2="210.39999999999998" stroke="#4fd1c5"/><rect x="651" y="179.59999999999997" width="18" height="17.6" fill="#4fd1c5" rx="2"/><line x1="704" x2="704" y1="157.59999999999997" y2="206" stroke="#f2706b"/><rect x="695" y="170.79999999999995" width="18" height="22" fill="#f2706b" rx="2"/><line x1="748" x2="748" y1="188.39999999999998" y2="223.59999999999997" stroke="#f2706b"/><rect x="739" y="201.59999999999997" width="18" height="8.8" fill="#f2706b" rx="2"/><line x1="792" x2="792" y1="184" y2="214.79999999999998" stroke="#4fd1c5"/><rect x="783" y="197.2" width="18" height="4.4" fill="#4fd1c5" rx="2"/><line x1="836" x2="836" y1="157.59999999999997" y2="201.59999999999997" stroke="#33465c"/><rect x="827" y="170.79999999999995" width="18" height="17.6" fill="#33465c" rx="2"/><line x1="880" x2="880" y1="166.39999999999998" y2="197.2" stroke="#33465c"/><rect x="871" y="179.59999999999997" width="18" height="4.4" fill="#33465c" rx="2"/><line x1="924" x2="924" y1="148.79999999999995" y2="188.39999999999998" stroke="#33465c"/><rect x="915" y="162" width="18" height="13.200000000000001" fill="#33465c" rx="2"/><line x1="968" x2="968" y1="131.2" y2="166.39999999999998" stroke="#33465c"/><rect x="959" y="144.39999999999998" width="18" height="8.8" fill="#33465c" rx="2"/><line x1="1012" x2="1012" y1="140" y2="166.39999999999998" stroke="#33465c"/><rect x="1003" y="153.2" width="18" height="3" fill="#33465c" rx="2"/><text x="756" y="386" fill="#75a8d5" font-size="14" text-anchor="end" font-weight="700">day i</text><text x="784" y="386" fill="#e3ad5a" font-size="14" font-weight="700">i + 1</text><rect x="70" y="410" width="240" height="64" rx="10" fill="#263e5b" stroke="#75a8d5"/><text x="86" y="436" fill="#f6f9fc" font-size="14" font-weight="700">1  Slice</text><text x="86" y="459" fill="#a9bdd0" font-size="13">Keep bars 0..i only</text><path d="M314 442h22" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="340" y="410" width="240" height="64" rx="10" fill="#263e5b" stroke="#75a8d5"/><text x="356" y="436" fill="#f6f9fc" font-size="14" font-weight="700">2  Recompute</text><text x="356" y="459" fill="#a9bdd0" font-size="13">Every indicator from scratch</text><path d="M584 442h22" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="610" y="410" width="240" height="64" rx="10" fill="#263e5b" stroke="#75a8d5"/><text x="626" y="436" fill="#f6f9fc" font-size="14" font-weight="700">3  Vote</text><text x="626" y="459" fill="#a9bdd0" font-size="13">Bias leans up, down or no call</text><path d="M854 442h22" stroke="#90adc2" stroke-width="1.7" marker-end="url(#a)"/><rect x="880" y="410" width="240" height="64" rx="10" fill="#263e5b" stroke="#e3ad5a"/><text x="896" y="436" fill="#f6f9fc" font-size="14" font-weight="700">4  Score</text><text x="896" y="459" fill="#a9bdd0" font-size="13">Next open (gap) and next close</text><text x="70" y="510" fill="#a9bdd0" font-size="14">Repeat for every i from session 35 (when MACD exists) to the second-last bar: 84 calls from 120 sessions.</text>
  </g>
</svg>
