<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Revenue Anthropic would need at peer multiples</title>
  <desc id="desc">Horizontal bars of the revenue that would justify a 1.75 trillion dollar valuation at each peer’s price-to-sales multiple: Amazon 515 billion dollars, Meta 266, TSMC 147, Tesla 114, Broadcom 98 and SpaceX 29. Dashed lines mark Anthropic’s trailing revenue of 35.3 billion and its third quarter annualised of 67.8 billion.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient></defs>
  <rect width="1200" height="600" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="40.0" y="56.0" fill="#f6f9fc" font-size="28" font-weight="700">What Anthropic would need to earn to look like its peers</text><text x="40.0" y="85.0" fill="#a9bdd0" font-size="16">Revenue that would justify $1.75T at each company’s current market cap ÷ trailing revenue.</text><line x1="230.0" y1="148" x2="230.0" y2="472" stroke="#26394d"/><text x="230.0" y="490.0" fill="#8fa6ba" font-size="12" text-anchor="middle">$0B</text><line x1="383.6" y1="148" x2="383.6" y2="472" stroke="#26394d"/><text x="383.6" y="490.0" fill="#8fa6ba" font-size="12" text-anchor="middle">$100B</text><line x1="537.1" y1="148" x2="537.1" y2="472" stroke="#26394d"/><text x="537.1" y="490.0" fill="#8fa6ba" font-size="12" text-anchor="middle">$200B</text><line x1="690.7" y1="148" x2="690.7" y2="472" stroke="#26394d"/><text x="690.7" y="490.0" fill="#8fa6ba" font-size="12" text-anchor="middle">$300B</text><line x1="844.3" y1="148" x2="844.3" y2="472" stroke="#26394d"/><text x="844.3" y="490.0" fill="#8fa6ba" font-size="12" text-anchor="middle">$400B</text><line x1="997.9" y1="148" x2="997.9" y2="472" stroke="#26394d"/><text x="997.9" y="490.0" fill="#8fa6ba" font-size="12" text-anchor="middle">$500B</text><line x1="284.2" y1="140" x2="284.2" y2="472" stroke="#d95926" stroke-width="2" stroke-dasharray="6 4"/><line x1="334.2" y1="140" x2="334.2" y2="472" stroke="#d95926" stroke-width="2" stroke-dasharray="6 4"/><text x="278.2" y="134.0" fill="#f3c3ac" font-size="13" text-anchor="end">Anthropic trailing $35.3B</text><text x="340.2" y="134.0" fill="#f3c3ac" font-size="13">Q3 × 4 = $67.8B</text><text x="40.0" y="182.0" fill="#fff" font-size="15" font-weight="700">Amazon</text><text x="40.0" y="200.0" fill="#8fa6ba" font-size="13">at 3.4×</text><path d="M230.0,166.0 h786.8 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-786.8 z" fill="#3987e5"/><text x="1010.8" y="183.0" fill="#0b1522" font-size="13" font-weight="700" text-anchor="end">$515B · 14.6× today’s trailing</text><text x="40.0" y="234.0" fill="#fff" font-size="15" font-weight="700">Meta</text><text x="40.0" y="252.0" fill="#8fa6ba" font-size="13">at 6.6×</text><path d="M230.0,218.0 h404.4 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-404.4 z" fill="#3987e5"/><text x="648.4" y="235.0" fill="#d7e3ef" font-size="13">$266B · 7.5× today’s trailing</text><text x="40.0" y="286.0" fill="#fff" font-size="15" font-weight="700">TSMC</text><text x="40.0" y="304.0" fill="#8fa6ba" font-size="13">at 11.9×</text><path d="M230.0,270.0 h222.5 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-222.5 z" fill="#3987e5"/><text x="466.5" y="287.0" fill="#d7e3ef" font-size="13">$148B · 4.2× today’s trailing</text><text x="40.0" y="338.0" fill="#fff" font-size="15" font-weight="700">Tesla</text><text x="40.0" y="356.0" fill="#8fa6ba" font-size="13">at 15.3×</text><path d="M230.0,322.0 h172.2 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-172.2 z" fill="#3987e5"/><text x="416.2" y="339.0" fill="#d7e3ef" font-size="13">$115B · 3.2× today’s trailing</text><text x="40.0" y="390.0" fill="#fff" font-size="15" font-weight="700">Broadcom</text><text x="40.0" y="408.0" fill="#8fa6ba" font-size="13">at 17.8×</text><path d="M230.0,374.0 h146.6 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-146.6 z" fill="#3987e5"/><text x="390.6" y="391.0" fill="#d7e3ef" font-size="13">$98B · 2.8× today’s trailing</text><text x="40.0" y="442.0" fill="#fff" font-size="15" font-weight="700">SpaceX</text><text x="40.0" y="460.0" fill="#8fa6ba" font-size="13">at 59.9×</text><path d="M230.0,426.0 h40.8 a4,4 0 0 1 4,4 v16.0 a4,4 0 0 1 -4,4 h-40.8 z" fill="#3987e5"/><text x="344.2" y="443.0" fill="#d7e3ef" font-size="13">$29B · 0.8× today’s trailing</text><text x="40.0" y="528.0" fill="#c8dbee" font-size="14">Read: to be valued like Amazon on sales, Anthropic would need about 15 times its current trailing revenue. Only SpaceX’s multiple</text><text x="40.0" y="550.0" fill="#c8dbee" font-size="14">is higher than Anthropic’s, and SpaceX sells launches and Starlink plus, since its merger, xAI.</text>
  </g>
</svg>
