<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Same prompt, five real answers, five layouts</title>
  <desc id="desc">Dot plot of assistant message height in pixels for five recorded real answers per prompt. SOL price: 331 to 513 px, 1.55 times. Buy 2 SOL: 286 to 413 px, 1.44 times. Compare table: 623 to 917 px, 1.47 times. Funding rates: 290 to 420 px, 1.45 times. A scripted answer has one height every run.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Same prompt, five real answers, five layouts</text><text x="45" y="85" fill="#a9bdd0" font-size="16">Height of the assistant message in the mock's chat column (px) for each recorded Sonnet 5.5 answer, replayed through the fixture.</text><line x1="330" y1="120" x2="330" y2="400" stroke="#22344a"/><text x="330" y="420" fill="#6f8aa3" font-size="12" text-anchor="middle">0 px</text><line x1="512.5" y1="120" x2="512.5" y2="400" stroke="#22344a"/><text x="512.5" y="420" fill="#6f8aa3" font-size="12" text-anchor="middle">250 px</text><line x1="695" y1="120" x2="695" y2="400" stroke="#22344a"/><text x="695" y="420" fill="#6f8aa3" font-size="12" text-anchor="middle">500 px</text><line x1="877.5" y1="120" x2="877.5" y2="400" stroke="#22344a"/><text x="877.5" y="420" fill="#6f8aa3" font-size="12" text-anchor="middle">750 px</text><line x1="1060" y1="120" x2="1060" y2="400" stroke="#22344a"/><text x="1060" y="420" fill="#6f8aa3" font-size="12" text-anchor="middle">1000 px</text><text x="45" y="154" fill="#f6f9fc" font-size="15" font-weight="700">SOL price and why it moved</text><text x="45" y="173" fill="#6f8aa3" font-size="12">331–513 px · 1.55× · 950–1,416 chars</text><rect x="571.63" y="144" width="132.86" height="12" rx="6" fill="#8a7fe0" fill-opacity="0.25"/><circle cx="573.09" cy="150" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="573.09" cy="150" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="689.89" cy="150" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="571.63" cy="150" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="704.49" cy="150" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><text x="718.49" y="155" fill="#f6f9fc" font-size="14" font-weight="700">1.55×</text><text x="45" y="220" fill="#f6f9fc" font-size="15" font-weight="700">Buy 2 SOL at market</text><text x="45" y="239" fill="#6f8aa3" font-size="12">286–413 px · 1.44× · 685–1,039 chars</text><rect x="538.78" y="210" width="92.71000000000004" height="12" rx="6" fill="#8a7fe0" fill-opacity="0.25"/><circle cx="613.24" cy="216" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="571.63" cy="216" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="631.49" cy="216" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="538.78" cy="216" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="538.78" cy="216" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><text x="645.49" y="221" fill="#f6f9fc" font-size="14" font-weight="700">1.44×</text><text x="45" y="286" fill="#f6f9fc" font-size="15" font-weight="700">Compare SOL, ETH, BTC (table)</text><text x="45" y="305" fill="#6f8aa3" font-size="12">623–917 px · 1.47× · 1,656–2,357 chars</text><rect x="784.79" y="276" width="214.62000000000012" height="12" rx="6" fill="#8a7fe0" fill-opacity="0.25"/><circle cx="925.68" cy="282" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="999.4100000000001" cy="282" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="784.79" cy="282" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="857.79" cy="282" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="809.61" cy="282" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><text x="1013.4100000000001" y="287" fill="#f6f9fc" font-size="14" font-weight="700">1.47×</text><text x="45" y="352" fill="#f6f9fc" font-size="15" font-weight="700">Explain funding rates</text><text x="45" y="371" fill="#6f8aa3" font-size="12">290–420 px · 1.45× · 1,011–1,328 chars</text><rect x="541.7" y="342" width="94.89999999999986" height="12" rx="6" fill="#8a7fe0" fill-opacity="0.25"/><circle cx="597.91" cy="348" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="586.23" cy="348" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="541.7" cy="348" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="636.5999999999999" cy="348" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><circle cx="619.08" cy="348" r="7" fill="#8a7fe0" stroke="#101c2c" stroke-width="2"/><text x="650.5999999999999" y="353" fill="#f6f9fc" font-size="14" font-weight="700">1.45×</text><text x="45" y="455" fill="#f6f9fc" font-size="13.5">A scripted answer has one height, every run. That is what you want for screenshots and visual review. The spread above is what the design must still survive in production,</text><text x="45" y="476" fill="#f6f9fc" font-size="13.5">which is why recording a handful of real answers and replaying them as fixtures is the useful middle ground.</text>
  </g>
</svg>
