<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">The paradox of supervision</title>
  <desc id="desc">A loop of four steps: lean on the agent more, practise the craft less, skills quietly weaken, supervise worse and trust more, which leads back to leaning on the agent more. Beside it, ways to break the loop: build something without the agent each week, take a monthly inventory of what you stopped doing, ask the agent to explain rather than generate when learning, and rebuild understanding of a module on demand.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#e06c6c" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
    <text x="45" y="56" fill="#f6f9fc" font-size="28" font-weight="700">The paradox of supervision</text>
    <text x="45" y="85" fill="#a9bdd0" font-size="16">The skills you need to supervise an agent are the ones heavy use wears down.</text>

    <g font-size="15" text-anchor="middle" fill="#fff">
      <rect x="330" y="135" width="200" height="50" rx="12" fill="#2c2f4f" stroke="#a99bf0" stroke-width="2"/>
      <text x="430" y="165">Lean on the agent more</text>
      <rect x="560" y="255" width="200" height="50" rx="12" fill="#3a2428" stroke="#d08a8a" stroke-width="2"/>
      <text x="660" y="285">Practise the craft less</text>
      <rect x="330" y="375" width="200" height="50" rx="12" fill="#3a2428" stroke="#d08a8a" stroke-width="2"/>
      <text x="430" y="405">Skills quietly weaken</text>
      <rect x="100" y="255" width="200" height="50" rx="12" fill="#3a2428" stroke="#d08a8a" stroke-width="2"/>
      <text x="200" y="279">Supervise worse,</text>
      <text x="200" y="297">trust more</text>
    </g>
    <g stroke="#e06c6c" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M532 168 Q 625 180 652 251"/>
      <path d="M652 309 Q 625 382 535 395"/>
      <path d="M326 395 Q 235 382 208 309"/>
      <path d="M208 251 Q 235 180 326 165"/>
    </g>
    <text x="430" y="275" fill="#f0a0a0" font-size="15" text-anchor="middle" font-style="italic">the loop</text>
    <text x="430" y="295" fill="#f0a0a0" font-size="15" text-anchor="middle" font-style="italic">feeds itself</text>

    <rect x="800" y="120" width="355" height="305" rx="18" fill="#1b2e22" stroke="#8fd16a" stroke-opacity=".7"/>
    <text x="825" y="156" fill="#fff" font-size="20" font-weight="700">Break the loop</text>
    <text x="825" y="180" fill="#a6e07f" font-size="14">practise on purpose, not by accident</text>
    <g font-size="14" fill="#d3ecc2">
      <text x="825" y="218">• Weekly: build something with the</text>
      <text x="839" y="237">agent closed</text>
      <text x="825" y="267">• Monthly: list what you stopped doing</text>
      <text x="839" y="286">and decide if you can afford to lose it</text>
      <text x="825" y="316">• When learning, ask it to explain</text>
      <text x="839" y="335">before you ask it to generate</text>
      <text x="825" y="365">• Rebuild understanding on demand:</text>
      <text x="839" y="384">have it walk you through a module,</text>
      <text x="839" y="403">once you know where your blind spot is</text>
    </g>
  </g>
</svg>
