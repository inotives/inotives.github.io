<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Data health gate rejection and replay loop</title>
  <desc id="desc">A dark control-loop diagram showing an incoming batch, manifest, validation failure, quarantine, investigation, correction, replay, and idempotent promotion into trusted data.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker>
    <style>.bg{fill:#0b1220}.box{fill:#17263b;stroke:#587692;stroke-width:2}.bad{fill:#30202b;stroke:#df7b86;stroke-width:2}.control{fill:#332b1d;stroke:#e2b866;stroke-width:2}.ok{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.fail{stroke:#df7b86;stroke-width:3;fill:none;marker-end:url(#arrow)}.yellow{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#7d6fae;stroke-width:2;fill:none;stroke-dasharray:8 8;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1600" height="760"/><text class="text" x="65" y="68" font-size="36" font-weight="700">Failure is a state, not a dead end</text><text class="small" x="65" y="103">Keep the evidence, fix the cause, and replay the same batch without duplicating trusted records.</text>
  <rect class="box" x="75" y="260" width="215" height="125" rx="16"/><text class="label" x="105" y="300">ARRIVAL</text><text class="text" x="105" y="340">Batch lands</text><text class="small" x="105" y="368">source files + ID</text>
  <rect class="control" x="365" y="260" width="215" height="125" rx="16"/><text class="label" x="395" y="300">RECORD</text><text class="text" x="395" y="340">Manifest created</text><text class="small" x="395" y="368">pending validation</text>
  <rect class="bad" x="655" y="260" width="215" height="125" rx="16"/><text class="label" x="685" y="300">FAILURE</text><text class="text" x="685" y="340">Gate rejects</text><text class="small" x="685" y="368">error and rule ID</text>
  <rect class="bad" x="945" y="260" width="215" height="125" rx="16"/><text class="label" x="975" y="300">EVIDENCE</text><text class="text" x="975" y="340">Quarantine</text><text class="small" x="975" y="368">files + report + logs</text>
  <rect class="control" x="1235" y="260" width="290" height="125" rx="16"/><text class="label" x="1265" y="300">OPERATE</text><text class="text" x="1265" y="340">Investigate and correct</text><text class="small" x="1265" y="368">owner + action + decision</text>
  <path class="line" d="M290 322 L365 322"/><path class="line" d="M580 322 L655 322"/><path class="fail" d="M870 322 L945 322"/><path class="fail" d="M1160 322 L1235 322"/>
  <rect class="box" x="365" y="535" width="215" height="125" rx="16"/><text class="label" x="395" y="575">REPLAY</text><text class="text" x="395" y="615">Run same batch</text><text class="small" x="395" y="643">same ID, new attempt</text>
  <rect class="ok" x="655" y="535" width="215" height="125" rx="16"/><text class="label" x="685" y="575">PROMOTE</text><text class="text" x="685" y="615">Trusted landing</text><text class="small" x="685" y="643">Bronze or warehouse</text>
  <rect class="control" x="945" y="535" width="215" height="125" rx="16"/><text class="label" x="975" y="575">PROTECT</text><text class="text" x="975" y="615">Idempotency check</text><text class="small" x="975" y="643">no duplicate batch</text>
  <path class="yellow" d="M1380 385 C1380 480 470 470 470 535"/><path class="line" d="M580 597 L655 597"/><path class="line" d="M870 597 L945 597"/><path class="dash" d="M1050 535 C1050 470 760 465 760 385"/><text class="small" x="1120" y="480">already accepted?</text>
  <rect class="box" x="75" y="690" width="1450" height="45" rx="12"/><text class="small" x="105" y="720">The manifest is the control record: pending → validating → quarantined or accepted → replayed/closed.</text>
</svg>
