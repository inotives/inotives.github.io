<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Revenue multiples before and after the amendment</title>
  <desc id="desc">A dumbbell chart of revenue multiples at a 1.5 or 2 trillion dollar valuation. On trailing twelve-month revenue the multiple falls from 76 to 42 times at 1.5 trillion and from 101 to 57 times at 2 trillion. On the latest quarter annualized it falls from 32 to 22 and from 43 to 30 times. A side panel lists factors that support the range and factors that weigh on it.</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#2a3a4d"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8fa6ba" stroke-width="3"/></pattern></defs>
  <rect width="1200" height="590" rx="24" fill="url(#bg)"/>
  <g font-family="system-ui,sans-serif">
<text x="40" y="56" fill="#f6f9fc" font-size="28" font-weight="700">Same price tag, cheaper on paper</text><text x="40" y="85" fill="#a9bdd0" font-size="16">Revenue multiple at the reported $1.5T to $2T target, before and after the Q3 numbers.</text><circle cx="52" cy="128" r="6" fill="none" stroke="#9fb3c7" stroke-width="2"/><text x="64" y="133" fill="#d7e3ef" font-size="13">S-1 (to June 30)</text><circle cx="212" cy="128" r="6" fill="#3987e5"/><text x="224" y="133" fill="#d7e3ef" font-size="13">S-1/A (to Sept 30)</text><line x1="330.0" y1="160" x2="330.0" y2="420" stroke="#26394d"/><text x="330.0" y="440" fill="#8fa6ba" font-size="12" text-anchor="middle">0×</text><line x1="416.4" y1="160" x2="416.4" y2="420" stroke="#26394d"/><text x="416.3636363636364" y="440" fill="#8fa6ba" font-size="12" text-anchor="middle">25×</text><line x1="502.7" y1="160" x2="502.7" y2="420" stroke="#26394d"/><text x="502.72727272727275" y="440" fill="#8fa6ba" font-size="12" text-anchor="middle">50×</text><line x1="589.1" y1="160" x2="589.1" y2="420" stroke="#26394d"/><text x="589.090909090909" y="440" fill="#8fa6ba" font-size="12" text-anchor="middle">75×</text><line x1="675.5" y1="160" x2="675.5" y2="420" stroke="#26394d"/><text x="675.4545454545455" y="440" fill="#8fa6ba" font-size="12" text-anchor="middle">100×</text><text x="40" y="195" fill="#e6eef6" font-size="14">$1.5T ÷ trailing 12-month revenue</text><line x1="484.8" y1="190" x2="584.9" y2="190" stroke="#5a7389" stroke-width="2"/><circle cx="592.9" cy="190" r="7" fill="#0f1c2c" stroke="#9fb3c7" stroke-width="2"/><circle cx="476.8" cy="190" r="8" fill="#3987e5"/><text x="476.8181818181818" y="176" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">42×</text><text x="592.8909090909091" y="176" fill="#9fb3c7" font-size="13" text-anchor="middle">76×</text><text x="40" y="257" fill="#e6eef6" font-size="14">$2T ÷ trailing 12-month revenue</text><line x1="533.9" y1="252" x2="672.6" y2="252" stroke="#5a7389" stroke-width="2"/><circle cx="680.6" cy="252" r="7" fill="#0f1c2c" stroke="#9fb3c7" stroke-width="2"/><circle cx="525.9" cy="252" r="8" fill="#3987e5"/><text x="525.8727272727273" y="238" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">57×</text><text x="680.6363636363636" y="238" fill="#9fb3c7" font-size="13" text-anchor="middle">102×</text><text x="40" y="319" fill="#e6eef6" font-size="14">$1.5T ÷ latest quarter × 4</text><line x1="414.3" y1="314" x2="433.9" y2="314" stroke="#5a7389" stroke-width="2"/><circle cx="441.9" cy="314" r="7" fill="#0f1c2c" stroke="#9fb3c7" stroke-width="2"/><circle cx="406.3" cy="314" r="8" fill="#3987e5"/><text x="406.3454545454546" y="300" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">22×</text><text x="441.92727272727274" y="300" fill="#9fb3c7" font-size="13" text-anchor="middle">32×</text><text x="40" y="381" fill="#e6eef6" font-size="14">$2T ÷ latest quarter × 4</text><line x1="439.9" y1="376" x2="471.2" y2="376" stroke="#5a7389" stroke-width="2"/><circle cx="479.2" cy="376" r="7" fill="#0f1c2c" stroke="#9fb3c7" stroke-width="2"/><circle cx="431.9" cy="376" r="8" fill="#3987e5"/><text x="431.9090909090909" y="362" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">30×</text><text x="479.23636363636365" y="362" fill="#9fb3c7" font-size="13" text-anchor="middle">43×</text><text x="40" y="474" fill="#a9bdd0" font-size="13">Trailing revenue: $19.7B → $35.3B. Latest quarter × 4: $46.3B → $67.8B.</text><text x="40" y="494" fill="#a9bdd0" font-size="13">Share base unchanged at about 16.94B: $1.5T ≈ $88.55 a share, $2T ≈ $118.06.</text><rect x="760" y="150" width="400" height="360" rx="14" fill="#16222f" stroke="#3e5468"/><text x="780" y="180" fill="#7fd99a" font-size="15" font-weight="700">Supports the range</text><text x="780" y="208" fill="#cfe9d6" font-size="13">▲ Q3 revenue $17.0B, +1,127% y/y</text><text x="780" y="232" fill="#cfe9d6" font-size="13">▲ Adjusted operating income $2.5B</text><text x="780" y="256" fill="#cfe9d6" font-size="13">▲ 11,900+ customers over $100k a year</text><text x="780" y="280" fill="#cfe9d6" font-size="13">▲ Cash flat at $131.8B after Q3</text><text x="780" y="326" fill="#f0a07a" font-size="15" font-weight="700">Weighs on it</text><text x="780" y="354" fill="#f3d2c5" font-size="13">▼ Growth slowed: +147% → +46% q/q</text><text x="780" y="378" fill="#f3d2c5" font-size="13">▼ GAAP operating loss again in Q3</text><text x="780" y="402" fill="#f3d2c5" font-size="13">▼ $895.4B committed; $69.8B due in a year</text><text x="780" y="426" fill="#f3d2c5" font-size="13">▼ Pricier short-term compute to grow</text><text x="780" y="450" fill="#f3d2c5" font-size="13">▼ New AI R&amp;D threshold risk sentence</text><text x="40" y="560" fill="#8fa6ba" font-size="13">My calculation from the filings, not a forecast or investment advice. The $1.5T to $2T target is from press reports; no price range has been filed.</text>
  </g>
</svg>
