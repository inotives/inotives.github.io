<title>D3 in 3D</title>
<!--
  Playground mock: four 3D charts where D3 does the data work and Three.js does the drawing.
  D3 supplies scales, ticks, color scales, the graticule, the map projection and the Sankey layout;
  Three.js turns those numbers into geometry. UI recreates shadcn/ui in Tailwind with the inoTives brand kit.
  Views: population by age from 1950 to 2100 (a Lexis surface), the US Treasury yield curve stacked month by month, a live BTC/ETH options volatility surface, and a world map of
  2026 GDP with a Sankey of GDP by sector flowing into each country's bar.
  GDP figures: IMF World Economic Outlook, October 2026 (projections for 2026, nominal US$).
  Sector shares: approximate, from World Bank value-added shares (latest available year), scaled to 100%.
  Yield curves: US Treasury daily par yield curve rates (real). Vol surface: Deribit public API, live,
  with a saved snapshot as fallback. Population: UN World Population Prospects 2024.
-->

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const B = { paper: '#15171b', raise: '#1d2026', muted: '#23262d', line: '#2b2f37', ink: '#e4e1d8', ink2: '#b8b5ac', fog: '#8b9099', signal: '#1fefd7', amber: '#f6c453' };

const rnd = d3.randomLcg(11), gauss = d3.randomNormal.source(rnd)(0, 1);
const tn = (v) => (v >= 1 ? `$${v.toFixed(2)}T` : `$${Math.round(v * 1000)}B`);

// ================= stage =================
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer(); labelR.domElement.className = 'labels'; stage.appendChild(labelR.domElement);

scene.fog = new THREE.Fog(B.paper, 34, 80);
scene.add(new THREE.HemisphereLight('#cfe9ff', B.paper, 1.15));
const key = new THREE.DirectionalLight('#ffffff', 1.5); key.position.set(-8, 14, 10); scene.add(key);
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 5; controls.maxDistance = 70; controls.autoRotateSpeed = 0.45;
controls.addEventListener('start', () => { controls.autoRotate = false; });
let group = new THREE.Group(); scene.add(group);
let pickables = [], tickers = [];

function lbl(text, pos, cls = '', parent = group) { const d = document.createElement('div'); d.className = `lbl ${cls}`; d.textContent = text; const o = new CSS2DObject(d); o.position.copy(pos); parent.add(o); return o; }
function clearScene() {
  group.traverse((o) => {
    o.geometry?.dispose();
    (Array.isArray(o.material) ? o.material : o.material ? [o.material] : []).forEach((m) => { m.map?.dispose(); m.dispose(); });
    if (o.isCSS2DObject) o.element.remove();
  });
  scene.remove(group); group = new THREE.Group(); scene.add(group);
  pickables = []; tickers = [];
}
const solid = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.1, ...o });
const lineMat = (color, opacity = 1) => new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity });
const polyline = (pts, color, opacity) => new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(color, opacity));
const segments = (pairs, color, opacity) => new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pairs), lineMat(color, opacity));

// A D3-scaled 3D frame: floor, back wall and side wall with gridlines at d3 ticks.
// sx, sy, sz map data to world; the box spans their ranges.
function frame3D({ sx, sy, sz, names, fmt = {} }) {
  const [x0, x1] = sx.range(), [y0, y1] = sy.range(), [z0, z1] = sz.range();
  const g = new THREE.Group();
  const pairs = [];
  const tx = (sx.ticks ? sx.ticks(6) : sx.domain()), ty = sy.ticks(5), tz = sz.ticks(5);
  tx.forEach((t) => { const x = sx(t); pairs.push(new THREE.Vector3(x, y0, z0), new THREE.Vector3(x, y1, z0), new THREE.Vector3(x, y0, z0), new THREE.Vector3(x, y0, z1)); });
  ty.forEach((t) => { const y = sy(t); pairs.push(new THREE.Vector3(x0, y, z0), new THREE.Vector3(x1, y, z0), new THREE.Vector3(x0, y, z0), new THREE.Vector3(x0, y, z1)); });
  tz.forEach((t) => { const z = sz(t); pairs.push(new THREE.Vector3(x0, y0, z), new THREE.Vector3(x1, y0, z), new THREE.Vector3(x0, y0, z), new THREE.Vector3(x0, y1, z)); });
  g.add(segments(pairs, B.line, 0.9));
  const walls = [[x1 - x0, y1 - y0, [(x0 + x1) / 2, (y0 + y1) / 2, z0], [0, 0, 0]], [x1 - x0, z1 - z0, [(x0 + x1) / 2, y0, (z0 + z1) / 2], [-Math.PI / 2, 0, 0]], [z1 - z0, y1 - y0, [x0, (y0 + y1) / 2, (z0 + z1) / 2], [0, Math.PI / 2, 0]]];
  walls.forEach(([w, h, p, r]) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: B.raise, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false })); m.position.set(...p); m.rotation.set(...r); g.add(m); });
  const f = (k) => fmt[k] ?? ((v) => d3.format('~s')(v));
  tx.forEach((t) => lbl(f('x')(t), new THREE.Vector3(sx(t), y0 - 0.25, z1 + 0.25), '', g));
  ty.forEach((t) => lbl(f('y')(t), new THREE.Vector3(x0 - 0.35, sy(t), z1), '', g));
  tz.forEach((t) => lbl(f('z')(t), new THREE.Vector3(x1 + 0.35, y0, sz(t)), '', g));
  lbl(names.x, new THREE.Vector3((x0 + x1) / 2, y0 - 0.7, z1 + 0.5), 'strong', g);
  lbl(names.y, new THREE.Vector3(x0 - 0.4, y1 + 0.45, z0), 'strong', g);
  lbl(names.z, new THREE.Vector3(x1 + 0.9, y0, (z0 + z1) / 2), 'strong', g);
  group.add(g);
}

function ivAt(pts, x) {

      const w = n.y1 - n.y0, h = n.x1 - n.x0;
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.12), solid(isC ? B.ink2 : n.color, { transparent: !!dim, opacity: dim ? 0.3 : 1 }));
      m.position.copy(P((n.x0 + n.x1) / 2, (n.y0 + n.y1) / 2));
      m.userData = isC ? { country: n.id, html: countryTip(n.c) } : { sector: n.id, html: `<div class="font-medium">${n.id}</div><div class="font-mono">${tn(n.value)} · ${((n.value / total) * 100).toFixed(1)}% of the top 20</div><div class="mt-1 text-muted-foreground">Click to highlight</div>` };
      group.add(m); pickables.push(m);
      if (!isC) {
        const o = lbl(`${n.id} ${tn(n.value)}`, P(n.x0 - (n.id === 'Agriculture' ? 0.75 : 0.3), (n.y0 + n.y1) / 2), 'strong bg');
        o.element.style.color = n.color;
        if (dim) o.element.style.opacity = '0.45';
      }
      // drop ribbon from the country node down into its bar
      if (isC) {
        const top = barTop.get(n.id), a = P(n.x1, (n.y0 + n.y1) / 2);
        const curve = new THREE.CubicBezierCurve3(a, new THREE.Vector3(a.x, a.y - 1.6, a.z), new THREE.Vector3(top.x, top.y + 1.4, top.z), top);
        group.add(ribbonAlong(curve, [Math.max(0.04, w * 0.9), bw], dim ? B.line : B.fog, dim ? 0.12 : 0.3, n.id));
      }
    });
    graph.links.forEach((l) => {
      const dim = (state.country && l.target.id !== state.country) || (sec && l.source.id !== sec.name);
      const x0 = l.source.x1, x1 = l.target.x0, xm = (x0 + x1) / 2;
      const curve = new THREE.CubicBezierCurve3(P(x0, l.y0), P(xm, l.y0), P(xm, l.y1), P(x1, l.y1));
      const rib = ribbonAlong(curve, l.width, l.sector.color, dim ? 0.06 : state.country || sec ? 0.8 : 0.42, l.target.id);
      rib.userData = { country: l.target.id, html: `<div class="font-medium">${l.sector.name} → ${esc(l.target.id)}</div><div class="font-mono">${tn(l.value)} · ${((l.value / l.target.c.gdp) * 100).toFixed(0)}% of its GDP</div>` };
      group.add(rib); pickables.push(rib);
    });
    lbl(`Top 20 economies · ${tn(total)} combined`, new THREE.Vector3(-SW / 4, ybase + SH + 0.75, ztop), 'strong bg');
  },
  controls() {
    const sec = state.sector ? SECT.find((s) => s.name === state.sector) : null;
    const si = sec ? shareIdx[sec.name] : -1;
    const val = (c) => (sec ? c.gdp * c.share[si] : c.gdp);
    const rows = sec ? [...GDP].sort((a, b) => val(b) - val(a)) : GDP;
    const max = d3.max(rows, val), secTotal = sec ? d3.sum(GDP, val) : 0;
    const topShare = sec ? [...GDP].sort((a, b) => b.share[si] - a.share[si])[0] : null;
    return `<div>
      <p class="mb-1.5 text-xs text-muted-foreground">Sector</p>
      <div class="flex flex-wrap gap-1.5">${SECT.map((s) => `<button data-sector="${s.name}" aria-pressed="${state.sector === s.name}" class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-1 text-sm text-muted-foreground hover:bg-accent focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring aria-pressed:border-foreground/30 aria-pressed:bg-accent aria-pressed:text-foreground"><span class="size-2 rounded-sm" style="background:${s.color}"></span>${s.name}</button>`).join('')}</div>
      ${sec ? `<p class="mt-2 text-xs leading-relaxed text-ink-2"><span style="color:${sec.color}">${sec.name}</span> adds up to ${tn(secTotal)} across the top 20. The map is shaded by its share of each country’s GDP; ${esc(topShare.name)} leans on it most at ${Math.round(topShare.share[si] * 100)}%.</p>` : ''}
      <p class="mb-1.5 mt-4 text-xs text-muted-foreground">${sec ? `Ranked by ${sec.name.toLowerCase()} output` : 'Click a country to trace its flows'}</p>
      <ol class="max-h-64 space-y-0.5 overflow-auto pr-1 scroll-thin">${rows.map((c, i) => `<li><button data-country="${esc(c.name)}" aria-pressed="${state.country === c.name}" class="grid w-full grid-cols-[18px_1fr_auto] items-center gap-2 rounded-md px-2 py-1 text-left text-sm hover:bg-accent focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring aria-pressed:bg-amber/10 aria-pressed:text-amber">
        <span class="font-mono text-[11px] text-muted-foreground">${i + 1}</span>
        <span class="min-w-0"><span class="block truncate">${esc(c.name)}</span>${sec
          ? `<span class="mt-1 block h-1.5 rounded-full" style="width:${(val(c) / max) * 100}%;background:${sec.color}"></span>`
          : `<span class="mt-1 flex h-1.5 overflow-hidden rounded-full bg-muted" style="width:${(c.gdp / max) * 100}%">${[2, 1, 0].map((k) => `<span style="width:${c.share[k] * 100}%;background:${SECT[2 - k].color}"></span>`).join('')}</span>`}</span>
        <span class="text-right font-mono text-xs">${tn(val(c))}${sec ? `<span class="block text-[10.5px] text-muted-foreground">${Math.round(c.share[si] * 100)}% of GDP</span>` : ''}</span></button></li>`).join('')}</ol>
      <div class="mt-3 rounded-lg border bg-background/60 p-3 text-xs leading-relaxed text-muted-foreground">
        <p><span class="text-foreground">GDP:</span> IMF World Economic Outlook, October 2026, projections for 2026 in current US$ (<a class="text-primary hover:underline" href="https://www.imf.org/en/publications/weo/issues/2026/10/13/world-economic-outlook-october-2026" target="_blank" rel="noopener noreferrer">IMF</a>, table via <a class="text-primary hover:underline" href="https://www.worldometers.info/gdp/gdp-by-country/?region=worldwide&year=2026&metric=nominal" target="_blank" rel="noopener noreferrer">Worldometer</a>).</p>
        <p class="mt-1.5"><span class="text-foreground">Sector split:</span> approximate shares from World Bank value added by sector (latest available year, <a class="text-primary hover:underline" href="https://data.worldbank.org/indicator/NV.SRV.TOTL.ZS" target="_blank" rel="noopener noreferrer">WDI</a>), scaled to 100%, applied to 2026 GDP. Illustrative, not an official breakdown.</p>
      </div></div>`;
  },
};
function countryTip(c) {
  return `<div class="font-medium">${esc(c.name)}</div><div class="font-mono">${tn(c.gdp)} · growth ${d3.format('+.2f')(c.growth)}%</div>${SECT.map((s) => `<div class="flex items-center gap-2 font-mono"><span class="size-2 rounded-sm" style="background:${s.color}"></span>${s.name}<span class="ml-auto pl-3">${tn(c.gdp * c.share[shareIdx[s.name]])}</span></div>`).join('')}`;
}
// A flat ribbon along a curve, always spanning world x (the Sankey plane's spread axis).
// width is a number, or [start, end] to taper, e.g. from a wide Sankey node into a thin bar.
function ribbonAlong(curve, width, color, opacity, country) {
  const [w0, w1] = Array.isArray(width) ? width : [width, width];
  const n = 48, pos = [], idx = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, p = curve.getPoint(t);
    const e = t * t * (3 - 2 * t), w = w0 + (w1 - w0) * e;
    pos.push(p.x - w / 2, p.y, p.z, p.x + w / 2, p.y, p.z);
    if (i < n) idx.push(2 * i, 2 * i + 1, 2 * i + 2, 2 * i + 1, 2 * i + 3, 2 * i + 2);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false }));
  m.userData.country = country;
  return m;
}

// ================= panel =================
const ORDER = ['gdp', 'pop', 'lines', 'vol'];
$('#tabs').innerHTML = ORDER.map((k) => `<button role="tab" data-tab="${k}" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all hover:text-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring data-[state=active]:bg-background data-[state=active]:text-foreground data-[state=active]:shadow"><i class="fi ${VIEWS[k].icon} text-xs"></i>${VIEWS[k].tab}</button>`).join('');
function renderPanel() {
  const v = VIEWS[state.view];
  $('#panel').innerHTML = `
    <h1 class="text-lg font-semibold leading-tight">${v.title}</h1>
    <p class="mt-1.5 text-sm leading-relaxed text-ink-2">${v.blurb}</p>
    <div class="mt-4">${v.controls()}</div>
    <div class="mt-4 space-y-2 border-t pt-3 text-sm">
      <p class="text-xs font-medium uppercase tracking-wider text-muted-foreground">How it’s built</p>
      <p class="flex gap-2 text-ink-2"><span class="mt-0.5 inline-flex h-5 shrink-0 items-center rounded bg-amber/15 px-1.5 font-mono text-[10.5px] text-amber">D3</span><span>${v.how[0]}</span></p>
      <p class="flex gap-2 text-ink-2"><span class="mt-0.5 inline-flex h-5 shrink-0 items-center rounded bg-primary/15 px-1.5 font-mono text-[10.5px] text-primary">Three.js</span><span>${v.how[1]}</span></p>
    </div>
    ${state.view === 'gdp' ? '' : `<p class="mt-3 text-xs text-muted-foreground"><i class="fi fi-rr-info mr-1 align-[-1px]"></i>${v.note ?? 'Mock data.'}</p>`}`;
}
let building = 0;
async function show(view, { keepCamera = false } = {}) {
  const ticket = ++building;
  state.view = view;
  document.querySelectorAll('[data-tab]').forEach((b) => { b.dataset.state = b.dataset.tab === view ? 'active' : ''; b.setAttribute('aria-selected', b.dataset.tab === view); });
  renderPanel();
  clearScene();
  const v = VIEWS[view];
  await v.build();
  if (ticket !== building) return;
  if (!keepCamera) { camera.position.set(...v.camera); controls.target.set(...v.target); controls.autoRotate = !reduceMotion && view !== 'gdp' && v.autoRotate !== false; }
  try { history.replaceState(null, '', `?view=${view}`); } catch { /* sandboxed */ }
}
$('#tabs').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b) show(b.dataset.tab); };
$('#panel').addEventListener('input', (e) => {
  if (e.target.id === 'yc-range') { if (ycTimer) ycPlay(); VIEWS.lines.select(+e.target.value); }
  if (e.target.id === 'pop-range') { if (popTimer) popPlay(); VIEWS.pop.select(+e.target.value); }
  if (e.target.id === 'vol-range') VIEWS.vol.select?.(+e.target.value);
});
$('#panel').addEventListener('click', (e) => {
  if (e.target.closest('#yc-play')) { ycPlay(); return; }
  const vc = e.target.closest('[data-vol-cur]');
  if (vc) { if (vc.dataset.volCur !== state.volCur) { state.volCur = vc.dataset.volCur; state.volExp = null; show('vol', { keepCamera: true }); } return; }
  if (e.target.closest('#vol-refresh')) { delete volCache[state.volCur]; show('vol', { keepCamera: true }); return; }
  if (e.target.closest('#pop-play')) { popPlay(); return; }
  const pl = e.target.closest('[data-pop-loc]');
  if (pl) { if (popTimer) popPlay(); state.popLoc = pl.dataset.popLoc; show('pop', { keepCamera: true }); return; }
  const c = e.target.closest('[data-country]'), sc = e.target.closest('[data-sector]');
  if (sc) { state.sector = state.sector === sc.dataset.sector ? null : sc.dataset.sector; state.country = null; show('gdp', { keepCamera: true }); }
  if (c) { state.country = state.country === c.dataset.country ? null : c.dataset.country; state.sector = null; show('gdp', { keepCamera: true }); }
});

// ================= hover and click =================
const tip = $('#tip'), ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let hover = null;
const glow = (o, on) => { if (o?.material?.emissive && !o.userData.pts && !o.userData.pick) o.material.emissive.set(on ? '#3a3220' : '#000000'); };
function pickAt(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(pickables, false)[0];
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const hit = pickAt(ev), obj = hit?.object ?? null;
  if (hover !== obj) { glow(hover, false); glow(obj, true); hover = obj; }
  renderer.domElement.style.cursor = obj?.userData.country || obj?.userData.sector ? 'pointer' : '';
  if (!hit) { tip.hidden = true; return; }
  tip.innerHTML = obj.userData.pick ? obj.userData.pick(hit) : obj.userData.html;
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = `${ev.clientX + 14 + w > innerWidth ? ev.clientX - w - 14 : ev.clientX + 14}px`;
  tip.style.top = `${ev.clientY + 14 + h > innerHeight ? ev.clientY - h - 14 : ev.clientY + 14}px`;
});
renderer.domElement.addEventListener('pointerleave', () => { glow(hover, false); hover = null; tip.hidden = true; });
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  if (state.view === 'lines') { const h = pickAt(e); if (h?.object.userData.monthAt) { if (ycTimer) ycPlay(); VIEWS.lines.select(h.object.userData.monthAt(h)); } return; }
  if (state.view === 'pop') { const h = pickAt(e); if (h?.object.userData.yearAt) { if (popTimer) popPlay(); VIEWS.pop.select(h.object.userData.yearAt(h)); } return; }
  if (state.view === 'vol') { const h = pickAt(e); if (h?.object.userData.rowAt) VIEWS.vol.select(h.object.userData.rowAt(h)); return; }
  if (state.view !== 'gdp') return;
  const ud = pickAt(e)?.object.userData ?? {};
  if (ud.sector) { state.sector = ud.sector === state.sector ? null : ud.sector; state.country = null; }
  else { state.country = ud.country && ud.country !== state.country ? ud.country : null; state.sector = null; }
  show('gdp', { keepCamera: true });
});

// ================= loop =================
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h; camera.fov = w < 700 ? 50 : 34;
  if (w >= 900) camera.setViewOffset(w, h, -185, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); labelR.render(scene, camera); });
const initial = new URLSearchParams(location.search).get('view');
document.fonts.ready.then(() => show(ORDER.includes(initial) ? initial : 'gdp'));
</script>
</body>
</html>
