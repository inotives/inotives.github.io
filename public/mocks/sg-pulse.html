<title>Singapore Pulse</title>
<!--
  Playground mock: Singapore's live government data on a 3D island.
  Three.js draws the island and the marks, D3 does projection, scales, colour and the panel charts,
  Leaflet shows the street map for a selected carpark (OneMap Night tiles). UI recreates shadcn/ui
  in Tailwind with the inoTives brand kit. Icons: Flaticon UIcons.
  Layers: weather (rain gauges, wind, temperature, humidity, forecasts, UV), air quality (PSI, PM2.5),
  available taxis and HDB carpark availability.
  Data (real, live): data.gov.sg real-time APIs, fetched by the page. Static base layer in
  data/sg-pulse.json: URA Master Plan 2019 planning areas and HDB carpark locations.
  data.gov.sg rate-limits bursts, so every call goes through one queue with a gap between calls.
-->

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = (ms) => new Promise((ok) => setTimeout(ok, ms));
const B = { paper: '#15171b', raise: '#1d2026', muted: '#23262d', line: '#2b2f37', ink: '#e4e1d8', ink2: '#b8b5ac', fog: '#8b9099', signal: '#1fefd7', amber: '#f6c453', pink: '#e58fb0', sky: '#7cc4dc', violet: '#c9a4f5' };
const RAMP = d3.interpolateRgbBasis(['#174d49', '#1fefd7', '#f6c453', '#e58fb0']);
const TEMP = d3.interpolateRgbBasis(['#2b5d7a', '#1fefd7', '#f6c453', '#e58fb0']);
const HUMID = d3.interpolateRgbBasis(['#4a4130', '#3f6b62', '#1fefd7', '#7cc4dc']);
const RAIN = d3.interpolateRgbBasis(['#3d6f8f', '#7cc4dc', '#d9f1ff']);
const FREE = d3.interpolateRgbBasis(['#e58fb0', '#f6c453', '#1fefd7']);
const TEMP_DOMAIN = [25, 34], RH_DOMAIN = [50, 100];
const title = (s) => s.toLowerCase().replace(/\b[a-z]/g, (c) => c.toUpperCase()).replace(/\bBlk\b/, 'Blk');
const f0 = d3.format(','), f1 = d3.format('.1f'), pctF = d3.format('.0%');
const muted = (t) => `<p class="text-xs text-muted-foreground">${t}</p>`;

// ---------- Singapore time ----------
const TZ = 'Asia/Singapore';
const sgDate = (d = new Date()) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(d);
const sgHour = (d = new Date()) => +new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', hourCycle: 'h23' }).format(d);
const hhmm = (t) => new Date(t).toLocaleTimeString('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const hourLbl = (h) => (h === 0 ? '12am' : h < 12 ? `${h}am` : h === 12 ? '12pm' : `${h - 12}pm`);
const minsOfDay = (t) => { const d = new Date(t); return sgHour(d) * 60 + +new Intl.DateTimeFormat('en-GB', { timeZone: TZ, minute: '2-digit' }).format(d); };

// ================= API queue =================
// data.gov.sg answers 429 to bursts, so calls go out one at a time with a gap, back off on 429,
// and identical calls inside their TTL share one response.
const RTB = 'https://api-open.data.gov.sg/v2/real-time/api/';
const V1 = 'https://api.data.gov.sg/v1/transport/';
// data.gov.sg's published limit without an API key: 6 real-time calls per 10 seconds (the counter
// resets every 10 s), counted per client. Calls go from each visitor's browser, so each visitor has
// their own allowance. We keep one under it, as a sliding window over the calls actually sent
// (retries included); the v1 transport feeds get their own window.
const LIMITS = [
  { host: 'api-open.data.gov.sg', max: 5, win: 10e3, sent: [] },
  { host: '', max: 4, win: 10e3, sent: [] },
];
const apiCache = new Map(), queue = [];
let pumping = false;
async function slot(url) {
  const L = LIMITS.find((l) => url.includes(l.host));
  for (;;) {
    const now = Date.now();
    while (L.sent.length && L.sent[0] <= now - L.win) L.sent.shift();
    if (L.sent.length < L.max) { L.sent.push(now); return; }
    await sleep(L.sent[0] + L.win - now + 60);
  }
}
function api(url, { ttl = 50e3 } = {}) {
  const c = apiCache.get(url);
  if (c && Date.now() - c.t < ttl) return c.p;
  const p = new Promise((ok, no) => { queue.push({ url, ok, no }); pump(); });
  apiCache.set(url, { t: Date.now(), p });
  p.catch(() => apiCache.delete(url));
  return p;
}
async function pump() {
  if (pumping) return;
  pumping = true;
  while (queue.length) {
    const job = queue.shift();
    for (let tries = 0; ; tries++) {
      await slot(job.url);
      // A 429 comes back without CORS headers, so the browser sees it as a network error: retry both.
      let r = null;
      try { r = await fetch(job.url); } catch (e) { if (tries < 4) { await sleep(10e3); continue; } job.no(new Error('rate-limited or offline')); break; }
      if (r.status === 429 && tries < 4) { await sleep(10e3); continue; }   // wait out the 10-second window
      try { if (!r.ok) throw new Error(`HTTP ${r.status}`); job.ok(await r.json()); } catch (e) { job.no(e); }
      break;
    }
  }
  pumping = false;
}

// ================= stage =================
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer(); labelR.domElement.className = 'labels'; stage.appendChild(labelR.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(B.paper, 40, 90);
scene.add(new THREE.HemisphereLight('#cfe9ff', B.paper, 1.2));
const key = new THREE.DirectionalLight('#ffffff', 1.6); key.position.set(-8, 16, 12); scene.add(key);
const camera = new THREE.PerspectiveCamera(34, 1, 0.05, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 1.5; controls.maxDistance = 70; controls.maxPolarAngle = Math.PI * 0.47;
controls.addEventListener('start', () => { fly = null; });
let group = new THREE.Group(); scene.add(group);
let pickables = [], fly = null;
const tickers = new Set();

function lbl(text, pos, cls = '', parent = group, html = false) {
  const d = document.createElement('div'); d.className = `lbl ${cls}`; d[html ? 'innerHTML' : 'textContent'] = text;
  const o = new CSS2DObject(d); o.position.copy(pos); parent.add(o); return o;
}
function dispose(root) {
  root.traverse((o) => {
    o.geometry?.dispose();
    (Array.isArray(o.material) ? o.material : o.material ? [o.material] : []).forEach((m) => m.dispose());
    if (o.isCSS2DObject) o.element.remove();
  });
  root.parent?.remove(root);
}
function clearScene() { dispose(group); group = new THREE.Group(); scene.add(group); pickables = []; tickers.clear(); }

// A soft round sprite for point clouds (taxis, raindrops).
const DOT = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,0.85)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

// ================= base data =================
let BASE = null, AREAS = [], CARPARKS = [];
const baseReady = fetch('data/sg-pulse.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((d) => {
  BASE = d;
  AREAS = d.areas.map((a, i) => {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    a.p.forEach((poly) => poly[0].forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }));
    return { ...a, i, bb: [x0, y0, x1, y1] };
  });
  AREAS.forEach((a) => { a.c = centroid(a); });
  CARPARKS = d.carparks.map(([lat, lon, id, address, type, free, night], i) => ({ i, lat, lon, id, address, type: d.carparkTypes[type], free, night }));
  CARPARKS.forEach((c) => { c.area = areaAt(c.lon, c.lat); });
  return d;
});
const centroid = (a) => {
  let best = null, ar = -1;
  a.p.forEach((poly) => { const r = poly[0]; const s = Math.abs(d3.polygonArea(r)); if (s > ar) { ar = s; best = r; } });
  return d3.polygonCentroid(best);
};
function areaAt(lon, lat) {
  for (const a of AREAS) {
    const [x0, y0, x1, y1] = a.bb;
    if (lon < x0 || lon > x1 || lat < y0 || lat > y1) continue;
    for (const poly of a.p) if (d3.polygonContains(poly[0], [lon, lat]) && !poly.slice(1).some((h) => d3.polygonContains(h, [lon, lat]))) return a.i;
  }
  return -1;
}

// Projection: Mercator fitted to the island, in world units. x east, z south.
let proj = null;
const P = (lon, lat) => proj([lon, lat]);
function setupProjection() {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  AREAS.forEach((a) => { x0 = Math.min(x0, a.bb[0]); y0 = Math.min(y0, a.bb[1]); x1 = Math.max(x1, a.bb[2]); y1 = Math.max(y1, a.bb[3]); });
  proj = d3.geoMercator().fitExtent([[-12, -7.5], [12, 7.5]], { type: 'MultiPoint', coordinates: [[x0, y0], [x1, y1]] });
}
function shapeOf(poly) {
  const toV = (r) => r.map(([lon, lat]) => { const [x, z] = P(lon, lat); return new THREE.Vector2(x, -z); });
  const s = new THREE.Shape(toV(poly[0]));
  poly.slice(1).forEach((h) => s.holes.push(new THREE.Path(toV(h))));
  return s;
}
const V3 = (lon, lat, y = 0) => { const [x, z] = P(lon, lat); return new THREE.Vector3(x, y, z); };

// The island: every planning area as a flat tile with its border. Returns the tiles, one per area.
function island() {
  const g = new THREE.Group(), edges = [], tiles = [];
  AREAS.forEach((a) => {
    const geo = new THREE.ShapeGeometry(a.p.map(shapeOf)); geo.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: '#262a31', roughness: 0.9 }));
    m.position.y = -0.01; m.userData = { area: a.i }; g.add(m); tiles.push(m);
    a.p.forEach((poly) => poly.forEach((r) => r.forEach((pt, k) => {
      const [ax, az] = P(...pt), [bx, bz] = P(...r[(k + 1) % r.length]);
      edges.push(new THREE.Vector3(ax, 0.002, az), new THREE.Vector3(bx, 0.002, bz));
    })));
  });
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(edges), new THREE.LineBasicMaterial({ color: '#3a3f48', transparent: true, opacity: 0.8 })));
  group.add(g);
  return tiles;
}
// Upright bars as one InstancedMesh, base on the ground, heights eased by a ticker.
function bars(n, { w = 0.08, round = false, hexagon = false } = {}) {
  const geo = hexagon ? new THREE.CylinderGeometry(w / 2, w / 2, 1, 6) : round ? new THREE.CylinderGeometry(w / 2, w / 2, 1, 14) : new THREE.BoxGeometry(w, 1, w);
  geo.translate(0, 0.5, 0);
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.05 }), n);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const pos = new Array(n).fill(null), cur = new Float32Array(n), tgt = new Float32Array(n), m4 = new THREE.Matrix4();
  const write = (i) => { const p = pos[i]; if (!p) return; m4.makeScale(cur[i] > 0 ? 1 : 0, Math.max(cur[i], 1e-4), cur[i] > 0 ? 1 : 0).setPosition(p.x, 0, p.z); mesh.setMatrixAt(i, m4); };
  const api = {
    mesh,
    place(i, v3) { pos[i] = v3; write(i); },
    set(i, h, color) { tgt[i] = h; if (color) mesh.setColorAt(i, new THREE.Color(color)); },
    alive: (i) => tgt[i] > 0,
    commit() { if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true; if (reduceMotion) { cur.set(tgt); for (let i = 0; i < n; i++) write(i); mesh.instanceMatrix.needsUpdate = true; } },
    tick() {
      let moved = false;
      for (let i = 0; i < n; i++) { const d = tgt[i] - cur[i]; if (Math.abs(d) > 1e-4) { cur[i] = Math.abs(d) < 2e-3 ? tgt[i] : cur[i] + d * 0.14; write(i); moved = true; } }
      if (moved) mesh.instanceMatrix.needsUpdate = true;
    },
  };
  for (let i = 0; i < n; i++) mesh.setColorAt(i, new THREE.Color(B.line));
  group.add(mesh); tickers.add(api.tick);
  return api;
}

// ================= state =================
const state = { view: 'weather', wmode: 'temp', air: 'psi', taxi: 'points', txFrom: null, cpFilter: 'all', area: null, region: null, cp: null, gauge: null };
const W = {};            // weather readings
const AIR = {};          // psi, pm25, day series
const TX = { hist: [], frames: [], hour: null, status: 'idle' };   // taxis
const CP = { live: new Map(), hist: new Map(), ts: null };          // carparks
const STN = new Map();   // weather stations by id
const RP = { status: 'idle', frames: [], i: 0, cum: false, pages: 0 };   // today's rain replay
let playTimer = null;

function stationsFrom(d) { (d.stations ?? []).forEach((s) => STN.set(s.id, { id: s.id, name: s.name, lat: s.location.latitude, lon: s.location.longitude })); }
function readingMap(d) { const r = d.readings?.[0]; return { ts: r?.timestamp, v: new Map((r?.data ?? []).map((x) => [x.stationId, x.value])), ids: (d.stations ?? []).map((s) => s.id) }; }
// Inverse-distance weighting from station readings to a point.
function idw(rd, lon, lat) {
  let sw = 0, sv = 0;
  for (const [id, v] of rd.v) {
    const s = STN.get(id); if (!s || v == null) continue;
    const d2 = (s.lon - lon) ** 2 + (s.lat - lat) ** 2;
    if (d2 < 1e-8) return v;
    const w = 1 / d2; sw += w; sv += w * v;
  }
  return sw ? sv / sw : null;
}
const avgOf = (rd) => d3.mean([...rd.v.values()]);

// ---------- forecasts ----------
const fcCat = (s = '') => (/thunder/i.test(s) ? 'thunder' : /rain|shower|drizzle/i.test(s) ? 'rain' : /haz|mist|fog/i.test(s) ? 'haze' : /cloud|overcast/i.test(s) ? 'cloud' : /night/i.test(s) ? 'night' : 'fair');
const FC_COL = { fair: '#5b4a24', night: '#2f3550', cloud: '#353a43', haze: '#5a5040', rain: '#2a5f86', thunder: '#5c3f8f' };
const FC_ICON = { fair: 'fi-rr-sun', night: 'fi-rr-moon', cloud: 'fi-rr-cloud', haze: 'fi-rr-smog', rain: 'fi-rr-cloud-rain', thunder: 'fi-rr-thunderstorm' };
const fcIcon = (s, cls = '') => `<i class="fi ${FC_ICON[fcCat(s)]} ${cls}"></i>`;

// ---------- air quality bands (NEA) ----------
// NEA's colours and bands (PSI forecast gauge): Good–Moderate 0–100 green, Unhealthy 101–200 yellow,
// Very unhealthy 201–300 orange, Hazardous above 300 red. PM2.5 1-hour bands I–IV in the same colours.
const NEA = { green: '#3f8f2f', yellow: '#f5c84a', orange: '#f0a03c', red: '#c9343a' };
const PSI_BANDS = [[100, 'Good – Moderate', NEA.green], [200, 'Unhealthy', NEA.yellow], [300, 'Very Unhealthy', NEA.orange], [Infinity, 'Hazardous', NEA.red]];
// PM2.5 descriptors carry NEA's band number (Band 1 to 4)
const bandName = (bands, v) => { const i = bands.findIndex(([hi]) => v <= hi); return bands === PM_BANDS ? `Band ${i + 1} · ${bands[i][1]}` : bands[i][1]; };
const PM_BANDS = [[55, 'Normal', NEA.green], [150, 'Elevated', NEA.yellow], [250, 'High', NEA.orange], [Infinity, 'Very High', NEA.red]];
const UV_BANDS = [[2, 'Low', '#5fbf8f'], [5, 'Moderate', '#f6c453'], [7, 'High', '#e8894a'], [10, 'Very high', '#e05d6f'], [Infinity, 'Extreme', '#9b4fb0']];
const band = (bands, v) => bands.find(([hi]) => v <= hi);
// The band colour, dimmer at the bottom of the band and full at the top, so regions in one band still differ.
const bandShade = (bands, v) => { const k = bands.findIndex(([hi]) => v <= hi), lo = k ? bands[k - 1][0] : 0, hi = bands[k][0] === Infinity ? lo * 1.5 : bands[k][0]; return d3.interpolateRgb('#3a3f48', bands[k][2])(0.4 + 0.6 * Math.min(1, (v - lo) / (hi - lo))); };
const REGIONS = ['north', 'east', 'central', 'west', 'south'];
const REG_COL = { north: B.signal, east: B.amber, central: B.ink, west: B.pink, south: B.sky };
// NEA's health advisory by 24-hour PSI band, for its three groups.
const ADVICE_GROUPS = ['Healthy persons', 'Elderly, pregnant women, children', 'Persons with chronic lung disease, heart disease'];
const AIR_ADVICE = {
  'Good – Moderate': ['Normal activities', 'Normal activities', 'Normal activities'],
  Unhealthy: ['Reduce prolonged or strenuous outdoor physical exertion', 'Minimise prolonged or strenuous outdoor physical exertion', 'Avoid prolonged or strenuous outdoor physical exertion'],
  'Very Unhealthy': ['Avoid prolonged or strenuous outdoor physical exertion', 'Minimise outdoor activity', 'Avoid outdoor activity'],
  Hazardous: ['Minimise outdoor activity', 'Avoid outdoor activity', 'Avoid outdoor activity'],
};

// ================= views =================
const VIEWS = {};

// ---------- weather ----------
VIEWS.weather = {
  tab: 'Weather', icon: 'fi-rr-cloud-sun-rain',
  title: 'The weather, right now',
  blurb: 'Every rain gauge rises with the last five minutes of rain, arrows show where the wind is blowing, and the island is shaded by temperature, humidity or the two-hour forecast. Replay today to watch the showers cross the island.',
  how: ['Inverse-distance shading from the 17 weather stations, the UV, forecast and rain charts.', 'A rain column and falling drops at each of the rain gauges, wind arrows turned to their bearing.'],
  camera: [-2, 17, 19], target: [0.5, 0, 0.6],
  build() {
    this.tiles = island();
    this.tiles.forEach((t) => { t.userData.pick = () => this.areaTip(AREAS[t.userData.area]); pickables.push(t); });
    this.labels = new THREE.Group(); group.add(this.labels);
    this.windG = new THREE.Group(); group.add(this.windG);
    this.rainIds = []; this.rain = null; this.drops = null;
    this.update();
  },
  // Rain shown: the live five minutes, or a frame of today's replay (five-minute or running total).
  rainNow() {
    if (RP.status === 'ready' && RP.on) { const fr = RP.frames[RP.i]; return { ts: fr.t, v: RP.cum ? fr.cum : fr.v, cum: RP.cum }; }
    return W.rain ? { ts: W.rain.ts, v: W.rain.v, cum: false } : null;
  },
  update() {
    if (!this.tiles) return;
    const mode = state.wmode;
    // island shading
    const tc = d3.scaleSequential(TEMP_DOMAIN, TEMP).clamp(true), hc = d3.scaleSequential(RH_DOMAIN, HUMID).clamp(true);
    this.tiles.forEach((t) => {
      const a = AREAS[t.userData.area]; let c = '#262a31';
      if (mode === 'temp' && W.temp) { const v = idw(W.temp, ...a.c); if (v != null) c = d3.interpolateRgb('#1d2026', tc(v))(0.62); }
      if (mode === 'rh' && W.rh) { const v = idw(W.rh, ...a.c); if (v != null) c = d3.interpolateRgb('#1d2026', hc(v))(0.62); }
      if (mode === 'fc' && W.f2) { const f = this.fcFor(a); if (f) c = FC_COL[fcCat(f)]; }
      t.material.color.set(state.area === a.i ? d3.interpolateRgb(c, B.amber)(0.35) : c);
    });
    // labels: station readings, or forecast icons
    dispose(this.labels); this.labels = new THREE.Group(); group.add(this.labels);
    const rd = mode === 'temp' ? W.temp : mode === 'rh' ? W.rh : null;
    if (rd) rd.v.forEach((v, id) => { const s = STN.get(id); if (s && v != null) lbl(mode === 'temp' ? `${f1(v)}°` : `${Math.round(v)}%`, V3(s.lon, s.lat, 0.12), 'val', this.labels); });
    if (mode === 'fc' && W.f2) W.f2.meta.forEach((m) => { const f = W.f2.byName.get(m.name); if (f) lbl(fcIcon(f), V3(m.label_location.longitude, m.label_location.latitude, 0.1), 'icon', this.labels, true); });
    if (state.area != null) { const a = AREAS[state.area]; lbl(a.n, V3(...a.c, 0.4), 'sel', this.labels); }
    if (state.gauge != null && STN.has(state.gauge)) { const g = STN.get(state.gauge); lbl(g.name, V3(g.lon, g.lat, 0.5), 'sel', this.labels); }
    this.drawRain(); this.drawWind(); this.drawTracks();
    legend();
  },
  drawRain() {
    const rn = this.rainNow(); if (!rn) return;
    const ids = [...new Set([...(W.rain?.ids ?? []), ...rn.v.keys()])].filter((id) => STN.has(id));
    if (!this.rain || ids.length !== this.rainIds.length) {
      if (this.rain) { tickers.delete(this.rain.tick); pickables = pickables.filter((p) => p !== this.rain.mesh); dispose(this.rain.mesh); }
      this.rainIds = ids;
      this.rain = bars(ids.length, { w: 0.13, round: true });
      ids.forEach((id, i) => { const s = STN.get(id); this.rain.place(i, V3(s.lon, s.lat)); });
      this.rain.mesh.userData = { alive: () => true, pick: (h) => this.rainTip(this.rainIds[h.instanceId]), onClick: (h) => selectGauge(this.rainIds[h.instanceId]) };
      pickables.push(this.rain.mesh);
    }
    const hOf = (mm) => (mm > 0 ? (rn.cum ? 0.12 + Math.sqrt(mm) * 0.32 : 0.15 + Math.sqrt(mm) * 0.9) : 0.03);
    const col = d3.scaleSequentialSqrt([0, rn.cum ? 40 : 4], RAIN).clamp(true);
    this.rainIds.forEach((id, i) => { const mm = rn.v.get(id) ?? 0, sel = id === state.gauge; this.rain.set(i, Math.min(3.2, Math.max(sel ? 0.3 : 0, hOf(mm))), sel ? B.amber : mm > 0 ? col(mm) : '#3a3f48'); });
    this.rain.commit();
    this.drawDrops(rn);
  },
  // Falling drops above every gauge with rain in the frame.
  drawDrops(rn) {
    if (this.drops) { tickers.delete(this.drops.tick); dispose(this.drops.pts); this.drops = null; }
    if (rn.cum) return;
    const wet = this.rainIds.map((id) => [STN.get(id), rn.v.get(id) ?? 0]).filter(([, mm]) => mm > 0);
    if (!wet.length) return;
    const xs = [], speed = [];
    wet.forEach(([s, mm]) => {
      const n = Math.round(Math.min(90, 10 + mm * 30)), c = V3(s.lon, s.lat);
      for (let k = 0; k < n; k++) { const r = Math.sqrt(Math.random()) * 0.42, a = Math.random() * Math.PI * 2; xs.push(c.x + r * Math.cos(a), Math.random() * 2.6, c.z + r * Math.sin(a)); speed.push(0.018 + Math.random() * 0.02); }
    });
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(xs, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.05, map: DOT, color: '#9fd8ff', transparent: true, opacity: 0.75, depthWrite: false }));
    group.add(pts);
    const arr = geo.attributes.position.array;
    const tick = () => { if (reduceMotion) return; for (let k = 0; k < speed.length; k++) { arr[k * 3 + 1] -= speed[k]; if (arr[k * 3 + 1] < 0) arr[k * 3 + 1] = 2.6; } geo.attributes.position.needsUpdate = true; };
    tickers.add(tick); this.drops = { pts, tick };
  },
  // Wind arrows point the way the wind blows (bearing + 180), length by speed.
  drawWind() {
    pickables = pickables.filter((p) => !p.userData.wind);
    dispose(this.windG); this.windG = new THREE.Group(); group.add(this.windG);
    if (!W.wd || !W.ws) return;
    const s = new THREE.Shape([[-0.5, -0.035], [0.22, -0.035], [0.22, -0.11], [0.5, 0], [0.22, 0.11], [0.22, 0.035], [-0.5, 0.035]].map(([x, y]) => new THREE.Vector2(x, y)));
    const geo = new THREE.ShapeGeometry(s); geo.rotateX(-Math.PI / 2);
    const mat = new THREE.MeshBasicMaterial({ color: B.ink, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
    W.wd.v.forEach((deg, id) => {
      const st = STN.get(id), kn = W.ws.v.get(id); if (!st || deg == null || kn == null) return;
      const m = new THREE.Mesh(geo, mat);
      const to = (deg + 180) * Math.PI / 180;
      m.rotation.y = Math.PI / 2 - to;
      const len = 0.35 + Math.min(kn, 25) * 0.05; m.scale.set(len, 1, 1);
      m.position.copy(V3(st.lon, st.lat, 0.05));
      m.userData = { wind: true, pick: () => `<div class="font-medium text-foreground">${esc(st.name)}</div><div class="font-mono">${f1(kn)} knots from ${Math.round(deg)}° (${compass(deg)})</div>` };
      this.windG.add(m); pickables.push(m);
    });
  },
  fcFor(a) {
    if (!W.f2) return null;
    let best = null, bd = Infinity;
    W.f2.meta.forEach((m) => { const d = (m.label_location.longitude - a.c[0]) ** 2 + (m.label_location.latitude - a.c[1]) ** 2; if (d < bd) { bd = d; best = m.name; } });
    return W.f2.byName.get(best) ?? null;
  },
  areaTip(a) {
    const t = W.temp && idw(W.temp, ...a.c), h = W.rh && idw(W.rh, ...a.c), f = this.fcFor(a);
    return `<div class="font-medium text-foreground">${esc(a.n)}</div>

    el.innerHTML = `${headRow(a.n, `${a.r}${f ? ` · ${f}` : ''}`)}
      <div class="mt-2 grid grid-cols-2 gap-2">${tile('About', W.temp ? `${f1(idw(W.temp, ...a.c))}°C` : '–')}${tile('Humidity', W.rh ? `${Math.round(idw(W.rh, ...a.c))}%` : '–')}</div>

const compass = (deg) => ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(deg / 45) % 8];

function uvChart(el) {
  const rec = W.uv; if (!rec?.index?.length) { el.innerHTML = muted('Sync “Forecasts and UV” above for the UV chart.'); return; }
  const pts = rec.index.map((d) => ({ h: sgHour(new Date(d.hour)), v: d.value }));
  const w = el.clientWidth || 340, H = 92, m = { l: 4, r: 4, t: 12, b: 16 };
  const x = d3.scaleBand(d3.range(7, 20), [m.l, w - m.r]).padding(0.2), y = d3.scaleLinear([0, Math.max(11, d3.max(pts, (d) => d.v))], [H - m.b, m.t]);
  el.innerHTML = `<svg width="${w}" height="${H}" class="block">
    ${pts.filter((d) => x(d.h) != null).map((d) => `<rect x="${x(d.h)}" y="${y(d.v)}" width="${x.bandwidth()}" height="${Math.max(1, y(0) - y(d.v))}" rx="2" fill="${band(UV_BANDS, d.v)[2]}"><title>${hourLbl(d.h)}: UV ${d.v} (${band(UV_BANDS, d.v)[1]})</title></rect>
      <text x="${x(d.h) + x.bandwidth() / 2}" y="${y(d.v) - 3}" text-anchor="middle" font-size="9.5" font-family="Source Code Pro" fill="#b8b5ac">${d.v}</text>`).join('')}
    ${d3.range(7, 20, 2).map((h) => `<text x="${x(h) + x.bandwidth() / 2}" y="${H - 3}" text-anchor="middle" font-size="9.5" font-family="Source Code Pro" fill="#8b9099">${hourLbl(h)}</text>`).join('')}
  </svg>`;
}

// ---------- rain replay (the synced day, five-minute frames) ----------
// Built from the stored readings of the day; the sync fetches only the pages it doesn't have yet.
function buildReplay(readings) {
  const frames = [...new Map(readings.map((r) => [r.timestamp, r])).values()].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  const run = new Map();
  RP.frames = frames.map((r) => {
    const v = new Map(r.data.map((x) => [x.stationId, x.value]));
    v.forEach((mm, id) => run.set(id, (run.get(id) ?? 0) + mm));
    return { t: r.timestamp, v, cum: new Map(run), mean: d3.mean([...v.values()]) ?? 0, wet: [...v.values()].filter((x) => x > 0).length };
  });
  const was = RP.status;
  RP._tracks = null;
  RP.status = RP.frames.length ? 'ready' : 'idle';

// ---------- rain today: gauge-by-time heatmap, storm tracks, wettest gauges ----------
const RAIN_CLAMP = 6;   // mm in five minutes; heavier cells share the top colour

// Gauges in the history, west to east, so a storm crossing the island reads as a diagonal.
function rainGauges() {
  const ids = new Set(); RP.frames.forEach((f) => f.v.forEach((_, id) => ids.add(id)));
  return [...ids].filter((id) => STN.has(id)).sort((a, b) => STN.get(a).lon - STN.get(b).lon);
}
const gaugeName = (id) => STN.get(id)?.name ?? id;

const wetGauges = () => { const last = RP.frames.at(-1); return rainGauges().filter((id) => (last?.cum.get(id) ?? 0) > 0); };

// Turn the replay on (if it isn't) and move to a frame.
function jumpReplay(fi) {

  const redo = !RP.on || RP.cum; RP.on = true; RP.cum = false;
  if (redo) { VIEWS.weather.update(); replayRow(); }

// Storm cells: in each frame, wet gauges within ~8 km join one cell (rain-weighted centre);
// a cell links to the nearest cell of the last 15 minutes within ~10 km, making a track.
function stormTracks() {
  if (RP._tracks) return RP._tracks;
  const JOIN = 0.07, LINK = 0.09, tracks = [];
  let active = [];
  RP.frames.forEach((f, fi) => {
    const wet = []; f.v.forEach((mm, id) => { const s = STN.get(id); if (s && mm > 0) wet.push({ s, mm }); });
    const par = wet.map((_, i) => i), find = (i) => (par[i] === i ? i : (par[i] = find(par[i])));
    for (let i = 0; i < wet.length; i++) for (let j = i + 1; j < wet.length; j++) if (Math.hypot(wet[i].s.lon - wet[j].s.lon, wet[i].s.lat - wet[j].s.lat) < JOIN) par[find(i)] = find(j);
    const cells = d3.rollups(wet, (v) => { const mm = d3.sum(v, (d) => d.mm); return { lon: d3.sum(v, (d) => d.s.lon * d.mm) / mm, lat: d3.sum(v, (d) => d.s.lat * d.mm) / mm, mm, n: v.length, peak: d3.max(v, (d) => d.mm), fi, t: f.t }; }, (_, i) => find(i)).map(([, c]) => c);
    const taken = new Set(), next = [];
    cells.sort((a, b) => b.mm - a.mm).forEach((c) => {
      let best = null, bd = LINK;
      active.forEach((t) => { if (taken.has(t)) return; const p = t.pts.at(-1); const d = Math.hypot(p.lon - c.lon, p.lat - c.lat); if (d < bd) { bd = d; best = t; } });
      if (best) { taken.add(best); best.pts.push(c); next.push(best); } else { const t = { pts: [c] }; tracks.push(t); next.push(t); }
    });

    active = next;

  // (rain-weighted) and judge movement by where it started and ended, not the summed hops.
  RP._tracks = tracks.filter((t) => t.pts.length >= 3).map((t) => {
    const sm = t.pts.map((_, i) => { const w = t.pts.slice(Math.max(0, i - 1), i + 2), mm = d3.sum(w, (p) => p.mm); return { lon: d3.sum(w, (p) => p.lon * p.mm) / mm, lat: d3.sum(w, (p) => p.lat * p.mm) / mm }; });

const trackTip = (t) => `<div class="font-medium text-foreground">Rain cell, ${hhmm(t.pts[0].t)} to ${hhmm(t.pts.at(-1).t)}</div>
  <div>${t.moving ? `${esc(t.from)} → ${esc(t.to)}, moved ${f1(t.km)} km ${t.heading}` : `Stayed over ${esc(t.over)} for ${t.mins} min`}</div>
  <div class="font-mono text-muted-foreground">peak ${f1(d3.max(t.pts, (p) => p.peak))} mm in 5 min · up to ${d3.max(t.pts, (p) => p.n)} gauges wet</div><div class="text-muted-foreground">Click to replay it</div>`;
VIEWS.weather.drawTracks = function () {
  if (!this.built && !this.tiles) return;
  pickables = pickables.filter((p) => !p.userData.track);
  if (this.trackG) dispose(this.trackG);
  this.trackG = new THREE.Group(); group.add(this.trackG);
  if (RP.status !== 'ready') return;
  const up = new THREE.Vector3(0, 1, 0);
  stormTracks().forEach((t, ti) => {
    const c = new THREE.Color(TRACK_COL(t.start)), dim = RP.on ? 0.95 : 0.6, ud = { track: true, pick: () => trackTip(t), onClick: () => playTrack(ti) };
    if (!t.moving) {

      const ring = new THREE.Mesh(new THREE.RingGeometry(r * 0.78, r, 48), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: dim, side: THREE.DoubleSide, depthWrite: false }));

    const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(8, pts.length * 4), 0.045, 8, false), new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: dim }));
    tube.userData = ud;

      cone.quaternion.setFromUnitVectors(up, dir.normalize()); cone.position.copy(b);
      cone.userData = tube.userData; this.trackG.add(cone); pickables.push(cone);
    }

// ---------- air quality ----------
// NEA reports five regions, so the island is drawn as five regions (tinted, with their borders) and
// each region gets one column at its centre. In PSI mode a ring of thin bars around the column shows

// ---------- the sync, in groups ----------
// Each group syncs on its own from its icon (in the Sync menu or the tab's panel), or all together.
// Groups queue up and run one after another, since every call shares the rate-limited queue.
const GROUPS = [
  { id: 'weather', every: 5, view: 'weather', also: ['air'], name: 'Weather now', icon: 'fi-rr-temperature-high', feeds: ['temp', 'rh', 'rain', 'ws', 'wd'], about: 'temperature, humidity, rain, wind' },

  { id: 'rainDay', every: 10, view: 'weather', name: 'Today’s rain', icon: 'fi-rr-time-past', history: 'rain', about: 'five-minute history for the replay' },
  { id: 'air', every: 15, view: 'air', name: 'Air quality now', icon: 'fi-rr-wind', feeds: ['psi', 'pm25'], about: 'PSI and PM2.5 by region' },
  { id: 'airDay', every: 30, view: 'air', name: 'Air quality today', icon: 'fi-rr-time-past', feeds: ['psiDay', 'pmDay'], about: 'hourly readings for the chart' },
  { id: 'taxis', every: 1, view: 'taxis', name: 'Taxis now', icon: 'fi-rr-taxi', feeds: ['taxi'], about: 'every free taxi' },
  { id: 'taxiDay', every: 30, view: 'taxis', name: 'Taxis today', icon: 'fi-rr-time-past', history: 'taxi', about: 'on the hour, for the slider' },
  { id: 'carparks', every: 1, view: 'carparks', name: 'Carparks', icon: 'fi-rr-parking', feeds: ['carparks'], about: 'free lots in every HDB carpark' },

const GROUP = Object.fromEntries(GROUPS.map((g) => [g.id, g]));
// Auto sync: off on every page load. While on, and while the tab is visible, each group re-syncs on
// its own schedule (g.every, minutes), matched to how often its source updates. That is under 90
// real-time calls an hour, far inside the limit, and every call still goes through the limiter.
const auto = { on: false };
function autoTick() {
  if (!auto.on || document.hidden) return;

setInterval(autoTick, 15e3);
document.addEventListener('visibilitychange', autoTick);
function setAuto(on) { auto.on = on; syncUi(); autoTick(); }

const FEED = Object.fromEntries(FEEDS.map(([k, label, url]) => [k, { label, url }]));
const sync = { running: null, queue: [], done: 0, total: 0, step: '' };
// a group redraws its own tab, plus any tab that also uses it (wind on the Air tab)
const shows = (g) => g.view === state.view || (g.also ?? []).includes(state.view);
const groupState = (id) => (sync.running === id ? 'running' : sync.queue.includes(id) ? 'queued' : 'idle');

function newDay() {
  const today = sgDate();
  if (STORE.day === today) return;
  STORE.day = today; STORE.rainDay = []; STORE.taxiDay = [];
  delete STORE.groupAt?.rainDay; delete STORE.groupAt?.taxiDay;
  RP.status = 'idle'; RP.frames = []; RP.on = false; TX.frames = []; TX.hour = null;

// Calls a group will make, for the progress bar (history groups only fetch what's missing).

function missingHours() { const nowH = sgHour(), have = new Set(STORE.taxiDay.filter((f) => f.h < nowH).map((f) => f.h)); return d3.range(nowH + 1).filter((h) => !have.has(h)); }

    STORE.syncedAt = Date.now();

    if (shows(g) && VIEWS[state.view].built) { VIEWS[state.view].update(); refreshPanel(); }
  }
  Object.assign(sync, { running: null, done: 0, total: 0, step: '' });
  syncUi();
}
async function syncGroup(g) {
  newDay();
  const errs = [], today = STORE.day;
  const touched = () => { if (shows(g) && VIEWS[state.view].built) { VIEWS[state.view].update(); refreshPanel(); } };
  const step = async (label, fn) => { sync.step = `${g.name} · ${label}`; syncUi(); try { await fn(); } catch (e) { errs.push(`${label}: ${e.message ?? e}`); } sync.done++; syncUi(); };
  if (g.feeds) {
    for (const k of g.feeds) await step(FEED[k].label, async () => { const j = await api(FEED[k].url(), { ttl: 0 }); STORE.feeds[k] = j; APPLY[k](j); touched(); });
  } else if (g.history === 'rain') {
    // pages run newest first, about two hours each; stop once a page reaches stored readings
    const have = STORE.rainDay.length ? d3.max(STORE.rainDay, (r) => new Date(r.timestamp)) : null;
    let tok = null, p = 0, planned = estimate(g);
    const fresh = [];
    for (;;) {
      let stop = true;   // stays true if the page fails, so a dead page isn't retried in a loop
      await step(`page ${p + 1}`, async () => {
        const j = await api(`${RTB}rainfall?date=${today}${tok ? `&paginationToken=${encodeURIComponent(tok)}` : ''}`, { ttl: 0 });
        stationsFrom(j.data); const rs = j.data.readings ?? []; fresh.push(...rs);
        tok = j.data.paginationToken;
        stop = !tok || (have && rs.some((r) => new Date(r.timestamp) <= have));
      });
      p++;
      if (stop || !tok || p >= 16) break;
      if (p >= planned) { sync.total++; planned++; }   // the estimate was short
    }
    if (p < planned) sync.total -= planned - p;
    if (fresh.length) { STORE.rainDay = [...new Map([...STORE.rainDay, ...fresh].map((r) => [r.timestamp, r])).values()]; buildReplay(STORE.rainDay); touched(); }
  } else {
    for (const h of missingHours()) {
      await step(hourLbl(h), async () => {
        const j = await api(`${V1}taxi-availability?date_time=${today}T${String(h).padStart(2, '0')}:00:00`, { ttl: 0 });
        const f = j.features?.[0]; if (!f) return;
        STORE.taxiDay = [...STORE.taxiDay.filter((x) => x.h !== h), { h, t: f.properties.timestamp, pts: f.geometry.coordinates }];
        buildTaxiDay(STORE.taxiDay); touched();
      });
    }
  }
  return errs;
}

// ---------- sync UI: header button + menu, and the tab's own groups in the panel ----------
const ago = (t) => { const m = Math.round((Date.now() - t) / 60e3); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
function groupRow(g, { compact = false } = {}) {
  const st = groupState(g.id), at = STORE.groupAt?.[g.id], err = STORE.groupErr?.[g.id];
  const stale = at && Date.now() - at > (g.history ? 60 : 10) * 60e3;
  const dot = st !== 'idle' ? 'bg-primary animate-pulse' : err ? 'bg-[#e05d6f]' : !at ? 'bg-input' : stale ? 'bg-amber' : 'bg-primary';
  const when = st === 'running' ? `syncing${sync.step.startsWith(g.name) ? ` · ${esc(sync.step.slice(g.name.length + 3))}` : ''}` : st === 'queued' ? 'queued' : (err ? 'some calls failed, try again' : at ? `synced ${hhmm(at)} · ${ago(at)}` : 'not synced yet') + (auto.on && st === 'idle' ? ` · ${nextIn(g)}` : '');
  return `<div class="flex items-center gap-2 ${compact ? 'py-1' : 'rounded-md px-2 py-1.5 hover:bg-accent/40'}" ${err ? `title="${esc(err)}"` : ''}>
    <span class="inline-flex size-2 shrink-0 rounded-full ${dot}"></span>
    ${compact ? '' : `<i class="fi ${g.icon} shrink-0 text-muted-foreground"></i>`}
    <span class="min-w-0 flex-1"><span class="block truncate text-xs text-foreground">${g.name}${compact ? '' : ` <span class="text-muted-foreground">· ${g.about}</span>`}</span>
      <span class="block truncate text-[11px] ${err && st === 'idle' ? 'text-[#e05d6f]' : stale && st === 'idle' ? 'text-amber' : 'text-muted-foreground'}">${when}</span></span>
    <button data-sync-group="${g.id}" ${st !== 'idle' ? 'disabled' : ''} class="inline-flex size-7 shrink-0 items-center justify-center rounded-md text-muted-foreground transition-colors hover:bg-accent hover:text-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:opacity-50" aria-label="Sync ${g.name}" title="Sync ${g.name}"><i class="fi fi-rr-refresh ${st === 'running' ? 'animate-spin' : ''}"></i></button>
  </div>`;
}
function progressBar() {
  if (!sync.running) return '';
  return `<div class="mt-1 h-1 overflow-hidden rounded-full bg-muted"><div class="h-full bg-primary transition-all" style="width:${(sync.done / Math.max(1, sync.total)) * 100}%"></div></div>
    <p class="mt-1 text-[11px] text-muted-foreground">${sync.done} of ${sync.total} calls · one at a time to stay inside data.gov.sg’s rate limit</p>`;
}
function syncMenu() {
  const m = $('#sync-menu'); if (!m || m.hidden) return;
  const tabs = ORDER.map((v) => `<p class="px-2 pb-0.5 pt-2 text-[11px] font-medium uppercase tracking-wide text-muted-foreground">${VIEWS[v].tab}</p>${GROUPS.filter((g) => g.view === v).map((g) => groupRow(g)).join('')}`).join('');
  m.innerHTML = `<div class="flex items-center justify-between gap-2 px-2 pb-1"><span class="text-sm font-medium">Sync from data.gov.sg</span>
      <button data-sync-all ${sync.running && !sync.queue.length && GROUPS.every((g) => groupState(g.id) !== 'idle') ? 'disabled' : ''} class="${btnCls} h-7 px-2.5 text-xs"><i class="fi fi-rr-refresh"></i>Sync all</button></div>
    <label class="mx-2 mt-1 flex cursor-pointer items-start justify-between gap-3 rounded-lg border bg-background/40 p-2">
      <span class="min-w-0"><span class="block text-xs font-medium text-foreground"><i class="fi fi-rr-time-fast mr-1 align-[-1px] ${auto.on ? 'text-primary' : 'text-muted-foreground'}"></i>Auto sync${auto.on ? (document.hidden ? ' · paused' : ' · on') : ''}</span>
        <span class="mt-0.5 block text-[11px] leading-snug text-muted-foreground">While this tab is open, each group refreshes on its own schedule: carparks and taxis every minute, weather every 5 min, today’s rain every 10, air every 15, forecasts and the day histories every 30. Calls stay under data.gov.sg’s limit of 6 per 10 seconds.</span></span>
      <button id="auto-toggle" role="switch" aria-checked="${auto.on}" aria-label="Auto sync" class="relative mt-0.5 inline-flex h-5 w-9 shrink-0 items-center rounded-full transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring ${auto.on ? 'bg-primary' : 'bg-input'}"><span class="inline-block size-4 rounded-full bg-background shadow transition-transform ${auto.on ? 'translate-x-[18px]' : 'translate-x-0.5'}"></span></button>
    </label>
    <div class="px-2">${progressBar()}</div>
    ${tabs}
    <div class="mt-2 flex items-center justify-between gap-2 border-t px-2 pt-2 text-[11px] text-muted-foreground"><span>Kept in this browser (IndexedDB)</span>
      <button id="sync-reset" ${sync.running ? 'disabled' : ''} class="rounded px-1.5 py-0.5 hover:bg-accent hover:text-foreground disabled:opacity-50">Clear stored data</button></div>`;
}
function syncUi() {
  const b = $('#sync'), l = $('#sync-lbl');
  if (b) b.querySelector('i').className = `fi fi-rr-refresh ${sync.running ? 'animate-spin' : ''}`;
  if (l) l.textContent = sync.running ? `${sync.done}/${sync.total}` : auto.on ? 'Auto' : 'Sync';
  if (b) b.classList.toggle('text-primary', auto.on && !sync.running);
  syncMenu();
  liveRow();
}
// The panel's status: just this tab's groups, each with its own sync icon.
function liveRow() {
  const el = $('#live'); if (!el) return;
  const gs = GROUPS.filter((g) => g.view === state.view);
  el.innerHTML = `<div class="rounded-lg border bg-background/40 px-2.5 py-1">${gs.map((g) => groupRow(g, { compact: true })).join('')}
    ${sync.running && GROUP[sync.running].view === state.view ? `<div class="pb-1.5">${progressBar()}</div>` : ''}</div>`;
}
setInterval(() => { if (!document.hidden) { liveRow(); syncMenu(); } }, 30e3);

// ================= view lifecycle =================
let building = 0;
async function show(view) {
  const ticket = ++building;
  if (playTimer) stopPlay();
  state.view = view; state.area = null; state.region = null; state.cp = null; state.gauge = null;
  document.querySelectorAll('[data-tab]').forEach((b) => { b.dataset.state = b.dataset.tab === view ? 'active' : ''; b.setAttribute('aria-selected', b.dataset.tab === view); });
  clearScene();
  dropMap();
  try { await ready; } catch { $('#panel').innerHTML = '<p class="text-sm text-muted-foreground">The map didn’t load. Reload the page to try again.</p>'; return; }
  if (ticket !== building) return;
  if (!proj) setupProjection();
  ORDER.forEach((k) => { const v = VIEWS[k]; v.tiles = v.meshes = v.bars = v.rain = v.grid = v.cloud = v.drops = v.trackG = v.markG = v.cols = v.borders = v.flow = v.hex = v.ameshes = v.alabels = undefined; v.rlabels = null; v.built = false; });
  const v = VIEWS[view];
  renderPanel();
  v.build(); v.built = true;
  camera.position.set(...v.camera); controls.target.set(...v.target);
  try { history.replaceState(null, '', `?view=${view}`); } catch { /* sandboxed */ }
  // a tab whose live data has never been synced fetches it once; history stays on its icon
  const fresh = GROUPS.filter((g) => g.view === view && !g.history && !STORE.groupAt?.[g.id]).map((g) => g.id);
  if (fresh.length) runSync(fresh);
}
// The page is ready once the base layer is in and the stored data is applied; with nothing stored, sync once.
const ready = baseReady.then(() => restoreStore());

function stopPlay() { clearInterval(playTimer); playTimer = null; const b = $('#play'); if (b) { b.innerHTML = '<i class="fi fi-rr-play"></i>'; b.setAttribute('aria-label', 'Play the day'); } }
function play() {
  if (playTimer) { stopPlay(); return; }
  if (state.view === 'weather' && RP.status === 'ready') {
    if (RP.i >= RP.frames.length - 1) setReplay(0);
    playTimer = setInterval(() => { if (RP.i >= RP.frames.length - 1) { stopPlay(); return; } setReplay(RP.i + 1); }, reduceMotion ? 600 : 160);
  } else if (state.view === 'taxis' && TX.frames.length) {
    if (TX.hour == null || TX.hour >= TX.frames.length - 1) setTaxiHour(0);
    playTimer = setInterval(() => { if (TX.hour >= TX.frames.length - 1) { stopPlay(); return; } setTaxiHour(TX.hour + 1); }, reduceMotion ? 1400 : 800);
  } else return;
  const b = $('#play'); if (b) { b.innerHTML = '<i class="fi fi-rr-pause"></i>'; b.setAttribute('aria-label', 'Pause'); }
}

// Ease the camera and its target together to a new view.
function flyCam(target, pos, dur = 1200) {
  if (reduceMotion) { controls.target.copy(target); camera.position.copy(pos); return; }
  fly = { t0: performance.now(), dur, ft: controls.target.clone(), fp: camera.position.clone(), tt: target, tp: pos };
}
function flyArea(i) { const a = AREAS[i], t = V3(...a.c, 0); flyCam(t, t.clone().add(new THREE.Vector3(-2, 7, 8.5))); }
function selectArea(i) {
  state.area = state.area === i ? null : i; state.gauge = null;
  if (state.view === 'air') { state.area = null; const r = i == null ? null : VIEWS.air.regionOf(AREAS[i]); if (r) selectRegion(r); return; }
  if (state.view === 'carparks') state.cp = null;
  VIEWS[state.view].update(); VIEWS[state.view].fill(); renderDetail();
}

// ================= events =================
// Back to the tab's starting view of the whole island.
function resetCamera() { const v = VIEWS[state.view]; flyCam(new THREE.Vector3(...v.target), new THREE.Vector3(...v.camera), 900); }
$('#reset-cam').onclick = resetCamera;
document.addEventListener('keydown', (e) => { if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) resetCamera(); });
$('#sync').onclick = (e) => { e.stopPropagation(); const m = $('#sync-menu'); m.hidden = !m.hidden; $('#sync').setAttribute('aria-expanded', !m.hidden); syncMenu(); };
$('#sync-menu').addEventListener('click', (e) => {
  e.stopPropagation();
  const g = e.target.closest('[data-sync-group]'); if (g) { runSync([g.dataset.syncGroup]); return; }
  if (e.target.closest('#auto-toggle')) { e.preventDefault(); setAuto(!auto.on); return; }
  if (e.target.closest('[data-sync-all]')) { runSync(); return; }
  if (e.target.closest('#sync-reset')) clearStore();
});
document.addEventListener('click', () => { const m = $('#sync-menu'); if (!m.hidden) { m.hidden = true; $('#sync').setAttribute('aria-expanded', 'false'); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const m = $('#sync-menu'); if (!m.hidden) { m.hidden = true; $('#sync').focus(); } } });
$('#tabs').onclick =(e) => { const b = e.target.closest('[data-tab]'); if (b && b.dataset.tab !== state.view) show(b.dataset.tab); };
$('#panel').addEventListener('input', (e) => {
  if (e.target.id === 'rp-i') { if (playTimer) stopPlay(); setReplay(+e.target.value); }
  if (e.target.id === 'tx-i') { if (playTimer) stopPlay(); setTaxiHour(+e.target.value); }
  if (e.target.id === 'cp-search') cpSearch(e.target.value);
});
$('#panel').addEventListener('change', (e) => { if (e.target.id === 'tx-from') { state.txFrom = e.target.value === '' ? null : +e.target.value; VIEWS.taxis.update(); refreshPanel(); } });
$('#panel').addEventListener('keydown', (e) => {
  if (e.target.id === 'cp-search' && e.key === 'Enter' && cpResults[0]) { selectCp(cpResults[0].i, true); e.target.value = ''; cpSearch(''); }
  if (e.target.id === 'cp-search' && e.key === 'Escape') { e.target.value = ''; cpSearch(''); }
});
$('#panel').addEventListener('click', (e) => {
  const t = e.target;
  const rg = t.closest('[data-region]'); if (rg) { selectRegion(rg.dataset.region); return; }
  const gb = t.closest('[data-gauge]'); if (gb) { selectGauge(gb.dataset.gauge); return; }
  const tb = t.closest('[data-track]'); if (tb) { playTrack(+tb.dataset.track); return; }
  const sg = t.closest('[data-sync-group]'); if (sg) { runSync([sg.dataset.syncGroup]); return; }
  if (t.closest('#play')) { play(); return; }
  if (t.closest('#rp-off')) { if (playTimer) stopPlay(); RP.on = false; VIEWS.weather.update(); replayRow(); renderDetail(); return; }
  if (t.closest('#rp-on')) { RP.on = true; VIEWS.weather.update(); replayRow(); renderDetail(); return; }
  if (t.closest('#tx-live')) { if (playTimer) stopPlay(); TX.hour = null; VIEWS.taxis.update(); refreshPanel(); return; }
  const hb = t.closest('[data-hour]'); if (hb) { if (playTimer) stopPlay(); setTaxiHour(+hb.dataset.hour); return; }
  const s = (name) => t.closest(`[data-${name}]`);
  let b;
  if ((b = s('wmode'))) { state.wmode = b.dataset.wmode; markSeg('wmode', b); VIEWS.weather.update(); return; }
  if ((b = s('rpcum'))) { RP.cum = b.dataset.rpcum === '1'; markSeg('rpcum', b); VIEWS.weather.drawRain(); return; }
  if ((b = s('air'))) { state.air = b.dataset.air; markSeg('air', b); VIEWS.air.update(); refreshPanel(); return; }
  if ((b = s('taxi'))) { state.taxi = b.dataset.taxi; renderPanel(); VIEWS.taxis.update(); return; }
  if ((b = s('cp'))) { state.cpFilter = b.dataset.cp; markSeg('cp', b); VIEWS.carparks.update(); return; }
  if ((b = s('cpick'))) { selectCp(cpResults[+b.dataset.cpick].i, true); $('#cp-search').value = ''; cpSearch(''); return; }
  if ((b = s('cp'))) return;
  if ((b = t.closest('[data-cp]'))) return;
  if ((b = t.closest('button[data-cp]'))) return;
  if (t.closest('[data-clear]')) { state.area = null; state.region = null; state.gauge = null; if (state.view === 'carparks') state.cp = null; VIEWS[state.view].update(); VIEWS[state.view].fill(); renderDetail(); return; }
  if ((b = s('area'))) { selectArea(+b.dataset.area); if (state.area != null) flyArea(state.area); }
});
// carpark buttons in the area list share data-cp with the filter seg, so pick them out by their numeric value
$('#panel').addEventListener('click', (e) => { const b = e.target.closest('button[data-cp]'); if (b && /^\d+$/.test(b.dataset.cp)) selectCp(+b.dataset.cp, true); }, true);
$('#panel').addEventListener('focusout', (e) => { if (e.target.id === 'cp-search') setTimeout(() => { if (document.activeElement?.id !== 'cp-search') { const l = $('#cp-list'); if (l) l.hidden = true; } }, 150); });
const markSeg = (name, btn) => document.querySelectorAll(`[data-${name}]`).forEach((x) => { x.dataset.state = x === btn ? 'active' : ''; });

// ================= hover and click on the 3D map =================
const tip = $('#tip'), ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
ray.params.Points.threshold = 0.05;
function pickAt(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(pickables, false).find((h) => h.object.visible && (h.instanceId == null || h.object.userData.alive?.(h.instanceId) !== false));
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const hit = pickAt(ev);
  renderer.domElement.style.cursor = hit ? 'pointer' : '';
  if (!hit?.object.userData.pick) { tip.hidden = true; return; }
  tip.innerHTML = hit.object.userData.pick(hit);
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = `${ev.clientX + 14 + w > innerWidth ? ev.clientX - w - 14 : ev.clientX + 14}px`;
  tip.style.top = `${ev.clientY + 14 + h > innerHeight ? ev.clientY - h - 14 : ev.clientY + 14}px`;
});
renderer.domElement.addEventListener('pointerleave', () => { tip.hidden = true; });
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const h = pickAt(e), o = h?.object;
  if (state.view === 'carparks' && o === VIEWS.carparks.bars?.mesh) { selectCp(h.instanceId === state.cp ? null : h.instanceId); return; }
  if (o?.userData.onClick) { o.userData.onClick(h); return; }
  const area = o?.userData.area;
  if (area != null) { selectArea(area); return; }
  if (!h && (state.area != null || state.region != null || state.cp != null || state.gauge != null)) { state.area = null; state.region = null; state.cp = null; state.gauge = null; VIEWS[state.view].update(); VIEWS[state.view].fill(); renderDetail(); }
});

// ================= loop =================
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h; camera.fov = w < 700 ? 52 : 34;
  if (w >= 900) camera.setViewOffset(w, h, -205, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => {
  tickers.forEach((f) => f());
  if (fly) {
    const k = Math.min(1, (performance.now() - fly.t0) / fly.dur), e = d3.easeCubicInOut(k);
    controls.target.lerpVectors(fly.ft, fly.tt, e); camera.position.lerpVectors(fly.fp, fly.tp, e);
    if (k === 1) fly = null;
  }
  controls.update(); renderer.render(scene, camera); labelR.render(scene, camera);
});
renderTabs();
const initial = new URLSearchParams(location.search).get('view');
document.fonts.ready.then(() => show(ORDER.includes(initial) ? initial : 'weather'));
</script>
