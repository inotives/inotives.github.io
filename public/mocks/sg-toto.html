<!--
  Playground mock: Singapore ToTo results since the 6/49 game began (draw 2995, 9 October 2014), in 3D.
  Views: Board (the 49 numbers as columns, height against chance, colour by draws since last seen),
  History (every draw as a wall of balls running back in time, with Group 1 jackpots), Patterns
  (sums, odd/even, low/high, ranges, back-to-back numbers, repeats and pairs against exact chance)
  and Picks (number-stats methods that pick a ticket, with a walk-forward backtest against chance).
  Earlier draws were a 6/45 game with different odds, so the parser drops them and every view uses
  6/49 draws only. Data: Singapore Pools' historical results CSV, bundled as public/mocks/data/sg-toto.json
  by scripts/mocks/sg-toto/build.mjs (which reuses the parser between the toto-csv markers below).
  "Update data" reads a newer CSV in the browser and keeps it in IndexedDB, with saved tickets.
  Three.js draws the stage; D3 provides scales, colour and formatting.
-->

<script>
/* <pg-layout-js v1> Playground layout standard: the mobile drawer (scripts/mocks/template/playground.html).
   Opens from #drawer-btn; closes from #drawer-close, the scrim, Escape, links to #anchors or
   [data-drawer-close] inside it, and when the window grows past 900px. Mirrors #legend into
   #drawer-legend. Mocks can call window.pgDrawer.open() / .close(). Keep identical across mocks. */
(() => {
  const body = document.body, btn = document.getElementById('drawer-btn');
  const set = (open) => { body.dataset.drawer = open ? 'open' : ''; btn?.setAttribute('aria-expanded', String(open)); };
  const close = (refocus) => { if (body.dataset.drawer !== 'open') return; set(false); if (refocus) btn?.focus(); };
  btn?.addEventListener('click', () => set(body.dataset.drawer !== 'open'));
  document.getElementById('drawer-close')?.addEventListener('click', () => close(true));
  document.getElementById('scrim')?.addEventListener('click', () => close(false));
  document.getElementById('drawer')?.addEventListener('click', (e) => { if (e.target.closest('a[href^="#"], [data-drawer-close]')) close(false); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && body.dataset.drawer === 'open') { e.stopImmediatePropagation(); close(true); } }, true);
  matchMedia('(min-width: 900px)').addEventListener('change', (m) => { if (m.matches) set(false); });
  const legend = document.getElementById('legend'), copy = document.getElementById('drawer-legend');
  if (legend && copy) {
    const sync = () => { copy.innerHTML = legend.hidden ? '' : legend.innerHTML.trim(); };
    new MutationObserver(sync).observe(legend, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
    sync();
  }
  window.pgDrawer = { open: () => set(true), close: () => close(false) };
})();
/* </pg-layout-js> */
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ================= results CSV =================
// Shared with scripts/mocks/sg-toto/build.mjs, which imports this block: keep it self-contained.
// <toto-csv>
const TOTO_GROUPS = 7;
// The game moved from 6/45 to 6/49 at this draw (9 October 2014). Earlier draws had different odds,
// so they would skew every count and test: the parser skips them.
const FIRST_649_DRAW = 2995;
function parseToto(text) {
  const rows = [];
  for (const line of String(text).replace(/^﻿/, '').split(/\r?\n/)) {
    if (!line.trim()) continue;
    const cells = [];
    let cur = '', quoted = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (quoted) {
        if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') quoted = false; else cur += ch;
      } else if (ch === '"') quoted = true;
      else if (ch === ',') { cells.push(cur); cur = ''; } else cur += ch;
    }
    cells.push(cur);
    rows.push(cells.map((c) => c.trim()));
  }
  const head = rows.shift() || [];
  const col = (name) => head.findIndex((h) => h.toLowerCase() === name.toLowerCase());
  const iDraw = col('Draw'), iDate = col('Date'), iN1 = col('Winning Number 1'), iAdd = col('Additional Number');
  if (iDraw < 0 || iDate < 0 || iN1 < 0 || iAdd < 0) throw new Error('Not a ToTo results CSV: expected Draw, Date, Winning Number 1 and Additional Number columns');
  const iWin = d3range(TOTO_GROUPS).map((g) => [col(`Division ${g + 1} Winners`), col(`Division ${g + 1} Prize`)]);
  const seen = new Map();
  for (const r of rows) {
    const draw = Number(r[iDraw]);
    if (!Number.isInteger(draw) || draw < FIRST_649_DRAW) continue;
    const date = r[iDate];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) throw new Error(`Draw ${draw}: date "${date}" is not YYYY-MM-DD`);
    const n = d3range(6).map((i) => Number(r[iN1 + i])).sort((a, b) => a - b);
    const add = Number(r[iAdd]);
    const all = [...n, add];
    if (all.some((x) => !Number.isInteger(x) || x < 1 || x > 49) || new Set(all).size !== 7) throw new Error(`Draw ${draw}: numbers ${all.join(' ')} are not seven different numbers from 1 to 49`);
    let prizes = null;
    if (iWin.every(([w, p]) => w >= 0 && p >= 0) && r[iWin[0][0]] !== '' && r[iWin[0][0]] != null) {
      prizes = iWin.map(([w, p]) => [Number(r[w]) || 0, Number(String(r[p]).replace(/,/g, '')) || 0]);
    }
    seen.set(draw, { draw, date, n, add, prizes });
  }
  const draws = [...seen.values()].sort((a, b) => a.draw - b.draw);
  if (!draws.length) throw new Error('No 6/49 draws (from draw 2995, October 2014) found in the CSV');
  return draws;
}
function d3range(n) { return Array.from({ length: n }, (_, i) => i); }
const toCompact = (d) => [d.draw, d.date, ...d.n, d.add, d.prizes ? d.prizes.flat() : 0];
const fromCompact = (a) => ({ draw: a[0], date: a[1], n: a.slice(2, 8), add: a[8], prizes: a[9] ? d3range(TOTO_GROUPS).map((g) => [a[9][g * 2], a[9][g * 2 + 1]]) : null });
// </toto-csv>

// ================= helpers =================
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const B = { paper: '#15171b', raise: '#1d2026', muted: '#23262d', line: '#2b2f37', ink: '#e4e1d8', ink2: '#b8b5ac', fog: '#8b9099', signal: '#1fefd7', amber: '#f6c453', pink: '#e58fb0', sky: '#7cc4dc' };
// draws since a number was last seen: fresh (cyan) to overdue (amber, then pink)
const RAMP_STOPS = ['#174d49', '#1fefd7', '#f6c453', '#e58fb0'];
const RAMP = d3.interpolateRgbBasis(RAMP_STOPS);
const GAP_MAX = 30;
const gapColor = (g) => RAMP(Math.min(1, g / GAP_MAX));
let toastTimer;
const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3600); };
const f = { int: d3.format(','), pct: d3.format('.1%'), pct2: d3.format('.2%'), d2: d3.format('.2f'), d3: d3.format('.3f'), money: (v) => `$${d3.format(',.0f')(v)}`, big: (v) => (v >= 1e6 ? `$${d3.format('.2f')(v / 1e6)}M` : `$${d3.format(',.0f')(v)}`) };
const fmtDate = (iso) => new Date(`${iso}T00:00:00`).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const fmtShort = (iso) => new Date(`${iso}T00:00:00`).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const choose = (n, k) => { if (k < 0 || k > n) return 0; let r = 1; for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i; return r; };
const mulberry32 = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// shadcn/ui-style building blocks for the panel
const btnCls = 'inline-flex h-8 items-center justify-center gap-1.5 whitespace-nowrap rounded-md border bg-background px-3 text-xs font-medium transition-colors hover:bg-accent focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50';
const primaryCls = 'inline-flex h-8 items-center justify-center gap-1.5 whitespace-nowrap rounded-md bg-primary px-3 text-xs font-medium text-primary-foreground shadow transition-colors hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50';
const kpi = (label, value, sub = '') => `<div class="min-w-0 rounded-lg border bg-background/40 px-2.5 py-2"><div class="truncate text-[11px] text-muted-foreground">${esc(label)}</div><div class="truncate text-sm font-semibold">${value}</div>${sub ? `<div class="truncate text-[11px] text-muted-foreground">${sub}</div>` : ''}</div>`;
const section = (title, body, icon = '') => `<div class="mt-4"><div class="mb-1.5 flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-muted-foreground">${icon ? `<i class="fi ${icon}"></i>` : ''}${esc(title)}</div>${body}</div>`;
const toggle = (opts, value, act) => `<div class="inline-flex h-8 max-w-full items-center overflow-x-auto rounded-md bg-muted p-0.5 text-xs text-muted-foreground">${opts.map(([v, l]) => `<button type="button" data-act="${act}" data-v="${v}" data-state="${String(v) === String(value) ? 'active' : ''}" class="whitespace-nowrap rounded px-2.5 py-1 font-medium transition-colors hover:text-foreground data-[state=active]:bg-background data-[state=active]:text-foreground data-[state=active]:shadow">${esc(l)}</button>`).join('')}</div>`;
const row = (k, v) => `<div class="flex items-baseline justify-between gap-3 py-0.5 text-xs"><span class="shrink-0 text-muted-foreground">${k}</span><span class="min-w-0 truncate text-right font-mono text-[12px]">${v}</span></div>`;
const ball = (k, cls = '', act = 'num') => `<button type="button" data-act="${act}" data-v="${k}" class="ball ${cls}" aria-label="Number ${k}">${k}</button>`;
const sw = (on, act, text) => `<button type="button" role="switch" aria-checked="${on}" data-act="${act}" class="flex w-full items-center justify-between gap-3 rounded-md py-1 text-xs"><span>${esc(text)}</span><span class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full transition-colors ${on ? 'bg-primary' : 'bg-input'}"><span class="inline-block size-4 rounded-full bg-background shadow transition-transform ${on ? 'translate-x-4' : 'translate-x-0.5'}"></span></span></button>`;
const note = (html) => `<p class="mt-3 text-[11px] leading-relaxed text-muted-foreground">${html}</p>`;

// ================= browser datastore (IndexedDB) =================
// The bundled CSV export is the fallback; a newer CSV loaded with "Update data" and saved
// tickets are kept here. Wrap every call: storage can be blocked.
const IDB = { name: 'inotives-sg-toto', store: 'kv' };
function idbOpen() {
  return new Promise((ok, no) => { const r = indexedDB.open(IDB.name, 1); r.onupgradeneeded = () => r.result.createObjectStore(IDB.store); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
}
async function idb(mode, fn) {
  const db = await idbOpen();
  try { return await new Promise((ok, no) => { const tx = db.transaction(IDB.store, mode), req = fn(tx.objectStore(IDB.store)); tx.oncomplete = () => ok(req?.result); tx.onerror = () => no(tx.error); }); }
  finally { db.close(); }
}
const store = {
  get: async (key) => { try { return await idb('readonly', (s) => s.get(key)); } catch { return null; } },
  put: async (key, value) => { try { await idb('readwrite', (s) => s.put(value, key)); return true; } catch { return false; } },
  del: async (key) => { try { await idb('readwrite', (s) => s.delete(key)); } catch { /* blocked */ } },
};

// ================= data and stats =================
const NUMS = d3.range(1, 50);
const pool = () => 49;          // every draw is 6/49: the parser drops the earlier 6/45 game
const lowCut = () => 24;        // the results file's Low/High split
const GROUPS = [
  { g: 1, m: 6, add: false, text: '6 numbers' }, { g: 2, m: 5, add: true, text: '5 + additional' }, { g: 3, m: 5, add: false, text: '5 numbers' },
  { g: 4, m: 4, add: true, text: '4 + additional' }, { g: 5, m: 4, add: false, text: '4 numbers' }, { g: 6, m: 3, add: true, text: '3 + additional' }, { g: 7, m: 3, add: false, text: '3 numbers' },
];

function zwAnimate(dt) {

    const bob = reduceMotion ? 0 : Math.sin(performance.now() / 900 + o.phase) * 0.05 * k;
    o.m.position.lerpVectors(c.pole.position, o.target, k).y += Math.sin(k * Math.PI) * 1.2 + bob;

    s.beam.geometry.setDrawRange(0, Math.ceil(49 * beamK));
    s.beam.material.opacity = u > 1.2 ? Math.max(0.25, 0.9 - (u - 1.2) * 0.5) : 0.9;

    renderPanel();
  }
  else if (act === 'unsave') { state.tickets.splice(Number(v), 1); await store.put('tickets', state.tickets); renderPanel(); }
  else if (act === 'reset-data') { await store.del('data'); await loadData(); toast('Back to the bundled data'); }
});
function readBirth() {
  const form = $('#panel [data-form="birth"]');
  if (!form) return;
  const b = { date: form.date.value || state.zw.birth.date, time: Number(form.time.value), gender: form.gender.value };
  state.zw.birth = b;
  store.put('birth', b);
}
$('#panel').addEventListener('change', (e) => { if (e.target.closest('[data-form="birth"]')) readBirth(); });
$('#panel').addEventListener('submit', (e) => {
  if (e.target.closest('[data-form="birth"]')) { e.preventDefault(); readBirth(); return castAndPlay(); }
  if (e.target.closest('[data-form="zwpast"]')) {
    e.preventDefault();
    const q = e.target.q.value.trim(), i = D.findIndex((d) => d.draw === Number(q));
    if (i < 0) return toast(`No draw ${q} in the data`);
    state.zw.past = i; return castAndPlay();
  }
  const form = e.target.closest('[data-form="jump"]');
  if (!form) return;
  e.preventDefault();
  const q = form.q.value.trim();
  let i = -1;
  if (/^\d{4}-\d{2}-\d{2}$/.test(q)) { i = D.findIndex((d) => d.date >= q); if (i < 0) i = D.length - 1; }
  else if (/^\d+$/.test(q)) i = D.findIndex((d) => d.draw === Number(q));
  if (i < 0) return toast(`No draw matches “${q}”`);
  state.hist.playing = false; selectDraw(i);
});

// "Update data": read a newer results CSV in the browser and keep it in IndexedDB
$('#csv').addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;
  try {
    const draws = parseToto(await file.text());
    const saved = await store.put('data', { draws: draws.map(toCompact), at: new Date().toISOString(), name: file.name });
    setData(draws, saved ? 'stored' : 'bundled');
    show();
    toast(`${f.int(draws.length)} draws to ${fmtShort(draws.at(-1).date)}${saved ? ', kept in this browser' : ' (storage is blocked, so only for this visit)'}`);
  } catch (err) { toast(err.message || 'Couldn’t read that file'); }
});

// ================= picking =================
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const hit = (e) => {
  if (!current?.picks) return null;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const h = ray.intersectObjects(current.picks.filter((o) => o.visible && (!o.parent || o.parent.visible)), false)[0];
  return h ? h.object.userData.pick(h.instanceId) : null;
};
const tip = $('#tip');
function hideTip() { tip.hidden = true; renderer.domElement.style.cursor = ''; }
let hoverQueued = null;
renderer.domElement.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') hoverQueued = e; });
renderer.domElement.addEventListener('pointerleave', () => { hoverQueued = null; hideTip(); });
const runHover = () => {
  if (!hoverQueued) return;
  const e = hoverQueued; hoverQueued = null;
  const p = hit(e);
  if (!p) return hideTip();
  tip.innerHTML = p.tip; tip.hidden = false;
  renderer.domElement.style.cursor = p.click ? 'pointer' : '';
  tip.style.left = `${Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)}px`;
  tip.style.top = `${Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8)}px`;
};
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const p = hit(e);
  if (p?.click) { hideTip(); p.click(); }
});
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.view === 'board' && state.sel != null) { state.sel = null; paintBoard(current.board, { sel: null }); renderPanel(); }
});

// ================= loop =================
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (flight) {
    flight.t = Math.min(1, flight.t + dt * 1.6);
    const e = 1 - (1 - flight.t) ** 3;
    camera.position.lerpVectors(flight.from.pos, flight.to.pos, e);
    controls.target.lerpVectors(flight.from.target, flight.to.target, e);
    if (flight.t >= 1) flight = null;
  }
  current?.tick?.(dt);
  // History replay: keep the camera on the moving row
  if (state.view === 'history' && state.hist.playing && current?.sel && !flight) {
    const z = -hz(state.hist.i), dz = z - 3 - controls.target.z;
    controls.target.z += dz * Math.min(1, dt * 5); camera.position.z += dz * Math.min(1, dt * 5);
  }
  runHover();
  controls.update(); renderer.render(scene, camera); labelR.render(scene, camera);
});

// ================= boot =================
function setData(draws, source) {
  CACHE = {};
  D = draws.filter((d) => d.draw >= FIRST_649_DRAW);   // also trims data stored before the parser dropped 6/45 draws
  state.source = source;
  state.hist.i = D.length - 1;
  state.sel = null; state.picks.bt = null; state.zw.chart = null; state.zw.past = null;
}
async function loadData() {
  let bundled = null;
  try { const r = await fetch('data/sg-toto.json'); if (!r.ok) throw new Error(r.status); bundled = (await r.json()).draws.map(fromCompact); } catch { /* fall back to stored */ }
  const kept = await store.get('data');
  const stored = kept?.draws?.length ? kept.draws.map(fromCompact) : null;
  // a stored CSV wins only while it is newer than the bundle
  if (stored && (!bundled || stored.at(-1).draw > bundled.at(-1).draw)) setData(stored, 'stored');
  else if (bundled) setData(bundled, 'bundled');
  else throw new Error('no data');
  show({ instant: true });
}
(async () => {
  resize();
  const v = new URL(location.href).searchParams.get('view');
  if (VIEWS[v]) state.view = v;
  renderTabs();
  state.tickets = (await store.get('tickets')) || [];
  const birth = await store.get('birth'); if (birth?.date) state.zw.birth = birth;
  try { await loadData(); } catch { $('#panel').innerHTML = '<p class="text-sm">Couldn’t load the results data.</p>'; }
})();
</script>
