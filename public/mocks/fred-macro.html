<title>US Macro Regimes</title>
<!--
  US macro regimes: reads 27 FRED series into four scores (growth, inflation, liquidity, risk
  appetite), places every month since 1991 in one of four regimes by where growth and inflation are
  heading, and turns the current regime into trading directions from what five assets did after
  past months in the same regime.

  Views:
  - Regime: Three.js tunnel. x = growth momentum, y = inflation momentum, z = time, one point per
    month along a thread; grey frames mark NBER recessions. Opens at today's end looking back.
  - Signals: D3, the four pillar scores over time with recessions and the regime strip.
  - Liquidity: D3, Fed net liquidity (balance sheet − reverse repo − Treasury account) against
    stocks or Bitcoin, and policy rates.
  - Playbook: D3, average forward return and hit rate per regime and asset; nearest past months
    ("rhymes with") in the panel.

  Data: FRED, Federal Reserve Bank of St. Louis (fred.stlouisfed.org), bundled as monthly averages
  in data/fred-macro.json by scripts/mocks/fred-macro/build.mjs (`npm run fred`). FRED sends no
  CORS headers, so the page can't fetch it directly: the panel links FRED's own zip downloads and
  "Update data" reads them into IndexedDB. readFredFiles()/toMonthly() mirror build.mjs.
  Scores are z-scores over the whole sample, so history is scored with hindsight; trading
  directions only use months before the one being read.
-->

<script>
/* <pg-layout-js v1> Playground layout standard: the mobile drawer (scripts/mocks/template/playground.html).
   Opens from #drawer-btn; closes from #drawer-close, the scrim, Escape, links to #anchors or
   [data-drawer-close] inside it, and when the window grows past 900px. Mirrors #legend into
   #drawer-legend. Mocks can call window.pgDrawer.open() / .close(). Keep identical across mocks. */
(() => {
  const body = document.body, btn = document.getElementById('drawer-btn');
  const set = (open) => { body.dataset.drawer = open ? 'open' : ''; btn?.setAttribute('aria-expanded', String(open)); };
  const close = (refocus) => { if (body.dataset.drawer !== 'open') return; set(false); if (refocus) btn?.focus(); };
  btn?.addEventListener('click', () => set(body.dataset.drawer !== 'open'));
  document.getElementById('drawer-close')?.addEventListener('click', () => close(true));
  document.getElementById('scrim')?.addEventListener('click', () => close(false));
  document.getElementById('drawer')?.addEventListener('click', (e) => { if (e.target.closest('a[href^="#"], [data-drawer-close]')) close(false); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && body.dataset.drawer === 'open') { e.stopImmediatePropagation(); close(true); } }, true);
  matchMedia('(min-width: 900px)').addEventListener('change', (m) => { if (m.matches) set(false); });
  const legend = document.getElementById('legend'), copy = document.getElementById('drawer-legend');
  if (legend && copy) {
    const sync = () => { copy.innerHTML = legend.hidden ? '' : legend.innerHTML.trim(); };
    new MutationObserver(sync).observe(legend, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
    sync();
  }
  window.pgDrawer = { open: () => set(true), close: () => close(false) };
})();
/* </pg-layout-js> */
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ================= helpers =================
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const B = { paper: '#15171b', raise: '#1d2026', muted: '#23262d', line: '#2b2f37', ink: '#e4e1d8', ink2: '#b8b5ac', fog: '#8b9099', signal: '#1fefd7', amber: '#f6c453', good: '#9ccf7f', bad: '#f2706b', sky: '#7cc4dc', clay: '#e9a66c', rose: '#e58fb0', violet: '#c9a4f5' };
let toastTimer;
const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3600); };
const tip = $('#tip');
function showTip(html, ev) {
  tip.innerHTML = html; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.left = `${x}px`; tip.style.top = `${y}px`;
}
const hideTip = () => { tip.hidden = true; };

// shadcn/ui-style building blocks for the panel
const section = (title, body, icon = '') => `<div class="mt-5"><div class="mb-1.5 flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide text-muted-foreground">${icon ? `<i class="fi ${icon}"></i>` : ''}${esc(title)}</div>${body}</div>`;
const btnCls = 'inline-flex h-8 items-center justify-center gap-1.5 rounded-md border bg-background/60 px-2.5 text-xs font-medium transition-colors hover:bg-accent focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:opacity-50';
const toggle = (opts, value, act) => `<div class="inline-flex h-8 max-w-full items-center overflow-x-auto rounded-md bg-muted p-0.5 text-xs text-muted-foreground">${opts.map(([v, l]) => `<button type="button" data-act="${act}" data-v="${v}" data-state="${String(v) === String(value) ? 'active' : ''}" class="whitespace-nowrap rounded px-2.5 py-1 font-medium transition-colors hover:text-foreground data-[state=active]:bg-background data-[state=active]:text-foreground data-[state=active]:shadow">${esc(l)}</button>`).join('')}</div>`;
const extLink = (href, text) => `<a href="${href}" target="_blank" rel="noopener" class="text-primary hover:underline">${esc(text)}</a>`;
const fredLink = (id) => extLink(`https://fred.stlouisfed.org/series/${id}`, id);

const f = {
  pct: d3.format('+.1%'), pct0: d3.format('.0%'), pctU: d3.format('.1%'), sc: d3.format('+.2f'), n2: d3.format('.2f'), pp: (v) => `${d3.format('+.2f')(v)} pp`,
  tn: (v) => `$${d3.format('.2f')(v / 1000)}tn`, int: d3.format(','),
};
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

// ================= browser datastore (IndexedDB) =================
const IDB = { name: 'inotives-fred-macro', store: 'kv' };
function idbOpen() {
  return new Promise((ok, no) => { const r = indexedDB.open(IDB.name, 1); r.onupgradeneeded = () => r.result.createObjectStore(IDB.store); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
}
async function idb(mode, fn) {
  const db = await idbOpen();
  try { return await new Promise((ok, no) => { const tx = db.transaction(IDB.store, mode), req = fn(tx.objectStore(IDB.store)); tx.oncomplete = () => ok(req?.result); tx.onerror = () => no(tx.error); }); }
  finally { db.close(); }
}
const store = {
  get: async (key) => { try { return await idb('readonly', (s) => s.get(key)); } catch { return null; } },
  put: async (key, value) => { try { await idb('readwrite', (s) => s.put(value, key)); return true; } catch { return false; } },
  del: async (key) => { try { await idb('readwrite', (s) => s.delete(key)); } catch { /* blocked */ } },
};

// ================= FRED files → monthly series (mirrors scripts/mocks/fred-macro/build.mjs) =================
const START = '1990-01';
const SETS = [
  { id: 'growth', name: 'Growth and inflation', ids: ['INDPRO', 'PAYEMS', 'ICSA', 'UNRATE', 'RSAFS', 'CPIAUCSL', 'PCEPILFE', 'T5YIE', 'USREC'] },
  { id: 'liquidity', name: 'Liquidity and rates', ids: ['FEDFUNDS', 'WALCL', 'RRPONTSYD', 'WTREGEN', 'M2SL', 'DGS10', 'DGS2', 'T10Y2Y', 'T10Y3M'] },
  { id: 'markets', name: 'Markets and stress', ids: ['BAMLH0A0HYM2', 'BAA10Y', 'NFCI', 'VIXCLS', 'DTWEXBGS', 'SP500', 'NASDAQCOM', 'DCOILWTICO', 'CBBTCUSD'] },
];
const KNOWN = new Set(SETS.flatMap((s) => s.ids));
const setUrl = (s) => `https://fred.stlouisfed.org/graph/fredgraph.csv?id=${s.ids.join(',')}`;

function parseCsv(text, obs) {
  const [head, ...rows] = text.trim().split(/\r?\n/);
  const cols = head.split(',');
  if (cols[0] !== 'observation_date') return;
  for (const row of rows) {
    const cells = row.split(',');
    for (let c = 1; c < cols.length; c++) {
      const v = Number(cells[c]);
      if (cells[c] !== '' && cells[c] !== '.' && Number.isFinite(v)) (obs[cols[c]] ||= []).push([cells[0], v]);
    }
  }
}
const inflate = (bytes) => new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
async function readFredFiles(files) {
  const obs = {}, dec = new TextDecoder();
  for (const file of files) {
    const buf = new Uint8Array(await file.arrayBuffer());
    if (buf[0] === 0x50 && buf[1] === 0x4b) {
      const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
      for (let p = 0; p + 30 <= buf.length && dv.getUint32(p, true) === 0x04034b50;) {
        const method = dv.getUint16(p + 8, true), size = dv.getUint32(p + 18, true), nl = dv.getUint16(p + 26, true), xl = dv.getUint16(p + 28, true);
        const name = dec.decode(buf.subarray(p + 30, p + 30 + nl)), at = p + 30 + nl + xl, data = buf.subarray(at, at + size);
        if (name.endsWith('.csv')) parseCsv(method === 8 ? await inflate(data) : dec.decode(data), obs);
        p = at + size;
      }
    } else parseCsv(dec.decode(buf), obs);
  }
  return obs;
}
function toMonthly(obs) {
  const last = Object.values(obs).flat().reduce((m, [d]) => (d > m ? d : m), START);
  const months = [];
  for (let [y, m] = START.split('-').map(Number); `${y}-${String(m).padStart(2, '0')}` <= last.slice(0, 7); m === 12 ? (y++, m = 1) : m++) months.push(`${y}-${String(m).padStart(2, '0')}`);
  const at = new Map(months.map((k, i) => [k, i]));
  const series = {}, lastObs = {};
  for (const [id, list] of Object.entries(obs)) {
    const sum = new Array(months.length).fill(0), n = new Array(months.length).fill(0);
    for (const [d, v] of list) { const i = at.get(d.slice(0, 7)); if (i != null) { sum[i] += v; n[i]++; } }
    series[id] = sum.map((s, i) => (n[i] ? Number((s / n[i]).toPrecision(6)) : null));
    lastObs[id] = list.at(-1)[0];
  }
  return { start: START, months: months.length, series, last: lastObs };
}
// new series replace old ones; series the files don't carry are kept
function mergeRaw(base, upd) {
  const months = Math.max(base?.months || 0, upd.months);
  const pad = (a) => (a.length < months ? a.concat(new Array(months - a.length).fill(null)) : a);
  const series = {}, last = { ...(base?.last || {}), ...upd.last };
  for (const [k, v] of Object.entries(base?.series || {})) series[k] = pad(v);
  for (const [k, v] of Object.entries(upd.series)) series[k] = pad(v);
  return { built: new Date().toISOString().slice(0, 10), source: 'FRED, Federal Reserve Bank of St. Louis', start: START, months, series, last };
}
const newest = (raw) => Object.values(raw?.last || {}).reduce((m, d) => (d > m ? d : m), '');

// ================= the model =================
const REGIMES = [
  { id: 'goldilocks', name: 'Goldilocks', color: B.sky, line: 'Growth is picking up while inflation eases.' },
  { id: 'reflation', name: 'Reflation', color: B.clay, line: 'Growth and inflation are both picking up.' },
  { id: 'stagflation', name: 'Stagflation', color: B.rose, line: 'Growth is slowing while inflation picks up.' },
  { id: 'slowdown', name: 'Slowdown', color: B.violet, line: 'Growth is slowing and inflation is easing.' },
];
const MOMENTUM = 6;   // months: regimes read the 6-month change in the growth and inflation scores
const ASSETS = [
  { id: 'eq', name: 'US stocks', note: 'Nasdaq Composite', series: 'NASDAQCOM', risk: 1 },
  { id: 'bond', name: '10-year Treasuries', note: 'Approximate total return: carry minus 8 × change in yield', series: 'DGS10', risk: -1 },
  { id: 'usd', name: 'US dollar', note: 'Broad trade-weighted index, from 2006', series: 'DTWEXBGS', risk: -1 },
  { id: 'oil', name: 'Crude oil', note: 'WTI spot', series: 'DCOILWTICO', risk: 1 },
  { id: 'btc', name: 'Bitcoin', note: 'Coinbase price, from 2015', series: 'CBBTCUSD', risk: 1 },
];
const PILLARS = [
  { id: 'G', name: 'Growth', color: B.ink, parts: [
    { k: 'ip', name: 'Industrial production, year on year', id: 'INDPRO', fmt: f.pct },
    { k: 'pay', name: 'Payrolls, year on year', id: 'PAYEMS', fmt: f.pct },
    { k: 'claims', name: 'Jobless claims, 3-month average vs a year ago', id: 'ICSA', fmt: f.pct, inv: true },
    { k: 'retail', name: 'Retail sales after inflation, year on year', id: 'RSAFS', fmt: f.pct },
    { k: 'sahm', name: 'Sahm gap: unemployment above its 12-month low', id: 'UNRATE', fmt: f.pp, inv: true },
  ] },
  { id: 'I', name: 'Inflation', color: B.ink, parts: [
    { k: 'cpi', name: 'CPI, year on year', id: 'CPIAUCSL', fmt: f.pct },
    { k: 'core', name: 'Core PCE, year on year', id: 'PCEPILFE', fmt: f.pct },
    { k: 'be', name: '5-year breakeven inflation', id: 'T5YIE', fmt: (v) => `${f.n2(v)}%` },
  ] },
  { id: 'L', name: 'Liquidity', color: B.ink, parts: [
    { k: 'ff6', name: 'Fed funds, change over 6 months', id: 'FEDFUNDS', fmt: f.pp, inv: true },
    { k: 'm2', name: 'M2 money supply, year on year', id: 'M2SL', fmt: f.pct },
    { k: 'nl6', name: 'Net liquidity, change over 6 months', id: 'WALCL', fmt: f.pct },
  ] },
  { id: 'R', name: 'Risk appetite', color: B.ink, parts: [

function buildModel(raw) {
  const N = raw.months, S = raw.series;
  const [y0, m0] = raw.start.split('-').map(Number);
  const mIdx = (i) => ({ y: y0 + Math.floor((m0 - 1 + i) / 12), m: (m0 - 1 + i) % 12 });
  const label = (i) => { const { y, m } = mIdx(i); return `${MON[m]} ${y}`; };
  const date = (i) => { const { y, m } = mIdx(i); return new Date(y, m, 15); };
  const blank = () => new Array(N).fill(null);
  const get = (id) => S[id] || blank();
  // carry a value forward up to 3 months: monthly releases lag the calendar
  const ffill = (a, gap = 3) => { const o = a.slice(); let last = null, age = 0; for (let i = 0; i < N; i++) { if (o[i] != null) { last = o[i]; age = 0; } else if (last != null && ++age <= gap) o[i] = last; } return o; };
  const map = (fn) => Array.from({ length: N }, (_, i) => fn(i));
  const ok = (...v) => v.every((x) => x != null && Number.isFinite(x));
  const pct = (a, k) => map((i) => (i >= k && ok(a[i], a[i - k]) && a[i - k] ? a[i] / a[i - k] - 1 : null));
  const diff = (a, k) => map((i) => (i >= k && ok(a[i], a[i - k]) ? a[i] - a[i - k] : null));
  const avg = (a, k) => map((i) => { if (i < k - 1) return null; let s = 0; for (let j = i - k + 1; j <= i; j++) { if (a[j] == null) return null; s += a[j]; } return s / k; });
  const neg = (a) => a.map((v) => (v == null ? null : -v));
  const z = (a) => { const v = a.filter((x) => x != null); if (!v.length) return a; const m = d3.mean(v), sd = d3.deviation(v) || 1; return a.map((x) => (x == null ? null : Math.max(-3, Math.min(3, (x - m) / sd)))); };
  const mean = (arrs) => map((i) => { const v = arrs.map((a) => a[i]).filter((x) => x != null); return v.length ? d3.mean(v) : null; });
  const s = Object.fromEntries([...KNOWN].map((k) => [k, ffill(get(k))]));

  // the last month with a payrolls release: later months only have market data
  let last = N - 1; while (last > 0 && get('PAYEMS')[last] == null) last--;

  const cpiY = pct(s.CPIAUCSL, 12), retY = pct(s.RSAFS, 12);
  const ua = avg(s.UNRATE, 3);
  const sahm = map((i) => { if (i < 15 || ua[i] == null) return null; let lo = Infinity; for (let j = i - 12; j < i; j++) if (ua[j] != null) lo = Math.min(lo, ua[j]); return ua[i] - lo; });
  const nl = map((i) => (ok(s.WALCL[i], s.RRPONTSYD[i], s.WTREGEN[i]) ? s.WALCL[i] / 1e3 - s.RRPONTSYD[i] - s.WTREGEN[i] / 1e3 : null)); // $bn
  const ind = {
    ip: pct(s.INDPRO, 12), pay: pct(s.PAYEMS, 12), claims: pct(avg(s.ICSA, 3), 12), retail: map((i) => (ok(retY[i], cpiY[i]) ? retY[i] - cpiY[i] : null)), sahm,
    cpi: cpiY, core: pct(s.PCEPILFE, 12), be: s.T5YIE,
    ff6: diff(s.FEDFUNDS, 6), m2: pct(s.M2SL, 12), nl6: pct(nl, 6),
    baa: s.BAA10Y, nfci: s.NFCI, vix: s.VIXCLS, curve: s.T10Y3M, usd6: pct(s.DTWEXBGS, 6),
  };
  const zz = {};
  for (const p of PILLARS) for (const c of p.parts) zz[c.k] = c.inv ? neg(z(ind[c.k])) : z(ind[c.k]);
  const pill = (id) => mean(PILLARS.find((p) => p.id === id).parts.map((c) => zz[c.k]));
  const G = avg(pill('G'), 3), I = avg(pill('I'), 3), L = pill('L'), R = pill('R');
  const gM = diff(G, MOMENTUM), iM = diff(I, MOMENTUM);
  const regime = map((i) => (i <= last && ok(gM[i], iM[i]) ? (gM[i] >= 0 ? (iM[i] < 0 ? 0 : 1) : (iM[i] >= 0 ? 2 : 3)) : null));
  const first = regime.findIndex((r) => r != null);
  const fwd = {
    eq: (i, h) => (ok(s.NASDAQCOM[i], s.NASDAQCOM[i + h]) ? s.NASDAQCOM[i + h] / s.NASDAQCOM[i] - 1 : null),
    bond: (i, h) => (ok(s.DGS10[i], s.DGS10[i + h]) ? (s.DGS10[i] / 100) * (h / 12) - (8 * (s.DGS10[i + h] - s.DGS10[i])) / 100 : null),
    usd: (i, h) => (ok(s.DTWEXBGS[i], s.DTWEXBGS[i + h]) ? s.DTWEXBGS[i + h] / s.DTWEXBGS[i] - 1 : null),
    oil: (i, h) => (ok(s.DCOILWTICO[i], s.DCOILWTICO[i + h]) ? s.DCOILWTICO[i + h] / s.DCOILWTICO[i] - 1 : null),
    btc: (i, h) => (ok(s.CBBTCUSD[i], s.CBBTCUSD[i + h]) ? s.CBBTCUSD[i + h] / s.CBBTCUSD[i] - 1 : null),
  };
  // forward returns in regime r over h months, from months whose window closed before `before`
  const stats = (r, a, h, before = last + 1) => {
    const v = [];
    for (let i = first; i + h < before && i + h < N; i++) if (regime[i] === r) { const x = fwd[a](i, h); if (x != null) v.push(x); }
    if (!v.length) return { n: 0 };
    const mu = d3.mean(v), sd = d3.deviation(v) || 1;
    return { n: v.length, mean: mu, hit: v.filter((x) => x > 0).length / v.length, sr: mu / sd };
  };
  return { N, last, first, label, date, s, ind, nl, G, I, L, R, gM, iM, regime, fwd, stats, usrec: get('USREC') };
}

// trading directions for month t: the forward record of its regime, nudged by liquidity and risk appetite
const DIRS = [['Short', B.bad, -2], ['Lean short', B.bad, -1], ['Neutral', B.fog, 0], ['Lean long', B.good, 1], ['Long', B.good, 2]];
function directions(t, h) {
  const r = M.regime[t];
  const tilt = ((M.L[t] ?? 0) + (M.R[t] ?? 0)) / 2;
  return ASSETS.map((a) => {
    const st = M.stats(r, a.id, h, t + 1);
    if (!st.n) return { a, st, dir: null };
    const score = st.sr + 0.15 * a.risk * tilt;
    const k = score >= 0.4 ? 4 : score >= 0.15 ? 3 : score > -0.15 ? 2 : score > -0.4 ? 1 : 0;
    return { a, st, score, dir: DIRS[k] };

// nearest past months on the six scores, at least a year apart, with a full forward window

  const vec = (i) => [M.G[i], M.gM[i], M.I[i], M.iM[i], M.L[i], M.R[i]];
  const target = vec(t);
  if (target.some((x) => x == null)) return [];
  const cand = [];
  for (let i = M.first; i + h <= M.last && i < t - 24; i++) {
    const v = vec(i); if (v.some((x) => x == null)) continue;

  }
  cand.sort((a, b) => a.d - b.d);

  for (const c of cand) { if (out.every((o) => Math.abs(o.i - c.i) >= 12)) out.push(c); if (out.length === k) break; }
  return out;
}

const heat = d3.scaleDiverging([-0.6, 0, 0.6], (t) => d3.interpolateRgbBasis([B.bad, B.muted, B.good])(t)).clamp(true);
function drawPlaybook() {
  const F = frame(), g = svg.append('g');
  const t = cur(), r = M.regime[t];
  const labW = innerWidth < 600 ? 78 : 100, cols = ASSETS.length;
  const cw = Math.min(150, (F.x1 - F.x0 - labW) / cols), ch = Math.min(84, (F.y1 - F.y0 - 60) / 4);
  const gx = F.x0 + Math.max(0, (F.x1 - F.x0 - labW - cw * cols) / 2), gy = F.y0 + Math.max(24, (F.y1 - F.y0 - ch * 4 - 40) / 2);
  g.append('text').attr('class', 'ttl').attr('x', gx).attr('y', gy - 30).text(`What each asset did over the next ${state.h} months, by regime`);
  ASSETS.forEach((a, c) => g.append('text').attr('x', gx + labW + c * cw + cw / 2).attr('y', gy - 10).attr('text-anchor', 'middle').text(innerWidth < 600 ? a.name.split(' ').at(-1) : a.name));
  REGIMES.forEach((rg, row) => {
    const y = gy + row * ch;

    g.append('text').attr('class', 'ttl').attr('x', gx + 14).attr('y', y + ch / 2 + 4).text(rg.name);
    ASSETS.forEach((a, c) => {
      const st = M.stats(row, a.id, state.h, t + 1), x = gx + labW + c * cw;
      const cell = g.append('g').attr('transform', `translate(${x},${y})`);
      cell.append('rect').attr('x', 2).attr('y', 2).attr('width', cw - 4).attr('height', ch - 4).attr('rx', 6).attr('fill', st.n ? heat(st.sr) : B.raise).attr('opacity', st.n ? 0.55 : 1);
      if (!st.n) { cell.append('text').attr('x', cw / 2).attr('y', ch / 2 + 4).attr('text-anchor', 'middle').text('no data'); return; }
      cell.append('text').attr('x', cw / 2).attr('y', ch / 2 - 2).attr('text-anchor', 'middle').style('font-size', '14px').style('fill', B.ink).text(f.pct(st.mean));
      cell.append('text').attr('x', cw / 2).attr('y', ch / 2 + 15).attr('text-anchor', 'middle').style('fill', B.ink2).text(`${f.pct0(st.hit)} up · ${st.n}`);

  });
  g.append('text').attr('x', gx).attr('y', gy + 4 * ch + 22).text(`Months from ${M.label(M.first)} whose ${state.h}-month window closed by ${M.label(t)}. Cells: average return, share of months it rose, number of months.`);
}

}
function select(i, go = false) {
  state.sel = i == null || i === M.last ? null : i;
  show();
  if (go && state.view === 'regime') travel(state.sel ?? M.last, true);
}

$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  state.view = b.dataset.tab;
  const u = new URL(location.href); u.searchParams.set('view', state.view); history.replaceState(null, '', u);
  show();
});
$('#panel').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const { act, v } = b.dataset;
  if (act === 'h') { state.h = Number(v); show(); }
  else if (act === 'compare') { state.compare = v; show(); }
  else if (act === 'look') { if (state.view === 'regime') { look(v, true); if (reduceMotion) syncDepth(); } }
  else if (act === 'sel') select(v === '' ? null : Number(v), true);
  else if (act === 'reset') { await store.del('data'); await loadData(); toast('Back to the bundled data'); }
});
$('#panel').addEventListener('input', (e) => { if (e.target.id === 'depth') travel(Number(e.target.value), false); });
$('#files').addEventListener('change', async (e) => {
  const files = [...(e.target.files || [])];
  e.target.value = '';
  if (!files.length) return;
  try {
    const obs = await readFredFiles(files);
    const ids = Object.keys(obs).filter((k) => KNOWN.has(k));
    if (!ids.length) throw new Error('No FRED series this page uses were in those files. Use the three downloads under Update from FRED.');
    const raw = mergeRaw(state.raw, toMonthly(Object.fromEntries(ids.map((k) => [k, obs[k]]))));
    const at = new Date().toISOString();
    const saved = await store.put('data', { raw, at });
    setData(raw, saved ? 'stored' : 'bundled', at);
    show(); buildTunnel();
    toast(`Loaded ${ids.length} series to ${newest(raw)}${saved ? ', saved in this browser' : '. This browser blocks storage, so it lasts until you reload'}`);
  } catch (err) { toast(err.message || 'Couldn’t read those files'); }
});

// ================= data =================
function setData(raw, source, at = null) {
  state.raw = raw; state.source = source; state.storedAt = at; state.sel = null;
  M = buildModel(raw);
}
async function loadData() {
  let bundled = null;
  try { const r = await fetch('data/fred-macro.json'); if (!r.ok) throw new Error(r.status); bundled = await r.json(); } catch { /* fall back to stored */ }
  const kept = await store.get('data');
  // stored data wins while it reaches at least as far as the bundle
  if (kept?.raw?.series && (!bundled || newest(kept.raw) >= newest(bundled))) setData(kept.raw, 'stored', kept.at);
  else if (bundled) setData(bundled, 'bundled');
  else throw new Error('no data');
  show(); buildTunnel();
}
(async () => {
  const v = new URL(location.href).searchParams.get('view');
  if (VIEWS[v]) state.view = v;
  resize(); renderTabs();
  try { await loadData(); } catch { $('#panel').innerHTML = '<p class="text-sm">Couldn’t load the FRED data. Reload the page, or load the FRED downloads with Update data.</p>'; return; }
  // the one orchestrated moment: fly from deep history up to today
  camera.position.set(9, 5, -30); controls.target.set(0, 0, -26);
  look('now', true);
})();
</script>
