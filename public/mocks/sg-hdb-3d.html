<title>Singapore HDB Resale</title>
<!--
  Playground mock: Singapore's HDB resale market on a 3D island.
  Three.js draws the island and the bars, D3 does projection, scales, colour and the panel charts,
  Leaflet shows the street map for whatever is selected (OneMap Night tiles). UI recreates
  shadcn/ui in Tailwind with the inoTives brand kit. Icons: Flaticon UIcons.
  Views: planning areas raised by median price per m², and every HDB block as a bar
  (median price, coloured by remaining lease, with a filter for million-dollar sales).
  Data (real): HDB resale flat prices from Jan 2017 (data.gov.sg), block positions from OneMap,
  URA Master Plan 2019 planning-area boundaries. Prepared into data/sg-hdb-resale.json.
  The latest sales for a selected block are fetched live from the data.gov.sg API.
-->

  /* <pg-layout v1> Playground layout standard (scripts/mocks/template/playground.html).
     Side panel: a floating card on the left from 900px wide (.pg-float); below 900px it is a

  }

    body[data-drawer="open"] .pg-drawer { transform: none; visibility: visible; transition: transform 0.22s ease; }
    body[data-drawer="open"] .pg-scrim { display: block; position: fixed; inset: 0; z-index: 44; background: rgb(0 0 0 / 0.5); }
    .pg-drawer-head { display: flex; align-items: center; gap: 0.625rem; flex-shrink: 0; height: 3.5rem; padding: 0 0.75rem 0 1rem; border-bottom: 1px solid #2b2f37; }

    .pg-hide-mobile, .pg-legend { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) { .pg-drawer { transition: none !important; } }

    <a href="/playground" class="pg-hide-mobile pointer-events-auto rounded-sm font-brand text-[26px] leading-none transition-colors hover:text-primary focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" title="Back to the Playground">inoTives</a>

      <button id="drawer-close" type="button" class="inline-flex size-8 items-center justify-center rounded-md hover:bg-accent focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" aria-label="Close the panel"><i class="fi fi-rr-cross-small"></i></button>

<script>
/* <pg-layout-js v1> Playground layout standard: the mobile drawer (scripts/mocks/template/playground.html).
   Opens from #drawer-btn; closes from #drawer-close, the scrim, Escape, links to #anchors or
   [data-drawer-close] inside it, and when the window grows past 900px. Mirrors #legend into
   #drawer-legend. Mocks can call window.pgDrawer.open() / .close(). Keep identical across mocks. */
(() => {
  const body = document.body, btn = document.getElementById('drawer-btn');
  const set = (open) => { body.dataset.drawer = open ? 'open' : ''; btn?.setAttribute('aria-expanded', String(open)); };
  const close = (refocus) => { if (body.dataset.drawer !== 'open') return; set(false); if (refocus) btn?.focus(); };
  btn?.addEventListener('click', () => set(body.dataset.drawer !== 'open'));
  document.getElementById('drawer-close')?.addEventListener('click', () => close(true));
  document.getElementById('scrim')?.addEventListener('click', () => close(false));
  document.getElementById('drawer')?.addEventListener('click', (e) => { if (e.target.closest('a[href^="#"], [data-drawer-close]')) close(false); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && body.dataset.drawer === 'open') { e.stopImmediatePropagation(); close(true); } }, true);
  matchMedia('(min-width: 900px)').addEventListener('change', (m) => { if (m.matches) set(false); });
  const legend = document.getElementById('legend'), copy = document.getElementById('drawer-legend');
  if (legend && copy) {
    const sync = () => { copy.innerHTML = legend.hidden ? '' : legend.innerHTML.trim(); };
    new MutationObserver(sync).observe(legend, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
    sync();
  }
  window.pgDrawer = { open: () => set(true), close: () => close(false) };
})();
/* </pg-layout-js> */
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const B = { paper: '#15171b', raise: '#1d2026', muted: '#23262d', line: '#2b2f37', ink: '#e4e1d8', ink2: '#b8b5ac', fog: '#8b9099', signal: '#1fefd7', amber: '#f6c453', pink: '#e58fb0' };
const RAMP = d3.interpolateRgbBasis(['#174d49', '#1fefd7', '#f6c453', '#e58fb0']);
const GOLD = d3.interpolateRgbBasis(['#3a3426', '#8a6a24', '#f6c453', '#fff3c4']);   // million-dollar sales: dim bronze to bright gold
const PSM_DOMAIN = [4500, 9000];   // S$/m²; a few central areas go well past 9k and are clamped
const LEASE = d3.interpolateRgbBasis(['#e58fb0', '#f6c453', '#9ccf7f', '#1fefd7']);
const CHANGE = d3.interpolateRgbBasis(['#7cc4dc', '#3a3f48', '#e58fb0']);
const sgd = (v) => (v >= 1e6 ? `S$${d3.format('.3~f')(v / 1e6)}M` : `S$${d3.format(',.0f')(Math.round(v / 1000))}k`);
const psmF = (v) => `S$${d3.format(',')(Math.round(v))}/m²`;
const title = (s) => s.toLowerCase().replace(/\b[a-z]/g, (c) => c.toUpperCase()).replace(/\bSt\b(?=\.? |$)/, 'St');

// ================= stage =================
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer(); labelR.domElement.className = 'labels'; stage.appendChild(labelR.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(B.paper, 40, 90);
scene.add(new THREE.HemisphereLight('#cfe9ff', B.paper, 1.2));
const key = new THREE.DirectionalLight('#ffffff', 1.6); key.position.set(-8, 16, 12); scene.add(key);
const camera = new THREE.PerspectiveCamera(34, 1, 0.05, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 1.5; controls.maxDistance = 70; controls.maxPolarAngle = Math.PI * 0.47; controls.autoRotateSpeed = 0.35;
controls.addEventListener('start', () => { controls.autoRotate = false; fly = null; });
let group = new THREE.Group(); scene.add(group);
let pickables = [];
const tickers = new Set();

function lbl(text, pos, cls = '', parent = group) { const d = document.createElement('div'); d.className = `lbl ${cls}`; d.textContent = text; const o = new CSS2DObject(d); o.position.copy(pos); parent.add(o); return o; }
function clearScene() {
  group.traverse((o) => {
    o.geometry?.dispose();
    (Array.isArray(o.material) ? o.material : o.material ? [o.material] : []).forEach((m) => m.dispose());
    if (o.isCSS2DObject) o.element.remove();
  });
  scene.remove(group); group = new THREE.Group(); scene.add(group);
  pickables = []; tickers.clear(); ring = null;
}

// ================= data =================
let DATA = null, AREAS = [], BLOCKS = [], YEARS = [], TOWNS = [];
const dataReady = fetch('data/sg-hdb-resale.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(async (d) => {
  DATA = d; YEARS = d.years;
  AREAS = d.areas.map((a, i) => ({ ...a, i, hdb: a.y.some((y) => y[1] > 0) }));
  BLOCKS = d.blocks.map(([lat, lon, area, lease, blk, st, psm, pk, n, n1m, town, postal], i) => ({ i, lat, lon, area, lease, blk, street: d.streets[st], psm, pk, n, n1m, town, postal }));
  TOWNS = d.towns;
  d.fileLastMonth = d.lastMonth;
  await restoreSync();
  return d;
});
const yi = (y) => y - YEARS[0];
const remaining = (b, y) => 99 - (y - b.lease);
const blockName = (b) => `Blk ${b.blk} ${title(b.street)}`;
const yearLabel = (y) => (y === YEARS.at(-1) ? `${y} to ${d3.timeFormat('%b')(new Date(`${DATA.lastMonth}-01`))}` : `${y}`);

// Projection: Mercator fitted to the island, in world units. x east, z south.
let proj = null;
const P = (lon, lat) => { const [x, y] = proj([lon, lat]); return [x, y]; };
function setupProjection() {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  AREAS.forEach((a) => a.p.forEach((poly) => poly[0].forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); })));
  proj = d3.geoMercator().fitExtent([[-12, -7.5], [12, 7.5]], { type: 'MultiPoint', coordinates: [[x0, y0], [x1, y1]] });
}
function shapeOf(poly) {
  const toV = (r) => r.map(([lon, lat]) => { const [x, z] = P(lon, lat); return new THREE.Vector2(x, -z); });
  const s = new THREE.Shape(toV(poly[0]));
  poly.slice(1).forEach((h) => s.holes.push(new THREE.Path(toV(h))));
  return s;
}
const centroid = (a) => {
  let best = null, ar = -1;
  a.p.forEach((poly) => { const r = poly[0]; const s = Math.abs(d3.polygonArea(r)); if (s > ar) { ar = s; best = r; } });
  return d3.polygonCentroid(best);
};

// The island: every planning area as a flat tile with its border.
function island(dimHdb = false) {
  const g = new THREE.Group();
  const edges = [];
  AREAS.forEach((a) => {
    const shapes = a.p.map(shapeOf);
    const geo = new THREE.ShapeGeometry(shapes); geo.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: a.hdb && !dimHdb ? '#262a31' : '#1f2228', roughness: 0.9 }));
    m.position.y = -0.01; g.add(m);
    a.p.forEach((poly) => poly.forEach((r) => r.forEach((pt, k) => {
      const q = r[(k + 1) % r.length]; const [ax, az] = P(...pt), [bx, bz] = P(...q);
      edges.push(new THREE.Vector3(ax, 0.002, az), new THREE.Vector3(bx, 0.002, bz));
    })));
  });
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(edges), new THREE.LineBasicMaterial({ color: '#3a3f48', transparent: true, opacity: 0.8 })));
  group.add(g);
}

// ================= state =================
const state = { view: 'areas', year: 2026, color: 'price', metric: 'price', million: false, area: null, block: null, focus: null };   // focus: null | 'r:<region>' | 'a:<area index>'
let playTimer = null, fly = null;

// ================= view 1: planning areas =================
const VIEWS = {};
VIEWS.areas = {
  tab: 'Areas', icon: 'fi-rr-city',
  title: 'What a square metre costs, by planning area',
  blurb: 'Each planning area with HDB flats rises by its median resale price per square metre. Play the years to watch the run-up after 2020; switch the colour to see which areas rose fastest, or where the million-dollar flats sell.',
  how: ['Mercator projection of the URA planning areas, median and change scales, the colour ramp and the panel charts.', 'Each area is an extruded shape; heights ease between years.'],
  camera: [-2, 17, 19], target: [0.5, 0, 0.6],
  maxPsm: 0,
  build() {
    island();
    this.maxPsm = d3.max(AREAS, (a) => d3.max(a.y, (y) => y[0]));
    this.meshes = [];
    AREAS.filter((a) => a.hdb).forEach((a) => {
      const geo = new THREE.ExtrudeGeometry(a.p.map(shapeOf), { depth: 1, bevelEnabled: false }); geo.rotateX(-Math.PI / 2);
      // roof lit, walls unlit: thousands of short wall segments would otherwise stripe in the light
      const m = new THREE.Mesh(geo, [new THREE.MeshStandardMaterial({ color: B.signal, roughness: 0.6, metalness: 0.05 }), new THREE.MeshBasicMaterial({ color: B.signal })]);
      m.scale.y = 0.001; m.userData = { area: a.i, h: 0.001, pick: () => areaTip(a) };
      // outline of the roof only (local y = 1 is the top once the mesh is scaled)
      const roof = [];
      a.p.forEach((poly) => poly.forEach((r) => r.forEach((pt, k) => { const [ax, az] = P(...pt), [bx, bz] = P(...r[(k + 1) % r.length]); roof.push(new THREE.Vector3(ax, 1, az), new THREE.Vector3(bx, 1, bz)); })));
      m.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(roof), new THREE.LineBasicMaterial({ color: '#15171b', transparent: true, opacity: 0.6 })));
      group.add(m); pickables.push(m); this.meshes.push(m);
      const [cx, cz] = P(...centroid(a));
      a.lbl = lbl(a.n, new THREE.Vector3(cx, 0, cz), 'bg');
    });
    tickers.add(() => this.meshes.forEach((m) => {
      const d = m.userData.h - m.scale.y;
      if (Math.abs(d) > 1e-4) m.scale.y += reduceMotion ? d : d * 0.14;
      AREAS[m.userData.area].lbl.position.y = m.scale.y + 0.25;
    }));
    this.update();
  },
  update() {
    const k = yi(state.year), sh = d3.scaleLinear([0, this.maxPsm], [0, 2.6]);
    const ch = d3.scaleDiverging([-6, 0, 14], CHANGE).clamp(true), col = d3.scaleSequential(PSM_DOMAIN, RAMP).clamp(true);
    // gold scale is fixed across years (busiest area-year), sqrt so a handful of sales still shows
    this.maxM = d3.max(AREAS, (a) => d3.max(a.y, (y) => y[2])) || 1;
    const gold = d3.scaleSequentialSqrt([0, this.maxM], GOLD);
    const gm = state.color === 'million';
    this.meshes.forEach((m) => {
      const a = AREAS[m.userData.area], [psm, n, m1] = a.y[k];
      const prev = k > 0 ? a.y[k - 1][0] : 0;
      m.userData.h = n ? Math.max(0.02, sh(psm)) : 0.001;
      m.visible = n > 0; a.lbl.visible = n > 0;
      const c = gm ? (m1 ? gold(m1) : '#2f333a') : state.color === 'change' ? (prev && psm ? ch(((psm / prev) - 1) * 100) : '#3a3f48') : col(psm);
      const top = new THREE.Color(state.area === a.i ? (gm ? B.signal : B.amber) : c);
      m.material[0].color.copy(top); m.material[1].color.copy(top).multiplyScalar(0.55);
      a.lbl.element.className = `lbl bg ${state.area === a.i ? 'sel' : ''}`;
      a.lbl.element.textContent = gm && m1 ? `${a.n} · ${d3.format(',')(m1)}` : a.n;
      if (gm && m1) a.lbl.element.style.color = m1 >= this.maxM * 0.25 ? '#f6c453' : ''; else a.lbl.element.style.color = '';
    });
    legend();
  },
};
function areaTip(a) {
  const k = yi(state.year), [psm, n, m1, byt] = a.y[k], prev = k > 0 ? a.y[k - 1][0] : 0;
  const chg = prev && psm ? ((psm / prev) - 1) * 100 : null;
  return `<div class="font-medium text-foreground">${esc(a.n)}</div>
    <div class="text-muted-foreground">${esc(a.r)} · ${yearLabel(state.year)}</div>
    <div class="mt-1 font-mono">${psmF(psm)} median${chg == null ? '' : ` <span class="${chg >= 0 ? 'text-[#e58fb0]' : 'text-[#7cc4dc]'}">${chg >= 0 ? '+' : ''}${chg.toFixed(1)}%</span>`}</div>
    <div class="font-mono text-muted-foreground">${d3.format(',')(n)} sales${m1 ? ` · ${m1} at S$1M+` : ''}</div>`;
}

// ================= view 2: blocks =================
const BOX = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
VIEWS.blocks = {
  tab: 'Blocks', icon: 'fi-rr-building',
  title: 'Every HDB block, by price and lease',
  blurb: 'One bar per block that sold a flat in the year. Height is the median resale price; colour is the lease left, so you can see old central blocks still selling high next to newer estates further out.',
  how: ['Scales for price and lease, the lease colour ramp, the yearly chart and the lease-versus-price scatter.', 'About 9,700 bars in one instanced mesh; picking reads the instance id.'],
  camera: [-1.5, 13.5, 15.5], target: [0.5, 0, 0.8],
  build() {
    island();
    const n = BLOCKS.length;
    const mat = new THREE.MeshStandardMaterial({ roughness: 0.5, metalness: 0.05 });
    const mesh = new THREE.InstancedMesh(BOX, mat, n);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh = mesh; this.pos = BLOCKS.map((b) => P(b.lon, b.lat));
    this.cur = new Float32Array(n); this.tgt = new Float32Array(n);
    this.maxK = d3.quantile(BLOCKS.flatMap((b) => b.pk.filter(Boolean)), 0.999);
    this.maxPsm = d3.quantile(BLOCKS.flatMap((b) => b.psm.filter(Boolean)), 0.999);
    mesh.userData.pick = (hit) => blockTip(BLOCKS[hit.instanceId]);
    mesh.userData.blockAt = (hit) => hit.instanceId;
    mesh.userData.alive = (i) => this.cur[i] > 0.001;
    group.add(mesh); pickables.push(mesh);
    // selection marker
    this.marker = new THREE.Group();
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1, 6).translate(0, 0.5, 0), new THREE.MeshBasicMaterial({ color: B.amber }));
    const halo = new THREE.Mesh(new THREE.RingGeometry(0.09, 0.12, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: B.amber, side: THREE.DoubleSide }));
    halo.position.y = 0.01;
    this.marker.add(pin, halo); this.pin = pin;
    this.markLbl = lbl('', new THREE.Vector3(), 'sel bg', this.marker);
    group.add(this.marker);
    this.dirty = true;
    tickers.add(() => this.step());
    tickers.add(ringStep);
    this.update();
  },
  step() {
    if (!this.dirty) return;
    const m4 = new THREE.Matrix4(), w = 0.042;
    let moving = false;
    for (let i = 0; i < this.cur.length; i++) {
      const d = this.tgt[i] - this.cur[i];
      if (Math.abs(d) > 1e-4) { this.cur[i] += reduceMotion ? d : d * 0.16; moving = true; } else this.cur[i] = this.tgt[i];
      const [x, z] = this.pos[i];
      m4.makeScale(w, Math.max(this.cur[i], 1e-4), w); m4.setPosition(x, 0, z);
      this.mesh.setMatrixAt(i, m4);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
    if (state.block != null) { const h = this.cur[state.block]; this.pin.scale.y = h + 0.5; this.markLbl.position.y = h + 0.62; }
    if (!moving) { this.dirty = false; this.mesh.computeBoundingSphere(); this.mesh.computeBoundingBox?.(); }
  },
  update() {
    const k = yi(state.year), psm = state.metric === 'psm';
    const sh = d3.scaleLinear([0, psm ? this.maxPsm : this.maxK], [0, 1.6]).clamp(true);
    const lease = d3.scaleSequential([45, 95], LEASE).clamp(true);
    const c = new THREE.Color();
    BLOCKS.forEach((b, i) => {
      const sold = b.n[k] > 0, top = b.n1m[k] > 0;
      const show = sold && (!state.million || top) && (state.focus == null || inFocus(b));   // outside the focus: flat stubs
      this.tgt[i] = sold ? (show ? Math.max(0.02, sh(psm ? b.psm[k] : b.pk[k])) : 0.02) : 0;
      if (i === state.block) c.set(B.ink);
      else if (state.focus != null && !inFocus(b)) c.set('#30343b');
      else if (state.million) c.set(top ? B.amber : '#2f343c');
      else c.set(lease(remaining(b, state.year)));
      this.mesh.setColorAt(i, c);
    });
    this.mesh.instanceColor.needsUpdate = true;
    this.dirty = true;
    const b = BLOCKS[state.block];
    this.marker.visible = !!b;
    if (b) { const [x, z] = this.pos[b.i]; this.marker.position.set(x, 0, z); this.markLbl.element.textContent = blockName(b); }
    sunburst();
    legend();
  },
};

// ================= sunburst ring around a town (Blocks, town in focus) =================
// D3's partition lays out the town's sales for the year: inner ring by flat type, outer ring by
// floor level within each type. Three.js draws each slice as a thin extruded arc lying on the ground,
// centred on the town and just outside its blocks. Slices ease to new angles when the year changes.
const MIX_COL = ['#7cc4dc', '#9ccf7f', '#1fefd7', '#f6c453', '#e58fb0', '#c9a4f5'];
const mixName = (i) => title(DATA.mixTypes[i]).replace('Other', '1-room and multi-gen');
const bandCol = (ti, bi) => d3.interpolateRgb('#15171b', MIX_COL[ti])(0.42 + bi * 0.19);
let ring = null;   // { town, g, c: [x, z], r: [r0, r1, r2, r3], segs: Map(key -> seg), head }
function arcGeo(r0, r1, a0, a1) {
  // angles run clockwise from north; shape y is north (it becomes -z once laid flat)
  const s = new THREE.Shape(), A = (a) => Math.PI / 2 - a;
  s.absarc(0, 0, r1, A(a0), A(a1), true);
  s.absarc(0, 0, r0, A(a1), A(a0), false);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.035, bevelEnabled: false, curveSegments: Math.max(4, Math.ceil((a1 - a0) * 24)) });
  g.rotateX(-Math.PI / 2);
  return g;
}
function sunburst() {
  const v = VIEWS.blocks;
  if (state.focus == null) { if (ring) { dropRing(); } return; }
  if (!ring || ring.town !== state.focus) buildRing();
  const t = TOWNS[state.focus], k = yi(state.year), mix = t.mix[k];
  const total = d3.sum(mix.flat(), (d) => d[0]);
  const root = d3.partition().size([Math.PI * 2, 3])(d3.hierarchy({ children: mix.map((bands, ti) => ({ ti, children: bands.map(([n, pk], bi) => ({ ti, bi, n, pk })) })) }, (d) => d.children).sum((d) => d.n ?? 0));
  root.descendants().slice(1).forEach((d) => {
    const key = d.depth === 1 ? `t${d.data.ti}` : `b${d.data.ti}_${d.data.bi}`, seg = ring.segs.get(key);
    const pad = d.x1 - d.x0 > 0.03 ? 0.006 : 0;
    seg.tgt = [d.x0 + pad, Math.max(d.x0 + pad, d.x1 - pad)];
    seg.n = d.value; seg.share = total ? d.value / total : 0; seg.pk = d.data.pk;
    if (d.depth === 1) {
      const mid = (d.x0 + d.x1) / 2, R = ring.r[3] + 0.16;
      seg.lbl.position.set(ring.c[0] + Math.sin(mid) * R, 0.05, ring.c[1] - Math.cos(mid) * R);
      seg.lbl.element.textContent = `${mixName(d.data.ti).replace('1-room and multi-gen', 'Other')} ${d3.format('.0%')(seg.share)}`;
      seg.lbl.visible = seg.share >= 0.04;
    }
  });
  ring.head.element.textContent = `${t.n} · ${d3.format(',')(total)} sales in ${state.year}`;
  ring.anim = true;
}
function buildRing() {
  dropRing();
  const v = VIEWS.blocks, pts = BLOCKS.filter(inFocus).map((b) => v.pos[b.i]);
  const [x0, x1] = d3.extent(pts, (p) => p[0]), [z0, z1] = d3.extent(pts, (p) => p[1]);
  const c = [(x0 + x1) / 2, (z0 + z1) / 2];
  const r0 = d3.max(pts, (p) => Math.hypot(p[0] - c[0], p[1] - c[1])) + 0.14;
  const w = Math.min(0.32, Math.max(0.1, r0 * 0.12));
  const r = [r0, r0 + w, r0 + w + 0.02, r0 + w * 1.85];
  const g = new THREE.Group(); g.position.set(c[0], 0.005, c[1]);
  // faint guide circle under the ring
  const guide = new THREE.Mesh(new THREE.RingGeometry(r[0] - 0.01, r[3] + 0.01, 96).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#1d2026', transparent: true, opacity: 0.85, depthWrite: false }));
  g.add(guide);
  const segs = new Map();
  DATA.mixTypes.forEach((_, ti) => {
    const make = (key, rr0, rr1, color, extra) => {
      const m = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.05 }));
      const seg = { key, m, r0: rr0, r1: rr1, cur: [0, 0], tgt: [0, 0], ...extra };
      m.userData.pick = () => ringTip(seg);
      g.add(m); pickables.push(m); segs.set(key, seg);
      return seg;
    };
    const tseg = make(`t${ti}`, r[0], r[1], MIX_COL[ti], { ti });
    tseg.lbl = lbl('', new THREE.Vector3(), 'bg'); tseg.lbl.visible = false;
    DATA.bands.forEach((_, bi) => make(`b${ti}_${bi}`, r[2], r[3], bandCol(ti, bi), { ti, bi }));
  });
  const head = lbl('', new THREE.Vector3(c[0], 0.05, c[1] + r[3] + 0.45), 'strong bg');   // front edge, clear of the bars
  group.add(g);
  ring = { town: state.focus, g, c, r, segs, head, anim: true };
}
function dropRing() {
  if (!ring) return;
  ring.g.traverse((o) => { o.geometry?.dispose(); o.material?.dispose?.(); });
  ring.segs.forEach((s) => { pickables = pickables.filter((p) => p !== s.m); if (s.lbl) { s.lbl.element.remove(); group.remove(s.lbl); } });
  ring.head.element.remove(); group.remove(ring.head);
  group.remove(ring.g); ring = null;
}
function ringStep() {
  if (!ring?.anim) return;
  let moving = false;
  ring.segs.forEach((s) => {
    const d0 = s.tgt[0] - s.cur[0], d1 = s.tgt[1] - s.cur[1];
    if (Math.abs(d0) + Math.abs(d1) < 1e-4) { if (s.cur !== s.tgt) { s.cur = [...s.tgt]; } else return; }
    else { s.cur = reduceMotion ? [...s.tgt] : [s.cur[0] + d0 * 0.14, s.cur[1] + d1 * 0.14]; moving = true; }
    s.m.geometry.dispose();
    s.m.geometry = s.cur[1] - s.cur[0] > 1e-4 ? arcGeo(s.r0, s.r1, s.cur[0], s.cur[1]) : new THREE.BufferGeometry();
  });
  ring.anim = moving;
}
function ringTip(seg) {
  const t = TOWNS[state.focus];
  const head = seg.bi == null ? mixName(seg.ti) : `${mixName(seg.ti)}, floors ${DATA.bands[seg.bi]}`;
  const price = seg.bi == null ? t.y[yi(state.year)][3][seg.ti] : seg.pk;
  return `<div class="font-medium text-foreground"><span class="mr-1.5 inline-block size-2.5 rounded-sm" style="background:${seg.bi == null ? MIX_COL[seg.ti] : bandCol(seg.ti, seg.bi)}"></span>${esc(head)}</div>
    <div class="text-muted-foreground">${esc(t.n)} · ${yearLabel(state.year)}</div>
    <div class="mt-1 font-mono">${d3.format(',')(seg.n)} sales · ${d3.format('.1%')(seg.share)} of the town</div>
    ${price ? `<div class="font-mono text-muted-foreground">median ${sgd(price * 1000)}</div>` : ''}`;
}
function blockTip(b) {
  const k = yi(state.year), y = state.year;
  const head = `<div class="font-medium text-foreground">${esc(blockName(b))}</div><div class="text-muted-foreground">${esc(AREAS[b.area]?.n ?? '')} · lease from ${b.lease}</div>`;
  if (!b.n[k]) return `${head}<div class="mt-1 text-muted-foreground">No resale in ${yearLabel(y)}</div>`;
  return `${head}<div class="mt-1 font-mono">${sgd(b.pk[k] * 1000)} median · ${psmF(b.psm[k])}</div>
    <div class="font-mono text-muted-foreground">${b.n[k]} sale${b.n[k] > 1 ? 's' : ''} in ${yearLabel(y)}${b.n1m[k] ? ` · <span class="text-amber">${b.n1m[k]} at S$1M+</span>` : ''}</div>
    <div class="font-mono text-muted-foreground">about ${remaining(b, y)} years of lease left</div>`;
}

// The selection-dependent part of the panel. Rebuilt on selection, refreshed on year change.
function renderDetail() {
  const el = $('#detail'); if (!el) return;

// Fit the camera to the town's blocks, keeping the default viewing angle.
function flyToFocus() {
  const v = VIEWS.blocks;
  if (state.focus == null) { flyCam(new THREE.Vector3(...v.target), new THREE.Vector3(...v.camera)); return; }
  const pts = BLOCKS.filter(inFocus).map((b) => v.pos[b.i]);
  if (!pts.length) return;
  const [x0, x1] = d3.extent(pts, (p) => p[0]), [z0, z1] = d3.extent(pts, (p) => p[1]);
  let size = Math.max(x1 - x0, (z1 - z0) * 1.5, 0.8);
  const t = new THREE.Vector3((x0 + x1) / 2, 0.3, (z0 + z1) / 2);
  if (ring) { size = Math.max(size, ring.r[3] * 2.3); t.set(ring.c[0], 0.3, ring.c[1] - 0.15); }   // fit the sunburst too
  const dir = new THREE.Vector3(...v.camera).sub(new THREE.Vector3(...v.target)).normalize();
  flyCam(t, t.clone().add(dir.multiplyScalar(size * 1.25 + 3.2)));
}

// ---------- search: towns, blocks (number, street, postal code), then OneMap for anything else ----------
const EXPAND = { BT: 'BUKIT', AVE: 'AVENUE', ST: 'STREET', RD: 'ROAD', DR: 'DRIVE', CRES: 'CRESCENT', JLN: 'JALAN', LOR: 'LORONG', KG: 'KAMPONG',
  NTH: 'NORTH', STH: 'SOUTH', UPP: 'UPPER', TG: 'TANJONG', PK: 'PARK', CTRL: 'CENTRAL', CL: 'CLOSE', CWEALTH: 'COMMONWEALTH', HTS: 'HEIGHTS',
  MKT: 'MARKET', GDNS: 'GARDENS', TER: 'TERRACE', PL: 'PLACE', CTR: 'CENTRE', LN: 'LANE', HG: 'HOUGANG',
  // common short names people type
  AMK: 'ANG MO KIO', TPY: 'TOA PAYOH', CCK: 'CHOA CHU KANG', BBT: 'BUKIT BATOK', BPJ: 'BUKIT PANJANG', JW: 'JURONG WEST', JE: 'JURONG EAST' };
const norm = (q) => q.toUpperCase().replace(/[’']/g, '').replace(/[^A-Z0-9]+/g, ' ').trim();
let INDEX = null, results = [], active = -1;
function buildIndex() {
  INDEX = BLOCKS.map((b) => {
    const st = norm(b.street);
    const street = ` ${st} ${st.split(' ').map((w) => EXPAND[w] ?? w).join(' ')} `;
    return { street, all: ` ${norm(b.blk)}${street}${b.postal} ${norm(TOWNS[b.town].n)} ` };
  });
}
function searchLocal(q) {
  const toks = norm(q).split(' ').filter(Boolean).flatMap((t) => (EXPAND[t] ?? t).split(' ')).filter((t) => t !== 'BLK' && t !== 'BLOCK');
  if (!toks.length) return [];
  if (!INDEX) buildIndex();
  const out = [];
  TOWNS.forEach((t, i) => { const n = ` ${norm(t.n)} `; if (toks.every((k) => n.includes(` ${k}`))) out.push({ kind: 'town', i, label: t.n, sub: 'HDB town' }); });
  const hits = [];
  BLOCKS.forEach((b, i) => {
    const text = INDEX[i].all;
    // every query word must start a word in the index; 1-2 digit numbers (avenue numbers) must match whole
    if (!toks.every((k) => text.includes(` ${k} `) || (text.includes(` ${k}`) && !/^\d{1,2}$/.test(k)))) return;
    const whole = toks.filter((k) => text.includes(` ${k} `)).length;
    const inStreet = toks.filter((k) => INDEX[i].street.includes(` ${k}`)).length;   // street-name matches outrank town-only ones
    const score = (toks.includes(b.postal) ? 0 : 4) + (toks.includes(norm(b.blk)) ? 0 : 2) - whole * 0.1 - inStreet * 0.5;
    hits.push({ score, b });
  });
  hits.sort((x, y) => x.score - y.score || d3.ascending(x.b.street, y.b.street) || d3.ascending(+x.b.blk.replace(/\D/g, '') || 0, +y.b.blk.replace(/\D/g, '') || 0));
  hits.slice(0, 8 - Math.min(out.length, 3)).forEach(({ b }) => out.push({ kind: 'block', i: b.i, label: blockName(b), sub: `${TOWNS[b.town].n}${b.postal ? ` · ${b.postal}` : ''}` }));
  return out.slice(0, 8);
}
function searchSuggest(q) {
  results = q.trim().length ? searchLocal(q) : [];
  if (q.trim().length >= 3) results.push({ kind: 'onemap', q: q.trim(), label: `Find “${q.trim()}” with OneMap`, sub: 'Addresses, buildings and postal codes; flies to the nearest HDB block' });
  active = results.length ? 0 : -1;
  drawSuggest();
}
function drawSuggest() {
  const list = $('#search-list'), input = $('#search'); if (!list) return;
  list.hidden = !results.length; input.setAttribute('aria-expanded', String(!!results.length));
  const icon = { town: 'fi-rr-city', block: 'fi-rr-building', onemap: 'fi-rr-marker' };
  list.innerHTML = results.map((r, i) => `<button type="button" role="option" id="sr-${i}" aria-selected="${i === active}" data-pick="${i}" class="flex w-full items-start gap-2 rounded px-2 py-1.5 text-left text-sm ${i === active ? 'bg-accent text-foreground' : 'text-ink-2'} hover:bg-accent focus-visible:outline-none">
    <i class="fi ${icon[r.kind]} mt-0.5 text-muted-foreground"></i><span class="min-w-0"><span class="block truncate">${esc(r.label)}</span><span class="block truncate text-[11px] text-muted-foreground">${esc(r.sub)}</span></span></button>`).join('');
  if (active >= 0) input.setAttribute('aria-activedescendant', `sr-${active}`); else input.removeAttribute('aria-activedescendant');

  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (!results.length) return; e.preventDefault(); active = (active + (e.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length; drawSuggest(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (!results.length) searchSuggest(e.target.value); if (results.length) pickResult(Math.max(0, active)); }

  note('Searching OneMap…');
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
    const res = await fetch(`https://www.onemap.gov.sg/api/common/elastic/search?searchVal=${encodeURIComponent(r.q)}&returnGeom=Y&getAddrDetails=Y&pageNum=1`, { signal: ctl.signal });
    clearTimeout(t);

    note(km(near) < 0.03 ? `${place}: this is ${blockName(near)}.` : `${place} is not an HDB resale block. Showing the nearest one, ${blockName(near)}, ${d3.format('.1f')(km(near))} km away.`);

// ---------- sync: re-fetch the latest year(s) from the HDB resale API and recompute in the browser ----------
// The saved file holds medians, not raw sales, so a sync re-downloads every month of each year it touches
// (one request per month) and rebuilds that year's figures exactly as the prep script does.
const RESALE_API = 'https://data.gov.sg/api/action/datastore_search?resource_id=d_8b84c4ee58e3cfc0ece0d773c8ca6abc';
const sync = { status: 'idle', text: '' };   // idle | busy | done | error
// Synced sales are kept in this browser's IndexedDB so they survive a reload. Static reference data
// (block positions, boundaries, the saved history) always comes from the shipped file.
const IDB = { name: 'inotives-sg-hdb', store: 'sync', key: 'latest-v2' };   // v2: rows carry the lease start year
function idbOpen() {
  return new Promise((ok, no) => { const r = indexedDB.open(IDB.name, 1); r.onupgradeneeded = () => r.result.createObjectStore(IDB.store); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
}
async function idb(mode, fn) {
  try {
    const db = await idbOpen();
    return await new Promise((ok, no) => { const tx = db.transaction(IDB.store, mode), q = fn(tx.objectStore(IDB.store)); tx.oncomplete = () => ok(q?.result); tx.onerror = () => no(tx.error); });
  } catch { return null; }   // private mode or storage blocked: the page still works, it just won't remember
}
const COLS = ['month', 'town', 'flat_type', 'block', 'street_name', 'storey_range', 'floor_area_sqm', 'resale_price', 'lease_commence_date'];
const packRows = (rows) => rows.map((r) => COLS.map((c) => r[c]));
const unpackRows = (rows) => rows.map((a) => Object.fromEntries(COLS.map((c, i) => [c, a[i]])));
// On load: reapply a saved sync unless the shipped file has caught up with it.
async function restoreSync() {
  const saved = await idb('readonly', (st) => st.get(IDB.key));
  if (!saved?.rows?.length) return;

async function syncLatest() {

  const firstYear = +oldLast.slice(0, 4), thisMonth = d3.timeFormat('%Y-%m')(now);
  const months = d3.timeMonths(new Date(firstYear, 0, 1), d3.timeMonth.offset(d3.timeMonth.floor(now), 1)).map(d3.timeFormat('%Y-%m'));

// Rebuild every figure for the given years from raw sale records.
function applySales(rows, years) {
  // a new calendar year: extend every per-year array with an empty slot
  years.filter((y) => y > YEARS.at(-1)).sort().forEach((y) => {
    YEARS.push(y);
    BLOCKS.forEach((b) => { b.psm.push(0); b.pk.push(0); b.n.push(0); b.n1m.push(0); });
    TOWNS.forEach((t) => { t.y.push([0, 0, 0, DATA.types.map(() => 0)]); t.mix.push(DATA.mixTypes.map(() => DATA.bands.map(() => [0, 0]))); });
    AREAS.forEach((a) => { a.y.push([0, 0, 0, DATA.types.map(() => 0)]); a.d.push(AGE_BANDS.map(() => PRICE_BANDS.map(() => 0))); a.f.push(DATA.bands.map(() => 0)); });
    DATA.island.push([0, 0, 0]); DATA.million.push(0); DATA.floors.push(DATA.bands.map(() => 0));
  });
  const key = new Map(BLOCKS.map((b) => [`${b.blk}|${b.street}`, b]));
  const townIdx = new Map(TOWNS.map((t, i) => [t.n.replace(' / ', '/').toUpperCase(), i]));
  // round half to even, like Python's round() in the prep script, so a sync reproduces the file exactly

    DATA.types.map((t) => { const v = list.filter((r) => r.type === t).map((r) => r.price); return v.length ? K(v) : 0; })];
  let unmapped = 0;
  years.forEach((y) => {
    const k = yi(y);
    const recs = rows.filter((r) => +r.month.slice(0, 4) === y).map((r) => {
      const price = +r.resale_price, sqm = +r.floor_area_sqm, lo = +r.storey_range.slice(0, 2);
      return { price, psm: price / sqm, type: r.flat_type, age: y - +r.lease_commence_date, b: key.get(`${r.block}|${r.street_name}`), t: townIdx.get(r.town),
        band: lo <= 6 ? 0 : lo <= 12 ? 1 : lo <= 24 ? 2 : 3 };
    });
    unmapped += recs.filter((r) => !r.b).length;
    DATA.island[k] = [rnd(med(recs.map((r) => r.psm))), recs.length, K(recs.map((r) => r.price))];
    DATA.million[k] = recs.filter((r) => r.price >= 1e6).length;
    DATA.floors[k] = DATA.bands.map((_, bi) => { const v = recs.filter((r) => r.band === bi).map((r) => r.psm); return v.length ? rnd(med(v)) : 0; });
    const byBlock = d3.group(recs.filter((r) => r.b), (r) => r.b);
    BLOCKS.forEach((b) => {
      const v = byBlock.get(b) ?? [];
      b.psm[k] = v.length ? rnd(med(v.map((r) => r.psm))) : 0;
      b.pk[k] = v.length ? K(v.map((r) => r.price)) : 0;
      b.n[k] = v.length; b.n1m[k] = v.filter((r) => r.price >= 1e6).length;
    });
    const byTown = d3.group(recs.filter((r) => r.t != null), (r) => r.t);
    TOWNS.forEach((t, i) => {
      const v = byTown.get(i) ?? [];
      t.y[k] = stats(v);
      t.mix[k] = DATA.mixTypes.map((mt, ti) => DATA.bands.map((_, bi) => {
        const p = v.filter((r) => (DATA.mixTypes.includes(r.type) ? r.type === mt : ti === DATA.mixTypes.length - 1) && r.band === bi).map((r) => r.price);
        return [p.length, p.length ? K(p) : 0];

    });
    const byArea = d3.group(recs.filter((r) => r.b && r.b.area >= 0), (r) => r.b.area);
    const bucket = (v, edges) => edges.filter((e) => v >= e).length;   // same banding as the prep script

// ================= view 3: value a flat =================
// Pick a block (postal code or name). Its own sales history comes live from data.gov.sg and fills in the
// likely flat type, storey and size. Then the town's sales of that flat type over the last 24 months are
// fetched and a small hedonic model is fitted in the browser:
//   log(price per m²) ~ storey + lease left + floor area + months since sale + distance from this block
// The model gives the estimate and its range; the charts read off what it learned.
const V = { blk: null, hist: null, type: null, storey: null, area: null, buy: '', buyYear: '', status: '', res: null };

async function apiRecords(filters, limit = 10000) {
  for (let attempt = 0; attempt < 4; attempt++) {
    const r = await fetch(`${RESALE_API}&limit=${limit}&filters=${encodeURIComponent(JSON.stringify(filters))}`);
    if (r.status === 429) { await new Promise((ok) => setTimeout(ok, 3000 * (attempt + 1))); continue; }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);

  }

  return histCache.get(key);

  renderPanel(); VIEWS.value.update(); flyValue();

// Ridge-stabilised least squares on standardised features. Small (6x6) normal equations.
function solve(A, y) {
  const n = A.length, M = A.map((row, i) => [...row, y[i]]);
  for (let c = 0; c < n; c++) {
    let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
  }
  return M.map((row, i) => row[n] / row[i]);
}
const FEATS = [

  { key: 'area', name: 'Floor area', unit: 10, say: (p) => `${fmtPct(p)} per m² for every 10 m² bigger` },
  { key: 'ago', name: 'Market trend', unit: -12, say: (p) => `${fmtPct(p)} a year over the last 2 years` },
  { key: 'dist', name: 'Distance', unit: 1, say: (p) => `${fmtPct(p)} per km from this block` },

function fitModel(b, comps) {

  const keys = FEATS.map((f) => f.key);

  const sd = Object.fromEntries(keys.map((k) => [k, d3.deviation(rows, (r) => r.x[k]) || 1]));

function returnBlock() {
  const buy = +String(V.buy).replace(/[^\d.]/g, ''), yr = +V.buyYear;

  const R = V.res, years = Math.max(0.5, +DATA.lastMonth.slice(0, 4) + +DATA.lastMonth.slice(5, 7) / 12 - (yr + 0.5));
  const gain = R.value - buy, cagr = (R.value / buy) ** (1 / years) - 1;
  const t = TOWNS[BLOCKS[V.blk].town], ti = DATA.types.indexOf(V.type), k0 = YEARS.indexOf(yr);
  const townG = ti >= 0 && k0 >= 0 && t.y[k0][3][ti] && t.y.at(-1)[3][ti] ? (t.y.at(-1)[3][ti] / t.y[k0][3][ti]) ** (1 / years) - 1 : null;
  return `<div class="mt-2 grid grid-cols-3 gap-2">${tile('Gain', 'v-gain', `${gain >= 0 ? '+' : '−'}${sgd(Math.abs(gain))}`)}${tile('A year', 'v-cagr', fmtPct(cagr))}${tile('Town, same type', 'v-town', townG == null ? '–' : fmtPct(townG))}</div>`;
}

// 4. outlook: town median history for this type, then three paces applied to this flat, less lease decay
function outlook() {
  const el = $('#v-outlook'), R = V.res, W = el.clientWidth || 340, H = 170, m = { t: 12, r: 44, b: 22, l: 44 };
  const t = TOWNS[BLOCKS[V.blk].town], ti = DATA.types.indexOf(V.type);
  const hist = ti >= 0 ? YEARS.map((y, k) => ({ y, v: t.y[k][3][ti] * 1000 })).filter((d) => d.v) : [];

  const h3 = hist.find((d) => d.y === yNow - 3), h0 = hist[0], hN = hist.at(-1);

    { name: 'Flat market', g: 0, col: '#7cc4dc' },

  const ln = d3.line().x((d) => x(d.y)).y((d) => y(d.v));
  const lo = proj.map((p) => p.pts.at(-1).v);
  const band = d3.area().x((d) => x(d.y)).y0((d, i) => y(d3.min(proj, (p) => p.pts[i].v))).y1((d, i) => y(d3.max(proj, (p) => p.pts[i].v)))(proj[0].pts);
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Price history and five-year projection">
    ${y.ticks(4).map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${B.line}"/><text x="${m.l - 5}" y="${y(v) + 3}" text-anchor="end" font-size="9.5" font-family="Source Code Pro" fill="${B.fog}">${v >= 1e6 ? `${v / 1e6}M` : `${v / 1000}k`}</text>`).join('')}
    <rect x="${x(yNow)}" y="${m.t}" width="${x(yNow + 5) - x(yNow)}" height="${H - m.b - m.t}" fill="${B.raise}"/>
    <path d="${band}" fill="${B.amber}" opacity="0.12"/>
    ${hist.length ? `<path d="${ln(hist)}" fill="none" stroke="${B.ink2}" stroke-width="1.5"/>` : ''}
    ${proj.map((p) => `<path d="${ln(p.pts)}" fill="none" stroke="${p.col}" stroke-width="1.5" ${p.g === 0 ? 'stroke-dasharray="4 3"' : ''}/>`).join('')}
    ${endLabels(proj.map((p) => ({ y: y(p.pts.at(-1).v), text: sgd(p.pts.at(-1).v).replace('S$', ''), col: p.col }))).map((l) => `<text x="${x(yNow + 5) + 4}" y="${l.y + 3}" font-size="9.5" font-family="Source Code Pro" fill="${l.col}">${l.text}</text>`).join('')}
    <circle cx="${x(yNow)}" cy="${y(R.value)}" r="4" fill="${B.amber}"/>
    ${x.ticks(5).filter(Number.isInteger).map((v) => `<text x="${x(v)}" y="${H - 6}" text-anchor="middle" font-size="9.5" font-family="Source Code Pro" fill="${B.fog}">${String(v).slice(2)}</text>`).join('')}
  </svg>
  <div class="mt-1 flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-muted-foreground"><span class="inline-flex items-center gap-1"><span class="inline-block h-0.5 w-3 bg-[#b8b5ac]"></span>Town median, ${title(V.type).toLowerCase()}</span>${proj.map((p) => `<span class="inline-flex items-center gap-1"><span class="inline-block h-0.5 w-3" style="background:${p.col}"></span>${p.name} ${fmtPct(p.g)}</span>`).join('')}</div>
  <p class="mt-1 text-[11px] text-muted-foreground">Each line grows this flat’s estimate at that yearly pace, less ${d3.format('.1%')(1 - decay)} a year for the lease running down. In ${yNow + 5}: ${sgd(d3.min(lo))} to ${sgd(d3.max(lo))}.</p>`;
}
// Nudge end-of-line labels apart so they don't overlap (11px minimum gap).

// ---------- 3D: comparable blocks as bars, coloured by how far they sold from the model ----------
VIEWS.value = {
  tab: 'Value', icon: 'fi-rr-home',

  blurb: 'Pick a block by postal code or name. The town’s sales of the same flat type over the last two years are fetched live and a small model values the flat, then shows what moves the price and where it could go.',
  how: ['A least-squares model on log price per m², fitted in the browser; histogram, lease curve, outlook and town bars.', 'Comparable blocks as instanced bars around this one, coloured by how far their sales landed from the model.'],
  camera: [-1.5, 13.5, 15.5], target: [0.5, 0, 0.8],
  build() {

    const halo = new THREE.Mesh(new THREE.RingGeometry(0.09, 0.12, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: B.amber, side: THREE.DoubleSide })); halo.position.y = 0.01;
    this.marker.add(halo); this.marker.visible = false;

    const b = V.blk != null ? BLOCKS[V.blk] : null;
    this.marker.visible = !!b;
    if (b) { const [x, z] = P(b.lon, b.lat); this.marker.position.set(x, 0, z); this.markLbl.element.textContent = blockName(b); }
    if (!V.res) { legend(); return; }
    const g = d3.rollups(V.res.rows, (v) => ({ n: v.length, res: d3.mean(v, (r) => r.res), psm: d3.median(v, (r) => r.psm) }), (r) => r.cb);
    const mesh = new THREE.InstancedMesh(BOX, new THREE.MeshStandardMaterial({ roughness: 0.5 }), g.length);
    const h = d3.scaleLinear([0, d3.max(g, (d) => d[1].psm)], [0, 0.9]), col = d3.scaleDiverging([-0.12, 0, 0.12], (t) => d3.interpolateRgbBasis(['#7cc4dc', '#3a3f48', '#e58fb0'])(t)).clamp(true);

    mesh.userData.valueAt = (hit) => g[hit.instanceId][0].i;
    group.add(mesh); pickables.push(mesh); this.mesh = mesh;
    this.ext = d3.max(g, ([cb]) => kmBetween(cb, b));
    legend();
  },
};
function flyValue() {
  const v = VIEWS.value;
  if (V.blk == null) return;
  const b = BLOCKS[V.blk], [x, z] = P(b.lon, b.lat);
  const t = new THREE.Vector3(x, 0.3, z), size = V.res ? Math.max(2.6, (v.ext ?? 1.5) * 2 * (24 / 50)) : 2.6;   // ~0.48 world units per km
  const dir = new THREE.Vector3(...v.camera).sub(new THREE.Vector3(...v.target)).normalize();
  flyCam(t, t.clone().add(dir.multiplyScalar(size * 1.3 + 2.2)));
}

// ---------- form events ----------
let vResults = [], vActive = -1;
function vSuggest(q) {
  vResults = q.trim() ? searchLocal(q).filter((r) => r.kind === 'block').slice(0, 8) : [];
  vActive = vResults.length ? 0 : -1;
  const list = $('#v-list'); if (!list) return;
  list.hidden = !vResults.length; $('#v-search').setAttribute('aria-expanded', String(!!vResults.length));
  list.innerHTML = vResults.map((r, i) => `<button type="button" role="option" aria-selected="${i === vActive}" data-vpick="${i}" class="flex w-full items-start gap-2 rounded px-2 py-1.5 text-left text-sm ${i === vActive ? 'bg-accent text-foreground' : 'text-ink-2'} hover:bg-accent focus-visible:outline-none"><i class="fi fi-rr-building mt-0.5 text-muted-foreground"></i><span class="min-w-0"><span class="block truncate">${esc(r.label)}</span><span class="block truncate text-[11px] text-muted-foreground">${esc(r.sub)}</span></span></button>`).join('');
}
function vKey(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (!vResults.length) return; e.preventDefault(); vActive = (vActive + (e.key === 'ArrowDown' ? 1 : -1) + vResults.length) % vResults.length; const items = document.querySelectorAll('[data-vpick]'); items.forEach((it, i) => { it.setAttribute('aria-selected', i === vActive); it.classList.toggle('bg-accent', i === vActive); }); }
  else if (e.key === 'Enter') { e.preventDefault(); if (!vResults.length) vSuggest(e.target.value); if (vResults.length) valueBlock(vResults[Math.max(0, vActive)].i); }
  else if (e.key === 'Escape') { vResults = []; const l = $('#v-list'); if (l) l.hidden = true; }
}

// ================= switching, selection, playback =================
let building = 0;
async function show(view, { keepCamera = false } = {}) {
  const ticket = ++building;
  state.view = view;
  document.querySelectorAll('[data-tab]').forEach((b) => { b.dataset.state = b.dataset.tab === view ? 'active' : ''; b.setAttribute('aria-selected', b.dataset.tab === view); });
  clearScene();
  renderPanel();
  try { await dataReady; } catch { $('#panel').innerHTML = '<p class="text-sm text-muted-foreground">The resale data didn’t load. Reload the page to try again.</p>'; return; }
  if (ticket !== building) return;
  if (!proj) setupProjection();
  renderPanel();
  const v = VIEWS[view];
  v.build();
  if (!keepCamera) { camera.position.set(...v.camera); controls.target.set(...v.target); controls.autoRotate = false; }
  if (view === 'value' && !keepCamera) flyValue();
  if (view === 'blocks' && !keepCamera) { if (state.block != null) flyTo(state.block); else if (state.focus != null) flyToFocus(); }
  try { history.replaceState(null, '', `?view=${view}`); } catch { /* sandboxed */ }
}
function setYear(y) {
  state.year = y;
  VIEWS[state.view].update();
  refreshDetail();
}
function play() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  else {
    if (state.year === YEARS.at(-1)) setYear(YEARS[0]);
    playTimer = setInterval(() => { if (state.year >= YEARS.at(-1)) { play(); return; } setYear(state.year + 1); }, reduceMotion ? 1400 : 900);
  }
  const b = $('#play'); if (b) { b.innerHTML = `<i class="fi ${playTimer ? 'fi-rr-pause' : 'fi-rr-play'}"></i>`; b.setAttribute('aria-label', playTimer ? 'Pause' : 'Play the years'); }
}
function selectArea(i) {
  state.area = state.area === i ? null : i;
  VIEWS.areas.update(); renderDetail();
}
function selectBlock(i, { fly: doFly = false } = {}) {
  state.block = i;
  VIEWS.blocks.update(); renderDetail();
  if (doFly && i != null) flyTo(i);
}
function openBlock(i, opts = {}) {
  if (state.view !== 'blocks') { state.block = i; show('blocks'); return; }
  selectBlock(i, opts);
}
function flyTo(i) {
  const [x, z] = P(BLOCKS[i].lon, BLOCKS[i].lat);
  const t = new THREE.Vector3(x, 0.4, z);
  flyCam(t, t.clone().add(new THREE.Vector3(-1.2, 3.2, 4.2)));
}
// Ease the camera and its target together to a new view.
function flyCam(target, pos, dur = 1200) {
  controls.autoRotate = false;
  if (reduceMotion) { controls.target.copy(target); camera.position.copy(pos); return; }
  fly = { t0: performance.now(), dur, ft: controls.target.clone(), fp: camera.position.clone(), tt: target, tp: pos };
}

$('#tabs').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b && b.dataset.tab !== state.view) show(b.dataset.tab); };
$('#panel').addEventListener('input', (e) => { if (e.target.id === 'year') { if (playTimer) play(); setYear(+e.target.value); } });
$('#panel').addEventListener('change', (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === 'focus') setFocus(v);
  if (id === 'v-type') { V.type = v; setTypeDefaults(); runValuation(); }
  if (id === 'v-storey') { V.storey = v; runValuation(); }
  if (id === 'v-area') { const a = +v.replace(/[^\d.]/g, ''); if (a >= 20 && a <= 300) { V.area = Math.round(a); runValuation(); } else e.target.value = V.area; }
  if (id === 'v-buy' || id === 'v-buyyear') { V.buy = $('#v-buy').value; V.buyYear = $('#v-buyyear').value; renderDetail(); }
});
$('#panel').addEventListener('input', (e) => { if (e.target.id === 'search') searchSuggest(e.target.value); if (e.target.id === 'v-search') vSuggest(e.target.value); });
$('#panel').addEventListener('keydown', (e) => { if (e.target.id === 'search') searchKey(e); if (e.target.id === 'v-search') vKey(e); });
$('#panel').addEventListener('focusout', (e) => { if (e.target.id === 'search') setTimeout(() => { if (!$('#panel').contains(document.activeElement) || document.activeElement.id !== 'search') closeSuggest(); }, 150); });
$('#panel').addEventListener('click', (e) => {
  if (e.target.closest('#play')) { play(); return; }
  if (e.target.closest('#sync')) { if (playTimer) play(); syncLatest(); return; }
  if (e.target.closest('#sync-reset')) { resetSync(); return; }
  const c = e.target.closest('[data-color]'); if (c) { state.color = c.dataset.color; document.querySelectorAll('[data-color]').forEach((b) => { b.dataset.state = b === c ? 'active' : ''; }); VIEWS.areas.update(); if (state.area == null) renderDetail(); return; }
  const ga = e.target.closest('[data-area]'); if (ga) { selectArea(+ga.dataset.area); return; }
  const m = e.target.closest('[data-metric]'); if (m) { state.metric = m.dataset.metric; document.querySelectorAll('[data-metric]').forEach((b) => { b.dataset.state = b === m ? 'active' : ''; }); VIEWS.blocks.update(); return; }
  if (e.target.closest('#million')) { state.million = !state.million; renderPanel(); VIEWS.blocks.update(); return; }
  if (e.target.closest('[data-clear]')) { if (state.view === 'areas') selectArea(state.area); else selectBlock(null); return; }
  if (e.target.closest('[data-retry]')) { const b = BLOCKS[state.block]; liveCache.delete(`${b.blk}|${b.street}`); $('#live').textContent = 'Fetching from data.gov.sg…'; liveSales(b); return; }
  const sr = e.target.closest('[data-pick]'); if (sr) { pickResult(+sr.dataset.pick); return; }
  const vp = e.target.closest('[data-vpick]'); if (vp) { valueBlock(vResults[+vp.dataset.vpick].i); return; }
  const vb = e.target.closest('[data-vblock]'); if (vb) { valueBlock(+vb.dataset.vblock); return; }
  const tr = e.target.closest('[data-try]'); if (tr) { const inp = $('#v-search'); inp.value = tr.dataset.try; inp.focus(); vSuggest(tr.dataset.try); return; }
  const fb = e.target.closest('[data-focus]'); if (fb) { setFocus(fb.dataset.focus); return; }
  const yb = e.target.closest('[data-year]'); if (yb) { if (playTimer) play(); setYear(+yb.dataset.year); return; }
  const bk = e.target.closest('[data-block]'); if (bk) { openBlock(+bk.dataset.block, { fly: true }); }
});

// ================= hover and click on the 3D map =================
const tip = $('#tip'), ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let hover = null;
function pickAt(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(pickables, false).find((h) => h.object.visible && (h.instanceId == null || h.object.userData.alive?.(h.instanceId) !== false));
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const hit = pickAt(ev), obj = hit?.object ?? null;
  if (hover && hover !== obj && hover.userData.area != null && hover.userData.area !== state.area) hover.material[0].emissive.set('#000000');
  if (obj?.userData.area != null && obj.userData.area !== state.area) obj.material[0].emissive.set('#2a2618');
  hover = obj;
  renderer.domElement.style.cursor = hit ? 'pointer' : '';
  if (!hit) { tip.hidden = true; return; }
  tip.innerHTML = obj.userData.pick(hit);
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = `${ev.clientX + 14 + w > innerWidth ? ev.clientX - w - 14 : ev.clientX + 14}px`;
  tip.style.top = `${ev.clientY + 14 + h > innerHeight ? ev.clientY - h - 14 : ev.clientY + 14}px`;
});
renderer.domElement.addEventListener('pointerleave', () => { if (hover?.userData.area != null && hover.userData.area !== state.area) hover.material[0].emissive.set('#000000'); hover = null; tip.hidden = true; });
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const h = pickAt(e);
  if (state.view === 'areas') { if (h?.object.userData.area != null) selectArea(h.object.userData.area); else if (state.area != null) selectArea(state.area); return; }
  if (state.view === 'blocks') { if (h?.instanceId != null) selectBlock(h.instanceId); else if (state.block != null) selectBlock(null); }
  if (state.view === 'value') { const i = h?.object.userData.valueAt?.(h); if (i != null && i !== V.blk) valueBlock(i); }
});

// ================= loop =================
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h; camera.fov = w < 700 ? 52 : 34;
  if (w >= 900) camera.setViewOffset(w, h, -195, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => {
  tickers.forEach((f) => f());
  if (fly) {
    const k = Math.min(1, (performance.now() - fly.t0) / fly.dur), e = d3.easeCubicInOut(k);
    controls.target.lerpVectors(fly.ft, fly.tt, e); camera.position.lerpVectors(fly.fp, fly.tp, e);
    if (k === 1) fly = null;
  }
  controls.update(); renderer.render(scene, camera); labelR.render(scene, camera);
});
const initial = new URLSearchParams(location.search).get('view');
renderTabs();   // after every view (including Value, defined further down) exists
document.fonts.ready.then(() => show(ORDER.includes(initial) ? initial : 'areas'));
</script>
</body>
