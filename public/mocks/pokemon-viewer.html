<title>Pokémon Specimen Lab</title>
<!--
  Pokémon specimen viewer. A single-page app over PokeAPI (https://pokeapi.co), laid out like a
  sci-fi lab HUD.

  List view: every Pokémon as a card, grouped by the generation (and its game versions) that
  introduced it, with search and a type filter in the side panel.
  Detail view (#/p/<id>): a specimen sheet. Moves by version and learn method, a type-matchup map
  (D3-style curves from each attacking type to its damage multiplier), the evolution chain with
  stat sparklines, the Pokédex entry with the official artwork as a Three.js point-cloud hologram,
  species summary, base stats, a learnset heatmap across game versions, training values and where
  each piece of data came from.

  Data: the index (generations, types, damage relations, move types) is 27 PokeAPI requests,
  bundled in public/mocks/data/pokemon-viewer.json by scripts/mocks/pokemon-viewer/capture.mjs,
  which runs the loaders in the poke-data block of the module script. "Sync" reruns them live.
  Specimen sheets load live from PokeAPI and are kept in IndexedDB. Sprites and cries come from
  the PokeAPI sprites and cries repositories on GitHub.
-->

<style>

  /* app layout: the side panel is a column in the list view, and steps aside for the specimen sheet */
  @media (min-width: 900px) { body[data-view="detail"] #drawer { display: none; } }

  .hp-t { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #e4e1d8; }

  .mrow { display: flex; align-items: center; gap: 8px; padding: 4px 2px; border-bottom: 1px dashed rgb(43 47 55 / 0.8); }

  .mapsvg text { font: 400 9.5px "Source Code Pro", monospace; fill: #8b9099; }

  .evo { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border: 1px solid transparent; border-radius: 8px; transition: background 0.15s; }

  .evo.cur { border-color: #1fefd7; }
  .evo:focus-visible { outline: none; box-shadow: 0 0 0 1px #1fefd7; }

  .holo-scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgb(124 196 220 / 0.05) 0 1px, transparent 1px 3px); }

  @keyframes sweep { to { top: 100%; } }
  @media (min-width: 1280px) { .a-dex .holo { flex: 1; height: auto; min-height: 0; } }
  .hrow { display: grid; grid-template-columns: 46px repeat(4, minmax(0, 1fr)); gap: 3px; width: 100%; padding: 1px; border-radius: 4px; text-align: left; }
  .hrow:hover { background: #23262d; }
  .hrow.on { box-shadow: 0 0 0 1px #1fefd7; }
  .hcell { display: flex; align-items: center; justify-content: center; height: 16px; border-radius: 2px; font: 400 9.5px "Source Code Pro", monospace; color: #e4e1d8; }
  .ring circle { fill: none; stroke-width: 4; }
  .skel { border-radius: 10px; border: 1px solid #2b2f37; background: linear-gradient(90deg, #1d2026 0%, #23262d 50%, #1d2026 100%); background-size: 200% 100%; animation: skel 1.4s ease infinite; }
  @keyframes skel { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .holo-sweep, .skel { animation: none; } .pcard { transition: none; } }

<script>
/* <pg-layout-js v1> Playground layout standard: the mobile drawer (scripts/mocks/template/playground.html).
   Opens from #drawer-btn; closes from #drawer-close, the scrim, Escape, links to #anchors or
   [data-drawer-close] inside it, and when the window grows past 900px. Mirrors #legend into
   #drawer-legend. Mocks can call window.pgDrawer.open() / .close(). Keep identical across mocks. */
(() => {
  const body = document.body, btn = document.getElementById('drawer-btn');
  const set = (open) => { body.dataset.drawer = open ? 'open' : ''; btn?.setAttribute('aria-expanded', String(open)); };
  const close = (refocus) => { if (body.dataset.drawer !== 'open') return; set(false); if (refocus) btn?.focus(); };
  btn?.addEventListener('click', () => set(body.dataset.drawer !== 'open'));
  document.getElementById('drawer-close')?.addEventListener('click', () => close(true));
  document.getElementById('scrim')?.addEventListener('click', () => close(false));
  document.getElementById('drawer')?.addEventListener('click', (e) => { if (e.target.closest('a[href^="#"], [data-drawer-close]')) close(false); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && body.dataset.drawer === 'open') { e.stopImmediatePropagation(); close(true); } }, true);
  matchMedia('(min-width: 900px)').addEventListener('change', (m) => { if (m.matches) set(false); });
  const legend = document.getElementById('legend'), copy = document.getElementById('drawer-legend');
  if (legend && copy) {
    const sync = () => { copy.innerHTML = legend.hidden ? '' : legend.innerHTML.trim(); };
    new MutationObserver(sync).observe(legend, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
    sync();
  }
  window.pgDrawer = { open: () => set(true), close: () => close(false) };
})();
/* </pg-layout-js> */
</script>

<script type="module">
import * as THREE from 'three';

// PokeAPI loaders, shared with scripts/mocks/pokemon-viewer/capture.mjs (which imports this block).
// <poke-data>
const POKE_DATA = (() => {
  const API = 'https://pokeapi.co/api/v2/';
  const TYPES = ['normal', 'fire', 'water', 'electric', 'grass', 'ice', 'fighting', 'poison', 'ground', 'flying', 'psychic', 'bug', 'rock', 'ghost', 'dragon', 'dark', 'steel', 'fairy'];
  const idOf = (url) => Number(String(url).match(/\/(\d+)\/?$/)[1]);
  const get = async (path) => {
    const r = await fetch(path.startsWith('http') ? path : API + path);
    if (!r.ok) throw new Error(`PokeAPI ${r.status} for ${path}`);
    return r.json();
  };
  const pretty = (s) => String(s || '').split('-').filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
  const en = (arr) => (arr || []).filter((x) => x.language?.name === 'en');

  // The index: every generation with its version groups and species, each Pokémon's types,
  // each type's damage relations and every move's type. 9 generation + 18 type requests.
  async function loadIndex(onStep = () => {}) {
    const list = await get('generation?limit=50');
    const gens = await Promise.all(list.results.map(async (g) => {
      const d = await get(g.url); onStep();
      return { id: d.id, name: d.name, region: d.main_region?.name ?? '', versionGroups: d.version_groups.map((v) => v.name), species: d.pokemon_species.map((s) => [idOf(s.url), s.name]) };
    }));
    gens.sort((a, b) => a.id - b.id);
    const types = {}, moveTypes = {}, slots = {};
    await Promise.all(TYPES.map(async (t) => {
      const d = await get(`type/${t}`); onStep();
      const r = d.damage_relations, n = (a) => a.map((x) => x.name);
      types[t] = { x2: n(r.double_damage_from), x05: n(r.half_damage_from), x0: n(r.no_damage_from) };
      for (const m of d.moves) moveTypes[m.name] = t;
      for (const p of d.pokemon) { const id = idOf(p.pokemon.url); if (id < 10000) (slots[id] ||= [])[p.slot - 1] = t; }
    }));
    const pokemon = gens.flatMap((g) => g.species.map(([id, name]) => [id, name, g.id, ...(slots[id] || []).filter(Boolean)])).sort((a, b) => a[0] - b[0]);
    return {
      capturedAt: new Date().toISOString(),
      gens: gens.map(({ species, ...g }) => ({ ...g, count: species.length })),
      pokemon, types, moveTypes,
    };
  }

  // A specimen, trimmed to what the sheet draws (the raw payload carries every move's history).
  async function loadPokemon(id) {
    const p = await get(`pokemon/${id}`);
    return {
      id: p.id, name: p.name, height: p.height, weight: p.weight, baseExp: p.base_experience,
      types: p.types.map((t) => t.type.name),
      stats: p.stats.map((s) => [s.stat.name, s.base_stat, s.effort]),
      abilities: p.abilities.map((a) => [a.ability.name, a.is_hidden]),
      moves: p.moves.map((m) => [m.move.name, m.version_group_details.map((d) => [d.version_group.name, idOf(d.version_group.url), d.move_learn_method.name, d.level_learned_at])]),
      cry: p.cries?.latest || '', cryLegacy: p.cries?.legacy || '',
      held: p.held_items.map((h) => h.item.name),
      games: p.game_indices.map((g) => g.version.name),
      art: p.sprites?.other?.['official-artwork']?.front_default || p.sprites?.front_default || '',
    };
  }

  async function loadSpecies(id) {
    const s = await get(`pokemon-species/${id}`);
    const flav = en(s.flavor_text_entries).at(-1);
    return {
      id: s.id, slug: s.name, name: en(s.names)[0]?.name || pretty(s.name), genus: en(s.genera)[0]?.genus || '',
      flavor: flav ? flav.flavor_text.replace(/[\f\n\r­]+/g, ' ').replace(/\s+/g, ' ').trim() : '', flavorVersion: flav?.version?.name || '',
      genderRate: s.gender_rate, captureRate: s.capture_rate, happiness: s.base_happiness, hatch: s.hatch_counter,
      growth: s.growth_rate?.name || '', eggGroups: s.egg_groups.map((e) => e.name), color: s.color?.name || '', shape: s.shape?.name || '', habitat: s.habitat?.name || '',
      legendary: s.is_legendary, mythical: s.is_mythical, baby: s.is_baby, gen: s.generation?.name || '',
      chain: s.evolution_chain ? idOf(s.evolution_chain.url) : null,
    };
  }

  const how = (d) => {
    if (!d) return '';
    const parts = [], tr = d.trigger?.name;
    if (d.min_level) parts.push(`Lv ${d.min_level}`);
    if (d.item) parts.push(`Use ${pretty(d.item.name)}`);
    if (tr === 'trade') parts.push('Trade');
    if (d.held_item) parts.push(`holding ${pretty(d.held_item.name)}`);
    if (d.min_happiness) parts.push('High friendship');
    if (d.min_affection) parts.push('High affection');
    if (d.known_move) parts.push(`knows ${pretty(d.known_move.name)}`);
    if (d.known_move_type) parts.push(`knows a ${d.known_move_type.name} move`);
    if (d.location) parts.push(`at ${pretty(d.location.name)}`);
    if (d.time_of_day) parts.push(`(${d.time_of_day})`);
    if (!parts.length && tr) parts.push(pretty(tr));
    return parts.join(' ');
  };
  // An evolution chain, flattened in walk order with each stage's depth and how it is reached.
  async function loadChain(chainId) {
    const c = await get(`evolution-chain/${chainId}`);
    const out = [];
    const walk = (n, depth, from) => {
      const id = idOf(n.species.url);
      out.push({ id, name: n.species.name, depth, from, how: how(n.evolution_details?.[0]) });
      n.evolves_to.forEach((k) => walk(k, depth + 1, id));
    };
    walk(c.chain, 0, null);

let loadToken = 0;
async function showDetail(id) {
  if (!state.byId.has(id)) { location.hash = ''; return; }
  setView('detail');
  state.current = id; state.last = id;
  renderTabs();
  if (state.sheet?.p.id === id) return;
  disposeHolo();
  const token = ++loadToken;
  renderSkeleton(id);
  $('#detail').scrollTop = 0;
  try {
    const [p, s] = await Promise.all([cached(`p:${id}`, () => D.loadPokemon(id)), cached(`s:${id}`, () => D.loadSpecies(id))]);
    const chain = s.chain ? await cached(`c:${s.chain}`, () => D.loadChain(s.chain)) : [{ id, name: p.name, depth: 0, from: null, how: '' }];
    const members = await Promise.all(chain.map((n) => (n.id === id ? p : cached(`p:${n.id}`, () => D.loadPokemon(n.id)).catch(() => null))));
    if (token !== loadToken) return;
    state.sheet = { p, s, chain, members };
    const vgs = vgsOf(p);
    // open on the newest game version where it learns moves by level
    state.vg = [...vgs].reverse().find((vg) => movesFor(p, vg, 'level-up').length) || vgs.at(-1);
    state.method = 'level-up';
    renderSheet();
    document.title = `${s.name} · Pokémon Specimen Lab`;
  } catch (err) {
    if (token === loadToken) renderError(id, err);
  }
}
function showList() {
  setView('list');
  disposeHolo(); state.sheet = null; loadToken++;
  document.title = 'Pokémon Specimen Lab';
  renderTabs();
  document.querySelectorAll('.pcard.last').forEach((c) => c.classList.remove('last'));
  const c = state.last && document.querySelector(`.pcard[href="#/p/${state.last}"]`);
  if (c) { c.classList.add('last'); const r = c.getBoundingClientRect(), L = $('#list').getBoundingClientRect(); if (r.top < L.top + 40 || r.bottom > L.bottom) c.scrollIntoView({ block: 'center' }); }
}
function setView(v) {
  state.view = v; document.body.dataset.view = v;
  $('#list').hidden = v !== 'list'; $('#detail').hidden = v !== 'detail';
}
const renderTabs = () => {

  $('#tabs').innerHTML = tabs.map(([k, n, icon]) => { const on = state.view === k, off = k === 'detail' && !state.last; return `<button role="tab" type="button" data-tab="${k}" aria-label="${n}" aria-selected="${on}" data-state="${on ? 'active' : ''}" ${off ? 'disabled' : ''} class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all hover:text-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-40 data-[state=active]:bg-background data-[state=active]:text-foreground data-[state=active]:shadow"><i class="fi ${icon}"></i><span class="hidden sm:inline">${n}</span></button>`; }).join('');
};
function route() {

}
const toList = () => { if (location.hash) history.pushState(null, '', location.pathname + location.search); showList(); };

// ================= hologram (Three.js point cloud of the official artwork) =================
let holo = null;
function disposeHolo() {
  if (!holo) return;
  holo.renderer.setAnimationLoop(null); holo.ro.disconnect();
  holo.scene.traverse((o) => { o.geometry?.dispose(); o.material?.dispose(); });
  holo.renderer.dispose(); holo.renderer.domElement.remove();
  holo = null;
}
const loadImg = (url) => new Promise((ok, no) => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => ok(im); im.onerror = () => no(new Error('image')); im.src = url; });
async function mountHolo(el, url) {
  disposeHolo();
  const token = loadToken;
  let im;
  try { im = await loadImg(url); } catch { return; }
  if (token !== loadToken || !el.isConnected) return;
  let px;
  try {
    const N = 150, c = document.createElement('canvas'); c.width = c.height = N;
    const g = c.getContext('2d', { willReadFrequently: true });
    const k = N / Math.max(im.width, im.height);
    g.drawImage(im, (N - im.width * k) / 2, (N - im.height * k) / 2, im.width * k, im.height * k);
    px = g.getImageData(0, 0, N, N).data;
    const pos = [], col = [], sky = new THREE.Color(B.sky), white = new THREE.Color('#ffffff'), tmp = new THREE.Color();
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = (y * N + x) * 4;
      if (px[i + 3] < 70) continue;
      const lum = (0.3 * px[i] + 0.59 * px[i + 1] + 0.11 * px[i + 2]) / 255;
      pos.push((x / N - 0.5) * 2, -(y / N - 0.5) * 2, (lum - 0.5) * 0.35 + (Math.random() - 0.5) * 0.05);
      tmp.copy(sky).lerp(white, lum * 0.55).multiplyScalar(0.35 + lum * 0.75);
      col.push(tmp.r, tmp.g, tmp.b);
    }
    const scene = new THREE.Scene();
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.016, vertexColors: true, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(pts);
    // projector pedestal: three rings under the specimen
    const base = new THREE.Group(); base.position.y = -1.08; base.rotation.x = -Math.PI / 2;
    [0.55, 0.78, 1.0].forEach((r, i) => {
      const ring = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(new THREE.Path().absarc(0, 0, r, 0, Math.PI * 2).getPoints(72)), new THREE.LineBasicMaterial({ color: B.sky, transparent: true, opacity: 0.45 - i * 0.12 }));
      base.add(ring);
    });
    scene.add(base);
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 20);
    camera.position.set(0, 0.25, 4.6); camera.lookAt(0, -0.1, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    el.prepend(renderer.domElement);
    const size = () => { const w = el.clientWidth, h = el.clientHeight; if (!w || !h) return; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); };
    const ro = new ResizeObserver(size); ro.observe(el); size();
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      if (!reduceMotion) { pts.rotation.y = Math.sin(t * 0.5) * 0.55; base.rotation.z = t * 0.3; pts.material.opacity = 0.88 + Math.sin(t * 9) * 0.04 + (Math.random() < 0.02 ? -0.2 : 0); }
      renderer.render(scene, camera);
    });
    holo = { renderer, scene, ro };
  } catch {
    // no WebGL or a tainted canvas: show the artwork with a hologram tint instead
    const img = document.createElement('img'); img.src = url; img.alt = ''; el.prepend(img);
  }
}

document.addEventListener('click', async (e) => {
  const t = e.target;
  if (t.closest('[data-back]')) return toList();
  const tab = t.closest('[data-tab]');
  if (tab) { if (tab.dataset.tab === 'list') toList(); else if (state.last) location.hash = `#/p/${state.last}`; return; }
  const gen = t.closest('[data-gen]');
  if (gen) {
    if (state.view !== 'list') toList();
    $(`#gen-${gen.dataset.gen}`)?.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
    return;
  }
  const ty = t.closest('[data-type]');
  if (ty) { state.type = state.type === ty.dataset.type ? '' : ty.dataset.type; document.querySelectorAll('#typef [data-type]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.type === state.type)); if (state.view !== 'list') toList(); refilter(); $('#list').scrollTop = 0; return; }
  if (t.closest('[data-reset]')) { state.q = ''; state.type = ''; $('#q').value = ''; document.querySelectorAll('#typef [data-type]').forEach((b) => b.setAttribute('aria-pressed', 'false')); refilter(); return; }
  const meth = t.closest('[data-method]');
  if (meth) { state.method = meth.dataset.method; renderMoves(); return; }
  const vg = t.closest('#heat [data-vg]');
  if (vg) { state.vg = vg.dataset.vg; renderMoves(); return; }
  const retry = t.closest('[data-retry]');
  if (retry) { state.sheet = null; showDetail(Number(retry.dataset.retry)); return; }
  if (t.closest('[data-cry]')) {
    const { p } = state.sheet;
    try { const a = new Audio(p.cry || p.cryLegacy); a.volume = 0.5; await a.play(); }
    catch { try { await new Audio(p.cryLegacy).play(); } catch { toast('This browser cannot play the cry (OGG audio)'); } }
    return;
  }
  if (t.closest('#clear, [data-clear]')) {
    await store.clear();
    for (const k of Object.keys(prov)) delete prov[k];
    if (state.idxSrc === 'synced') { await loadIndex(); renderPanel(); refilter(); }
    toast('Cleared what this page stored in your browser');
  }
});

  const at = state.order.indexOf(state.current);
  if (e.key === 'Escape') toList();
  else if (e.key === 'ArrowLeft' && at > 0) location.hash = `#/p/${state.order[at - 1]}`;
  else if (e.key === 'ArrowRight' && at < state.order.length - 1) location.hash = `#/p/${state.order[at + 1]}`;
});
addEventListener('hashchange', route);
addEventListener('popstate', route);

let syncing = false;
$('#action').addEventListener('click', async () => {
  if (syncing) return;
  syncing = true; $('#action').disabled = true;
  let n = 0;
  toast('Syncing the index from PokeAPI…', true);
  try {
    const idx = await D.loadIndex(() => { n++; toast(`Syncing the index from PokeAPI · ${n} of 27`, true); });
    await store.put('index', idx);
    setIndex(idx, 'synced');
    renderPanel(); renderList();
    if (state.view === 'detail') showList();
    toast(`Synced ${fmt(idx.pokemon.length)} Pokémon from PokeAPI`);
  } catch (err) {
    toast(`Sync failed: ${err.message}`);
  } finally { syncing = false; $('#action').disabled = false; }
});

(async () => {
  setView('list'); renderTabs();
  $('#list-hero').innerHTML = '<p class="text-sm text-muted-foreground">Loading the Pokédex…</p>';
  try { await loadIndex(); }
  catch (err) { $('#list-hero').innerHTML = `<p class="text-sm">Could not load the Pokédex: <span class="font-mono text-xs text-muted-foreground">${esc(err.message)}</span></p>`; return; }
  renderPanel(); renderList(); route();
})();
</script>
</body>
</html>
