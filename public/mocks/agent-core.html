ground\">Click for details\u003c/p>`;\n        } else {\n          const c = capabilities[hovered.index];\n          html = c\n            ? `\u003cp class=\"font-mono text-[10px] tracking-widest\" style=\"color:${KIND_COLOR[c.kind]}\">${KIND_LABEL[c.kind]}${c.active ? ' · ACTIVE' : ' · IDLE'}\u003c/p>\u003cp class=\"font-medium\">${esc(c.name)}\u003c/p>\u003cp class=\"text-muted-foreground\">${c.uses} runs / 7d\u003c/p>`\n            : `\u003cp class=\"text-muted-foreground\">Empty slot ${hovered.index + 1} / ${MAX_BARS}\u003c/p>`;\n        }\n        tooltip.innerHTML = html;\n        tooltip.classList.remove('hidden');\n        const x = Math.min(pointerPx.x + 14, innerWidth - tooltip.offsetWidth - 8);\n        const y = Math.min(pointerPx.y + 14, innerHeight - tooltip.offsetHeight - 8);\n        tooltip.style.transform = `translate(${x}px, ${y}px)`;\n        tooltip.style.left = tooltip.style.top = '0';\n      }\n\n      // Highlight set: focused node + neighbours, or memory linked to a focused capability.\n      // Priority: focused item > hovered node > live search matches > hovered bar.\n      function highlightSet() {\n        const src = focused ?? (hovered?.type === 'node' ? { type: 'node', index: hovered.index } : null) ?? (panelHover?.type === 'node' ? panelHover : null);\n        if (!src && panelHover?.type === 'nodes') return { set: panelHover.set };\n        if (!src && panelHover?.type === 'caps') {\n          const set = new Set();\n          for (const ci of panelHover.caps) for (const id of capabilities[ci].linkedMemoryIds ?? []) if (nodeById.has(id)) set.add(nodeById.get(id));\n          return { set, caps: panelHover.caps };\n        }\n        if (!src && searchHits) {\n          const r = results[sel];\n          return { set: searchHits.nodes, caps: searchHits.caps, pulse: r?.ref.type === 'node' ? r.ref.index : undefined, pulseCap: r?.ref.type === 'cap' ? r.ref.index : undefined };\n        }\n        if (!src && hovered?.type === 'bar' && capabilities[hovered.index]) return highlightSetFor({ type: 'cap', index: hovered.index });\n        return src ? highlightSetFor(src) : null;\n      }\n      function highlightSetFor(src) {\n        if (src.type === 'node') return { center: src.index, set: new Set([src.index, ...neighbours[src.index]]) };\n        const ids = capabilities[src.index].linkedMemoryIds ?? [];\n        return { cap: src.index, set: new Set(ids.map((id) => nodeById.get(id)).filter((i) => i !== undefined)) };\n      }\n\n      // ---------- detail sheet ----------\n      const sheet = document.getElementById('sheet');\n      document.getElementById('sheet-close').onclick = () => setFocus(null);\n      const nodeChip = (i) => {\n        const n = nodes[i], d = domains[domainIndex.get(n.domain)];\n        return `\u003cbutton data-node=\"${i}\" class=\"flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left hover:bg-accent\">\u003ci class=\"legend-dot shrink-0\" style=\"background:${d.color}\">\u003c/i>\u003cspan class=\"truncate\">${esc(n.title)}\u003c/span>\u003c/button>`;\n      };\n      const section = (title, body) => `\u003csection>\u003ch3 class=\"mb-2 font-mono text-[10px] tracking-[0.2em] text-muted-foreground\">${title}\u003c/h3>${body}\u003c/section>`;\n\n      function renderSheet() {\n        if (!focused) { sheet.classList.add('translate-x-full'); return; }\n        let kind, title, body = '';\n        if (focused.type === 'node') {\n          const n = nodes[focused.index], d = domains[domainIndex.get(n.domain)];\n          kind = `MEMORY · ${d.label.toUpperCase()}`;\n          title = n.title;\n          body += `\u003cdiv class=\"flex flex-wrap gap-1.5\">\u003cspan class=\"badge\" style=\"border-color:${d.color}66;color:${d.color}\">${esc(n.type)}\u003c/span>\u003cspan class=\"badge\">${esc(n.status)}\u003c/span>\u003c/div>`;\n          body += section('PATH', `\u003cp class=\"break-all font-mono text-xs text-muted-foreground\">${esc(n.path)}\u003c/p>`);\n          body += section('UPDATED', `\u003cp class=\"text-muted-foreground\">${esc(n.updated)} \u003cspan class=\"opacity-60\">· created ${esc(n.created)}\u003c/span>\u003c/p>`);\n          if (n.tags?.length) body += section('TAGS', `\u003cdiv class=\"flex flex-wrap gap-1.5\">${n.tags.map((t) => `\u003cspan class=\"badge text-muted-foreground\">#${esc(t)}\u003c/span>`).join('')}\u003c/div>`);\n          const rel = [...neighbours[focused.index]];\n          body += section(`RELATED · ${rel.length}`, rel.length ? rel.map(nodeChip).join('') : '\u003cp class=\"text-muted-foreground\">No links.\u003c/p>');\n          const usedBy = capabilities.map((c, ci) => [c, ci]).filter(([c]) => c.linkedMemoryIds?.includes(n.id));\n          if (usedBy.length) body += section('USED BY', usedBy.map(([c, ci]) => capChip(ci)).join(''));\n        } else {\n          const c = capabilities[focused.index];\n          kind = `${KIND_LABEL[c.kind]} · ${c.active ? 'ACTIVE' : 'IDLE'}`;\n          title = c.name;\n          body += `\u003cp class=\"text-muted-foreground\">${esc(c.description)}\u003c/p>`;\n          body += `\u003cdiv class=\"flex flex-wrap gap-1.5\">\u003cspan class=\"badge\" style=\"border-color:${KIND_COLOR[c.kind]}66;color:${KIND_COLOR[c.kind]}\">${c.uses} runs / 7d\u003c/span>${c.model ? `\u003cspan class=\"badge\">${esc(c.model)}\u003c/span>` : ''}${c.effort ? `\u003cspan class=\"badge\">effort ${esc(c.effort)}\u003c/span>` : ''}\u003c/div>`;\n          if (c.path) body += section('PATH', `\u003cp class=\"break-all font-mono text-xs text-muted-foreground\">${esc(c.path)}\u003c/p>`);\n          const mem = (c.linkedMemoryIds ?? []).map((id) => nodeById.get(id)).filter((i) => i !== undefined);\n          body += section(`LINKED MEMORY · ${mem.length}`, mem.length ? mem.map(nodeChip).join('') : '\u003cp class=\"text-muted-foreground\">None.\u003c/p>');\n        }\n        document.getElementById('sheet-kind').textContent = kind;\n        document.getElementById('sheet-title').textContent = title;\n        const b = document.getElementById('sheet-body');\n        b.innerHTML = body;\n        b.scrollTop = 0;\n        sheet.classList.remove('translate-x-full');\n      }\n      function capChip(ci) {\n        const c = capabilities[ci];\n        return `\u003cbutton data-cap=\"${ci}\" class=\"flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left hover:bg-accent\">\u003ci class=\"legend-dot shrink-0\" style=\"background:${KIND_COLOR[c.kind]}\">\u003c/i>\u003cspan class=\"truncate\">${esc(c.name)}\u003c/span>\u003cspan class=\"ml-auto font-mono text-[10px] text-muted-foreground\">${KIND_LABEL[c.kind]}\u003c/span>\u003c/button>`;\n      }\n      document.getElementById('sheet-body').addEventListener('click', (e) => {\n        const el = e.target.closest('[data-node],[data-cap]');\n        if (!el) return;\n        setFocus(el.dataset.node !== undefined ? { type: 'node', index: +el.dataset.node } : { type: 'cap', index: +el.dataset.cap });\n      });\n\n      function setFocus(f) { focused = f; renderSheet(); }\n\n      // ---------- right column: activity panels ----------\n      let panelHover = null; // { type: 'node', index } | { type: 'caps', caps: Set }\n      const capIndexById = new Map(capabilities.map((c, i) => [c.id, i]));\n      const capIndexByName = new Map(capabilities.map((c, i) => [`${c.kind}:${c.name}`, i]));\n      // Mock \"now\": the latest agent heartbeat, so relative times match the fixtures.\n      const now = new Date(Math.max(...agents.map((a) => Date.parse(a.lastActiveAt))));\n      const ago = (ms) => {\n        const m = Math.round(ms / 60000);\n        return m \u003c 1 ? 'now' : m \u003c 60 ? `${m}m ago` : m \u003c 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;\n      };\n      const STATUS = {\n        running: { c: '#5eead4', live: true }, idle: { c: '#64748b' }, waiting: { c: '#fbbf24' },\n        error: { c: '#f87171', live: true }, offline: { c: '#334155' },\n        fired: { c: '#5eead4' }, failed: { c: '#f87171' }, next: { c: '#fbbf24' }, queued: { c: '#475569' },\n      };\n      const dot = (status) => {\n        const st = STATUS[status] ?? STATUS.idle;\n        return `\u003ci class=\"legend-dot mt-1 shrink-0 ${st.live ? 'dot-live' : ''}\" style=\"background:${st.c};color:${st.c}\">\u003c/i>`;\n      };\n\n      // 1. Agents\n      const agentOrder = ['running', 'error', 'waiting', 'idle', 'offline'];\n      const agentsSorted = [...agents].sort((a, b) => agentOrder.indexOf(a.status) - agentOrder.indexOf(b.status));\n      document.getElementById('agents-summary').textContent = `${agents.filter((a) => a.status === 'running').length} running · ${agents.length}`;\n      document.getElementById('agents-list').innerHTML = agentsSorted.map((a) => {\n        const caps = (a.tools ?? []).map((t) => capIndexByName.get(`mcp:${t}`)).filter((i) => i !== undefined);\n        return `\u003cdiv class=\"panel-row\" data-caps=\"${caps.join(',')}\">\n          ${dot(a.status)}\n          \u003cdiv class=\"min-w-0 flex-1\">\n            \u003cp class=\"flex items-baseline gap-1.5\">\u003cspan class=\"font-medium\">${esc(a.name)}\u003c/span>\u003cspan class=\"truncate text-muted-foreground\">${esc(a.role)}\u003c/span>\u003cspan class=\"ml-auto shrink-0 font-mono text-[10px] text-muted-foreground\">${esc(a.model)}\u003c/span>\u003c/p>\n            \u003cp class=\"truncate text-muted-foreground\">${a.currentTask ? esc(a.currentTask) : `${esc(a.status)} · ${ago(now - Date.parse(a.lastActiveAt))}`}\u003c/p>\n          \u003c/div>\u003c/div>`;\n      }).join('');\n\n      // 2. Today's workflow runs, with a \"now\" marker between past and upcoming.\n      const runs = schedule.runs;\n      const fmtDur = (s) => (s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.round((s % 3600) / 60)}m` : s >= 60 ? `${Math.round(s / 60)}m` : `${s}s`);\n      document.getElementById('runs-summary').textContent = `${runs.filter((r) => r.status === 'fired').length}/${runs.length} done${runs.some((r) => r.status === 'failed') ? ' · 1 failed' : ''}`;\n      let runsHtml = '\u003cdiv class=\"absolute bottom-3 left-[11px] top-3 w-px bg-border\">\u003c/div>';\n      let nowPlaced = false;\n      for (const r of runs) {\n        if (!nowPlaced && Date.parse(r.scheduledAt) > now) {\n          nowPlaced = true;\n          const hhmm = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Singapore' });\n          runsHtml += `\u003cdiv class=\"relative my-1 flex items-center gap-2 pl-1\">\u003ci class=\"z-10 size-2 rounded-full bg-sky-300 shadow-[0_0_8px_#7dd3fc]\">\u003c/i>\u003cspan class=\"font-mono text-[10px] text-sky-300\">NOW ${hhmm}\u003c/span>\u003cspan class=\"h-px flex-1 bg-sky-300/40\">\u003c/span>\u003c/div>`;\n        }\n        const ci = capIndexById.get(r.workflowId);\n        const meta = r.status === 'running' ? 'running…' : r.durationSec ? fmtDur(r.durationSec) : r.status;\n        runsHtml += `\u003cdiv class=\"panel-row relative ${r.status === 'queued' ? 'opacity-60' : ''}\" data-caps=\"${ci ?? ''}\">\n          \u003cspan class=\"relative z-10 mt-0.5 flex size-3 shrink-0 items-center justify-center rounded-full bg-background\">${dot(r.status).replace('mt-1 ', '')}\u003c/span>\n          \u003cspan class=\"w-10 shrink-0 font-mono text-[11px] text-muted-foreground\">${esc(r.time)}\u003c/span>\n          \u003cdiv class=\"min-w-0 flex-1\">\n            \u003cp class=\"truncate ${r.status === 'failed' ? 'text-red-300' : ''}\">${esc(r.workflowName)}\u003c/p>\n            \u003cp class=\"truncate text-muted-foreground\">${esc(r.runner.label)} · ${esc(meta)}\u003c/p>\n          \u003c/div>\u003c/div>`;\n      }\n      document.getElementById('runs-list').innerHTML = runsHtml;\n\n      // 3. Recently updated memory\n      const recent = nodes.map((n, i) => [n, i]).sort((a, b) => b[0].updated.localeCompare(a[0].updated) || a[0].title.localeCompare(b[0].title)).slice(0, 7);\n      const dayAgo = (d) => {\n        const days = Math.round((Date.parse(now.toISOString().slice(0, 10)) - Date.parse(d)) / 86400000);\n        return days \u003c= 0 ? 'today' : days === 1 ? 'yesterday' : `${days}d ago`;\n      };\n      document.getElementById('recent-list').innerHTML = recent.map(([n, i]) => {\n        const d = domains[domainIndex.get(n.domain)];\n        return `\u003cdiv class=\"panel-row\" data-node=\"${i}\">\u003ci class=\"legend-dot mt-1 shrink-0\" style=\"background:${d.color}\">\u003c/i>\n          \u003cdiv class=\"min-w-0 flex-1\">\u003cp class=\"truncate\">${esc(n.title)}\u003c/p>\u003cp class=\"truncate text-muted-foreground\">${esc(d.label)} · ${esc(n.type)} · ${dayAgo(n.updated)}\u003c/p>\u003c/div>\u003c/div>`;\n      }).join('');\n\n      // 4. Memory health (left panel): status mix as a stacked bar, plus notes needing attention.\n      {\n        const HEALTH = [['active', '#5eead4'], ['completed', '#60a5fa'], ['reference', '#a78bfa'], ['draft', '#fbbf24'], ['archived', '#475569']];\n        const byStatus = (st) => new Set(nodes.flatMap((n, i) => (n.status === st ? [i] : [])));\n        const groups = HEALTH.map(([st, c]) => ({ st, c, set: byStatus(st) })).filter((g) => g.set.size);\n        const orphans = new Set(nodes.flatMap((_, i) => (neighbours[i].size ? [] : [i])));\n        const drafts = byStatus('draft');\n        document.getElementById('health-total').textContent = `${nodes.length} notes`;\n        const healthEl = document.getElementById('health');\n        healthEl.innerHTML =\n          `\u003cdiv class=\"flex h-2 overflow-hidden rounded-full bg-muted\">${groups.map((g, k) => `\u003cspan data-h=\"${k}\" class=\"h-full cursor-pointer hover:brightness-150\" style=\"width:${(g.set.size / nodes.length) * 100}%;background:${g.c}\" title=\"${g.st} · ${g.set.size}\">\u003c/span>`).join('')}\u003c/div>`\n          + `\u003cdiv class=\"mt-2 grid grid-cols-2 gap-x-4 gap-y-0.5\">${groups.map((g, k) => `\u003cspan data-h=\"${k}\" class=\"flex cursor-pointer items-center gap-1.5 rounded hover:text-foreground\">\u003ci class=\"legend-dot\" style=\"background:${g.c}\">\u003c/i>${g.st} \u003cb class=\"font-mono font-normal text-muted-foreground\">${g.set.size}\u003c/b>\u003c/span>`).join('')}\u003c/div>`\n          + `\u003cp class=\"mb-1 mt-2.5 text-[11px] text-muted-foreground\">Needs attention\u003c/p>`\n          + `\u003cdiv class=\"flex flex-wrap gap-1.5\">`\n          + `\u003cspan data-h=\"drafts\" class=\"badge cursor-pointer border-amber-400/40 text-amber-300 hover:bg-accent\">${drafts.size} drafts\u003c/span>`\n          + `\u003cspan data-h=\"orphans\" class=\"badge cursor-pointer border-red-400/40 text-red-300 hover:bg-accent\">${orphans.size} unlinked\u003c/span>\u003c/div>`;\n        const healthSet = (k) => (k === 'drafts' ? drafts : k === 'orphans' ? orphans : groups[+k]?.set);\n        healthEl.addEventListener('mouseover', (e) => {\n          const el = e.target.closest('[data-h]');\n          panelHover = el ? { type: 'nodes', set: healthSet(el.dataset.h) } : null;\n        });\n        healthEl.addEventListener('mouseleave', () => (panelHover = null));\n      }\n\n      const activity = document.getElementById('activity');\n      const rowRef = (el) => (el.dataset.node !== undefined ? { type: 'node', index: +el.dataset.node }\n        : el.dataset.caps ? { type: 'caps', caps: new Set(el.dataset.caps.split(',').map(Number)) } : null);\n      activity.addEventListener('mouseover', (e) => { const el = e.target.closest('.panel-row'); panelHover = el ? rowRef(el) : null; });\n      activity.addEventListener('mouseleave', () => (panelHover = null));\n      activity.addEventListener('click', (e) => {\n        const el = e.target.closest('.panel-row');\n        const ref = el && rowRef(el);\n        if (!ref) return;\n        if (ref.type === 'node') setFocus(ref);\n        else if (ref.caps.size === 1) setFocus({ type: 'cap', index: [...ref.caps][0] });\n        setLegendOpen(false);\n      });\n      // Phone widths: fold the activity column into the left sidebar; restore it on wider screens.\n      const phoneMq = matchMedia('(max-width: 639.98px)');\n      const activityHome = activity.parentNode, activityNext = activity.nextSibling;\n      const moveActivity = () => {\n        if (phoneMq.matches) document.getElementById('legend').append(activity);\n        else activityHome.insertBefore(activity, activityNext);\n      };\n      phoneMq.addEventListener('change', moveActivity);\n      moveActivity();\n\n      // ---------- ring / sphere toggle ----------\n      const viewBtns = [...document.querySelectorAll('#view-toggle [data-view]')];\n      const setView = (mode) => {\n        sphereTarget = mode === 'sphere' ? 1 : 0;\n        viewBtns.forEach((b) => b.setAttribute('aria-checked', String(b.dataset.view === mode)));\n      };\n      viewBtns.forEach((b) => (b.onclick = () => setView(b.dataset.view)));\n\n      // ---------- command palette ----------\n      const cmd = document.getElementById('cmd');\n      const cmdInput = document.getElementById('cmd-input');\n      const cmdList = document.getElementById('cmd-list');\n      const index = [\n        ...capabilities.map((c, i) => ({ group: c.kind, ref: { type: 'cap', index: i }, title: c.name, sub: c.description, hay: `${c.name} ${c.description} ${c.kind}`.toLowerCase(), color: KIND_COLOR[c.kind] })),\n        ...nodes.map((n, i) => {\n          const d = domains[domainIndex.get(n.domain)];\n          return { group: 'memory', ref: { type: 'node', index: i }, title: n.title, sub: `${d.label} · ${n.type}`, hay: `${n.title} ${n.tags?.join(' ')} ${d.label} ${n.id}`.toLowerCase(), color: d.color };\n        }),\n      ];\n      const GROUPS = [['memory', 'Memory'], ['skill', 'Skills'], ['workflow', 'Workflows'], ['mcp', 'MCP']];\n      let results = [], sel = 0;\n\n      function search(q) {\n        const terms = q.toLowerCase().split(/\\s+/).filter(Boolean);\n        const scored = index\n          .map((e) => {\n            if (!terms.every((t) => e.hay.includes(t))) return null;\n            const tl = e.title.toLowerCase();\n            const score = terms.reduce((s, t) => s + (tl.startsWith(t) ? 3 : tl.includes(t) ? 2 : 1), 0);\n            return { e, score };\n          })\n          .filter(Boolean)\n          .sort((a, b) => b.score - a.score);\n        results = [];\n        for (const [g] of GROUPS) results.push(...scored.filter((s) => s.e.group === g).slice(0, terms.length ? 12 : 5).map((s) => s.e));\n        sel = 0;\n        // Every match (not just the listed ones) lights up on the rings.\n        searchHits = terms.length ? { nodes: new Set(), caps: new Set() } : null;\n        for (const { e } of terms.length ? scored : []) searchHits[e.ref.type === 'node' ? 'nodes' : 'caps'].add(e.ref.index);\n        renderCmd(scored.length);\n      }\n      function renderCmd(total) {\n        let html = '', i = 0;\n        for (const [g, label] of GROUPS) {\n          const items = results.filter((r) => r.group === g);\n          if (!items.length) continue;\n          html += `\u003cp class=\"px-2 pb-1 pt-3 text-[11px] font-medium text-muted-foreground\">${label}\u003c/p>`;\n          for (const r of items) {\n            html += `\u003cdiv class=\"cmd-item\" role=\"option\" data-i=\"${i}\" aria-selected=\"${i === sel}\">\u003ci class=\"legend-dot shrink-0\" style=\"background:${r.color}\">\u003c/i>\u003cdiv class=\"min-w-0\">\u003cp class=\"truncate\">${esc(r.title)}\u003c/p>\u003cp class=\"truncate text-xs text-muted-foreground\">${esc(r.sub)}\u003c/p>\u003c/div>\u003c/div>`;\n            i++;\n          }\n        }\n        cmdList.innerHTML = html || '\u003cp class=\"py-8 text-center text-sm text-muted-foreground\">No results found.\u003c/p>';\n        document.getElementById('cmd-count').textContent = `${total} match${total === 1 ? '' : 'es'}`;\n      }\n      function moveSel(d) {\n        if (!results.length) return;\n        sel = (sel + d + results.length) % results.length;\n        cmdList.querySelectorAll('.cmd-item').forEach((el) => el.setAttribute('aria-selected', String(+el.dataset.i === sel)));\n        cmdList.querySelector(`[data-i=\"${sel}\"]`)?.scrollIntoView({ block: 'nearest' });\n      }\n      function choose(i) { const r = results[i]; if (!r) return; closeCmd(); setFocus(r.ref); }\n      const isCmdOpen = () => document.body.classList.contains('searching');\n      function openCmd() {\n        // Open over the top-left metrics panel that holds the search icon.\n        // On phones the panel is a hidden sidebar, so use the fixed top-left slot instead.\n        const phone = innerWidth \u003c 640;\n        const r = document.getElementById('legend').getBoundingClientRect();\n        cmd.style.left = phone ? '16px' : `${r.left}px`;\n        cmd.style.top = phone ? '80px' : `${r.top}px`;\n        setLegendOpen(false);\n        document.body.classList.add('searching');\n        cmd.setAttribute('aria-hidden', 'false');\n        cmdInput.value = '';\n        search('');\n        cmdInput.focus({ preventScroll: true });\n      }\n      function closeCmd() {\n        document.body.classList.remove('searching');\n        cmd.setAttribute('aria-hidden', 'true');\n        searchHits = null;\n        cmdInput.blur();\n      }\n      document.getElementById('cmd-close').onclick = closeCmd;\n      cmdList.addEventListener('mousemove', (e) => {\n        const el = e.target.closest('.cmd-item');\n        if (el && +el.dataset.i !== sel) moveSel(+el.dataset.i - sel);\n      });\n\n      cmdInput.addEventListener('input', () => search(cmdInput.value));\n      cmdInput.addEventListener('keydown', (e) => {\n        if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }\n        else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }\n        else if (e.key === 'Enter') { e.preventDefault(); choose(sel); }\n      });\n      cmdList.addEventListener('click', (e) => { const el = e.target.closest('.cmd-item'); if (el) choose(+el.dataset.i); });\n      addEventListener('keydown', (e) => {\n        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); isCmdOpen() ? closeCmd() : openCmd(); }\n        else if (e.key === 'Escape') { if (isCmdOpen()) closeCmd(); else { setFocus(null); setLegendOpen(false); } }\n      });\n\n      // ---------- frame loop ----------\n      const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();\n      const mat4 = new THREE.Matrix4(), col = new THREE.Color();\n      const dimColor = new THREE.Color('#2a3542');\n      const clock = new THREE.Clock();\n\n      function resize() {\n        const w = innerWidth, h = innerHeight;\n        renderer.setSize(w, h, false);\n        composer.setSize(w, h);\n        bloom.resolution.set(w, h);\n        camera.aspect = w / h;\n        // Keep the whole ring system in view on narrow screens.\n        const fit = (DECO_R + 1.5) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / Math.min(1, camera.aspect);\n        controls.maxDistance = Math.max(60, fit * 1.3);\n        if (camera.position.length() \u003c fit) camera.position.setLength(fit);\n        camera.updateProjectionMatrix();\n      }\n      addEventListener('resize', resize);\n      resize();\n\n      // ---------- intro timeline ----------\n      const INTRO_END = 3.6;\n      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;\n      const clamp01 = (x) => Math.min(Math.max(x, 0), 1);\n      const easeOut = (x) => 1 - Math.pow(1 - x, 3);\n      const easeBack = (x) => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);\n      const phase = (t, start, dur) => clamp01((t - start) / dur);\n      const camEnd = camera.position.clone();\n      const camStart = camEnd.clone().multiplyScalar(2.2).add(new THREE.Vector3(0, -camEnd.length() * 0.9, 0));\n      const decoMats = deco.children.map((c) => [c.material, c.material.opacity]);\n      const fadeMats = [coreRing.material, name.material, ...ringGroups.map((g) => g.children[0].material)];\n      const fadeBase = fadeMats.map((m) => m.opacity);\n      let introDone = false;\n      controls.enabled = false;\n\n      function applyIntro(t) {\n        const camP = easeOut(phase(t, 0, 2.6));\n        camera.position.lerpVectors(camStart, camEnd, camP);\n        camera.lookAt(0, 0, 0);\n\n        const core = phase(t, 0.15, 0.9);\n        coreRing.scale.setScalar(Math.max(easeOut(core), 0.001));\n        fadeMats[0].opacity = fadeBase[0] * core;\n        fadeMats[1].opacity = phase(t, 0.8, 0.6);\n\n        domains.forEach((_, i) => {\n          const p = easeOut(phase(t, 0.45 + i * 0.12, 0.9));\n          ringScale[i] = Math.max(p, 0.001);\n          ringTwist[i] = (1 - p) * (i % 2 ? -2.2 : 2.2);\n          ringGroups[i].children[0].scale.setScalar(ringScale[i]);\n          fadeMats[2 + i].opacity = fadeBase[2 + i] * p;\n        });\n\n        linkLines.material.opacity = 0.55 * phase(t, 1.6, 1.0);\n\n        bars.forEach((b, i) => {\n          const p = phase(t, 1.4 + i * 0.013, 0.3);\n          b.userData.intro = p;\n          b.scale.setScalar(0.92 + 0.08 * easeOut(p));\n        });\n\n        const d = easeOut(phase(t, 2.0, 1.4));\n        decoMats.forEach(([m, o]) => (m.opacity = o * d));\n        deco.rotation.z = -(1 - d) * Math.PI * 0.8;\n\n        showPct(Math.round(activeCount * easeOut(phase(t, 1.4, 1.6))));\n\n        const r = phase(t, 0.1, 0.8);\n        robot.userData.introScale = r ? easeBack(r) : 0.001;\n        robot.userData.introSpin = (1 - easeOut(r)) * Math.PI * 2;\n      }\n\n      function finishIntro() {\n        introDone = true;\n        applyIntro(INTRO_END + 10);\n        controls.enabled = true;\n        document.body.classList.add('intro-done');\n      }\n      if (reduceMotion) finishIntro();\n\n      renderer.setAnimationLoop(() => {\n        const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;\n        if (!introDone) {\n          if (t >= INTRO_END) finishIntro();\n          else applyIntro(t);\n        }\n        if (introDone) controls.update();\n\n        hovered = introDone ? pick() : null;\n        showTooltip();\n        const hl = highlightSet();\n        const paused = !!hl;\n\n        if (!paused) ringGroups.forEach((g, i) => { ringAngle[i] += g.userData.speed * dt; });\n        // Ring \u003c-> sphere morph; ring outlines dim to become the shells' silhouettes.\n        if (sphereT !== sphereTarget) {\n          sphereT = reduceMotion ? sphereTarget : THREE.MathUtils.clamp(sphereT + Math.sign(sphereTarget - sphereT) * dt / 1.4, 0, 1);\n        }\n        if (introDone) ringGroups.forEach((g, i) => (g.children[0].material.opacity = fadeBase[2 + i] * (1 - 0.5 * easeInOut(sphereT))));\n        deco.rotation.z -= 0.03 * dt;\n\n        // Nodes\n        for (let i = 0; i \u003c nodes.length; i++) {\n          nodePos(i, tmpA);\n          const on = !hl || hl.set.has(i);\n          const s = nodeSize[i] * (hl?.center === i || hl?.pulse === i ? 2.4 : on && hl ? 1.6 : 1) * (1 + 0.12 * Math.sin(t * 2 + i)) * ringScale[domainIndex.get(nodes[i].domain)] * (i === robotGaze ? 1 + gazeW * (2 + Math.sin(t * 8)) : 1);\n          mat4.makeScale(s, s, s).setPosition(tmpA);\n          nodeMesh.setMatrixAt(i, mat4);\n          col.copy(nodeBaseColor[i]);\n          if (!on) col.lerp(dimColor, 0.8); else if (hl) col.multiplyScalar(1.6);\n          // Sphere view: dim nodes on the far side of their shell.\n          if (sphereT > 0) col.multiplyScalar(lerp(1, 0.3 + 0.7 * (tmpA.z / nodeRadius[i] + 1) / 2, easeInOut(sphereT)));\n          nodeMesh.setColorAt(i, col);\n        }\n        nodeMesh.instanceMatrix.needsUpdate = true;\n        nodeMesh.instanceColor.needsUpdate = true;\n\n        // Links\n        for (let k = 0; k \u003c linkEnds.length; k++) {\n          const [a, b] = linkEnds[k];\n          nodePos(a, tmpA); nodePos(b, tmpB);\n          linkPos.set([tmpA.x, tmpA.y, tmpA.z, tmpB.x, tmpB.y, tmpB.z], k * 6);\n          const on = !hl || (hl.center !== undefined ? a === hl.center || b === hl.center : hl.set.has(a) && hl.set.has(b));\n          const ca = nodeBaseColor[a], cb = nodeBaseColor[b];\n          const f = hl ? (on ? 0.9 : 0.03) : 0.16;\n          linkCol.set([ca.r * f, ca.g * f, ca.b * f, cb.r * f, cb.g * f, cb.b * f], k * 6);\n        }\n        linkGeo.attributes.position.needsUpdate = true;\n        linkGeo.attributes.color.needsUpdate = true;\n\n        // Bars\n        bars.forEach((b, i) => {\n          const { cap, baseOpacity } = b.userData;\n          const isHot = (hovered?.type === 'bar' && hovered.index === i) || (focused?.type === 'cap' && focused.index === i) || hl?.cap === i || hl?.pulseCap === i;\n          const searchHit = !!hl?.caps?.has(i);\n          const linkedToNode = cap && hl?.center !== undefined && cap.linkedMemoryIds?.includes(nodes[hl.center].id);\n          let o = baseOpacity;\n          if (cap?.active) o = 0.75 + 0.25 * Math.sin(t * 1.5 + i * 0.25);\n          if (hl && !isHot && !linkedToNode && !searchHit) o *= 0.35;\n          if (isHot || linkedToNode || searchHit) o = 1;\n          b.material.opacity = o * (b.userData.intro ?? 1);\n          if (introDone) b.scale.setScalar(isHot ? 1.025 : 1);\n        });\n\n        // Mascot\n        const hoverBot = hovered?.type === 'robot';\n        // Look toward the mouse tip: yaw/pitch from the pointer's offset to the robot on screen,\n        // plus a small lean toward it. Falls back to an idle sway when the pointer leaves the page.\n        {\n          const look = robot.userData.look ??= { yaw: 0, pitch: 0, x: 0, y: 0 };\n          let yaw = Math.sin(t * 0.6) * 0.35, pitch = 0, lx = 0, ly = 0;\n          if (introDone && pointer.x \u003c= 1) {\n            pickV.set(0, 0, 0).project(camera);\n            const dx = THREE.MathUtils.clamp((pointer.x - pickV.x) * camera.aspect, -1.5, 1.5);\n            const dy = THREE.MathUtils.clamp(pointer.y - pickV.y, -1.5, 1.5);\n            yaw = dx * 0.55;\n            pitch = -dy * 0.45;\n            lx = dx * 0.12;\n            ly = dy * 0.1;\n          }\n          const k = 1 - Math.exp(-dt * 6);\n          look.yaw += (yaw - look.yaw) * k;\n          look.pitch += (pitch - look.pitch) * k;\n          look.x += (lx - look.x) * k;\n          look.y += (ly - look.y) * k;\n        }\n        if (introDone) robot.scale.setScalar(THREE.MathUtils.lerp(robot.scale.x, hoverBot ? 0.22 : 0.2, 0.15));\n        else robot.scale.setScalar(0.2 * robot.userData.introScale);\n        {\n          const ud = robot.userData;\n          const { body, eyes, blink, look, tip, arms, legs } = ud;\n\n          // Random idle actions: start one when the timer is up; hovering the robot cuts it short.\n          if (introDone && !reduceMotion && !act.cur && !hoverBot && t >= act.next) {\n            const pool = ACTION_NAMES.filter((n) => n !== act.last);\n            startAction(pool[Math.floor(Math.random() * pool.length)], t);\n          }\n          let pose = {}, w = 0;\n          if (act.cur) {\n            const lt = t - act.start;\n            if (hoverBot && act.dur > lt + FADE) act.dur = lt + FADE;\n            if (lt >= act.dur) endAction(t);\n            else {\n              pose = act.cur.pose(Math.min(lt, act.cur.dur), actHelper(lt));\n              w = smooth(Math.min(1, lt / FADE, (act.dur - lt) / FADE));\n            }\n          }\n          const mix = (live, key) => (pose[key] === undefined ? live : lerp(live, pose[key], w));\n          const mixArr = (key, i) => (pose[key] ? pose[key][i] * w : 0);\n\n          // Gaze line + node pulse for the \"curious\" action.\n          gazeW = robotGaze >= 0 ? w : 0;\n          gazeLine.material.opacity = 0.9 * gazeW;\n          if (robotGaze >= 0) {\n            const pts = gazeLine.geometry.attributes.position;\n            nodePos(robotGaze, tmpB);\n            pts.setXYZ(0, robot.position.x, robot.position.y + 0.25, 0.3);\n            pts.setXYZ(1, tmpB.x, tmpB.y, tmpB.z);\n            pts.needsUpdate = true;\n            gazeLine.computeLineDistances();\n          }\n\n          // Body pose: live mouse-follow blended with the action's overrides.\n          const lean = { x: mix(look.x, 'leanX'), y: mix(look.y, 'leanY') };\n          robot.rotation.set(mix(look.pitch, 'pitch'), mix(look.yaw, 'yaw') + (ud.introSpin ?? 0), mix(-look.x * 0.3, 'roll'));\n          robot.position.x = lean.x;\n          robot.position.y = -0.05 + lean.y + Math.sin(t * 1.6) * 0.06;\n\n          // Breathing squash, and a happy hop while hovered.\n          const br = Math.sin(t * 2.2);\n          ud.hop = THREE.MathUtils.lerp(ud.hop ?? 0, hoverBot ? 1 : 0, 1 - Math.exp(-dt * 8));\n          const sq = mix(1 + 0.03 * br, 'squash');\n          body.scale.set(1 - 0.5 * (sq - 1), sq, 1);\n          body.position.y = mix(ud.hop * Math.abs(Math.sin(t * 7)) * 0.7, 'lift');\n          arms.forEach((a, i) => (a.pivot.rotation.z = a.side * mixArr('arms', i) + a.side * 0.04 * br));\n          legs.forEach((l, i) => {\n            l.pivot.rotation.z = mixArr('legs', i);\n            l.pivot.position.y = -3 + mixArr('legLift', i);\n          });\n\n          // Antenna light wobbles and trails the lean; actions can recolour it.\n          tip.position.set(Math.sin(t * 2.7) * 0.3 - lean.x * 3, 6.6 + br * 0.15, 0);\n          tip.material.color.setHSL(mix(0.43, 'tipH'), 0.7, mix(0.55 + 0.15 * Math.sin(t * 3), 'tipL'));\n          updateFx(t);\n\n          // Blink every 2–5.5s; a quarter of the time it's a double blink.\n          if (blink.start \u003c 0 && t >= blink.next) { blink.start = t; blink.double = Math.random() \u003c 0.25; }\n          let open = 1;\n          if (blink.start >= 0) {\n            const p = (t - blink.start) / 0.17;\n            if (p >= 1) {\n              if (blink.double) { blink.double = false; blink.start = t + 0.08; }\n              else { blink.start = -1; blink.next = t + 2 + Math.random() * 3.5; }\n            } else if (p >= 0) open = 1 - Math.sin(Math.PI * p) * 0.93;\n          }\n          // Happy squint while hovered.\n          ud.squint = THREE.MathUtils.lerp(ud.squint ?? 1, hoverBot ? 0.45 : 1, 1 - Math.exp(-dt * 10));\n          open = mix(Math.min(open, ud.squint), 'open');\n\n          const gx = mix(THREE.MathUtils.clamp(look.yaw / 0.55, -1, 1) * 0.5, 'gx');\n          const gy = mix(THREE.MathUtils.clamp(-look.pitch / 0.45, -1, 1) * 0.5, 'gy');\n          for (const e of eyes) {\n            e.eye.scale.y = Math.min(open, 1);\n            e.pupil.scale.setScalar(open > 1 ? 1 / (open * open) : 1); // wide-eyed: small pupils\n            e.pupil.position.x += (gx - e.pupil.position.x) * (1 - Math.exp(-dt * 12));\n            e.pupil.position.y += (gy - e.pupil.position.y) * (1 - Math.exp(-dt * 12));\n          }\n          ud.eyeMat.color.copy(ud.eyeGlow).multiplyScalar((0.85 + 0.15 * Math.sin(t * 2.5)) * Math.max(1, open) ** 2);\n        }\n\n        composer.render();\n      });\n\n      document.getElementById('boot').remove();\n    \u003c/script>\n  \u003c/body>\n\u003c/html>\n"};
const frame = document.getElementById('view');
const nav = document.querySelector('.mock-switch');
const buttons = nav.querySelectorAll('button');
const EDGE = { galaxy: 'bottom', brain: 'top' };

function show(name) {
  if (!(name in VIEWS)) name = 'galaxy';
  frame.srcdoc = VIEWS[name];
  nav.dataset.edge = EDGE[name];
  buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  const url = new URL(location.href);
  url.searchParams.set('view', name);
  history.replaceState(null, '', url);
}

buttons.forEach((b) => b.addEventListener('click', () => show(b.dataset.view)));
show(new URLSearchParams(location.search).get('view'));
