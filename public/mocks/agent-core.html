on 2026-04-09.\n\n## TL;DR\n\n- Scope: memos (memo).\n- Status is *reference*; revisit when the decision assumptions change.\n- Measure before optimising.\n\n## Steps\n\n1. Collect inputs for `snippet_window`.\n2. Compare with the last snapshot.\n3. Record the outcome in this note.\n\n```bash\nduckdb memory.duckdb -c \"select count(*) from notes where tag = 'how-to'\"\ngit log --oneline -n 8 -- memory/07_memos\n```\n\n## Related\n\n- [Checklist: Before Running a Backfill](./checklist-before-running-a-backfill.md)\n- [[decision-use-duckdb-for-local-analytics]]\n","source":"simulated","updated":"2026-04-09"},"/api/mock/notes/07_memos/fix-pgvector-index-build-out-of-memory":{"id":"07_memos/fix-pgvector-index-build-out-of-memory","path":"memory/07_memos/fix-pgvector-index-build-out-of-memory.md","format":"markdown","body":"# Fix: pgvector Index Build Out of Memory\n\nThis note records **Fix: pgvector Index Build Out of Memory** in practice. It is tagged `snippet` and was last revised on 2026-06-23.\n\n## TL;DR\n\n- Scope: memos (memo).\n- Status is *reference*; revisit when the snippet assumptions change.\n- Keep the grain explicit.\n\n## Steps\n\n1. Collect inputs for `fix_pgvector`.\n2. Compare with the last snapshot.\n3. Record the outcome in this note.\n\n```bash\nduckdb memory.duckdb -c \"select count(*) from notes where tag = 'decision'\"\ngit log --oneline -n 7 -- memory/07_memos\n```\n\n> If it is not tested, it is not done.\n\n## Related\n\n- [[02_data_systems/evaluation-results-warehouse-schema|Evaluation Results Warehouse Schema]]\n- [The Google File System Paper](../01_research/the-google-file-system-paper.md)\n","source":"simulated","updated":"2026-06-23"},"/api/mock/notes/07_memos/reading-list-query-engines-q4":{"id":"07_memos/reading-list-query-engines-q4","path":"memory/07_memos/reading-list-query-engines-q4.md","format":"markdown","body":"# Reading List: Query Engines Q4\n\nThis note compares **Reading List: Query Engines Q4** at our current scale. It is tagged `how-to` and was last revised on 2026-09-12.\n\n## TL;DR\n\n- Scope: memos (memo).\n- Status is *active*; revisit when the how-to assumptions change.\n- Prefer incremental over full refresh.\n\n## Steps\n\n1. Collect inputs for `reading_list`.\n2. Compare with the last snapshot.\n3. Record the outcome in this note.\n\n```bash\nduckdb memory.duckdb -c \"select count(*) from notes where tag = 'how-to'\"\ngit log --oneline -n 7 -- memory/07_memos\n```\n\n## Owners\n\n| Item | Owner | State |\n| --- | --- | --- |\n| scope | atlas | todo |\n| review | archivist | in progress |\n| rollout | archivist | todo |\n\n## Related\n\n- [Mixed Precision](../06_knowledge_concept/mixed-precision.md)\n- [Snowflake Warehouse Sizing and Auto-Suspend Policy](../02_data_systems/snowflake-warehouse-sizing-and-auto-suspend-policy.md)\n","source":"simulated","updated":"2026-09-12"}};
const VIEWS = {"galaxy":"\u003c!doctype html>\n\u003chtml lang=\"en\" data-theme=\"galaxy\">\n  \u003chead>\n\u003cscript>\n(() => {\n  const data = parent.__AGENT_CORE_MOCK__;\n  const realFetch = window.fetch.bind(window);\n  const json = (body, status) =>\n    new Response(JSON.stringify(body), { status, headers: { 'content-type': 'application/json' } });\n  window.fetch = (input, init) => {\n    const url = typeof input === 'string' ? input : input.url;\n    let path;\n    try {\n      path = decodeURIComponent(new URL(url, 'http://mock.local').pathname).replace(/\\/$/, '');\n    } catch {\n      return realFetch(input, init);\n    }\n    if (!path.startsWith('/api/mock')) return realFetch(input, init);\n    return Promise.resolve(path in data ? json(data[path], 200) : json({ error: 'not found' }, 404));\n  };\n})();\n\u003c/script>\n    \u003cmeta charset=\"utf-8\" />\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n    \u003cmeta name=\"color-scheme\" content=\"dark\" />\n    \u003ctitle>AGENT CORE Agentic OS\u003c/title>\n\n    \u003c!--\n      CDN libraries, pinned to exact versions (see README \"Front-end libraries\").\n      DaisyUI 5 CSS + Tailwind CSS v4 browser build, per https://daisyui.com/docs/cdn/.\n      Flaticon UIcons, regular-rounded style.\n    -->\n    \u003clink rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/daisyui@5.7.50/daisyui.css\" />\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3\">\u003c/script>\n    \u003clink rel=\"stylesheet\" href=\"https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css\" />\n\n    \u003c!--\n      Import map for browser-resolved modules. The esbuild bundle keeps\n      `three` and `three/*` external; Three.js r180 (0.180.0) loads from the CDN.\n      Keep this version in sync with the `@types/three` devDependency.\n      `marked` and `dompurify` (note bodies in the drawer) are imported lazily;\n      keep their versions equal to the exact devDependencies in package.json.\n    -->\n    \u003cscript type=\"importmap\">\n      {\n        \"imports\": {\n          \"three\": \"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js\",\n          \"three/addons/\": \"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/\",\n          \"marked\": \"https://cdn.jsdelivr.net/npm/marked@18.1.0/lib/marked.esm.js\",\n          \"dompurify\": \"https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.es.mjs\"\n        }\n      }\n    \u003c/script>\n\n    \u003c!-- App styles and the custom \"galaxy\" DaisyUI theme (loaded after DaisyUI so it wins). -->\n    \u003cstyle>\n/*\n * Agent Core mock UI styles.\n *\n * 1. Custom DaisyUI 5 theme \"galaxy\": dark deep-space base, blue primary,\n *    cyan accent (no orange). Keep in sync with src/client/theme/palette.ts.\n * 2. App shell, panels and entity rows. Plain CSS (unlayered) so it wins over\n *    DaisyUI's and Tailwind's layered base styles.\n *\n * 3. Motion layer (T-0006, end of file): starfield/nebula, intro reveal, ring\n *    glow, hover lift and live status indicators. Every animation is switched\n *    off under `prefers-reduced-motion: reduce` (the JS side reads the same\n *    query via src/client/motion.ts).\n */\n\n/* ---------------------------------------------------------------- theme -- */\n[data-theme='galaxy'] {\n  color-scheme: dark;\n  --color-base-100: oklch(18% 0.04 266);\n  --color-base-200: oklch(14.5% 0.035 266);\n  --color-base-300: oklch(24% 0.05 264);\n  --color-base-content: oklch(92% 0.03 245);\n  --color-primary: oklch(64% 0.19 258);\n  --color-primary-content: oklch(98% 0.01 250);\n  --color-secondary: oklch(67% 0.16 280);\n  --color-secondary-content: oklch(98% 0.01 280);\n  --color-accent: oklch(82% 0.14 205);\n  --color-accent-content: oklch(18% 0.04 220);\n  --color-neutral: oklch(28% 0.045 264);\n  --color-neutral-content: oklch(88% 0.03 250);\n  --color-info: oklch(75% 0.14 232);\n  --color-info-content: oklch(18% 0.04 240);\n  --color-success: oklch(78% 0.13 180);\n  --color-success-content: oklch(18% 0.04 180);\n  --color-warning: oklch(84% 0.15 85);\n  --color-warning-content: oklch(22% 0.05 85);\n  --color-error: oklch(65% 0.21 16);\n  --color-error-content: oklch(98% 0.01 16);\n  --radius-selector: 1rem;\n  --radius-field: 0.5rem;\n  --radius-box: 0.75rem;\n  --size-selector: 0.25rem;\n  --size-field: 0.25rem;\n  --border: 1px;\n  --depth: 1;\n  --noise: 0;\n\n  /* App tokens */\n  --space: #050816;\n  --glass: color-mix(in oklab, var(--color-base-100) 72%, transparent);\n  --line: color-mix(in oklab, var(--color-primary) 22%, transparent);\n  --line-soft: color-mix(in oklab, var(--color-base-content) 9%, transparent);\n  --muted: color-mix(in oklab, var(--color-base-content) 58%, transparent);\n  --glow: 0 0 0 1px color-mix(in oklab, var(--color-accent) 45%, transparent),\n    0 0 18px -4px color-mix(in oklab, var(--color-accent) 55%, transparent);\n}\n\n/* ----------------------------------------------------------------- base -- */\nhtml,\nbody {\n  margin: 0;\n  min-height: 100%;\n}\nbody {\n  background-color: var(--space);\n  /* Base nebula; stars (canvas) and drifting nebula blobs are the T-0006 motion layer. */\n  background-image:\n    radial-gradient(60% 50% at 50% 45%, oklch(30% 0.12 265 / 0.55), transparent 70%),\n    radial-gradient(40% 35% at 75% 25%, oklch(45% 0.12 220 / 0.22), transparent 70%),\n    radial-gradient(45% 40% at 22% 70%, oklch(35% 0.14 285 / 0.25), transparent 70%);\n  background-attachment: fixed;\n  color: var(--color-base-content);\n  font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;\n  font-size: 14px;\n}\n.boot-msg {\n  padding: 2rem;\n  color: var(--muted);\n}\n.mono,\n.wf-time {\n  font-family: ui-monospace, 'SF Mono', Menlo, monospace;\n}\n.ui-icon {\n  display: inline-flex;\n  line-height: 1;\n}\n\n/* ---------------------------------------------------------------- shell -- */\n.app-shell {\n  display: grid;\n  grid-template-columns: minmax(320px, 400px) minmax(480px, 1fr) minmax(320px, 400px);\n  gap: 0;\n  height: 100vh;\n  overflow: hidden;\n}\n.col {\n  min-height: 0;\n  overflow-y: auto;\n  scrollbar-width: thin;\n  scrollbar-color: var(--color-base-300) transparent;\n}\n.col-left,\n.col-right {\n  display: flex;\n  flex-direction: column;\n  /* No backdrop blur: it would re-blur the animated starfield every frame. */\n  background: color-mix(in oklab, var(--space) 66%, transparent);\n}\n.col-left {\n  border-right: 1px solid var(--line);\n}\n/*\n * Fit-to-viewport (T-0007): the side columns never need page/column scroll at\n * 1440×900 or 1512×860. Every panel keeps its natural (compact) height except\n * the last one in each column, which takes the remaining height and scrolls\n * internally. The column itself still scrolls as a fallback on very short\n * windows, because the last panel keeps a usable minimum height.\n */\n.col-left > .panel,\n.col-right > .panel {\n  flex: none;\n}\n.col-left > .panel:last-child,\n.col-right > .panel:last-child {\n  flex: 1 1 0;\n  min-height: 8.5rem;\n  display: flex;\n  flex-direction: column;\n}\n.col-left > .panel:last-child > .panel-body,\n.col-right > .panel:last-child > .panel-body {\n  flex: 1 1 auto;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n}\n.col-right {\n  border-left: 1px solid var(--line);\n}\n.col-center {\n  display: flex;\n  flex-direction: column;\n  min-width: 0;\n  overflow: hidden;\n}\n.overlay-layer {\n  position: fixed;\n  inset: 0;\n  pointer-events: none;\n  z-index: 40;\n}\n\n/* Stack columns below 1024px (center first). */\n@media (max-width: 1023.98px) {\n  .app-shell {\n    grid-template-columns: 1fr;\n    height: auto;\n    overflow: visible;\n  }\n  .col {\n    overflow: visible;\n  }\n  .col-left > .panel:last-child,\n  .col-right > .panel:last-child {\n    flex: none;\n    min-height: 0;\n  }\n  .col-center {\n    order: -1;\n    min-height: 70vh;\n  }\n  .col-left,\n  .col-right {\n    border: 0;\n    border-top: 1px solid var(--line);\n  }\n}\n\n/* --------------------------------------------------------------- header -- */\n.app-header {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 0.25rem;\n  padding: 1.5rem 1rem 0.5rem;\n  text-align: center;\n}\n.brand {\n  display: flex;\n  align-items: center;\n  gap: 0.6rem;\n  margin: 0;\n  font-size: 1.9rem;\n  letter-spacing: 0.02em;\n}\n.brand-mark {\n  color: var(--color-accent);\n  font-size: 1.4rem;\n  filter: drop-shadow(0 0 6px color-mix(in oklab, var(--color-accent) 70%, transparent));\n}\n.brand-name {\n  font-weight: 800;\n}\n.brand-suffix {\n  font-weight: 400;\n  background: linear-gradient(90deg, var(--color-primary), var(--color-accent));\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n}\n.brand-sub {\n  margin: 0;\n  color: var(--muted);\n  letter-spacing: 0.3em;\n  font-size: 0.8rem;\n  text-transform: none;\n}\n.header-tools {\n  display: flex;\n  align-items: center;\n  gap: 0.25rem;\n  margin-top: 0.4rem;\n}\n.header-icon {\n  color: var(--muted);\n}\n.header-icon:hover,\n.header-icon:focus-visible {\n  color: var(--color-accent);\n  box-shadow: var(--glow);\n}\n.search-field {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  margin-left: 0.5rem;\n}\n.search-field-icon {\n  position: absolute;\n  left: 0.6rem;\n  color: var(--muted);\n  font-size: 0.8rem;\n  pointer-events: none;\n  z-index: 1;\n}\n.header-search {\n  width: 16rem;\n  padding-left: 1.9rem;\n  background: var(--glass);\n  border-color: var(--line);\n}\n.header-search:focus,\n.header-search:focus-within {\n  border-color: var(--color-accent);\n  outline: none;\n  box-shadow: var(--glow);\n}\n\n/* ---------------------------------------------------------- graph stage -- */\n.graph-stage {\n  position: relative;\n  flex: 1;\n  min-height: 360px;\n  margin: 0.5rem 1rem 1rem;\n  border-radius: var(--radius-box);\n  overflow: hidden;\n}\n.graph-placeholder {\n  position: absolute;\n  inset: 0;\n  display: grid;\n  place-content: center;\n  justify-items: center;\n  gap: 1rem;\n  color: var(--muted);\n  font-size: 0.8rem;\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n}\n.graph-orb {\n  width: min(42vh, 360px);\n  aspect-ratio: 1;\n  border-radius: 50%;\n  border: 1px dashed var(--line);\n  background: radial-gradient(circle at 50% 50%, oklch(70% 0.14 220 / 0.35), oklch(45% 0.18 265 / 0.15) 45%, transparent 70%);\n  box-shadow: inset 0 0 60px oklch(60% 0.15 250 / 0.2);\n}\n\n/* ------------------------------------------------- memory graph (T-0003) -- */\n.graph-stage.is-live {\n  background: radial-gradient(circle at 50% 50%, oklch(55% 0.16 240 / 0.16), oklch(35% 0.14 265 / 0.08) 38%, transparent 62%);\n}\n.graph-canvas,\n.graph-beams {\n  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n  display: block;\n}\n.graph-canvas {\n  touch-action: none;\n  outline: none;\n}\n.graph-beams {\n  pointer-events: none;\n  z-index: 1;\n}\n.graph-ring {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  z-index: 2;\n  --ring-btn-size: 40px;\n  --ring-move-ms: 1200ms;\n}\n.ring-btn {\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  width: var(--ring-btn-size);\n  height: var(--ring-btn-size);\n  display: grid;\n  place-items: center;\n  padding: 0;\n  border-radius: 50%;\n  border: 2px solid var(--ring-color);\n  background: radial-gradient(circle at 50% 50%, color-mix(in oklab, var(--color-base-200) 62%, var(--ring-color) 38%), color-mix(in oklab, var(--color-base-200) 86%, var(--ring-color) 14%) 70%);\n  color: color-mix(in oklab, var(--ring-color) 55%, white 45%);\n  box-shadow: 0 0 12px color-mix(in oklab, var(--ring-color) 60%, transparent), inset 0 0 8px color-mix(in oklab, var(--ring-color) 40%, transparent);\n  font-size: calc(var(--ring-btn-size) * 0.4);\n  line-height: 1;\n  cursor: pointer;\n  pointer-events: auto;\n  /* Size changes during a glide are a composited scale (see CapabilityRing.relayout); 1 at rest. */\n  transform: scale(var(--ring-k, 1));\n  transition: opacity 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease, scale 0.2s cubic-bezier(0.2, 1.4, 0.4, 1);\n}\n/* Transform-only glide: translate + transform (scale) never trigger layout. */\n.graph-ring.is-moving .ring-btn {\n  will-change: translate, transform;\n  transition: translate var(--ring-move-ms) cubic-bezier(0.65, 0, 0.35, 1), transform var(--ring-move-ms) cubic-bezier(0.65, 0, 0.35, 1), opacity 0.2s ease,\n    box-shadow 0.2s ease, scale 0.2s ease;\n}\n/* Small buttons (core rule markers, dense rings in the radial view) drop the badge. */\n.ring-btn.is-small .ring-badge {\n  display: none;\n}\n.ring-btn .ring-icon {\n  display: block;\n  line-height: 1;\n}\n.ring-btn:hover,\n.ring-btn:focus-visible {\n  outline: none;\n  z-index: 1;\n  scale: 1.2;\n  color: white;\n  box-shadow: 0 0 0 2px color-mix(in oklab, var(--ring-color) 55%, transparent), 0 0 22px 2px var(--ring-color), inset 0 0 12px color-mix(in oklab, var(--ring-color) 60%, transparent);\n}\n.ring-btn.is-active,\n.ring-btn.is-match {\n  box-shadow: 0 0 0 2px var(--ring-color), 0 0 24px 3px var(--ring-color), inset 0 0 12px color-mix(in oklab, var(--ring-color) 55%, transparent);\n  color: white;\n}\n.ring-btn.is-dim {\n  opacity: 0.3;\n  filter: saturate(0.5);\n}\n.ring-badge {\n  position: absolute;\n  top: -5px;\n  right: -7px;\n  min-width: 1.15rem;\n  height: 1.15rem;\n  padding: 0 0.25rem;\n  border-radius: 999px;\n  border: 1px solid var(--ring-color);\n  background: var(--color-base-200);\n  color: var(--color-base-content);\n  font-size: 0.62rem;\n  font-weight: 700;\n  line-height: calc(1.15rem - 2px);\n  text-align: center;\n}\n.graph-tooltip {\n  position: absolute;\n  left: 0;\n  top: 0;\n  z-index: 3;\n  max-width: 18rem;\n  padding: 0.45rem 0.65rem;\n  border: 1px solid var(--line);\n  border-radius: 0.6rem;\n  background: color-mix(in oklab, var(--color-base-200) 90%, transparent);\n  backdrop-filter: blur(6px);\n  box-shadow: 0 6px 24px oklch(10% 0.05 260 / 0.6);\n  pointer-events: none;\n  font-size: 0.78rem;\n}\n.graph-tooltip[hidden] {\n  display: none;\n}\n.graph-tooltip-title {\n  display: block;\n  font-weight: 600;\n  color: var(--color-base-content);\n}\n.graph-tooltip-meta {\n  display: flex;\n  align-items: center;\n  gap: 0.35rem;\n  margin-top: 0.15rem;\n  color: var(--muted);\n}\n.legend-dot {\n  width: 0.55rem;\n  height: 0.55rem;\n  flex: none;\n  border-radius: 50%;\n  background: var(--dot);\n  box-shadow: 0 0 6px var(--dot);\n}\n.graph-legend {\n  position: absolute;\n  left: 0.4rem;\n  bottom: 0.4rem;\n  z-index: 1; /* below the ring so corner buttons stay clickable */\n  display: grid;\n  gap: 0.1rem;\n  margin: 0;\n  padding: 0.35rem 0.5rem;\n  list-style: none;\n  border: 1px solid var(--line-soft);\n  border-radius: 0.6rem;\n  background: color-mix(in oklab, var(--color-base-200) 55%, transparent);\n  font-size: 0.62rem;\n  line-height: 1.35;\n  pointer-events: none;\n}\n.legend-item {\n  display: flex;\n  align-items: center;\n  gap: 0.4rem;\n  /* Rows are hoverable for their description title; the legend box itself\n     stays click-through and sits below the ring buttons (z-index 1 vs 2). */\n  pointer-events: auto;\n  cursor: help;\n}\n.legend-label {\n  color: var(--color-base-content);\n}\n.legend-count {\n  margin-left: auto;\n  padding-left: 0.6rem;\n  color: var(--muted);\n  font-variant-numeric: tabular-nums;\n}\n\n/* ------------------------------------------------- radial view (T-0004) -- */\n.graph-legend {\n  transition: opacity 0.4s ease, visibility 0.4s;\n}\n.graph-stage.is-radial .graph-legend {\n  opacity: 0;\n  visibility: hidden;\n}\n.radial-overlay {\n  position: absolute;\n  inset: 0;\n  z-index: 2;\n  pointer-events: none;\n}\n.radial-overlay[hidden] {\n  display: none;\n}\n.radial-overlay > * {\n  animation: radial ------------------------- skills -- */\n.skill-grid {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 0.45rem;\n}\n.skill-card {\n  display: grid;\n  grid-template-columns: auto minmax(0, 1fr);\n  align-items: center;\n  column-gap: 0.4rem;\n  row-gap: 0.1rem;\n  padding: 0.45rem 0.6rem 0.5rem;\n  border-radius: var(--radius-box);\n  border: 1px solid var(--line);\n  background: var(--glass);\n}\n.skill-icon {\n  color: var(--color-accent);\n  font-size: 0.85rem;\n  line-height: 1;\n}\n.skill-meta,\n.skill-actions {\n  grid-column: 1 / -1;\n}\n.skill-name {\n  margin: 0;\n  font-size: 0.82rem;\n  font-weight: 700;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.skill-meta {\n  margin: 0;\n  font-size: 0.65rem;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n.model {\n  font-weight: 700;\n}\n.model-opus {\n  color: var(--color-secondary);\n}\n.model-sonnet {\n  color: var(--color-info);\n}\n.model-haiku {\n  color: var(--color-success);\n}\n.model-fable {\n  color: var(--color-accent);\n}\n.skill-actions {\n  display: flex;\n  align-items: center;\n  gap: 0.25rem;\n  margin-top: 0.15rem;\n}\n.skill-actions .btn {\n  border: 1px solid var(--line);\n}\n.skill-run {\n  color: var(--color-accent);\n}\n.skill-runs {\n  margin-left: auto;\n  font-size: 0.62rem;\n  color: var(--muted);\n}\n\n/* ------------------------------------------------------------ workflows -- */\n.wf-scroll {\n  flex: 1 1 auto;\n  min-height: 0;\n  max-height: none;\n  overflow-y: auto;\n  scrollbar-width: thin;\n}\n.wf-table thead th {\n  position: sticky;\n  top: 0;\n  z-index: 1;\n  /* Opaque so rows scrolling underneath never show through the header. */\n  background: var(--space);\n  box-shadow: 0 1px 0 var(--line-soft);\n}\n.wf-table th {\n  font-size: 0.62rem;\n  letter-spacing: 0.15em;\n  text-transform: uppercase;\n  color: var(--muted);\n  background: transparent;\n}\n.wf-table td {\n  font-si browser build with shadcn/ui design tokens (zinc dark theme,\n      Command dialog + Sheet patterns re-created in plain HTML; shadcn itself ships\n      as copy-paste React source, not a CDN bundle).\n      3D: Three.js r180 via import map, same version as index.html.\n    -->\n    \u003cscript src=\"https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3\">\u003c/script>\n    \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap\" rel=\"stylesheet\" />\n    \u003cscript type=\"importmap\">\n      {\n        \"imports\": {\n          \"three\": \"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js\",\n          \"three/addons/\": \"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/\"\n        }\n      }\n    \u003c/script>\n\n    \u003cstyle type=\"text/tailwindcss\">\n      /* shadcn/ui \"zinc\" dark tokens */\n      @theme {\n        --color-background: hsl(222 30% 5%);\n        --color-foreground: hsl(210 20% 96%);\n        --color-card: hsl(222 25% 8% / 0.82);\n        --color-popover: hsl(222 25% 8% / 0.92);\n        --color-muted: hsl(220 15% 14%);\n        --color-muted-foreground: hsl(218 11% 62%);\n        --color-accent: hsl(220 15% 17%);\n        --color-border: hsl(220 14% 18%);\n        --color-ring: hsl(166 72% 60%);\n        --color-skill: #5eead4;\n        --color-workflow: #93c5fd;\n        --color-mcp: #f9a8d4;\n        --font-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;\n        --font-mono: 'Geist Mono', ui-monospace, monospace;\n      }\n      html, body { @apply h-full bg-background text-foreground font-sans antialiased overflow-hidden; }\n      .kbd { @apply inline-flex h-5 items-center gap-1 rounded border border-border bg-muted px-1.5 font-mono text-[10px] text-muted-foreground; }\n      .badge { @apply inline-flex items-center rounded-md border border-border px-2 py-0.5 text-[11px] font-medium; }\n      .cmd-item { @apply flex cursor-pointer items-center gap-3 rounded-md px-2 py-2 text-sm outline-none; }\n      .cmd-item[aria-selected='true'] { @apply bg-accent; }\n      .legend-dot { @apply inline-block size-2 rounded-full; }\n      .view-btn[aria-checked='true'] { @apply bg-accent text-foreground; }\n      .panel-card { @apply rounded-lg border border-border bg-card p-3 text-xs backdrop-blur; }\n      .panel-title { @apply mb-2 flex items-center justify-between font-mono text-[10px] tracking-[0.2em] text-muted-foreground; }\n      .panel-row { @apply flex w-full cursor-pointer items-start gap-2 rounded-md px-1.5 py-1.5 text-left hover:bg-accent; }\n      #activity { scrollbar-width: thin; scrollbar-color: var(--color-border) transparent; }\n      @keyframes ping-soft { 0% { box-shadow: 0 0 0 0 currentColor; } 70%, 100% { box-shadow: 0 0 0 5px transparent; } }\n      .dot-live { animation: ping-soft 1.6s ease-out infinite; }\n      .intro-ui { opacity: 0; transform: translateY(8px); transition: opacity 0.8s ease, transform 0.8s ease; }\n      .intro-done .intro-ui { opacity: 1; transform: none; }\n      .searching #cmd { @apply pointer-events-auto translate-y-0 opacity-100; }\n      .searching #legend { opacity: 0; }\n      /* Phone widths: the metrics panel becomes a slide-out left sidebar. */\n      @media (max-width: 639.98px) {\n        #legend {\n          top: 0; bottom: 0; left: 0; z-index: 35; width: min(18rem, 85vw); max-width: none;\n          border-radius: 0; border-width: 0 1px 0 0; padding: 1.25rem 1rem; overflow-y: auto;\n          pointer-events: auto; translate: -100% 0; background: hsl(222 25% 7% / 0.96);\n          transition: opacity 0.8s ease, transform 0.8s ease, translate 0.3s ease;\n        }\n        .legend-open #legend { translate: 0 0; }\n        .legend-open #legend-toggle { opacity: 0; pointer-events: none; }\n        /* The right-hand activity column is moved into this sidebar (see moveActivity in JS). */\n        #legend #activity { position: static; width: auto; max-height: none; overflow: visible; margin-top: 1.25rem; opacity: 1; transform: none; }\n      }\n    \u003c/style>\n  \u003c/head>\n  \u003cbody>\n    \u003ccanvas id=\"scene\" class=\"fixed inset-0 block size-full\">\u003c/canvas>\n\n    \u003c!-- Header -->\n    \u003cheader class=\"intro-ui pointer-events-none fixed left-0 top-0 p-4 sm:p-6\">\n      \u003cdiv>\n        \u003cp class=\"font-mono text-[11px] tracking-[0.3em] text-muted-foreground\">AGENT CORE\u003c/p>\n        \u003ch1 class=\"mt-1 text-lg font-medium tracking-tight\">Second Brain\u003c/h1>\n      \u003c/div>\n    \u003c/header>\n\n    \u003c!-- Phone-only tab that opens the metrics sidebar -->\n    \u003cbutton id=\"legend-toggle\" aria-label=\"Show metrics and activity\" class=\"intro-ui fixed left-0 top-20 z-30 inline-flex h-10 w-8 items-center justify-center rounded-r-md border border-l-0 border-border bg-card text-muted-foreground backdrop-blur hover:text-foreground sm:hidden\">\n      \u003csvg class=\"size-4\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"/>\u003c/svg>\n    \u003c/button>\n\n    \u003c!-- Legend -->\n    \u003caside id=\"legend\" class=\"intro-ui pointer-events-none fixed left-4 top-20 max-w-[calc(100vw-2rem)] rounded-lg border border-border bg-card p-3 text-xs backdrop-blur sm:left-6 sm:top-24\">\n      \u003cdiv class=\"mb-4 flex items-center justify-between sm:hidden\">\n        \u003cp class=\"text-sm font-medium\">Metrics &amp; activity\u003c/p>\n        \u003cbutton id=\"legend-close\" class=\"rounded-md p-1 text-muted-foreground hover:bg-accent hover:text-foreground\" aria-label=\"Close metrics\">\n          \u003csvg class=\"size-4\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M18 6 6 18M6 6l12 12\"/>\u003c/svg>\n        \u003c/button>\n      \u003c/div>\n      \u003cp class=\"mb-2 font-mono text-[10px] tracking-[0.2em] text-muted-foreground\">OUTER RING · TOP 100 BY USAGE\u003c/p>\n      \u003cdiv class=\"flex flex-wrap gap-x-4 gap-y-1\">\n        \u003cspan class=\"flex items-center gap-1.5\">\u003ci class=\"legend-dot bg-skill\">\u003c/i>Skills \u003cb id=\"n-skill\" class=\"font-mono font-normal text-muted-foreground\">\u003c/b>\u003c/span>\n        \u003cspan class=\"flex items-center gap-1.5\">\u003ci class=\"legend-dot bg-workflow\">\u003c/i>Workflows \u003cb id=\"n-workflow\" class=\"font-mono font-normal text-muted-foreground\">\u003c/b>\u003c/span>\n        \u003cspan class=\"flex items-center gap-1.5\">\u003ci class=\"legend-dot bg-mcp\">\u003c/i>MCP \u003cb id=\"n-mcp\" class=\"font-mono font-normal text-muted-foreground\">\u003c/b>\u003c/span>\n      \u003c/div>\n      \u003cp class=\"mb-2 mt-3 font-mono text-[10px] tracking-[0.2em] text-muted-foreground\">MEMORY RINGS · INNER → OUTER\u003c/p>\n      \u003cdiv id=\"domain-legend\" class=\"grid grid-cols-2 gap-x-4 gap-y-1\">\u003c/div>\n      \u003cp class=\"mb-2 mt-3 flex justify-between font-mono text-[10px] tracking-[0.2em] text-muted-foreground\">\u003cspan>MEMORY HEALTH\u003c/span>\u003cspan id=\"health-total\" class=\"tracking-normal\">\u003c/span>\u003c/p>\n      \u003cdiv id=\"health\" class=\"pointer-events-auto\">\u003c/div>\n    \u003c/aside>\n\n    \u003c!-- Right column: agents, today's workflow runs, recently updated memory. Rows highlight what they touch on the rings. -->\n    \u003caside id=\"activity\" class=\"intro-ui fixed right-4 top-4 z-20 flex max-h-[calc(100vh-2rem)] w-72 flex-col gap-3 overflow-y-auto sm:right-6 sm:top-6 sm:max-h-[calc(100vh-3rem)]\">\n      \u003csection class=\"panel-card\">\n        \u003ch2 class=\"panel-title\">\u003cspan>AGENTS\u003c/span>\u003cspan id=\"agents-summary\" class=\"tracking-normal\">\u003c/span>\u003c/h2>\n        \u003cdiv id=\"agents-list\">\u003c/div>\n      \u003c/section>\n      \u003csection class=\"panel-card\">\n        \u003ch2 class=\"panel-title\">\u003cspan>TODAY · WORKFLOWS\u003c/span>\u003cspan id=\"runs-summary\" class=\"tracking-normal\">\u003c/span>\u003c/h2>\n        \u003cdiv id=\"runs-list\" class=\"relative\">\u003c/div>\n      \u003c/section>\n      \u003csection class=\"panel-card\">\n        \u003ch2 class=\"panel-title\">\u003cspan>RECENTLY UPDATED\u003c/span>\u003cspan class=\"tracking-normal\">memory\u003c/span>\u003c/h2>\n        \u003cdiv id=\"recent-list\">\u003c/div>\n      \u003c/section>\n    \u003c/aside>\n\n    \u003c!-- View toggle: flat rings \u003c-> nested spheres (shadcn ToggleGroup pattern) -->\n    \u003cdiv id=\"view-toggle\" role=\"radiogroup\" aria-label=\"Memory view\" class=\"intro-ui fixed bottom-4 left-1/2 z-20 flex -translate-x-1/2 gap-1 rounded-lg border border-border bg-card p-1 text-xs backdrop-blur sm:bottom-6\">\n      \u003cbutton data-view=\"ring\" role=\"radio\" aria-checked=\"true\" class=\"view-btn inline-flex h-8 items-center gap-1.5 rounded-md px-3 text-muted-foreground hover:text-foreground\">\n        \u003csvg class=\"size-4\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"5\"/>\u003c/svg>Ring\n      \u003c/button>\n      \u003cbutton data-view=\"sphere\" role=\"radio\" aria-checked=\"false\" class=\"view-btn inline-flex h-8 items-center gap-1.5 rounded-md px-3 text-muted-foreground hover:text-foreground\">\n        \u003csvg class=\"size-4\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cellipse cx=\"12\" cy=\"12\" rx=\"9\" ry=\"3.5\"/>\u003cellipse cx=\"12\" cy=\"12\" rx=\"3.5\" ry=\"9\"/>\u003c/svg>Sphere\n      \u003c/button>\n    \u003c/div>\n\n    \u003c!-- Hover tooltip -->\n    \u003cdiv id=\"tooltip\" class=\"pointer-events-none fixed z-20 hidden max-w-80 rounded-md border border-border bg-popover px-3 py-2 text-xs shadow-xl backdrop-blur\">\u003c/div>\n\n    \u003c!-- Detail sheet (shadcn Sheet pattern) -->\n    \u003caside id=\"sheet\" class=\"fixed inset-y-0 right-0 z-30 flex w-full max-w-sm translate-x-full flex-col border-l border-border bg-popover backdrop-blur-xl transition-transform duration-300\">\n      \u003cdiv class=\"flex items-start justify-between gap-3 border-b border-border p-5\">\n        \u003cdiv class=\"min-w-0\">\n          \u003cp id=\"sheet-kind\" class=\"font-mono text-[10px] tracking-[0.2em] text-muted-foreground\">\u003c/p>\n          \u003ch2 id=\"sheet-title\" class=\"mt-1 text-base font-semibold leading-snug\">\u003c/h2>\n        \u003c/div>\n        \u003cbutton id=\"sheet-close\" class=\"rounded-md p-1 text-muted-foreground hover:bg-accent hover:text-foreground\" aria-label=\"Close\">\n          \u003csvg class=\"size-4\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M18 6 6 18M6 6l12 12\"/>\u003c/svg>\n        \u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"sheet-body\" class=\"flex-1 space-y-5 overflow-y-auto p-5 text-sm\">\u003c/div>\n    \u003c/aside>\n\n    \u003c!-- Command dialog (shadcn CommandDialog pattern) -->\n    \u003c!-- Search panel: drops down in place of the top-left search button; results list below the input.\n         Semi-transparent with no backdrop, so matches stay visible on the rings. -->\n    \u003cdiv id=\"cmd\" aria-hidden=\"true\" class=\"pointer-events-none fixed left-4 top-4 z-40 w-[min(30rem,calc(100vw-2rem))] -translate-y-2 opacity-0 transition-[transform,opacity] duration-200 ease-out sm:left-6 sm:top-6\">\n      \u003cdiv class=\"pointer-events-auto flex flex-col overflow-hidden rounded-xl border border-border bg-[hsl(222_25%_8%/0.45)] shadow-2xl backdrop-blur-md\">\n        \u003cdiv class=\"flex items-center gap-2 px-3\">\n          \u003csvg class=\"size-4 shrink-0 text-muted-foreground\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\"/>\u003cpath d=\"m20 20-3.5-3.5\"/>\u003c/svg>\n          \u003cinput id=\"cmd-input\" class=\"h-11 w-full bg-transparent text-sm outline-none placeholder:text-muted-foreground\" placeholder=\"Search memory nodes, skills, workflows, MCP…\" autocomplete=\"off\" spellcheck=\"false\" />\n          \u003cbutton id=\"cmd-close\" class=\"kbd hover:text-foreground\" aria-label=\"Close search\">esc\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"flex items-center justify-between border-y border-border px-3 py-1.5 text-[11px] text-muted-foreground\">\n          \u003cspan>\u003cspan class=\"kbd\">↑\u003c/span> \u003cspan class=\"kbd\">↓\u003c/span> navigate · \u003cspan class=\"kbd\">↵\u003c/span> open\u003c/span>\n          \u003cspan id=\"cmd-count\" class=\"font-mono\">\u003c/span>\n        \u003c/div>\n        \u003cdiv id=\"cmd-list\" class=\"max-h-[60vh] overflow-y-auto p-2 empty:hidden\" role=\"listbox\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv id=\"boot\" class=\"fixed inset-0 grid place-items-center font-mono text-xs tracking-[0.2em] text-muted-foreground\">LOADING SECOND BRAIN…\u003c/div>\n\n    \u003cscript type=\"module\">\n      import * as THREE from 'three';\n      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';\n      import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';\n      import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';\n      import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';\n      import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';\n\n      // ---------- data ----------\n      const KIND_COLOR = { skill: '#5eead4', workflow: '#93c5fd', mcp: '#f9a8d4' };\n      const KIND_LABEL = { skill: 'SKILL', workflow: 'WORKFLOW', mcp: 'MCP' };\n      const MAX_BARS = 100;\n\n      const getJson = (slug) => fetch(`/api/mock/${slug}`).then((r) => {\n        if (!r.ok) throw new Error(`${slug}: HTTP ${r.status}`);\n        return r.json();\n      });\n\n      let memory, ring, skillCards, agents, schedule;\n      try {\n        [memory, ring, skillCards, agents, schedule] = await Promise.all([getJson('memory'), getJson('ring'), getJson('skills'), getJson('agents'), getJson('workflows')]);\n      } catch (err) {\n        document.getElementById('boot').textContent = `Could not load mock API (${err.message}). Run \"npm start\" in mock-ui/ and open /index-2.html.`;\n        throw err;\n      }\n\n      // Deterministic hash so mock usage numbers are stable across reloads.\n      const hash = (s) => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967295; };\n\n      const runs7dBySkill = new Map(skillCards.map((c) => [c.ringItemId, c.runs7d]));\n      const capabilities = ring\n        .filter((r) => r.kind in KIND_COLOR)\n        .map((r) => {\n          const uses = runs7dBySkill.get(r.id) ?? Math.round(2 + hash(r.id) * 30 + (r.linkedMemoryIds?.length ?? 0) * 0.4);\n          return { ...r, uses, active: uses >= 6 };\n        })\n        .sort((a, b) => b.uses - a.uses)\n        .slice(0, MAX_BARS);\n      // Group by kind so each kind forms one coloured arc, most-used first within the arc.\n      const kindOrder = ['skill', 'workflow', 'mcp'];\n      capabilities.sort((a, b) => kindOrder.indexOf(a.kind) - kindOrder.indexOf(b.kind) || b.uses - a.uses);\n      for (const k of kindOrder) {\n        const all = capabilities.filter((c) => c.kind === k);\n        document.getElementById(`n-${k}`).textContent = `${all.filter((c) => c.active).length}/${all.length}`;\n      }\n\n      const domains = memory.domains;\n      const domainIndex = new Map(domains.map((d, i) => [d.id, i]));\n      const nodes = memory.nodes.filter((n) => domainIndex.has(n.domain));\n      const nodeById = new Map(nodes.map((n, i) => [n.id, i]));\n      const links = memory.links.filter((l) => nodeById.has(l.source) && nodeById.has(l.target) && l.source !== l.target);\n      const neighbours = nodes.map(() => new Set());\n      for (const l of links) {\n        neighbours[nodeById.get(l.source)].add(nodeById.get(l.target));\n        neighbours[nodeById.get(l.target)].add(nodeById.get(l.source));\n      }\n\n      document.getElementById('domain-legend').innerHTML = domains\n        .map((d) => `\u003cspan class=\"flex items-center gap-1.5\">\u003ci class=\"legend-dot\" style=\"background:${d.color}\">\u003c/i>${d.label} \u003cb class=\"font-mono font-normal text-muted-foreground\">${d.noteCount ?? ''}\u003c/b>\u003c/span>`)\n        .join('');\n\n      // ---------- scene ----------\n      const canvas = document.getElementById('scene');\n      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });\n      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));\n      const scene = new THREE.Scene();\n      scene.background = new THREE.Color('#0a1014');\n      scene.fog = new THREE.FogExp2('#0a1014', 0.012);\n      const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);\n      camera.position.set(0, -3.5, 30);\n\n      const controls = new OrbitControls(camera, canvas);\n      controls.enableDamping = true;\n      controls.enablePan = false;\n      controls.minDistance = 12;\n      controls.maxDistance = 60;\n      controls.minPolarAngle = Math.PI * 0.2;\n      controls.maxPolarAngle = Math.PI * 0.8;\n\n      const composer = new EffectComposer(renderer);\n      composer.addPass(new RenderPass(scene, camera));\n      const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.7, 0.5, 0.3);\n      composer.addPass(bloom);\n      composer.addPass(new OutputPass());\n\n      scene.add(new THREE.AmbientLight('#ffffff', 0.55));\n      const key = new THREE.DirectionalLight('#ffffff', 1.3);\n      key.position.set(4, 6, 10);\n      scene.add(key);\n\n      // Starfield\n      {\n        const g = new THREE.BufferGeometry();\n        const p = new Float32Array(1500 * 3);\n        for (let i = 0; i \u003c p.length; i += 3) {\n          const r = 40 + Math.random() * 120, t = Math.random() * Math.PI * 2, z = (Math.random() - 0.5) * 120;\n          p[i] = Math.cos(t) * r; p[i + 1] = Math.sin(t) * r; p[i + 2] = z - 30;\n        }\n        g.setAttribute('position', new THREE.BufferAttribute(p, 3));\n        scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: '#7d8ba0', size: 0.12, transparent: true, opacity: 0.6 })));\n      }\n\n      const arc = (r, width, start, len, color, opacity = 1) => {\n        const m = new THREE.Mesh(\n          new THREE.RingGeometry(r - width / 2, r + width / 2, Math.max(8, Math.ceil(len * 40)), 1, start, len),\n          new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false }),\n        );\n        return m;\n      };\n\n      // Layout radii\n      const CORE_R = 2.6;\n      const MEM_R0 = 3.7, MEM_STEP = 0.95;\n      const memR = (i) => MEM_R0 + i * MEM_STEP;\n      const BAR_R = memR(domains.length - 1) + 1.5;\n      const DECO_R = BAR_R + 1.6;\n\n      // Core ring around the mascot\n      const coreRing = arc(CORE_R, 0.05, 0, Math.PI * 2, '#6ee7b7', 0.9);\n      scene.add(coreRing);\n\n      // ---------- memory rings + nodes ----------\n      const ringGroups = domains.map((d, i) => {\n        const g = new THREE.Group();\n        g.add(arc(memR(i), 0.025, 0, Math.PI * 2, d.color, 0.35));\n        g.userData.speed = (i % 2 ? -1 : 1) * (0.012 + 0.006 * (domains.length - i) / domains.length);\n        scene.add(g);\n        return g;\n      });\n\n      // Base angle per node, evenly spread inside its domain ring with a small deterministic jitter.\n      const perDomain = domains.map(() => []);\n      nodes.forEach((n, i) => perDomain[domainIndex.get(n.domain)].push(i));\n      const baseAngle = new Float32Array(nodes.length);\n      const nodeRadius = new Float32Array(nodes.length);\n      perDomain.forEach((idxs, di) => idxs.forEach((ni, k) => {\n        baseAngle[ni] = (k / idxs.length) * Math.PI * 2 + hash(nodes[ni].id) * 0.3 / Math.max(idxs.length / 20, 1);\n        nodeRadius[ni] = memR(di);\n      }));\n      const ringAngle = new Float32Array(domains.length);\n      // Intro spiral: per-ring radius factor and extra twist (1 and 0 once settled).\n      const ringScale = new Float32Array(domains.length).fill(1);\n      const ringTwist = new Float32Array(domains.length);\n      // Sphere view: each domain ring becomes a shell of the same radius, nodes spread over it\n      // with a Fibonacci lattice. `sphereT` morphs 0 (rings) -> 1 (shells).\n      const sphereU = new Float32Array(nodes.length * 3);\n      perDomain.forEach((idxs) => idxs.forEach((ni, k) => {\n        const y = 1 - (2 * (k + 0.5)) / idxs.length, r = Math.sqrt(1 - y * y);\n        const phi = k * Math.PI * (3 - Math.sqrt(5)) + hash(nodes[ni].id) * 0.4;\n        sphereU.set([Math.cos(phi) * r, y, Math.sin(phi) * r], ni * 3);\n      }));\n      let sphereT = 0, sphereTarget = 0;\n      const SPHERE_TILT = 0.42;\n      const easeInOut = (x) => (x \u003c 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);\n      const nodePos = (i, out) => {\n        const d = domainIndex.get(nodes[i].domain);\n        const a = baseAngle[i] + ringAngle[d] + ringTwist[d] + Math.PI / 2;\n        const r = nodeRadius[i] * ringScale[d];\n        out.set(Math.cos(a) * r, Math.sin(a) * r, 0);\n        if (sphereT \u003c= 0) return out;\n        // Spin each shell about Y (reusing its ring speed), then tilt toward the camera.\n        const spin = ringAngle[d] * 3 + ringTwist[d];\n        const ux = sphereU[i * 3], uy = sphereU[i * 3 + 1], uz = sphereU[i * 3 + 2];\n        const x1 = ux * Math.cos(spin) + uz * Math.sin(spin), z1 = -ux * Math.sin(spin) + uz * Math.cos(spin);\n        const y2 = uy * Math.cos(SPHERE_TILT) - z1 * Math.sin(SPHERE_TILT), z2 = uy * Math.sin(SPHERE_TILT) + z1 * Math.cos(SPHERE_TILT);\n        const e = easeInOut(sphereT);\n        return out.set(lerp(out.x, x1 * r, e), lerp(out.y, y2 * r, e), lerp(0, z2 * r, e));\n      };\n\n      const nodeMesh = new THREE.InstancedMesh(\n        new THREE.SphereGeometry(1, 14, 10),\n        new THREE.MeshBasicMaterial({ toneMapped: false }),\n        nodes.length,\n      );\n      const nodeBaseColor = nodes.map((n) => new THREE.Color(domains[domainIndex.get(n.domain)].color));\n      const nodeSize = nodes.map((_, i) => 0.06 + Math.min(neighbours[i].size, 12) * 0.008);\n      scene.add(nodeMesh);\n\n      const linkGeo = new THREE.BufferGeometry();\n      const linkPos = new Float32Array(links.length * 6);\n      const linkCol = new Float32Array(links.length * 6);\n      linkGeo.setAttribute('position', new THREE.BufferAttribute(linkPos, 3));\n      linkGeo.setAttribute('color', new THREE.BufferAttribute(linkCol, 3));\n      const linkLines = new THREE.LineSegments(linkGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending }));\n      scene.add(linkLines);\n      const linkEnds = links.map((l) => [nodeById.get(l.source), nodeById.get(l.target)]);\n\n      // ---------- outer capability bars (100 slots) ----------\n      const GAP = 0.012 * Math.PI * 2;\n      const SLOT = (Math.PI * 2) / MAX_BARS;\n      const barGroup = new THREE.Group();\n      scene.add(barGroup);\n      const bars = [];\n      for (let s = 0; s \u003c MAX_BARS; s++) {\n        const cap = capabilities[s];\n        // Clockwise from 12 o'clock.\n        const start = Math.PI / 2 - (s + 1) * SLOT + GAP / 2;\n        const color = cap ? KIND_COLOR[cap.kind] : '#3a4a63';\n        const opacity = cap ? (cap.active ? 1 : 0.28) : 0.35;\n        const mesh = arc(BAR_R, cap?.active ? 0.34 : 0.26, start, SLOT - GAP, color, opacity);\n        mesh.material.toneMapped = !cap?.active;\n        mesh.userData = { cap, baseOpacity: opacity, color: new THREE.Color(color) };\n        barGroup.add(mesh);\n        bars.push(mesh);\n      }\n      const activeCount = capabilities.filter((c) => c.active).length;\n\n      // ---------- decorative outer tick ring ----------\n      const deco = new THREE.Group();\n      {\n        const pts = [];\n        const n = 240;\n        for (let i = 0; i \u003c n; i++) {\n          const a = (i / n) * Math.PI * 2, len = i % 10 === 0 ? 0.45 : i % 5 === 0 ? 0.28 : 0.14;\n          pts.push(Math.cos(a) * DECO_R, Math.sin(a) * DECO_R, 0, Math.cos(a) * (DECO_R + len), Math.sin(a) * (DECO_R + len), 0);\n        }\n        const g = new THREE.BufferGeometry();\n        g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));\n        deco.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: '#9fb3c8', transparent: true, opacity: 0.18 })));\n        deco.add(arc(DECO_R + 1.0, 0.015, 0, Math.PI * 1.3, '#9fb3c8', 0.12));\n        deco.add(arc(DECO_R - 0.35, 0.01, Math.PI, Math.PI * 0.8, '#9fb3c8', 0.1));\n      }\n      scene.add(deco);\n\n      // ---------- Claude voxel mascot ----------\n      const robot = new THREE.Group();\n      {\n        const voxel = new THREE.BoxGeometry(0.98, 0.98, 0.98);\n        const mat = new THREE.MeshStandardMaterial({ color: '#d97757', roughness: 0.75, metalness: 0.05 });\n        const cells = [];\n        // Body 11 x 6 with two 2x2 eye holes, 2 rows deep.\n        for (let x = -5; x \u003c= 5; x++) for (let y = 0; y \u003c 6; y++) {\n          const eye = y >= 2 && y \u003c= 3 && (x === -3 || x === -2 || x === 2 || x === 3);\n          if (!eye) for (let z = 0; z \u003c 2; z++) cells.push([x, y, z]);\n        }\n        cells.push([0, 6, 0], [0, 7, 0]);                                                               // antenna\n        const voxels = (list) => {\n          const mesh = new THREE.InstancedMesh(voxel, mat, list.length);\n          const m = new THREE.Matrix4();\n          list.forEach(([x, y, z], i) => mesh.setMatrixAt(i, m.makeTranslation(x, y, -z)));\n          return mesh;\n        };\n        const im = voxels(cells.map(([x, y, z]) => [x, y - 2.5, z]));\n        // Everything that breathes/squashes lives in `body`; the hit box stays outside it.\n        const body = new THREE.Group();\n        body.add(im);\n        robot.add(body);\n        robot.userData.body = body;\n\n        // Limbs are pivot groups so actions can swing them: arms pivot at the shoulder,\n        // legs at the hip.\n        robot.userData.arms = [-1, 1].map((side) => {\n          const pivot = new THREE.Group();\n          pivot.position.set(side * 5.5, -1.5, 0);\n          pivot.add(voxels([[side * 0.5, 0, 0], [side * 0.5, 0, 1], [side * 1.5, 0, 0], [side * 1.5, 0, 1]]));\n          body.add(pivot);\n          return { pivot, side };\n        });\n        robot.userData.legs = [-4, -2, 2, 4].map((x) => {\n          const pivot = new THREE.Group();\n          pivot.position.set(x, -3, 0);\n          pivot.add(voxels([[0, -0.5, 0], [0, -1.5, 0]]));\n          body.add(pivot);\n          return { pivot };\n        });\n\n        // Neon blue eyes: a dark socket at the back of each hole, a glowing eye block that\n        // squashes to blink, and a bright pupil that glances toward the cursor.\n        const eyeGlow = new THREE.Color('#38bdf8').multiplyScalar(2.2);\n        const eyeMat = new THREE.MeshBasicMaterial({ color: eyeGlow.clone(), toneMapped: false });\n        const pupilMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#e0f7ff').multiplyScalar(2.5), toneMapped: false });\n        const socketMat = new THREE.MeshBasicMaterial({ color: '#07131c' });\n        robot.userData.eyes = [-2.5, 2.5].map((x) => {\n          const socket = new THREE.Mesh(new THREE.BoxGeometry(1.96, 1.96, 0.2), socketMat);\n          socket.position.set(x, 0, -1.35);\n          const eye = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.9, 1.2), eyeMat);\n          eye.position.set(x, 0, -0.3);\n          const pupil = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.2), pupilMat);\n          pupil.position.set(0, 0, 0.65);\n          eye.add(pupil);\n          body.add(socket, eye);\n          return { eye, pupil, x };\n        });\n        robot.userData.eyeMat = eyeMat;\n        robot.userData.eyeGlow = eyeGlow;\n        robot.userData.blink = { next: 1.5, start: -1, double: false };\n\n        const tip = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 12), new THREE.MeshBasicMaterial({ color: '#6ee7b7', toneMapped: false }));\n        tip.position.set(0, 6.6, 0);\n        body.add(tip);\n        robot.userData.tip = tip;\n        // Invisible hit box for easier clicking.\n        const hit = new THREE.Mesh(new THREE.CircleGeometry(9, 24), new THREE.MeshBasicMaterial({ visible: false }));\n        robot.add(hit);\n        robot.userData.hit = hit;\n        robot.scale.setScalar(0.2);\n        robot.position.set(0, -0.15, 0.2);\n      }\n      scene.add(robot);\n\n      // Text sprites (canvas textures) for the core readout.\n      const textSprite = (text, { size = 64, weight = 300, color = '#e5edf5', spacing = 0, scale = 1 } = {}) => {\n        const c = document.createElement('canvas');\n        const ctx = c.getContext('2d');\n        const font = `${weight} ${size}px Geist, system-ui, sans-serif`;\n        ctx.font = font;\n        const spaced = spacing ? text.split('').join(' '.repeat(spacing)) : text;\n        c.width = Math.ceil(ctx.measureText(spaced).width) + 16; c.height = size * 1.4;\n        ctx.font = font; ctx.fillStyle = color; ctx.textBaseline = 'middle';\n        ctx.fillText(spaced, 8, c.height / 2);\n        const tex = new THREE.CanvasTexture(c);\n        tex.colorSpace = THREE.SRGBColorSpace;\n        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));\n        s.scale.set((c.width / c.height) * 0.5 * scale, 0.5 * scale, 1);\n        return s;\n      };\n      await document.fonts.ready;\n      // One sprite per value so the intro can count the readout up from 0%.\n      const pctSprites = Array.from({ length: activeCount + 1 }, (_, v) => {\n        const s = textSprite(`${v}%`, { size: 72, scale: 1.25 });\n        s.position.set(0, 1.85, 0.3);\n        s.visible = false;\n        scene.add(s);\n        return s;\n      });\n      const showPct = (v) => pctSprites.forEach((s, i) => (s.visible = i === v));\n      const name = textSprite('AGENT CORE', { size: 40, weight: 500, color: '#8b98a8', spacing: 3, scale: 0.55 });\n      name.position.set(0, -1.85, 0.3);\n      scene.add(name);\n\n      // ---------- mascot idle actions ----------\n      // Floating glyphs (Z, ♪, ?, !, …) spawned by actions. Each spawn gets its own material\n      // so it can fade independently.\n      const glyphBase = {};\n      const glyph = (ch, color, size = 64) => (glyphBase[ch + color] ??= textSprite(ch, { size, weight: 600, color, scale: 1 }));\n      const fx = [];\n      function spawnGlyph(ch, { color = '#e0f2fe', at = [0.5, 1.0], vel = [0.25, 0.5], life = 1.8, scale = 0.8, wobble = 0.15 } = {}) {\n        const base = glyph(ch, color);\n        const s = new THREE.Sprite(base.material.clone());\n        s.material.depthTest = false;\n        s.renderOrder = 10;\n        s.userData = { born: clock.elapsedTime, life, vel, wobble, base: base.scale.clone().multiplyScalar(scale * 1.9), at: new THREE.Vector3(robot.position.x + at[0], robot.position.y + at[1], 0.6) };\n        scene.add(s);\n        fx.push(s);\n      }\n      function updateFx(t) {\n        for (let i = fx.length - 1; i >= 0; i--) {\n          const s = fx[i], u = s.userData, age = t - u.born, p = age / u.life;\n          if (p >= 1) { scene.remove(s); s.material.dispose(); fx.splice(i, 1); continue; }\n          s.position.set(u.at.x + u.vel[0] * age + Math.sin(age * 4) * u.wobble, u.at.y + u.vel[1] * age, u.at.z);\n          s.material.opacity = Math.min(1, p * 6) * (1 - p);\n          s.scale.copy(u.base).mult st up = smooth(seg(lt, 0.15, 0.55)) * (1 - smooth(seg(lt, 3.3, 3.8)));\n            return { yaw: 0, pitch: 0, gx: 0, gy: 0, roll: -0.1 * up, open: 0.5, arms: [0, up * (1.2 + 0.35 * Math.sin(lt * 14))], lift: 0.5 * Math.sin(Math.PI * seg(lt, 0, 0.4)) };\n          },\n        },\n        think: {\n          dur: 6,\n          pose(lt, a) {\n            if (lt \u003c 3.8) {\n              a.every(0.6, 0.4, 2.2, (n) => spawnGlyph('•', { color: '#93c5fd', at: [-0.5 - n * 0.25, 1.0 + n * 0.3], vel: [-0.05, 0.25], life: 2.6 - n * 0.6, scale: 0.4 + n * 0.15, wobble: 0.03 }));\n              const p = smooth(seg(lt, 0, 0.6));\n              return { yaw: -0.35 * p, pitch: -0.4 * p, gx: 0.5 * Math.cos(lt * 5), gy: 0.5 * Math.sin(lt * 5), arms: [0, 1.5 * p], roll: 0.06 * p, open: 0.85, tipL: 0.45 + 0.4 * Math.abs(Math.sin(lt * 10)), tipH: 0.55 };\n            }\n            a.once('eureka', () => spawnGlyph('!', { color: '#fde68a', at: [0, 1.4], vel: [0, 0.65], life: 1.3, scale: 1.1 }));\n            const p = seg(lt, 3.8, 4.4);\n            return { yaw: 0, pitch: -0.1, gx: 0, gy: 0.2, open: 1.3, lift: Math.sin(Math.PI * p) * 1.1, arms: [1.45 * (1 - smooth(seg(lt, 4.6, 5.4))), 1.45 * (1 - smooth(seg(lt, 4.6, 5.4)))], squash: 1 + 0.08 * Math.sin(Math.PI * p), tipH: 0.14, tipL: 0.7 };\n          },\n        },\n      };\n      const ACTION_NAMES = Object.keys(ACTIONS);\n      // Dev hook: preview an action from the console, e.g. robotAction('snooze').\n      window.robotAction = (name) => {\n        if (!ACTIONS[name]) return `Unknown action. Try: ${ACTION_NAMES.join(', ')}`;\n        if (act.cur) act.cur.end?.();\n        startAction(name, clock.elapsedTime);\n        return name;\n      };\n      const FADE = 0.35;\n      const act = { cur: null, name: '', start: 0, dur: 0, fired: new Set(), next: 6 + Math.random() * 3, last: '' };\n      function startAction(name, t) {\n        Object.assign(act, { cur: ACTIONS[name], name, start: t, dur: ACTIONS[name].dur, fired: new Set(       setPointer(e);\n        const hit = pick();\n        if (touch) pointer.set(9, 9); // no lingering \"hover\" after a tap\n        if (!hit) return setFocus(null);\n        if (hit.type === 'robot') return openCmd();\n        if (hit.type === 'node') return setFocus({ type: 'node', index: hit.index });\n        if (hit.type === 'bar' && capabilities[hit.index]) return setFocus({ type: 'cap', index: hit.index });\n      });\n\n      // Phone-width metrics sidebar.\n      const setLegendOpen = (open) => document.body.classList.toggle('legend-open', open);\n      document.getElementById('legend-toggle').onclick = () => setLegendOpen(true);\n      document.getElementById('legend-close').onclick = () => setLegendOpen(false);\n      canvas.addEventListener('pointerdown', () => setLegendOpen(false));\n\n      const esc = (s) => String(s ?? '').replace(/[&\u003c>\"']/g, (c) => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n\n      const pickV = new THREE.Vector3();\n      function pick() {\n        raycaster.setFromCamera(pointer, camera);\n        raycaster.params.Line.threshold = 0;\n        // Nodes are tiny and moving, so pick the nearest one on screen within a 12px radius.\n        if (pointer.x \u003c= 1) {\n          let best = -1, bestD = pointerType === 'mouse' ? 144 : 576; // 12px mouse, 24px touch\n          for (let i = 0; i \u003c nodes.length; i++) {\n            nodePos(i, pickV).project(camera);\n            const dx = (pickV.x - pointer.x) * innerWidth / 2, dy = (pickV.y - pointer.y) * innerHeight / 2;\n            const d2 = dx * dx + dy * dy;\n            if (d2 \u003c bestD) { bestD = d2; best = i; }\n          }\n          if (best >= 0) return { type: 'node', index: best };\n        }\n        const hitBar = raycaster.intersectObjects(bars)[0];\n        if (hitBar) return { type: 'bar', index: bars.indexOf(hitBar.object) };\n        if (raycaster.intersectObject(robot.userData.hit)[0]) return { type: 'robot
