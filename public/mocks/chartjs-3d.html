<title>Chart.js in 3D</title>
<!--
  Playground mock: Chart.js charts lifted into 3D with Three.js. Chart.js does what it is good at, 2D layout:
  scales, ticks, grid, labels and the pixel position of every point, bar and sector. Each chart renders on a
  hidden canvas; Three.js uses that canvas as a texture (axes, grid, labels) and reads the computed positions
  from chart.getDatasetMeta(i).data to build real 3D geometry: lofted radar layers, multi-axis ribbons,
  extruded polar sectors and bar rows. Every view can show the original interactive Chart.js chart.
  Styled with the inoTives brand kit. All figures are mock data.
-->

<style>
  body { margin: 0; background: #15171b; }
  .fi { display: inline-flex; line-height: 1; }
  #stage { isolation: isolate; background: radial-gradient(ellipse 80% 70% at 62% 45%, #1b1e24 0%, #15171b 72%); }
  #stage canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .lbl { font: 400 11px "Source Code Pro", monospace; color: #8b9099; white-space: nowrap; padding: 1px 5px; border-radius: 4px; background: rgb(21 23 27 / 0.6); }
  .lbl.strong { color: #e4e1d8; font: 500 12px "IBM Plex Sans Condensed", sans-serif; }
  #offscreen { position: fixed; left: -10000px; top: 0; pointer-events: none; }
  .scroll-thin { scrollbar-width: thin; scrollbar-color: #343943 transparent; }
  .code { font: 400 11.5px/1.6 "Source Code Pro", monospace; white-space: pre; }
  .code .c { color: #8b9099; font-style: italic; } .code .s { color: #9ccf7f; } .code .k { color: #c9a4f5; } .code .n { color: #e9a66c; }
  #drawer { --pg-panel-w: 340px; }

  /* <pg-layout v1> Playground layout standard (scripts/mocks/template/playground.html).
     Side panel: a floating card on the left from 900px wide (.pg-float); below 900px it is a
     drawer that slides in from the left over a scrim, with the stage legend folded into it.
     Keep this block identical across mocks; check.mjs compares it with the template. */
  .pg-drawer { display: flex; flex-direction: column; min-height: 0; }
  .pg-drawer-head, .pg-drawer-legend, .pg-drawer-btn, .pg-scrim { display: none; }
  @media (min-width: 900px) {
    .pg-float { position: absolute; z-index: 10; left: 1.5rem; top: 4.5rem; width: var(--pg-panel-w, 360px); max-height: calc(100% - 6rem); }
  }
  @media (max-width: 899px) {
    .pg-drawer { position: fixed; inset: 0 auto 0 0; z-index: 45; width: min(var(--pg-drawer-w, 360px), 88vw); height: auto; max-height: none; border: 0; border-right: 1px solid #2b2f37; border-radius: 0 0.75rem 0.75rem 0; background: #1d2026; box-shadow: 0 10px 40px rgb(0 0 0 / 0.5); transform: translateX(-104%); visibility: hidden; transition: transform 0.22s ease, visibility 0s linear 0.22s; }
    body[data-drawer="open"] .pg-drawer { transform: none; visibility: visible; transition: transform 0.22s ease; }
    body[data-drawer="open"] .pg-scrim { display: block; position: fixed; inset: 0; z-index: 44; background: rgb(0 0 0 / 0.5); }
    .pg-drawer-head { display: flex; align-items: center; gap: 0.625rem; flex-shrink: 0; height: 3.5rem; padding: 0 0.75rem 0 1rem; border-bottom: 1px solid #2b2f37; }
    .pg-drawer-legend:not(:empty) { display: block; flex-shrink: 0; padding: 0.75rem 1rem; border-top: 1px solid #2b2f37; font-size: 0.75rem; color: #8b9099; }
    .pg-drawer-btn { display: inline-flex; }
    .pg-hide-mobile, .pg-legend { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) { .pg-drawer { transition: none !important; } }
  /* </pg-layout> */
</style>
</head>

    <a href="/playground" class="pg-hide-mobile pointer-events-auto rounded-sm font-brand text-[26px] leading-none transition-colors hover:text-primary focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" title="Back to the Playground">inoTives</a>
    <span class="hidden text-sm text-muted-foreground lg:inline">Playground · Chart.js in 3D</span>
    <div role="tablist" aria-label="Chart types" id="tabs" class="pointer-events-auto mx-auto inline-flex h-9 max-w-full items-center overflow-x-auto rounded-lg bg-muted p-1 text-muted-foreground"></div>

      <span class="min-w-0 flex-1 truncate text-sm text-muted-foreground">Chart.js in 3D</span>
      <button id="drawer-close" type="button" class="inline-flex size-8 items-center justify-center rounded-md hover:bg-accent focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" aria-label="Close the panel"><i class="fi fi-rr-cross-small"></i></button>
    </div>

  <div id="scrim" class="pg-scrim"></div>

  <!-- the source Chart.js chart, flat and interactive -->
  <div id="flat" hidden class="absolute inset-0 z-30 flex items-center justify-center bg-black/55 p-3 backdrop-blur-sm sm:p-8">
    <div role="dialog" aria-modal="true" aria-labelledby="flat-title" class="flex h-full max-h-[620px] w-full max-w-[920px] flex-col rounded-xl border bg-card p-4 shadow-lg sm:p-5">
      <div class="flex items-start gap-3">
        <div class="min-w-0 flex-1">
          <h2 id="flat-title" class="font-semibold"></h2>
          <p class="text-xs text-muted-foreground">The same data as a plain Chart.js chart, with its own tooltips and legend.</p>
        </div>
        <button id="flat-close" class="inline-flex size-8 items-center justify-center rounded-md hover:bg-accent focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" aria-label="Close"><i class="fi fi-rr-cross-small"></i></button>
      </div>
      <div class="relative mt-3 min-h-0 flex-1"><canvas id="flat-canvas"></canvas></div>
    </div>
  </div>

  <footer class="pointer-events-none absolute bottom-3 right-4 z-10 hidden text-xs text-muted-foreground md:block"><i class="fi fi-rr-cursor-finger mr-1 align-[-1px]"></i>Drag to turn · scroll to zoom · hover for values</footer>
</div>

<script>
/* <pg-layout-js v1> Playground layout standard: the mobile drawer (scripts/mocks/template/playground.html).
   Opens from #drawer-btn; closes from #drawer-close, the scrim, Escape, links to #anchors or
   [data-drawer-close] inside it, and when the window grows past 900px. Mirrors #legend into
   #drawer-legend. Mocks can call window.pgDrawer.open() / .close(). Keep identical across mocks. */
(() => {
  const body = document.body, btn = document.getElementById('drawer-btn');
  const set = (open) => { body.dataset.drawer = open ? 'open' : ''; btn?.setAttribute('aria-expanded', String(open)); };
  const close = (refocus) => { if (body.dataset.drawer !== 'open') return; set(false); if (refocus) btn?.focus(); };
  btn?.addEventListener('click', () => set(body.dataset.drawer !== 'open'));
  document.getElementById('drawer-close')?.addEventListener('click', () => close(true));
  document.getElementById('scrim')?.addEventListener('click', () => close(false));
  document.getElementById('drawer')?.addEventListener('click', (e) => { if (e.target.closest('a[href^="#"], [data-drawer-close]')) close(false); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && body.dataset.drawer === 'open') { e.stopImmediatePropagation(); close(true); } }, true);
  matchMedia('(min-width: 900px)').addEventListener('change', (m) => { if (m.matches) set(false); });
  const legend = document.getElementById('legend'), copy = document.getElementById('drawer-legend');
  if (legend && copy) {
    const sync = () => { copy.innerHTML = legend.hidden ? '' : legend.innerHTML.trim(); };
    new MutationObserver(sync).observe(legend, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
    sync();
  }
  window.pgDrawer = { open: () => set(true), close: () => close(false) };
})();
/* </pg-layout-js> */
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- brand kit ----------
const B = { paper: '#15171b', raise: '#1d2026', line: '#2b2f37', ink: '#e4e1d8', ink2: '#b8b5ac', fog: '#8b9099', signal: '#1fefd7', amber: '#f6c453' };
const PAL = ['#1fefd7', '#f6c453', '#c9a4f5', '#9ccf7f', '#e58fb0', '#7cc4dc', '#e9a66c'];
const alpha = (hex, a) => hex + Math.round(a * 255).toString(16).padStart(2, '0');
const MONO = '"Source Code Pro", monospace', SANS = '"IBM Plex Sans Condensed", sans-serif';
// Chart.js defaults set once from the brand, so every chart (hidden or flat) matches
Chart.defaults.color = B.fog;
Chart.defaults.borderColor = B.line;
Chart.defaults.font.family = MONO;
Chart.defaults.font.size = 11;
Chart.defaults.plugins.tooltip.backgroundColor = alpha(B.paper, 0.95);
Chart.defaults.plugins.tooltip.borderColor = B.line;
Chart.defaults.plugins.tooltip.borderWidth = 1;
Chart.defaults.plugins.tooltip.titleFont = { family: SANS, weight: '600', size: 12 };
Chart.defaults.plugins.legend.labels.boxWidth = 10;
Chart.defaults.plugins.legend.labels.boxHeight = 3;

// ---------- seeded mock data ----------
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const gauss = () => Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(2 * Math.PI * rnd());
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v, d = 1) => v.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });

const MONTHS = ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];
const AXES = ['TVL', 'Volume', 'Users', 'Fees', 'Developers', 'Uptime'];
const CHAINS = {
  Ethereum: [92, 70, 60, 88, 95, 97], Solana: [55, 92, 90, 66, 70, 82], Base: [40, 64, 78, 50, 58, 95],
};
const radarData = Object.fromEntries(Object.entries(CHAINS).map(([k, base]) => [k, MONTHS.map((_, m) => base.map((v, i) => clamp(v * (0.78 + 0.05 * m) + 7 * gauss() + (i === 2 && k !== 'Ethereum' ? m * 2 : 0), 8, 100)))]));

const DAYS = Array.from({ length: 60 }, (_, i) => { const d = new Date(Date.UTC(2026, 8, 3 + i)); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }); });
const SERIES = (() => {
  let p = 61000, v;
  const price = DAYS.map((_, i) => (i ? (p *= Math.exp(0.002 + 0.022 * gauss())) : p));
  const vol = DAYS.map((_, i) => (v = 28 + 9 * Math.sin(i / 6) + 5 * gauss() + (i > 40 ? 10 : 0)));
  const fund = DAYS.map((_, i) => 0.008 + 0.006 * Math.sin(i / 9) + 0.004 * gauss());
  return [
    { key: 'price', name: 'BTC price', unit: 'US$', data: price, color: PAL[0], fmt: (x) => `$${fmt(x, 0)}` },
    { key: 'vol', name: 'Spot volume', unit: 'US$ B', data: vol, color: PAL[1], fmt: (x) => `$${fmt(x, 1)}B` },
    { key: 'fund', name: 'Funding rate', unit: '% per 8h', data: fund, color: PAL[2], fmt: (x) => `${fmt(x, 3)}%` },
  ];
})();

const VENUES = ['Binance', 'OKX', 'Bybit', 'Coinbase', 'CME', 'Bitget', 'Deribit', 'Hyperliquid'];
const POLAR = { share: [34, 12, 14, 8, 9, 7, 5, 11], oi: [21.4, 9.8, 12.1, 3.2, 14.6, 6.1, 4.8, 8.9], growth: [4, -2, 6, 3, 9, 5, -1, 31] };

const ROWS = ['Ethereum', 'Solana', 'Base', 'Arbitrum'];
const BARS = ROWS.map((r, k) => ({ name: r, color: PAL[k], data: MONTHS.map((_, m) => clamp([62, 12, 6, 3.4][k] * (1 + 0.05 * m * (k === 2 ? 3 : 1)) * (1 + 0.06 * gauss()), 1, 99)) }));

// ---------- Chart.js on hidden canvases ----------
const host = $('#offscreen');
const offCharts = [];
function offChart(config, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h; c.style.width = `${w}px`; c.style.height = `${h}px`;
  host.appendChild(c);
  const o = config.options ?? {};
  const chart = new Chart(c, {
    ...config,
    options: { ...o, responsive: false, animation: false, devicePixelRatio: 1, events: [], plugins: { legend: { display: false }, tooltip: { enabled: false }, ...(o.plugins ?? {}) } },
  });
  offCharts.push(chart);
  return chart;
}
function texture(chart) {
  const t = new THREE.CanvasTexture(chart.canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
// Chart.js pixel position -> plane coordinates (plane centered at 0, y up)
const toPlane = (chart, px, py, W) => { const H = (W * chart.height) / chart.width; return [(px / chart.width - 0.5) * W, (0.5 - py / chart.height) * H]; };

// ---------- Three.js stage ----------
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.domElement.className = 'labels';
stage.appendChild(labelR.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(B.paper, 26, 60);
scene.add(new THREE.HemisphereLight('#cfe9ff', B.paper, 1.15));
const key = new THREE.DirectionalLight('#ffffff', 1.5); key.position.set(-8, 14, 10); scene.add(key);
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 6; controls.maxDistance = 45;
controls.autoRotateSpeed = 0.45;
controls.addEventListener('start', () => { controls.autoRotate = false; });
let group = new THREE.Group(); scene.add(group);
let pickables = [];

function lbl(text, pos, cls = '') { const d = document.createElement('div'); d.className = `lbl ${cls}`; d.textContent = text; const o = new CSS2DObject(d); o.position.copy(pos); group.add(o); return o; }
function clearScene() {
  group.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
    mats.forEach((m) => { m.map?.dispose(); m.dispose(); });
    if (o.isCSS2DObject) o.element.remove();
  });
  scene.remove(group); group = new THREE.Group(); scene.add(group);
  pickables = [];
  offCharts.splice(0).forEach((c) => { c.canvas.remove(); c.destroy(); });
}
const panelMat = (chart) => new THREE.MeshBasicMaterial({ map: texture(chart), transparent: true, side: THREE.DoubleSide, depthWrite: false });
const solid = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.1, ...opts });

// ================= views =================
const VIEWS = {};
const state = { view: 'radar', chain: 'Solana', series: { price: true, vol: true, fund: true }, polarHeight: 'oi', barFocus: null };

// ---------- 1. 3D radar: one Chart.js radar per month, lofted along depth ----------
VIEWS.radar = {
  tab: '3D radar', icon: 'fi-rr-chart-network',
  title: 'Radar over time',
  blurb: 'Six monthly radar charts stacked front to back. The shape between them is lofted from the points Chart.js computed, so you see each metric grow or shrink across the months.',
  how: ['Chart.js draws each month’s radar (scale, grid, labels) on a hidden canvas and computes every vertex position.', 'Three.js stacks the canvases as transparent layers and joins the vertices into a skin and six axis threads.'],
  camera: [5.5, 4.5, 14], target: [0, 0, 0],
  build() {
    const W = 6.4, gap = 1.25, data = radarData[state.chain], col = PAL[Object.keys(CHAINS).indexOf(state.chain)];
    const layers = MONTHS.map((m, k) => {
      const last = k === MONTHS.length - 1;
      const chart = offChart({
        type: 'radar',
        data: { labels: AXES, datasets: [{ data: data[k], borderColor: alpha(col, last ? 1 : 0.55), backgroundColor: alpha(col, last ? 0.18 : 0.06), borderWidth: last ? 4 : 2, pointRadius: 0 }] },
        options: { layout: { padding: 8 }, scales: { r: { min: 0, max: 100, ticks: { display: k === 0, stepSize: 25, backdropColor: 'transparent', color: B.fog, font: { size: 18 } }, grid: { color: k === 0 ? B.line : 'transparent', lineWidth: 2 }, angleLines: { color: k === 0 ? B.line : 'transparent', lineWidth: 2 }, pointLabels: { color: last ? B.ink : 'transparent', font: { family: SANS, size: 26, weight: '500' } } } } },
      }, 720, 720);
      const z = (k - (MONTHS.length - 1) / 2) * gap;
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(W, W), panelMat(chart));
      plane.position.z = z; plane.renderOrder = k;
      group.add(plane);
      const pts = chart.getDatasetMeta(0).data.map((el) => { const [x, y] = toPlane(chart, el.x, el.y, W); return new THREE.Vector3(x, y, z); });
      lbl(m, new THREE.Vector3(0, -W / 2 - 0.15, z), last ? 'strong' : '');
      return pts;
    });
    // skin between consecutive layers
    const pos = [], n = AXES.length;
    for (let k = 0; k < layers.length - 1; k++) for (let i = 0; i < n; i++) {
      const a = layers[k][i], b = layers[k][(i + 1) % n], c = layers[k + 1][(i + 1) % n], d = layers[k + 1][i];
      pos.push(...a.toArray(), ...b.toArray(), ...c.toArray(), ...a.toArray(), ...c.toArray(), ...d.toArray());
    }
    const skin = new THREE.BufferGeometry(); skin.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); skin.computeVertexNormals();
    group.add(new THREE.Mesh(skin, solid(col, { transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false })));
    // axis threads and vertex beads
    const beadGeo = new THREE.SphereGeometry(0.075, 14, 10);
    for (let i = 0; i < n; i++) {
      const curve = new THREE.CatmullRomCurve3(layers.map((l) => l[i]));
      group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.022, 6), new THREE.MeshBasicMaterial({ color: col })));
      layers.forEach((l, k) => {
        const bead = new THREE.Mesh(beadGeo, solid(k === layers.length - 1 ? B.amber : col));
        bead.position.copy(l[i]); bead.userData = { html: `<div class="font-medium">${esc(state.chain)} · ${MONTHS[k]}</div><div class="font-mono">${AXES[i]} ${fmt(data[k][i], 0)} / 100</div>` };
        group.add(bead); pickables.push(bead);
      });
    }
  },
  controls() {
    return `<div><p class="mb-1.5 text-xs text-muted-foreground">Chain</p><div class="inline-flex rounded-lg bg-muted p-1 text-muted-foreground" role="radiogroup">${Object.keys(CHAINS).map((c, i) => `<button data-chain="${c}" role="radio" aria-checked="${state.chain === c}" class="inline-flex items-center gap-1.5 rounded-md px-3 py-1 text-sm font-medium hover:text-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring aria-checked:bg-background aria-checked:text-foreground aria-checked:shadow"><span class="size-2 rounded-full" style="background:${PAL[i]}"></span>${c}</button>`).join('')}</div></div>`;
  },
  flat() {
    const col = PAL[Object.keys(CHAINS).indexOf(state.chain)];
    return { title: `${state.chain}: six months on one radar`, config: { type: 'radar', data: { labels: AXES, datasets: MONTHS.map((m, k) => ({ label: m, data: radarData[state.chain][k], borderColor: alpha(col, 0.25 + 0.15 * k), backgroundColor: alpha(col, k === 5 ? 0.15 : 0.02), borderWidth: k === 5 ? 2.5 : 1.25, pointRadius: 2 })) }, options: { scales: { r: { min: 0, max: 100, ticks: { stepSize: 25, backdropColor: 'transparent' }, pointLabels: { color: B.ink2, font: { family: SANS, size: 13 } } } } } } };
  },
  snippet: `// one hidden radar per month
const chart = new Chart(canvas, { type: 'radar', data, options: {
  responsive: false, animation: false,

  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); labelR.setSize(w, h);
  camera.aspect = w / h;
  // on narrow screens pull back so the whole chart fits
  camera.fov = w < 700 ? 48 : 34;
  // on desktop the side panel covers the left; center the scene in the space beside it
  if (w >= 900) camera.setViewOffset(w, h, -185, 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); labelR.render(scene, camera); });

const initial = new URLSearchParams(location.search).get('view');
document.fonts.ready.then(() => show(ORDER.includes(initial) ? initial : 'radar'));
</script>
</body>
</html>
