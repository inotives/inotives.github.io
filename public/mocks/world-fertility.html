<title>Fertility Extinction Clock</title>
<!--
  Playground mock: how long each country's population lasts if its fertility rate stays where it
  is today. A cohort-component model (five-year age groups by sex, no migration, mortality held at
  today's life expectancy) projects every country forward until the expected population is below
  one person. Three.js draws three views: a globe coloured by fertility rate or by the year of the
  last person, with a spike per capital for population; a trajectory of one country's age structure,
  row by row, until it runs out; and a ranking of every country as a column, soonest end first.
  A slider holds any country at another fertility rate. D3 draws the population chart, scales and
  the globe texture. UI recreates shadcn/ui in Tailwind with the inoTives brand kit. Icons: Flaticon UIcons.
  Data: World Bank World Development Indicators (population by age and sex, fertility rate, life
  expectancy, infant mortality), bundled in data/world-fertility.json by
  scripts/mocks/world-fertility/capture.mjs, which imports the loader between the wb-data markers
  below. "Go live" runs the same loader in the browser and keeps the result in IndexedDB.
  Country shapes: world-atlas (Natural Earth 1:50m), drawn as geometry on the sphere.
-->

<script>
/* <pg-layout-js v1> Playground layout standard: the mobile drawer (scripts/mocks/template/playground.html).
   Opens from #drawer-btn; closes from #drawer-close, the scrim, Escape, links to #anchors or
   [data-drawer-close] inside it, and when the window grows past 900px. Mirrors #legend into
   #drawer-legend. Mocks can call window.pgDrawer.open() / .close(). Keep identical across mocks. */
(() => {
  const body = document.body, btn = document.getElementById('drawer-btn');
  const set = (open) => { body.dataset.drawer = open ? 'open' : ''; btn?.setAttribute('aria-expanded', String(open)); };
  const close = (refocus) => { if (body.dataset.drawer !== 'open') return; set(false); if (refocus) btn?.focus(); };
  btn?.addEventListener('click', () => set(body.dataset.drawer !== 'open'));
  document.getElementById('drawer-close')?.addEventListener('click', () => close(true));
  document.getElementById('scrim')?.addEventListener('click', () => close(false));
  document.getElementById('drawer')?.addEventListener('click', (e) => { if (e.target.closest('a[href^="#"], [data-drawer-close]')) close(false); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && body.dataset.drawer === 'open') { e.stopImmediatePropagation(); close(true); } }, true);
  matchMedia('(min-width: 900px)').addEventListener('change', (m) => { if (m.matches) set(false); });
  const legend = document.getElementById('legend'), copy = document.getElementById('drawer-legend');
  if (legend && copy) {
    const sync = () => { copy.innerHTML = legend.hidden ? '' : legend.innerHTML.trim(); };
    new MutationObserver(sync).observe(legend, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
    sync();
  }
  window.pgDrawer = { open: () => set(true), close: () => close(false) };
})();
/* </pg-layout-js> */
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ================= World Bank data =================
// <wb-data>
// Loads every country's age structure, fertility history, population history and mortality
// from the World Bank API. "Go live" runs this in the browser, and
// scripts/mocks/world-fertility/capture.mjs imports this block to build the bundled snapshot,
// so both have the same shape. No DOM in here: it also runs in Node.
const WB_DATA = (() => {
  const API = {
    worldBank: 'https://api.worldbank.org/v2',
    isoCodes: 'https://cdn.jsdelivr.net/npm/i18n-iso-countries@7.14.0/codes.json',
  };
  const AGES = ['0004', '0509', '1014', '1519', '2024', '2529', '3034', '3539', '4044', '4549', '5054', '5559', '6064', '6569', '7074', '7579', '80UP'];
  // one call, all pages (a page holds at most 20,000 rows)
  const page = async (path, n) => {
    const r = await fetch(`${API.worldBank}${path}${path.includes('?') ? '&' : '?'}format=json&per_page=20000&page=${n}`);
    if (!r.ok) throw new Error(`World Bank API ${r.status}`);
    const j = await r.json();
    if (!Array.isArray(j) || !Array.isArray(j[1])) throw new Error('World Bank API returned no data');
    return j;
  };
  const get = async (path) => {
    const [meta, rows] = await page(path, 1);
    const rest = await Promise.all(Array.from({ length: (meta.pages || 1) - 1 }, (_, i) => page(path, i + 2).then((j) => j[1])));
    return rows.concat(...rest);
  };
  const iso = (r) => r.countryiso3code || r.country.id;
  // newest non-empty value per country and indicator
  const latest = (rows) => {
    const m = new Map();
    for (const r of rows) {
      if (r.value == null) continue;
      const k = `${iso(r)}|${r.indicator.id}`, had = m.get(k);
      if (!had || +r.date > had.year) m.set(k, { year: +r.date, value: r.value });
    }
    return m;
  };
  // yearly series per country: { y0, v: [...] }, trailing gaps trimmed
  const series = (rows, digits) => {
    const by = new Map();
    for (const r of rows) {
      if (r.value == null) continue;
      if (!by.has(iso(r))) by.set(iso(r), new Map());
      by.get(iso(r)).set(+r.date, +r.value.toFixed(digits));
    }
    const out = new Map();
    for (const [k, ys] of by) {
      const yrs = [...ys.keys()], y0 = Math.min(...yrs), y1 = Math.max(...yrs);
      out.set(k, { y0, v: Array.from({ length: y1 - y0 + 1 }, (_, i) => ys.get(y0 + i) ?? null) });
    }
    return out;
  };
  async function load() {
    const year = new Date().getFullYear();
    const ageInds = AGES.flatMap((a) => [`SP.POP.${a}.FE`, `SP.POP.${a}.MA`]);
    const [countries, codes, ages, tfr, pop, vital] = await Promise.all([
      get('/country'),
      fetch(API.isoCodes).then((r) => { if (!r.ok) throw new Error(`ISO codes ${r.status}`); return r.json(); }),
      get(`/country/all/indicator/${ageInds.join(';')}?source=16&date=${year - 3}:${year}`),
      get(`/country/all/indicator/SP.DYN.TFRT.IN?date=1960:${year}`),
      get(`/country/all/indicator/SP.POP.TOTL?date=1960:${year}`),
      get(`/country/all/indicator/SP.DYN.LE00.FE.IN;SP.DYN.LE00.MA.IN;SP.DYN.IMRT.IN?source=2&date=${year - 10}:${year}`),
    ]);
    const num = new Map(codes.map(([, a3, n]) => [a3, n]));
    const L = latest([...ages, ...vital]), T = series(tfr, 3), P = series(pop, 0);
    const out = [];
    for (const c of countries) {
      const agg = c.region?.id === 'NA';
      if (agg && c.id !== 'WLD') continue;
      const v = (ind) => L.get(`${c.id}|${ind}`) || null;
      const grab = (sex) => {
        const vals = AGES.map((a) => v(`SP.POP.${a}.${sex}`));
        return vals.every(Boolean) ? vals.map((x) => Math.round(x.value)) : null;
      };
      out.push({
        iso3: c.id, num: num.get(c.id) ?? null, name: c.name, region: agg ? 'World' : c.region.value.trim(),
        income: agg ? '' : c.incomeLevel.value, lat: c.latitude ? +c.latitude : null, lon: c.longitude ? +c.longitude : null,
        ageYear: v('SP.POP.0004.FE')?.year ?? null, f: grab('FE'), m: grab('MA'),
        e0f: v('SP.DYN.LE00.FE.IN')?.value ?? null, e0m: v('SP.DYN.LE00.MA.IN')?.value ?? null, imr: v('SP.DYN.IMRT.IN')?.value ?? null,
        tfr: T.get(c.id) || null, pop: P.get(c.id) || null,
      });
    }
    return { capturedAt: Date.now(), source: API.worldBank, countries: out };
  }
  return { API, AGES, load };
})();
// </wb-data>

// ================= cohort model =================
// <cohort-model>
// Cohort-component projection in five-year steps for 17 age groups (0–4 … 80+) by sex, starting
// from a country's latest age structure. Closed population: no migration. Fertility and
// mortality are held at one level forever, so this shows where a rate leads, not a forecast.
// Mortality: a Gompertz curve (plus a child term from infant mortality) whose level is solved to
// match each sex's life expectancy. Fertility: a fixed age pattern over 15–49 scaled to the TFR.
const COHORT = (() => {
  const NG = 17, STEP = 5, SRB = 1.05, MAX_YEARS = 20000, GROW_YEARS = 300;
  // share of lifetime births by mother's age group (15–19 … 45–49)
  const FERT = [0, 0, 0, 0.045, 0.19, 0.3, 0.27, 0.145, 0.04, 0.01, 0, 0, 0, 0, 0, 0, 0];
  function lifeTable(e0, q0) {
    const X = 121, GB = 0.09, MAK = 0.0002;
    const make = (a) => {
      const l = new Float64Array(X + 1); l[0] = 1;
      for (let x = 0; x < X; x++) {
        const mu = MAK + a * Math.exp(GB * x) + (x >= 1 && x < 15 ? 0.1 * q0 * Math.exp(-0.45 * (x - 1)) : 0);
        l[x + 1] = l[x] * (x === 0 ? 1 - q0 : Math.exp(-mu));
      }
      const L = new Float64Array(X);
      let e = 0;
      for (let x = 0; x < X; x++) { L[x] = x === 0 ? l[1] + 0.15 * (l[0] - l[1]) : (l[x] + l[x + 1]) / 2; e += L[x]; }
      return { L, e };
    };
    let lo = Math.log(1e-9), hi = Math.log(0.05);
    for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (make(Math.exp(mid)).e > e0) lo = mid; else hi = mid; }
    const { L, e } = make(Math.exp((lo + hi) / 2));
    const L5 = new Float64Array(NG);
    for (let x = 0; x < X; x++) L5[Math.min(16, Math.floor(x / 5))] += L[x];
    const S = new Float64Array(16);
    for (let g = 0; g < 15; g++) S[g] = L5[g + 1] / L5[g];
    S[15] = L5[16] / (L5[15] + L5[16]);                 // 75–79 and 80+ both feed 80+
    return { L5, S, sb: L5[0] / 5, e0: e };
  }
  const tables = new WeakMap();
  const prep = (c) => {
    if (!tables.has(c)) {
      const q0 = Math.min(0.2, Math.max(0.001, (c.imr ?? 10) / 1000));
      tables.set(c, { f: lifeTable(c.e0f, q0 * 0.9), m: lifeTable(c.e0m, q0 * 1.1) });
    }
    return tables.get(c);
  };
  const usable = (c) => !!(c.f && c.m && c.e0f && c.e0m && c.ageYear);
  // net reproduction rate: daughters per woman at this TFR and today's mortality
  const nrr = (c, tfr) => { const { f } = prep(c); let s = 0; for (let g = 0; g < NG; g++) s += (tfr * FERT[g] / 5) * f.L5[g]; return s / (1 + SRB); };
  const age = (P, S) => {
    const n = new Float64Array(NG);
    for (let g = 0; g < 15; g++) n[g + 1] = P[g] * S[g];
    n[16] = (P[15] + P[16]) * S[15];
    return n;
  };
  // Runs until the expected population is below one person, MAX_YEARS pass, or (for a rate at or
  // above replacement) GROW_YEARS pass. keepAges keeps every step's age structure.
  function project(c, tfr, keepAges = false) {
    const { f: lf, m: lm } = prep(c), r = nrr(c, tfr), grows = r >= 1;
    const asfr = FERT.map((s) => tfr * s / 5), limit = (grows ? GROW_YEARS : MAX_YEARS) / STEP;
    let F = Float64Array.from(c.f), M = Float64Array.from(c.m);
    const sum = (a) => a.reduce((s, v) => s + v, 0);
    const totals = [sum(F) + sum(M)], ages = keepAges ? [{ f: F, m: M }] : null;
    for (let t = 1; t <= limit; t++) {
      const nF = age(F, lf.S), nM = age(M, lm.S);
      let births = 0;
      for (let g = 3; g < 10; g++) births += STEP * asfr[g] * (F[g] + nF[g]) / 2;
      nF[0] = births / (1 + SRB) * lf.sb; nM[0] = births * SRB / (1 + SRB) * lm.sb;
      F = nF; M = nM;
      const tot = sum(F) + sum(M);
      totals.push(tot); if (ages) ages.push({ f: F, m: M });
      if (tot < 1) break;
    }
    return { y0: c.ageYear, step: STEP, totals, ages, nrr: r, grows };
  }
  // first (fractional) year the projection falls to `level`, log-interpolated between steps
  const crossing = (p, level) => {
    const t = p.totals;
    if (t[0] <= level) return null;
    for (let i = 1; i < t.length; i++) {
      if (t[i] <= level) {
        const frac = Math.log(t[i - 1] / level) / Math.log(t[i - 1] / Math.max(t[i], 1e-9));
        return p.y0 + p.step * (i - 1 + frac);
      }
    }
    return null;
  };
  function summarize(c, tfr, keepAges = false) {
    const p = project(c, tfr, keepAges), t = p.totals;
    const pk = t.indexOf(Math.max(...t)), p0 = t[0];
    return {
      ...p, tfr, p0, replacement: tfr / p.nrr,
      peak: { year: p.y0 + pk * p.step, pop: t[pk] },
      half: crossing(p, p0 / 2), million: p0 > 2e6 ? crossing(p, 1e6) : null,
      thousand: crossing(p, 1000), end: crossing(p, 1),
    };
  }
  return { NG, STEP, MAX_YEARS, GROW_YEARS, usable, nrr, summarize };
})();
// </cohort-model>

// ================= helpers =================
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const B = { paper: '#15171b', raise: '#1d2026', muted: '#23262d', line: '#2b2f37', ink: '#e4e1d8', ink2: '#b8b5ac', fog: '#8b9099', signal: '#1fefd7', amber: '#f6c453', pink: '#e58fb0', sky: '#7cc4dc' };
let toastTimer;
const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200); };
const kpi = (label, value, sub = '') => `<div class="min-w-0 rounded-lg border bg-background/40 px-2.5 py-2"><div class="truncate text-[11px] text-muted-foreground">${esc(label)}</div><div class="truncate font-mono text-sm font-semibold">${value}</div>${sub ? `<div class="truncate text-[11px] text-muted-foreground">${sub}</div>` : ''}</div>`;

// Countries are real geometry on the sphere (not a painted texture), so borders stay sharp at any
// zoom: each polygon is triangulated in lon/lat, split until no edge is longer than 2°, then
// wrapped onto the sphere just above an opaque ocean, with slight transparency.

    else { const d = c.clone().lerp(a, 0.5); split(a, b, d, depth + 1); split(d, b, c, depth + 1); }

  cap.innerHTML = `${esc(c.name)} · <span class="font-mono">${year}</span> · <span class="font-mono">${tot >= 1 ? fmt.pop(tot) : 'nobody left'}</span>`;
  el.appendChild(cap);

// ---------- ranking: countdown walls, soonest end first ----------

// the panel list after its filter; the walls show the first WALLS of it

    + '<div class="text-[11px]">Height: projected population (log scale)</div><div class="text-[11px]">Length: from today to the last person</div>'
    + `<div class="mt-1.5 mb-1 text-[11px]">Colour: fertility rate</div><div class="h-2 w-48 rounded-full" style="background:${ramp([0.7, 1.05, 1.4, 1.75, 2.09].map(tfrColor))}"></div><div class="mt-0.5 flex w-48 justify-between font-mono text-[10px]"><span>0.7</span><span>2.1</span></div>`

      ${kpi('Last person', s.grows ? 'Never' : s.end == null ? `>${fmt.int(COHORT.MAX_YEARS)}y` : fmt.year(s.end), s.grows ? 'at or above replacement' : s.end == null ? '' : `in ${fmt.int(Math.round(s.end - s.y0))} years`)}
    </div>
    ${section('Milestones at this rate', `<div class="divide-y rounded-lg border bg-background/40 text-xs">${ms.map(([k, v]) => `<div class="flex justify-between gap-3 px-2.5 py-1.5"><span class="text-muted-foreground">${k}</span><span class="text-right font-mono">${esc(v)}</span></div>`).join('')}</div>`, 'fi-rr-hourglass-end')}`;
}
// total population: history from the World Bank, then the projection (log scale)
function chartHtml() {
  const c = country(state.sel), s = sumOf(state.sel);
  const hist = c.pop ? c.pop.v.map((v, i) => [c.pop.y0 + i, v]).filter((d) => d[1]) : [];
  const proj = s.totals.map((v, i) => [s.y0 + i * s.step, Math.max(v, 1)]);
  const base = state.override[c.iso3] != null ? COHORT.summarize(c, realTfr(c)) : null;
  const baseLine = base ? base.totals.map((v, i) => [base.y0 + i * base.step, Math.max(v, 1)]) : [];
  const W = 328, H = 170, m = { l: 34, r: 8, t: 8, b: 18 };
  const xMax = Math.max(proj.at(-1)[0], baseLine.at(-1)?.[0] ?? 0);
  const x = d3.scaleLinear().domain([hist[0]?.[0] ?? s.y0, xMax]).range([m.l, W - m.r]);
  const yMax = d3.max([...hist, ...proj, ...baseLine], (d) => d[1]);
  const y = d3.scaleLog().domain([1, yMax * 1.3]).range([H - m.b, m.t]);
  const line = d3.line().x((d) => x(d[0])).y((d) => y(d[1]));
  const yt = [1, 1e3, 1e6, 1e9].filter((v) => v < yMax * 1.3);
  const xt = x.ticks(4);
  const dot = (yr, lv, t) => (yr == null ? '' : `<circle cx="${x(yr)}" cy="${y(Math.max(lv, 1))}" r="3" fill="${B.amber}" stroke="${B.paper}"><title>${t} · ${fmt.year(yr)}</title></circle>`);
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" role="img" aria-label="Population of ${esc(c.name)}: history and projection">
    ${yt.map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${B.line}"/><text x="${m.l - 4}" y="${y(v) + 3}" text-anchor="end" fill="${B.fog}" font-size="9" font-family="Source Code Pro">${fmt.pop(v)}</text>`).join('')}
    ${xt.map((v) => `<text x="${x(v)}" y="${H - 4}" text-anchor="middle" fill="${B.fog}" font-size="9" font-family="Source Code Pro">${fmt.year(v)}</text>`).join('')}
    ${baseLine.length ? `<path d="${line(baseLine)}" fill="none" stroke="${B.fog}" stroke-width="1.2" stroke-dasharray="3 3"/>` : ''}
    <path d="${line(proj)}" fill="none" stroke="${B.amber}" stroke-width="1.8"/>
    ${hist.length ? `<path d="${line(hist)}" fill="none" stroke="${B.ink}" stroke-width="2"/>` : ''}
    ${dot(s.half, s.p0 / 2, 'Half of today')}${dot(s.million, 1e6, 'Below 1 million')}${dot(s.thousand, 1e3, 'Below 1,000')}${dot(s.end, 1, 'Last person')}
  </svg>
  <div class="mt-1 flex flex-wrap gap-x-3 text-[11px] text-muted-foreground"><span><span class="mr-1 inline-block h-0.5 w-3 align-middle" style="background:${B.ink}"></span>Recorded</span><span><span class="mr-1 inline-block h-0.5 w-3 align-middle" style="background:${B.amber}"></span>Projected</span>${base ? '<span><span class="mr-1 inline-block w-3 border-t border-dashed align-middle" style="border-color:#8b9099"></span>At the actual rate</span>' : ''}</div>`;
}
function refreshCountry() {
  const c = country(state.sel), s = sumOf(state.sel);
  $('#tfr-val').textContent = fmt.tfr(tfrOf(c));
  $('#tfr-reset').classList.toggle('invisible', state.override[c.iso3] == null);
  $('#cc-stats').innerHTML = statsHtml();
  const ch = $('#cc-chart'); if (ch) ch.innerHTML = chartHtml();
  const rk = $('#rank-list'); if (rk) rk.innerHTML = rankRows();
  return s;
}
function rankRows() {
  const q = state.q.trim().toLowerCase();
  return rankOrder().map((c, i) => ({ c, i })).filter(({ c }) => !q || c.name.toLowerCase().includes(q)).map(({ c, i }) => {
    const s = sumOf(c.iso3), on = c.iso3 === state.sel;
    return `<button type="button" data-iso="${c.iso3}" class="grid w-full grid-cols-[2rem_1fr_3rem_4.5rem] items-center gap-1 px-2 py-1 text-left text-xs hover:bg-accent ${on ? 'bg-accent text-primary' : ''}"><span class="font-mono text-muted-foreground">${i + 1}</span><span class="truncate">${esc(c.name)}</span><span class="text-right font-mono"><span class="mr-1 inline-block size-2 rounded-sm" style="background:${tfrColor(tfrOf(c))}"></span>${fmt.tfr(tfrOf(c))}</span><span class="text-right font-mono">${esc(endText(s, true))}</span></button>`;
  }).join('');
}
function dataSection() {
  const d = data(), synced = state.mode === 'synced' && state.synced;
  const link = (act, t) => `<button type="button" data-act="${act}" class="underline underline-offset-2 hover:text-foreground">${t}</button>`;
  const parts = [synced ? `Synced from the World Bank on ${esc(fmt.when(d.capturedAt))}, kept in this browser` : `Bundled snapshot from ${esc(fmt.when(d.capturedAt))}`];
  if (synced) parts.push(link('use-snapshot', 'Use snapshot'));
  else if (state.synced) parts.push(link('use-synced', 'Use synced data'));
  if (state.synced) parts.push(link('clear', 'Clear stored data'));
  return section('Data', `<p class="text-xs leading-relaxed text-muted-foreground">World Bank <a class="underline underline-offset-2 hover:text-foreground" href="https://data.worldbank.org/indicator/SP.DYN.TFRT.IN" target="_blank" rel="noopener">World Development Indicators</a>: population by five-year age group and sex, fertility rate, life expectancy by sex and infant mortality for ${state.list.length - 1} countries. ${parts.join(' · ')}.</p>`, 'fi-rr-database');
}
const modelSection = () => section('How the projection works', `<ul class="list-disc space-y-1 pl-4 text-xs leading-relaxed text-muted-foreground">
  <li>Starts from each country's ${state.world?.ageYear ?? ''} population by age and sex and steps forward five years at a time.</li>
  <li>The fertility rate stays where you set it, forever, with births spread over mothers aged 15–49.</li>
  <li>Deaths follow today's life expectancy and infant mortality (a Gompertz curve fitted to each), held fixed.</li>
  <li>No migration. It shows what births alone would do, which matters most for places like Singapore and the Gulf states.</li>
  <li>"Last person" is when the expected population drops below one. It is arithmetic on today's rates, not a forecast: rates change, and the model ignores that.</li>
</ul>`, 'fi-rr-info');

function renderPanel() {
  const c = country(state.sel);
  let body = '';
  if (state.view === 'globe') {
    body = `<h1 class="text-lg font-semibold leading-tight">How long at today's birth rates?</h1>
      <p class="mt-1 text-xs text-muted-foreground">Hold each country's fertility rate where it is today, with no migration, and project its population forward until nobody is left.</p>
      <div class="mt-3 flex items-center justify-between gap-2"><span class="text-xs text-muted-foreground">Colour the map by</span>${toggle('metric', [['tfr', 'Fertility rate'], ['end', 'Last person']], state.metric)}</div>
      ${countryCard()}
      ${section(`Rings around ${c.name}`, `<p class="text-xs leading-relaxed text-muted-foreground">On the globe: age bands inside, five-year groups in the middle, women and men outside. Pick a year to see the projection at the rate above.</p>
        <div class="mt-2 flex flex-wrap items-center justify-between gap-2">${toggle('ring', ringYears(sumOf(c.iso3).y0).map((y) => [String(y), String(y)]), String(ringYears(sumOf(c.iso3).y0).includes(state.ringYear) ? state.ringYear : sumOf(c.iso3).y0))}<button type="button" data-act="zoom-out" class="${btnCls}"><i class="fi fi-rr-globe"></i>Whole globe</button></div>`, 'fi-rr-chart-pie-alt')}
      ${section('Population', '<div id="cc-chart"></div>', 'fi-rr-chart-line-up')}`;
  } else if (state.view === 'trajectory') {
    body = `<h1 class="text-lg font-semibold leading-tight">${esc(c.name)}, generation by generation</h1>
      <p class="mt-1 text-xs text-muted-foreground">Each row is the population by age, five years apart, from today until the projection runs out. Low fertility first ages a country, then empties it.</p>
      <div class="mt-3 flex items-center justify-between gap-2"><span class="text-xs text-muted-foreground">Bar height</span>${toggle('scale', [['log', 'People (log)'], ['actual', 'People'], ['shape', 'Age shape']], state.scale)}</div>
      ${countryCard()}
      ${section('Population', '<div id="cc-chart"></div>', 'fi-rr-chart-line-up')}`;
  } else {
    const s = sumOf(state.sel);
    const shrinking = state.list.filter((x) => x.iso3 !== 'WLD' && !sumOf(x.iso3).grows).length;
    body = `<h1 class="text-lg font-semibold leading-tight">Which countries run out first</h1>
      <p class="mt-1 text-xs text-muted-foreground">${shrinking} of ${state.list.length - 1} countries have fertility below their replacement rate. Held there, each one ends. Each wall on the stage is a country's projected population, from today until the last person; they follow the first ${WALLS} rows of this list, so sort or filter it to compare others.</p>
      <div class="mt-3 rounded-lg border bg-background/40 p-2.5 text-xs"><div class="flex items-center justify-between gap-2"><span class="font-medium">${esc(c.name)}</span><span class="font-mono">${esc(endText(s))}</span></div>
        <div class="mt-2 flex gap-2"><button type="button" data-act="open-trajectory" class="${btnCls}"><i class="fi fi-rr-chart-line-up"></i>Trajectory</button><button type="button" data-act="open-globe" class="${btnCls}"><i class="fi fi-rr-globe"></i>On the globe</button></div></div>
      <div class="mt-3 flex items-center justify-between gap-2">${toggle('sort', [['end', 'Soonest'], ['tfr', 'Fertility'], ['pop', 'Population']], state.sort)}</div>
      <input id="rank-q" type="search" placeholder="Filter countries" value="${esc(state.q)}" class="mt-2 h-8 w-full rounded-md border border-input bg-background/60 px-2 text-xs placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring" />
      <div class="mt-2 grid grid-cols-[2rem_1fr_3rem_4.5rem] gap-1 px-2 text-[11px] text-muted-foreground"><span>#</span><span>Country</span><span class="text-right">TFR</span><span class="text-right">Last person</span></div>
      <div id="rank-list" class="mt-1 divide-y rounded-lg border bg-background/40"></div>`;
  }
  $('#panel').innerHTML = body + modelSection() + dataSection();
  if (state.view !== 'ranking') refreshCountry(); else $('#rank-list').innerHTML = rankRows();
}

// slider: recompute the chosen country only, redraw at most once a frame
let tfrRaf = 0;
$('#panel').addEventListener('input', (e) => {
  if (e.target.id === 'tfr') {
    state.override[state.sel] = +e.target.value;
    resum(state.sel); refreshCountry();
    cancelAnimationFrame(tfrRaf); tfrRaf = requestAnimationFrame(build);
  } else if (e.target.id === 'rank-q') { state.q = e.target.value; $('#rank-list').innerHTML = rankRows(); build(); }
});
$('#panel').addEventListener('change', (e) => { if (e.target.id === 'pick') select(e.target.value, { face: true }); });
$('#panel').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.metric) { state.metric = b.dataset.metric; build(); renderPanel(); }
  else if (b.dataset.scale) { state.scale = b.dataset.scale; build(); renderPanel(); }
  else if (b.dataset.sort) { state.sort = b.dataset.sort; build(); renderPanel(); }
  else if (b.dataset.iso) select(b.dataset.iso);
  else if (b.dataset.act === 'reset-tfr') { delete state.override[state.sel]; resum(state.sel); build(); renderPanel(); }
  else if (b.dataset.act === 'open-trajectory') setView('trajectory');
  else if (b.dataset.act === 'open-globe') { setView('globe'); flyTo(state.sel); }
  else if (b.dataset.ring) { state.ringYear = +b.dataset.ring; build(); renderPanel(); }
  else if (b.dataset.act === 'zoom-out') flyToward(camera.position.clone().normalize(), 13.5);
  else if (b.dataset.act === 'use-snapshot') { state.mode = 'snapshot'; reload(); toast('Showing the bundled snapshot'); }
  else if (b.dataset.act === 'use-synced') { state.mode = 'synced'; reload(); toast('Showing the data synced to this browser'); }
  else if (b.dataset.act === 'clear') { store.del('wb'); state.synced = null; state.mode = 'snapshot'; reload(); toast('Cleared the data stored in this browser'); }
});
const reload = () => { loadData(); build(); renderPanel(); };

const renderTabs = () => {
  $('#tabs').innerHTML = Object.entries(VIEWS).map(([k, v]) => `<button role="tab" data-tab="${k}" aria-label="${v.name}" aria-selected="${k === state.view}" data-state="${k === state.view ? 'active' : ''}" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all hover:text-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring data-[state=active]:bg-background data-[state=active]:text-foreground data-[state=active]:shadow"><i class="fi ${v.icon}"></i><span class="hidden sm:inline">${v.name}</span></button>`).join('');
};
const setView = (v) => { state.view = v; renderTabs(); build(); renderPanel(); };
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) setView(b.dataset.tab); });

// Go live: load the latest World Bank figures and keep them in this browser
let syncing = false;
$('#action').addEventListener('click', async () => {
  if (syncing) return;
  syncing = true; $('#action').disabled = true; $('#action span').textContent = 'Syncing…';
  try {
    const d = await WB_DATA.load();
    if (d.countries.filter(COHORT.usable).length < 100) throw new Error('too few countries came back');
    state.synced = d; state.mode = 'synced';
    const kept = await store.put('wb', d);
    reload();
    toast(kept ? 'Synced the latest World Bank data and kept it in this browser' : 'Synced, but this browser would not store it');
  } catch (err) {
    toast(`Couldn’t reach the World Bank API (${err.message}). Still showing the ${state.mode === 'synced' ? 'synced data' : 'snapshot'}.`);
  } finally { syncing = false; $('#action').disabled = false; $('#action span').textContent = 'Go live'; }
});

// ================= pointer: hover tips and click to select =================
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null, hoverRaf = 0;
const hitAt = (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  return pickables.length ? ray.intersectObjects(pickables, false)[0] : null;
};
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) { down = null; return; }
  down = null; const hit = hitAt(e); if (hit && onPick) onPick(hit);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  cancelAnimationFrame(hoverRaf);
  hoverRaf = requestAnimationFrame(() => {
    const hit = e.buttons ? null : hitAt(e), tip = $('#tip');
    onHoverMove?.(hit);
    const html = hit && onHover ? onHover(hit) : null;
    if (!html) { tip.hidden = true; renderer.domElement.style.cursor = ''; return; }
    tip.innerHTML = html; tip.hidden = false;
    tip.style.left = `${Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)}px`;
    tip.style.top = `${Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8)}px`;
    renderer.domElement.style.cursor = onPick ? 'pointer' : '';
  });
});
renderer.domElement.addEventListener('pointerleave', () => { $('#tip').hidden = true; onHoverMove?.(null); });

renderer.setAnimationLoop(() => {
  stepFlight(); controls.update(); frameTick?.();
  renderer.render(scene, camera); labelR.render(scene, camera);
});

(async () => {
  resize(); renderTabs();
  $('#panel').innerHTML = '<p class="text-sm text-muted-foreground">Loading…</p>';
  try {
    const [snap, kept] = await Promise.all([
      fetch('data/world-fertility.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      store.get('wb'),
    ]);
    state.snapshot = snap;
    if (kept?.countries) { state.synced = kept; state.mode = 'synced'; }
  } catch {
    $('#panel').innerHTML = '<p class="text-sm">Couldn’t load the snapshot data. Try Go live.</p>';
    return;
  }
  loadData(); build(); renderPanel();
  // country shapes for the globe (world-atlas, Natural Earth 1:50m, which keeps small states like Singapore)
  try {
    const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json')).json();
    world = { topo, features: topojson.feature(topo, topo.objects.countries).features, lines: topojson.mesh(topo, topo.objects.countries) };
    if (state.view === 'globe') build();
  } catch { toast('Couldn’t load country shapes; the globe shows capitals only'); }
})();
</script>
</body>
</html>
