<head>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f172a; --bg-card: #1e293b; --bg-hover: #334155;
  --border: #334155; --text: #f1f5f9; --text-muted: #94a3b8;
  --green: #22c55e; --red: #ef4444; --accent: #6366f1;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
  min-height: 100vh;
}
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(15,23,42,.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); padding: 1rem 1.5rem;
}
.header-inner {
  max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem;
}
header h1 { font-size: 1.25rem; font-weight: 700; }
header .sub { color: var(--text-muted); font-size: .875rem; }
.controls { display: flex; gap: .5rem; align-items: center; }
.search-input {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); padding: .375rem .75rem; font-size: .875rem; width: 200px;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.filter-btn {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-muted); padding: .375rem .75rem; font-size: .75rem; cursor: pointer; transition: .15s;
}
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.filter-btn:hover { background: var(--bg-hover); }
.container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
.summary-bar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1rem; margin-bottom: 1.5rem;
}
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  padding: 1rem; text-align: center;
}
.stat-card .label { font-size: .75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
.stat-card .value { font-size: 1.5rem; font-weight: 700; margin-top: .25rem; }
.stat-card .value.green { color: var(--green); }
.stat-card .value.red { color: var(--red); }
.stat-card .sub { font-size: .75rem; color: var(--text-muted); margin-top: .125rem; }
.chart-row { margin-bottom: 1.5rem; }
.chart-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem;
}
.chart-card h2 { font-size: .875rem; font-weight: 600; margin-bottom: .75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
.chart-wrap { position: relative; width: 100%; max-height: 400px; }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 1rem;
}
.card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  overflow: hidden; transition: border-color .15s;
}
.card:hover { border-color: var(--accent); }
.card-header {
  padding: .875rem 1rem; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.card-header .ticker {
  font-size: 1.125rem; font-weight: 700;
}
.card-header .change { font-size: .875rem; font-weight: 600; }
.card-body { padding: 1rem; }
.stat-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: .25rem 0; font-size: .875rem;
}
.stat-row .label { color: var(--text-muted); }
.grade-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 2rem; height: 2rem; border-radius: 9999px; font-size: .75rem; font-weight: 700;
}
.grade-A, .grade-A- { background: #14532d; color: #4ade80; }
.grade-B, .grade-B-, .grade-B-\\+ { background: #422006; color: #facc15; }
.grade-C, .grade-C-, .grade-C\\+ { background: #451a03; color: #fb923c; }
.grade-D, .grade-D\\+, .grade-D- { background: #450a0a; color: #f87171; }
.grade-F { background: #450a0a; color: #ef4444; }
.mini-chart { margin-top: .75rem; height: 60px; }
.weekly-dates { font-size: .75rem; color: var(--text-muted); margin-bottom: 1rem; }
.card-notes { font-size: .8125rem; color: var(--text-muted); margin-top: .75rem; line-height: 1.6; }
.missing-badge {
  display: inline-flex; align-items: center; gap: .25rem;
  background: #1e293b; border: 1px dashed #475569; border-radius: 6px;
  padding: .25rem .5rem; font-size: .75rem; color: var(--text-muted);
}
@media (max-width: 640px) {
  .grid { grid-template-columns: 1fr; }
  .summary-bar { grid-template-columns: repeat(2, 1fr); }
  header h1 { font-size: 1rem; }
  .search-input { width: 140px; }
}
</style>

function gradeClass(g) {
  const m = g.replace("+", "\\+");
  for (const [prefix, cls] of [["A","grade-A"], ["B","grade-B"], ["C","grade-C"], ["D","grade-D"], ["F","grade-F"]]) {
    if (g.startsWith(prefix)) return cls;
  }
  return "grade-F";
}

function renderSummaryBar() {
  const total = stocks.length;
  const green = stocks.filter(s => s.direction > 0).length;
  const red = stocks.filter(s => s.direction < 0).length;
  const flat = total - green - red;
  const avgReturn = stocks.reduce((a, s) => {
    const n = parseFloat(s.change);
    return a + n;
  }, 0) / total;
  const best = stocks.reduce((a, s) => Math.max(a, parseFloat(s.change)), -Infinity);
  const worst = stocks.reduce((a, s) => Math.min(a, parseFloat(s.change)), Infinity);
  const bestT = stocks.find(s => parseFloat(s.change) === best)?.ticker || "";
  const worstT = stocks.find(s => parseFloat(s.change) === worst)?.ticker || "";
  document.getElementById("summary-bar").innerHTML = `
    <div class="stat-card"><div class="label">Tracked</div><div class="value">${total}</div></div>
    <div class="stat-card"><div class="label">Green</div><div class="value green">${green}</div></div>
    <div class="stat-card"><div class="label">Red</div><div class="value red">${red}</div></div>
    <div class="stat-card"><div class="label">Flat</div><div class="value">${flat}</div></div>
    <div class="stat-card"><div class="label">Avg Return</div><div class="value ${avgReturn >= 0 ? 'green' : 'red'}">${avgReturn >= 0 ? '+' : ''}${avgReturn.toFixed(2)}%</div></div>
    <div class="stat-card"><div class="label">Best</div><div class="value green">+${best.toFixed(2)}%</div><div class="sub">${bestT}</div></div>
    <div class="stat-card"><div class="label">Worst</div><div class="value red">${worst.toFixed(2)}%</div><div class="sub">${worstT}</div></div>
  `;
}

function renderCards(filter) {
  const grid = document.getElementById("card-grid");
  let html = "";
  const filtered = filter === "all" ? stocks : stocks.filter(s => filter === "green" ? s.direction > 0 : s.direction < 0);
  for (const s of filtered) {
    const isGreen = s.direction > 0;
    const chgClass = isGreen ? "green" : "red";
    html += `<div class="card" data-ticker="${s.ticker.toLowerCase()}">
      <div class="card-header">
        <div class="ticker">${s.ticker} <span style="font-weight:400;font-size:.8125rem;color:var(--text-muted)">${s.name}</span></div>
        <div class="change ${chgClass}">${s.change}</div>
      </div>
      <div class="card-body">
        <div class="weekly-dates">May 26 &ndash; May 29</div>
        <div class="stat-row"><span class="label">Open</span><span>$${s.open.toFixed(2)}</span></div>
        <div class="stat-row"><span class="label">Close</span><span>$${s.close.toFixed(2)}</span></div>
        <div class="stat-row"><span class="label">Net Chg</span><span class="${chgClass}">${(s.close - s.open) >= 0 ? '+' : ''}$${(s.close - s.open).toFixed(2)}</span></div>
        <div class="stat-row" style="border-top:1px solid var(--border);padding-top:.5rem;margin-top:.25rem">
          <span class="label">Grade</span>
          <span class="grade-badge ${gradeClass(s.grade)}">${s.grade}</span>
        </div>
        <div class="mini-chart"><canvas id="mini-${s.ticker}"></canvas></div>
        <div class="card-notes">${s.notes}</div>
      </div>
    </div>`;
  }

function renderCharts() {
  const sorted = [...stocks].sort((a, b) => parseFloat(a.change) - parseFloat(b.change));
  const tickers = sorted.map(s => s.ticker);
  const returns = sorted.map(s => parseFloat(s.change));

    type: "bar",

      datasets: [{
        label: "Weekly Return %",
        data: returns,
        backgroundColor: returns.map(v => v >= 0 ? "rgba(34,197,94,.7)" : "rgba(239,68,68,.7)"),
        borderColor: returns.map(v => v >= 0 ? "#22c55e" : "#ef4444"),

        borderRadius: 4,

    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      onHover: (e, el) => e.native.target.style.cursor = el.length ? "pointer" : "default",
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#1e293b",
          titleColor: "#f1f5f9",
          bodyColor: "#22c55e",
          borderColor: "#334155",

          callbacks: {

          }
        }
      },
      scales: {
        x: {
          ticks: { color: "#94a3b8", font: { size: 11 } },
          grid: { color: "rgba(51,65,85,.5)" }
        },
        y: {
          ticks: { color: "#94a3b8", callback: v => v + "%" },
          grid: { color: "rgba(51,65,85,.5)" },
          beginAtZero: true
        }
      }
    }
  });

  const priceCtx = document.getElementById("priceLevelChart");
  let priceTooltipEl = document.getElementById("price-tooltip");
  if (!priceTooltipEl) {
    priceTooltipEl = document.createElement("div");
    priceTooltipEl.id = "price-tooltip";
    priceTooltipEl.style.cssText = "position:fixed;display:none;background:#1e293b;border:1px solid #334155;border-radius:6px;padding:8px 12px;font-size:.8125rem;pointer-events:none;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.4)";
    document.body.appendChild(priceTooltipEl);
  }
  new Chart(priceCtx, {
    type: "bar",
    data: {
      labels: stocks.map(s => s.ticker),
      datasets: [
        {
          label: "Open",

          hoverBackgroundColor: "rgba(99,102,241,.9)"
        },
        {
          label: "Close",
          data: stocks.map(s => s.close),
          backgroundColor: "rgba(34,197,94,.6)",
          borderRadius: 4,
          hoverBackgroundColor: "rgba(34,197,94,.9)"
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      onHover: (e, el) => e.native.target.style.cursor = el.length ? "pointer" : "default",
      plugins: {
        legend: {
          labels: { color: "#94a3b8", font: { size: 11 } }
        },
        tooltip: {
          enabled: true,
          backgroundColor: "#1e293b",
          titleColor: "#f1f5f9",
          bodyColor: "#94a3b8",
          borderColor: "#334155",
          borderWidth: 1,
          padding: 10,
          cornerRadius: 6,
          callbacks: {
            label: ctx => `${ctx.dataset.label}: $${ctx.parsed.y.toFixed(2)}`
          }
        }
      },
      scales: {
        x: {
          ticks: { color: "#94a3b8", font: { size: 10 } },
          grid: { color: "rgba(51,65,85,.5)" }
        },
        y: {
          ticks: { color: "#94a3b8", callback: v => "$" + v.toFixed(0) },
          grid: { color: "rgba(51,65,85,.5)" }
        }
      }
    }
  });

  const gradeCount = {};
  for (const s of stocks) {
    const base = s.grade[0];
    gradeCount[base] = (gradeCount[base] || 0) + 1;
  }

  new Chart(document.getElementById("gradeChart"), {
    type: "doughnut",
    data: {
      labels: Object.keys(gradeCount).sort(),
      datasets: [{
        data: Object.keys(gradeCount).sort().map(k => gradeCount[k]),
        backgroundColor: ["#4ade80","#facc15","#fb923c","#f87171","#ef4444"],
        borderWidth: 0,
        hoverOffset: 12
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: "right",
          labels: { color: "#94a3b8", font: { size: 12 }, padding: 12 }
        },
        tooltip: {
          backgroundColor: "#1e293b",
          titleColor: "#f1f5f9",
          bodyColor: "#94a3b8",
          borderColor: "#334155",
          borderWidth: 1,
          padding: 10,
          cornerRadius: 6,
          callbacks: {
            label: ctx => `${ctx.label}: ${ctx.parsed} stock${ctx.parsed !== 1 ? "s" : ""}`
          }
        }
      }
    }
  });
}

function renderMiniCharts() {
  for (const s of stocks) {
    const canvas = document.getElementById("mini-" + s.ticker);
    if (!canvas) continue;
    const ctx = canvas.getContext("2d");
    const prices = s.daily.map((v, i) => {
      const match = v.match(/[\d.]+/);
      return match ? parseFloat(match[0]) : 0;
    });
    const minPrice = Math.min(...prices);
    const maxPrice = Math.max(...prices);
    const range = maxPrice - minPrice || 1;
    new Chart(ctx, {
      type: "line",
      data: {
        labels: s.dailyLabels,
        datasets: [{
          data: prices,
          borderColor: s.direction > 0 ? "#22c55e" : "#ef4444",
          backgroundColor: "transparent",
          borderWidth: 2,
          pointRadius: 0,
          tension: .3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        onHover: (e, el) => e.native.target.style.cursor = el.length ? "pointer" : "default",
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: true,
            backgroundColor: "#1e293b",
            titleColor: "#f1f5f9",
            bodyColor: s.direction > 0 ? "#22c55e" : "#ef4444",
            borderColor: "#334155",
            borderWidth: 1,
            padding: 8,
            cornerRadius: 6,
            displayColors: false,
            callbacks: {
              title: items => items[0].label,
              label: ctx => {
                const idx = ctx.dataIndex;
                const op = parseFloat(s.daily[idx].replace("$", ""));
                const chg = (op - prices[0]).toFixed(2);
                return `$${op.toFixed(2)}  (${chg >= 0 ? "+" : ""}$${chg})`;
              }
            }
          }
        },
        scales: {
          x: { display: false },
          y: { display: false, min: minPrice - range * 0.15, max: maxPrice + range * 0.15 }
        }
      }
    });
  }
}

function filterCards(v) {
  const q = v.toLowerCase();
  document.querySelectorAll(".card").forEach(el => {
    const t = el.dataset.ticker || "";
    el.style.display = t.includes(q) ? "" : "none";
  });
}

let currentFilter = "all";
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === f));
  renderCards(f);
  setTimeout(renderMiniCharts, 100);
}
