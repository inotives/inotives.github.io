name: Build and Deploy

on:
  push:
    branches: [master]
    paths:
      - 'content/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
  # Weekdays after the US close (21:00 UTC in winter, 20:00 in summer): refreshes the
  # stock-signals snapshot, since the page can't call Yahoo from github.io (no CORS).
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fresh daily bars for the stock-signals mock. Goes into the deployed build only; if
      # Yahoo refuses the runner, the committed snapshot ships instead.
      - name: Refresh stock-signals snapshot
        run: npm run stocks
        continue-on-error: true

      - run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
