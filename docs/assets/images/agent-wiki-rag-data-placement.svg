<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Data placement across the agent wiki, RAG, and GraphRAG</title>
  <desc id="desc">A dark diagram mapping the previous agent wiki folders to canonical wiki pages, vector retrieval, and graph relationships.</desc>
  <defs><style>.bg{fill:#0b1220}.folder{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.vector{fill:#17263b;stroke:#587692;stroke-width:2}.graph{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.text{fill:#e7eef6;font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.branch{stroke:#667d96;stroke-width:3;fill:none}</style></defs>
  <rect class="bg" width="1600" height="860"/><text class="text" x="65" y="68" font-size="36" font-weight="700">Place knowledge by how it will be used</text><text class="small" x="65" y="103">A page can contribute to both retrieval views, but the views should preserve the page as their source.</text>
  <rect class="folder" x="65" y="170" width="390" height="565" rx="22"/><text class="label" x="105" y="215">WIKI FOLDERS</text><text class="text" x="105" y="265">knowledge/</text><text class="small" x="140" y="310">domains/</text><text class="small" x="140" y="350">projects/</text><text class="small" x="140" y="390">decisions/</text><text class="small" x="140" y="430">runbooks/</text><text class="small" x="140" y="470">glossary/</text><text class="small" x="140" y="510">shared-rules/</text><text class="small" x="105" y="580">canonical prose</text><text class="small" x="105" y="615">ownership and lifecycle</text><text class="small" x="105" y="650">source and review context</text>
  <path class="branch" d="M455 300 L570 300 M455 560 L570 560"/>
  <rect class="vector" x="570" y="170" width="430" height="265" rx="20"/><text class="label" x="610" y="215">RAG / VECTOR SEARCH</text><text class="text" x="610" y="260">Chunk the explanatory text</text><text class="small" x="610" y="310">definitions and examples</text><text class="small" x="610" y="345">runbook steps and FAQs</text><text class="small" x="610" y="380">policy passages and summaries</text><text class="small" x="610" y="415">metadata keeps scope and status</text>
  <rect class="graph" x="570" y="500" width="430" height="235" rx="20"/><text class="label" x="610" y="545">GRAPHRAG / GRAPH SEARCH</text><text class="text" x="610" y="590">Extract stable relationships</text><text class="small" x="610" y="635">team owns domain</text><text class="small" x="610" y="670">decision constrains system</text><text class="small" x="610" y="705">policy supersedes policy</text>
  <rect class="vector" x="1090" y="170" width="430" height="265" rx="20"/><text class="label" x="1130" y="215">GOOD VECTOR TARGET</text><text class="text" x="1130" y="260">“What does this rule say?”</text><text class="small" x="1130" y="315">specific facts and text fragments</text><text class="small" x="1130" y="350">supporting paragraphs</text><text class="small" x="1130" y="385">source-page citations</text>
  <rect class="graph" x="1090" y="500" width="430" height="235" rx="20"/><text class="label" x="1130" y="545">GOOD GRAPH TARGET</text><text class="text" x="1130" y="590">“What connects to this?”</text><text class="small" x="1130" y="645">ownership and dependencies</text><text class="small" x="1130" y="680">decision and policy history</text><text class="small" x="1130" y="715">multi-hop context</text>
</svg>
