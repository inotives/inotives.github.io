<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid RAG and GraphRAG query sequence</title>
  <desc id="desc">A dark sequence diagram showing an agent using graph search to find connected entities, vector search to retrieve supporting passages, then answering with canonical wiki citations.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.agent{fill:#332b1d;stroke:#e2b866;stroke-width:2}.graph{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.vector{fill:#17263b;stroke:#587692;stroke-width:2}.wiki{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.text{fill:#e7eef6;font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.purple{stroke:#ba79c7;stroke-width:3;fill:none;marker-end:url(#arrow)}.yellow{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="820"/><text class="text" x="65" y="68" font-size="36" font-weight="700">A multi-hop question needs both views</text><text class="small" x="65" y="103">GraphRAG maps the neighborhood. RAG brings back the words that support the answer.</text>
  <rect class="agent" x="65" y="220" width="250" height="150" rx="16"/><text class="label" x="100" y="260">QUESTION</text><text class="text" x="100" y="305">Agent asks</text><text class="small" x="100" y="340">“What changed and who owns it?”</text>
  <rect class="agent" x="65" y="510" width="250" height="150" rx="16"/><text class="label" x="100" y="550">ROUTER</text><text class="text" x="100" y="595">Detect multi-hop</text><text class="small" x="100" y="630">relationship + evidence</text>
  <path class="line" d="M190 370 L190 510"/>
  <rect class="graph" x="470" y="180" width="300" height="180" rx="18"/><text class="label" x="510" y="225">GRAPH SEARCH</text><text class="text" x="510" y="270">Find connected nodes</text><text class="small" x="510" y="315">policy → decision → system</text>
  <rect class="graph" x="470" y="490" width="300" height="150" rx="18"/><text class="label" x="510" y="535">GRAPH RESULT</text><text class="text" x="510" y="580">Relevant neighborhood</text><text class="small" x="510" y="615">IDs and source-page links</text>
  <path class="purple" d="M315 585 L470 565"/><path class="purple" d="M620 360 L620 490"/>
  <rect class="vector" x="925" y="180" width="300" height="180" rx="18"/><text class="label" x="965" y="225">VECTOR SEARCH</text><text class="text" x="965" y="270">Fetch evidence</text><text class="small" x="965" y="315">relevant wiki passages</text>
  <rect class="wiki" x="925" y="490" width="300" height="150" rx="18"/><text class="label" x="965" y="535">CANONICAL WIKI</text><text class="text" x="965" y="580">Verify page state</text><text class="small" x="965" y="615">owner · status · review date</text>
  <path class="purple" d="M770 565 L925 270"/><path class="line" d="M1075 360 L1075 490"/>
  <rect class="wiki" x="1360" y="285" width="180" height="220" rx="18"/><text class="label" x="1390" y="330">ANSWER</text><text class="text" x="1390" y="375">Explain</text><text class="small" x="1390" y="420">relationship</text><text class="small" x="1390" y="455">supporting text</text><text class="small" x="1390" y="490">wiki citations</text>
  <path class="yellow" d="M1225 270 L1360 395"/><path class="line" d="M1225 565 L1360 430"/>
  <rect class="agent" x="470" y="700" width="755" height="55" rx="14"/><text class="small" x="505" y="735">If the question is only “what does this page say?”, skip the graph and call vector_search_tool directly.</text>
</svg>
