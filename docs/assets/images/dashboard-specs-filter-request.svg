<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Filters arrive as query string values and reach SQL only as bound parameters</title>
  <desc id="desc">A request for one card carries period and chain values in its query string. The API checks each value against the filter definitions in the spec, binds them as named parameters, runs the card in the viewer's table scope, and caches the result by run, version, card and values. A value outside the allowed list is refused.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <text x="47" y="56" fill="#f6f9fc" font-family="system-ui,sans-serif" font-size="28" font-weight="700">The viewer sends values, never SQL</text>
  <text x="47" y="85" fill="#a9bdd0" font-family="system-ui,sans-serif" font-size="16">The spec defines which filters exist and what they accept. The query string only picks values.</text>

  <rect x="43" y="116" width="1114" height="54" rx="12" fill="#0e1a28" stroke="#3a5672"/>
  <text x="66" y="150" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#c8dbee">GET /dashboards/stablecoin-flows/cards/net-flow<tspan fill="#53dfdc">?period=last_3_months</tspan><tspan fill="#e3ad5a">&amp;chain=tron</tspan></text>

  <g font-family="system-ui,sans-serif">
    <rect x="43" y="214" width="244" height="160" rx="16" fill="#263e5b" stroke="#75a8d5"/>
    <circle cx="79" cy="250" r="20" fill="#75a8d5"/><text x="73" y="257" fill="#132538" font-size="18" font-weight="700">1</text>
    <text x="64" y="300" fill="#fff" font-size="19" font-weight="700">Check</text>
    <text x="64" y="328" fill="#c8dbee" font-size="15">period is a known range;</text>
    <text x="64" y="350" fill="#c8dbee" font-size="15">chain is in the options</text>

    <rect x="327" y="214" width="244" height="160" rx="16" fill="#1d3d45" stroke="#53dfdc"/>
    <circle cx="363" cy="250" r="20" fill="#53dfdc"/><text x="357" y="257" fill="#10212b" font-size="18" font-weight="700">2</text>
    <text x="348" y="300" fill="#fff" font-size="19" font-weight="700">Bind</text>
    <text x="348" y="328" fill="#c1e5e5" font-size="14" font-family="ui-monospace,Menlo,monospace">$period_from, $period_to</text>
    <text x="348" y="350" fill="#c1e5e5" font-size="14" font-family="ui-monospace,Menlo,monospace">$chain = 'tron'</text>

    <rect x="611" y="214" width="244" height="160" rx="16" fill="#294a40" stroke="#71c69a"/>
    <circle cx="647" cy="250" r="20" fill="#71c69a"/><text x="641" y="257" fill="#143224" font-size="18" font-weight="700">3</text>
    <text x="632" y="300" fill="#fff" font-size="19" font-weight="700">Run in scope</text>
    <text x="632" y="328" fill="#c7ead6" font-size="15">Viewer's tables only,</text>
    <text x="632" y="350" fill="#c7ead6" font-size="15">read-only, time limit</text>

    <rect x="895" y="214" width="262" height="160" rx="16" fill="#3b2f52" stroke="#b49ce6"/>
    <circle cx="931" cy="250" r="20" fill="#b49ce6"/><text x="925" y="257" fill="#251b36" font-size="18" font-weight="700">4</text>
    <text x="916" y="300" fill="#fff" font-size="19" font-weight="700">Cache</text>
    <text x="916" y="328" fill="#ddd0f5" font-size="15">by run, spec version,</text>
    <text x="916" y="350" fill="#ddd0f5" font-size="15">card and values</text>

    <rect x="43" y="408" width="528" height="58" rx="12" fill="#4a2a30" stroke="#e07a7a"/>
    <text x="64" y="443" fill="#f4c4c4" font-size="15"><tspan font-family="ui-monospace,Menlo,monospace">chain=tron' or 1=1</tspan> is not an option: refused</text>
  </g>
  <g fill="none" stroke="#90adc2" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M165 170 V211"/>
    <path d="M287 294 H324"/>
    <path d="M571 294 H608"/>
    <path d="M855 294 H892"/>
  </g>
</svg>
