<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Ingestion pipeline for agent memory embeddings</title>
  <desc id="desc">Markdown, office documents, research, concepts, and entities are extracted, chunked, embedded, and stored with provenance in PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#151b30"/></linearGradient>
    <linearGradient id="source" x1="0" x2="1"><stop stop-color="#1e3a8a"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
    <linearGradient id="process" x1="0" x2="1"><stop stop-color="#0e7490"/><stop offset="1" stop-color="#155e75"/></linearGradient>
    <linearGradient id="store" x1="0" x2="1"><stop stop-color="#6b21a8"/><stop offset="1" stop-color="#581c87"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="68" y="68" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Turn source material into attributed chunks</text>
  <text x="68" y="102" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">Keep the readable content and source metadata beside the embedding.</text>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <rect x="55" y="165" width="235" height="390" rx="20" fill="#111827" stroke="#334155"/>
    <text x="172" y="207" fill="#f8fafc" font-size="20" font-weight="700">Sources</text>
    <rect x="82" y="230" width="180" height="48" rx="10" fill="url(#source)"/><text x="172" y="260" fill="#dbeafe" font-size="14">Markdown + wiki</text>
    <rect x="82" y="291" width="180" height="48" rx="10" fill="url(#source)"/><text x="172" y="321" fill="#dbeafe" font-size="14">PDF / DOCX</text>
    <rect x="82" y="352" width="180" height="48" rx="10" fill="url(#source)"/><text x="172" y="382" fill="#dbeafe" font-size="14">Research papers</text>
    <rect x="82" y="413" width="180" height="48" rx="10" fill="url(#source)"/><text x="172" y="443" fill="#dbeafe" font-size="14">Concepts / entities</text>
    <rect x="82" y="474" width="180" height="48" rx="10" fill="url(#source)"/><text x="172" y="504" fill="#dbeafe" font-size="14">Skills / procedures</text>
    <rect x="340" y="215" width="235" height="280" rx="20" fill="url(#process)" stroke="#67e8f9"/>
    <text x="457" y="260" fill="#ecfeff" font-size="20" font-weight="700">Extract + prepare</text>
    <text x="457" y="310" fill="#cffafe" font-size="14">parse text and tables</text>
    <text x="457" y="344" fill="#cffafe" font-size="14">preserve headings</text>
    <text x="457" y="378" fill="#cffafe" font-size="14">OCR scans if needed</text>
    <text x="457" y="412" fill="#cffafe" font-size="14">keep source locations</text>
    <text x="457" y="460" fill="#a5f3fc" font-size="14">clean text, retain meaning</text>
    <rect x="625" y="215" width="235" height="280" rx="20" fill="#164e63" stroke="#22d3ee"/>
    <text x="742" y="260" fill="#ecfeff" font-size="20" font-weight="700">Chunk + embed</text>
    <text x="742" y="310" fill="#cffafe" font-size="14">split by structure</text>
    <text x="742" y="344" fill="#cffafe" font-size="14">add heading context</text>
    <text x="742" y="378" fill="#cffafe" font-size="14">encode each chunk</text>
    <text x="742" y="412" fill="#cffafe" font-size="14">record model version</text>
    <text x="742" y="460" fill="#a5f3fc" font-size="14">vector + original text</text>
    <rect x="910" y="165" width="235" height="390" rx="20" fill="url(#store)" stroke="#d8b4fe"/>
    <text x="1027" y="207" fill="#faf5ff" font-size="20" font-weight="700">PostgreSQL</text>
    <rect x="937" y="230" width="180" height="48" rx="10" fill="#4c1d95"/><text x="1027" y="260" fill="#f3e8ff" font-size="14">text chunks</text>
    <rect x="937" y="291" width="180" height="48" rx="10" fill="#4c1d95"/><text x="1027" y="321" fill="#f3e8ff" font-size="14">embedding vectors</text>
    <rect x="937" y="352" width="180" height="48" rx="10" fill="#4c1d95"/><text x="1027" y="382" fill="#f3e8ff" font-size="14">source + version</text>
    <rect x="937" y="413" width="180" height="48" rx="10" fill="#4c1d95"/><text x="1027" y="443" fill="#f3e8ff" font-size="14">access metadata</text>
    <rect x="937" y="474" width="180" height="48" rx="10" fill="#4c1d95"/><text x="1027" y="504" fill="#f3e8ff" font-size="14">full-text + vector index</text>
  </g>
  <path d="M290 355H330M575 355H615M860 355H900" fill="none" stroke="#164e63" stroke-width="10" stroke-linecap="round"/>
  <path d="M290 355H330M575 355H615M860 355H900" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="340" y="585" width="520" height="50" rx="12" fill="#111827" stroke="#334155"/>
  <text x="600" y="616" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Update or delete vectors when their source version changes.</text>
</svg>
