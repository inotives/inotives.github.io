<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Orca coordinating role agents through OpenKnowledge</title>
  <desc id="desc">An animated dark diagram showing Orca assigning a task to role agents, each reading and writing OpenKnowledge, and returning a result to the owner.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.owner{fill:#332b1d;stroke:#e2b866;stroke-width:2}.orca{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.role{fill:#17263b;stroke:#587692;stroke-width:2}.memory{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.flow{stroke:#7ee0d1;stroke-width:4;fill:none;stroke-dasharray:12 14;animation:move 2.8s linear infinite}.text{fill:#e7eef6;font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}@keyframes move{to{stroke-dashoffset:-52}}</style></defs>
  <rect class="bg" width="1600" height="820"/><text class="text" x="65" y="68" font-size="36" font-weight="700">Orca coordinates; OpenKnowledge remembers</text><text class="small" x="65" y="103">The moving paths show task and memory flow. The wiki remains the durable shared context.</text>
  <rect class="owner" x="65" y="300" width="260" height="160" rx="18"/><text class="label" x="105" y="345">OWNER</text><text class="text" x="105" y="390">Business question</text><text class="small" x="105" y="430">priority and approval</text>
  <rect class="orca" x="500" y="210" width="360" height="270" rx="22"/><text class="label" x="545" y="255">ORCA FLEET</text><text class="text" x="545" y="305">Dispatch roles</text><text class="small" x="545" y="350">parallel agents</text><text class="small" x="545" y="385">status and results</text><text class="small" x="545" y="420">desktop or remote runtime</text>
  <rect class="role" x="1000" y="140" width="240" height="125" rx="16"/><text class="label" x="1035" y="180">ROLE</text><text class="text" x="1035" y="225">Researcher</text><text class="small" x="1035" y="252">reads and drafts</text><rect class="role" x="1290" y="140" width="240" height="125" rx="16"/><text class="label" x="1325" y="180">ROLE</text><text class="text" x="1325" y="225">Operator</text><text class="small" x="1325" y="252">executes BAU</text><rect class="role" x="1000" y="330" width="240" height="125" rx="16"/><text class="label" x="1035" y="370">ROLE</text><text class="text" x="1035" y="415">Reviewer</text><text class="small" x="1035" y="442">checks outcomes</text><rect class="role" x="1290" y="330" width="240" height="125" rx="16"/><text class="label" x="1325" y="370">ROLE</text><text class="text" x="1325" y="415">Archivist</text><text class="small" x="1325" y="442">writes memory</text>
  <path class="flow" d="M325 380 C400 380 430 330 500 330"/><path class="flow" d="M860 330 C920 330 940 205 1000 205"/><path class="flow" d="M860 360 C960 480 1190 500 1290 395"/><circle fill="#7ee0d1" r="9"><animateMotion dur="2.8s" repeatCount="indefinite" path="M325 380 C400 380 430 330 500 330"/></circle><circle fill="#7ee0d1" r="9"><animateMotion dur="2.8s" repeatCount="indefinite" path="M860 330 C920 330 940 205 1000 205"/></circle>
  <rect class="memory" x="500" y="585" width="500" height="150" rx="20"/><text class="label" x="545" y="630">OPENKNOWLEDGE</text><text class="text" x="545" y="675">read context · write reviewed memory</text><text class="small" x="545" y="710">MCP and skills keep agents on the same wiki</text><path class="flow" d="M750 480 L750 585"/><path class="line" d="M1290 455 C1200 610 1050 650 1000 650"/><path class="line" d="M500 650 C425 650 390 500 325 460"/>
</svg>
