<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">MCP and API integration paths</title>
  <desc id="desc">Two dark-theme lanes compare an application calling a shop API directly with an AI host using MCP discovery and tools through an MCP server. The MCP server can call the same shop API, but it can also connect to other resources.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#69d8d2"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#68a8ff"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#edf3fb}.title{font-size:30px;font-weight:750}.sub{font-size:17px;fill:#a9bad0}.head{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:15px;fill:#c5d0df}.muted{font-size:14px;fill:#97a9c0}.box{fill:#172438;stroke:#3b506d;stroke-width:2}.host{fill:#152c3b;stroke:#42d6d0;stroke-width:2}.api{fill:#172b44;stroke:#68a8ff;stroke-width:2}.server{fill:#22203a;stroke:#b899ff;stroke-width:2}.line{stroke:#69d8d2;stroke-width:3;fill:none;marker-end:url(#arrow)}.blue{stroke:#68a8ff;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}.panel{fill:#101827;stroke:#27374e;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="#0b1120"/>
  <text x="52" y="58" class="title">Same shop. Two integration paths.</text>
  <text x="52" y="89" class="sub">An API serves software callers. MCP gives an AI host a standard way to discover and use capabilities.</text>

  <rect x="42" y="120" width="1316" height="270" rx="20" class="panel"/>
  <text x="72" y="160" class="head">A · Application calls the API directly</text>
  <rect x="95" y="205" width="250" height="94" rx="14" class="box"/><text x="121" y="242" class="label">Shop mobile app</text><text x="121" y="271" class="small">programmed client logic</text>
  <path d="M347 252H541" class="blue"/><text x="385" y="229" class="small">GET /v1/orders/A-1041</text><text x="389" y="279" class="muted">known route + auth + schema</text>
  <rect x="550" y="205" width="300" height="94" rx="14" class="api"/><text x="584" y="242" class="label">Shop API</text><text x="584" y="271" class="small">HTTP endpoint and business rules</text>
  <path d="M852 252H1046" class="blue"/><text x="891" y="229" class="small">query order service</text>
  <rect x="1055" y="205" width="250" height="94" rx="14" class="box"/><text x="1085" y="242" class="label">Orders database</text><text x="1085" y="271" class="small">system of record</text>
  <text x="95" y="347" class="muted">The app’s code already knows which endpoint to call and when.</text>

  <rect x="42" y="414" width="1316" height="350" rx="20" class="panel"/>
  <text x="72" y="454" class="head">B · AI host connects through MCP</text>
  <rect x="80" y="500" width="270" height="124" rx="14" class="host"/><text x="108" y="538" class="label">AI host</text><text x="108" y="568" class="small">LLM + MCP client</text><text x="108" y="596" class="muted">understands user request</text>
  <path d="M352 562H520" class="line"/><text x="373" y="531" class="small">tools/list</text><text x="370" y="594" class="small">tools/call</text>
  <rect x="530" y="500" width="310" height="124" rx="14" class="server"/><text x="560" y="538" class="label">Shop MCP server</text><text x="560" y="568" class="small">get_order · request_cancellation</text><text x="560" y="596" class="muted">descriptions + input schemas</text>
  <path d="M842 562H1022" class="blue"/><text x="865" y="531" class="small">may call API</text><text x="865" y="594" class="muted">or another backend</text>
  <rect x="1030" y="500" width="270" height="124" rx="14" class="api"/><text x="1060" y="538" class="label">Shop API / data</text><text x="1060" y="568" class="small">same backend as the app</text><text x="1060" y="596" class="muted">MCP server adapts the call</text>
  <rect x="82" y="676" width="1216" height="48" rx="12" fill="#192638" stroke="#344761"/><text x="106" y="706" class="small">MCP is the AI-facing protocol boundary. It can wrap an existing API, but the protocol does not require an API behind every server.</text>
</svg>
