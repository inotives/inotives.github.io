<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Agent rig and durable team memory</title>
  <desc id="desc">An agent rig owns execution state while MCP and PostgreSQL provide shared durable memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111e"/><stop offset="1" stop-color="#171b31"/></linearGradient>
    <linearGradient id="rig" x1="0" x2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#3730a3"/></linearGradient>
    <linearGradient id="mcp" x1="0" x2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#115e59"/></linearGradient>
    <linearGradient id="db" x1="0" x2="1"><stop stop-color="#6b21a8"/><stop offset="1" stop-color="#7e22ce"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#a5f3fc"/></marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Keep execution state and memory separate</text>
  <text x="70" y="104" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">The rig coordinates work. MCP gives every role a durable context boundary.</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="70" y="175" width="315" height="260" rx="22" fill="url(#rig)" stroke="#93c5fd"/>
    <text x="227" y="230" fill="#eff6ff" font-size="23" font-weight="700" text-anchor="middle">Agent rig</text>
    <text x="227" y="270" fill="#dbeafe" font-size="16" text-anchor="middle">Roles and profiles</text>
    <text x="227" y="304" fill="#dbeafe" font-size="16" text-anchor="middle">Tasks and handoffs</text>
    <text x="227" y="338" fill="#dbeafe" font-size="16" text-anchor="middle">Worker / reviewer loop</text>
    <text x="227" y="390" fill="#bfdbfe" font-size="14" text-anchor="middle">Owns execution state</text>
    <rect x="445" y="175" width="310" height="260" rx="22" fill="url(#mcp)" stroke="#99f6e4"/>
    <text x="600" y="230" fill="#f0fdfa" font-size="23" font-weight="700" text-anchor="middle">MCP boundary</text>
    <text x="600" y="270" fill="#ccfbf1" font-size="16" text-anchor="middle">Search current context</text>
    <text x="600" y="304" fill="#ccfbf1" font-size="16" text-anchor="middle">Publish reviewed memory</text>
    <text x="600" y="338" fill="#ccfbf1" font-size="16" text-anchor="middle">Apply identity + rules</text>
    <text x="600" y="390" fill="#99f6e4" font-size="14" text-anchor="middle">Owns the memory contract</text>
    <rect x="815" y="175" width="315" height="260" rx="22" fill="url(#db)" stroke="#e9d5ff"/>
    <text x="972" y="230" fill="#faf5ff" font-size="23" font-weight="700" text-anchor="middle">PostgreSQL</text>
    <text x="972" y="270" fill="#f3e8ff" font-size="16" text-anchor="middle">Team pages</text>
    <text x="972" y="304" fill="#f3e8ff" font-size="16" text-anchor="middle">Search indexes</text>
    <text x="972" y="338" fill="#f3e8ff" font-size="16" text-anchor="middle">Versions + audit</text>
    <text x="972" y="390" fill="#e9d5ff" font-size="14" text-anchor="middle">Owns durable records</text>
  </g>
  <path d="M385 305H435" stroke="#a5f3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M755 305H805" stroke="#a5f3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="410" y="282" fill="#bae6fd" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">tool calls</text>
  <text x="780" y="282" fill="#bae6fd" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">validated writes</text>
  <text x="600" y="500" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">One boundary, many agents, one durable team memory.</text>
</svg>
