<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
  <title id="title">A DuckLake share needs catalog and storage access</title>
  <desc id="desc">An analyst's query needs both a MotherDuck share grant to see the catalog and a scoped S3 credential to read DuckLake data. A share without the S3 credential is visible but the query fails. IAM denies access to another data prefix.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#53dfdc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="760" rx="32" fill="#101b27"/>
  <text x="48" y="68" fill="#f5f8fc" font-family="Arial, sans-serif" font-size="32" font-weight="700">A share is only one key</text>
  <text x="48" y="106" fill="#b8c9d8" font-family="Arial, sans-serif" font-size="20">Reading a shared DuckLake crosses two permission gates.</text>

  <rect x="48" y="146" width="624" height="98" rx="20" fill="#1c2d40" stroke="#537ba4" stroke-width="2"/>
  <circle cx="88" cy="195" r="20" fill="#9aafff"/>
  <circle cx="88" cy="187" r="6" fill="#142238"/>
  <path d="M76 207c2-10 22-10 24 0" fill="none" stroke="#142238" stroke-width="3" stroke-linecap="round"/>
  <text x="128" y="202" fill="#f5f8fc" font-family="Arial, sans-serif" font-size="25" font-weight="700">Analyst queries the shared database</text>

  <path d="M360 244v36H198v31" fill="none" stroke="#53dfdc" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M360 280h162v31" fill="none" stroke="#53dfdc" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="48" y="326" width="300" height="144" rx="20" fill="#332714" stroke="#efae54" stroke-width="2"/>
  <rect x="372" y="326" width="300" height="144" rx="20" fill="#193b35" stroke="#55c69b" stroke-width="2"/>
  <text x="76" y="370" fill="#fff8eb" font-family="Arial, sans-serif" font-size="24" font-weight="700">MotherDuck share</text>
  <text x="76" y="408" fill="#f5d5a7" font-family="Arial, sans-serif" font-size="20">Grants catalog view</text>
  <text x="76" y="439" fill="#f5d5a7" font-family="Arial, sans-serif" font-size="20">for this database</text>
  <text x="400" y="370" fill="#eafff4" font-family="Arial, sans-serif" font-size="24" font-weight="700">Scoped S3 secret</text>
  <text x="400" y="408" fill="#bde9d6" font-family="Arial, sans-serif" font-size="20">Grants object reads</text>
  <text x="400" y="439" fill="#bde9d6" font-family="Arial, sans-serif" font-size="20">for this data prefix</text>

  <path d="M198 470v40h162m162-40v40H360v35" fill="none" stroke="#53dfdc" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="108" y="558" width="504" height="86" rx="18" fill="#214237" stroke="#55c69b" stroke-width="2"/>
  <text x="150" y="611" fill="#eafff4" font-family="Arial, sans-serif" font-size="25" font-weight="700">Both present → query succeeds</text>
  <text x="48" y="695" fill="#ffcbbe" font-family="Arial, sans-serif" font-size="19">Share only → visible database, failed read</text>
  <text x="48" y="725" fill="#b8c9d8" font-family="Arial, sans-serif" font-size="19">Other S3 prefix → denied by IAM</text>
</svg>
