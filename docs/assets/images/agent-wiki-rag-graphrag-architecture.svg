<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Agent wiki with RAG and GraphRAG retrieval</title>
  <desc id="desc">A dark architecture diagram showing the canonical agent wiki producing a vector projection and a graph projection. An agent query router calls vector_search_tool, graph_search_tool, or both.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.wiki{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.index{fill:#17263b;stroke:#587692;stroke-width:2}.graph{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.router{fill:#332b1d;stroke:#e2b866;stroke-width:2}.answer{fill:#17343a;stroke:#7ee0d1;stroke-width:2}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.yellow{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}.purple{stroke:#ba79c7;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="820"/><text class="text" x="65" y="68" font-size="36" font-weight="700">One canonical wiki, two retrieval projections</text><text class="small" x="65" y="103">RAG finds supporting passages. GraphRAG finds the connected context around them.</text>
  <rect class="wiki" x="65" y="205" width="350" height="410" rx="22"/><text class="label" x="105" y="250">CANONICAL SOURCE</text><text class="text" x="105" y="295">Agent wiki / OKF</text><text class="small" x="105" y="345">domains/</text><text class="small" x="105" y="380">projects/</text><text class="small" x="105" y="415">decisions/</text><text class="small" x="105" y="450">runbooks/</text><text class="small" x="105" y="485">glossary/</text><text class="small" x="105" y="520">shared-rules/</text><text class="small" x="105" y="570">owner · status · scope · source</text>
  <rect class="index" x="545" y="175" width="310" height="180" rx="18"/><text class="label" x="585" y="220">DERIVED VIEW</text><text class="text" x="585" y="265">Vector index</text><text class="small" x="585" y="305">chunks · embeddings · metadata</text><path class="line" d="M415 325 L545 265"/>
  <rect class="graph" x="545" y="480" width="310" height="180" rx="18"/><text class="label" x="585" y="525">DERIVED VIEW</text><text class="text" x="585" y="570">Knowledge graph</text><text class="small" x="585" y="610">entities · edges · provenance</text><path class="purple" d="M415 490 L545 570"/>
  <rect class="router" x="980" y="275" width="300" height="250" rx="20"/><text class="label" x="1020" y="320">AGENT ROUTER</text><text class="text" x="1020" y="365">Classify the question</text><text class="small" x="1020" y="410">fact · relationship · multi-hop</text><text class="small" x="1020" y="450">choose retrieval path</text>
  <path class="line" d="M855 265 L980 345"/><path class="purple" d="M855 570 L980 455"/>
  <rect class="index" x="1350" y="165" width="190" height="135" rx="16"/><text class="label" x="1380" y="205">TOOL</text><text class="text" x="1380" y="245">vector_search_tool</text><text class="small" x="1380" y="275">precise passages</text>
  <rect class="graph" x="1350" y="350" width="190" height="135" rx="16"/><text class="label" x="1380" y="390">TOOL</text><text class="text" x="1380" y="430">graph_search_tool</text><text class="small" x="1380" y="460">relationships</text>
  <rect class="answer" x="1350" y="535" width="190" height="135" rx="16"/><text class="label" x="1380" y="575">OUTPUT</text><text class="text" x="1380" y="615">Grounded answer</text><text class="small" x="1380" y="645">wiki citations</text>
  <path class="yellow" d="M1280 350 L1350 235"/><path class="purple" d="M1280 450 L1350 418"/><path class="line" d="M1280 480 C1320 560 1320 600 1350 600"/>
  <rect class="wiki" x="65" y="690" width="1215" height="65" rx="14"/><text class="small" x="100" y="730">The wiki is authoritative. The vector index and graph are rebuildable retrieval views, not independent sources of truth.</text>
</svg>
