<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">The agent drafts through MCP; a person publishes</title>
  <desc id="desc">Through MCP tools bound to one analyst's roles, the agent explores tables, reads the dashboard guide, creates a draft, previews cards as each audience role and runs the publish checks. The analyst reviews the preview link and publishes. There is no publish tool.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <text x="47" y="56" fill="#f6f9fc" font-family="system-ui,sans-serif" font-size="28" font-weight="700">The agent can draft and test. Only a person can publish.</text>
  <text x="47" y="85" fill="#a9bdd0" font-family="system-ui,sans-serif" font-size="16">Every tool runs as the analyst who issued the token, with that person's roles at that moment.</text>

  <rect x="31" y="112" width="876" height="356" rx="20" fill="none" stroke="#3a5672" stroke-dasharray="6 6"/>
  <text x="52" y="140" fill="#a9bdd0" font-family="system-ui,sans-serif" font-size="15">Agent, over MCP</text>
  <rect x="931" y="112" width="238" height="356" rx="20" fill="none" stroke="#71c69a" stroke-dasharray="6 6"/>
  <text x="952" y="140" fill="#c7ead6" font-family="system-ui,sans-serif" font-size="15">Analyst, in the web app</text>

  <g font-family="system-ui,sans-serif">
    <rect x="52" y="160" width="190" height="124" rx="14" fill="#263e5b" stroke="#75a8d5"/>
    <text x="70" y="192" fill="#fff" font-size="18" font-weight="700">Explore</text>
    <text x="70" y="220" fill="#c8dbee" font-size="13" font-family="ui-monospace,Menlo,monospace">list_tables</text>
    <text x="70" y="242" fill="#c8dbee" font-size="13" font-family="ui-monospace,Menlo,monospace">describe_table</text>
    <text x="70" y="264" fill="#c8dbee" font-size="13" font-family="ui-monospace,Menlo,monospace">run_query</text>

    <rect x="266" y="160" width="190" height="124" rx="14" fill="#1d3d45" stroke="#53dfdc"/>
    <text x="284" y="192" fill="#fff" font-size="18" font-weight="700">Learn the rules</text>
    <text x="284" y="220" fill="#c1e5e5" font-size="13" font-family="ui-monospace,Menlo,monospace">dashboard_guide</text>
    <text x="284" y="246" fill="#c1e5e5" font-size="14">chart types, columns,</text>
    <text x="284" y="266" fill="#c1e5e5" font-size="14">filters, audiences</text>

    <rect x="480" y="160" width="190" height="124" rx="14" fill="#4c3d2b" stroke="#e3ad5a"/>
    <text x="498" y="192" fill="#fff" font-size="18" font-weight="700">Draft</text>
    <text x="498" y="220" fill="#f1d7aa" font-size="13" font-family="ui-monospace,Menlo,monospace">create_draft</text>
    <text x="498" y="242" fill="#f1d7aa" font-size="13" font-family="ui-monospace,Menlo,monospace">update_draft</text>
    <text x="498" y="266" fill="#f1d7aa" font-size="14">each save = new version</text>

    <rect x="694" y="160" width="196" height="124" rx="14" fill="#3b2f52" stroke="#b49ce6"/>
    <text x="712" y="192" fill="#fff" font-size="18" font-weight="700">Test</text>
    <text x="712" y="220" fill="#ddd0f5" font-size="13" font-family="ui-monospace,Menlo,monospace">preview_card</text>
    <text x="712" y="242" fill="#ddd0f5" font-size="13" font-family="ui-monospace,Menlo,monospace">check_draft</text>
    <text x="712" y="266" fill="#ddd0f5" font-size="14">as every audience role</text>

    <rect x="52" y="324" width="838" height="124" rx="14" fill="#1b2a3c" stroke="#3a5672"/>
    <text x="70" y="358" fill="#fff" font-size="17" font-weight="700">Hand back</text>
    <text x="70" y="386" fill="#c8dbee" font-size="15">Summarise each card's figures and return <tspan font-family="ui-monospace,Menlo,monospace" fill="#e3ad5a">preview_url</tspan>.</text>
    <text x="70" y="412" fill="#c8dbee" font-size="15">There is no publish tool. The API also refuses the token on the publish endpoint.</text>

    <rect x="952" y="160" width="196" height="124" rx="14" fill="#294a40" stroke="#71c69a"/>
    <text x="970" y="192" fill="#fff" font-size="18" font-weight="700">Review</text>
    <text x="970" y="220" fill="#c7ead6" font-size="14">Open the preview,</text>
    <text x="970" y="242" fill="#c7ead6" font-size="14">compare figures,</text>
    <text x="970" y="264" fill="#c7ead6" font-size="14">pick a version</text>

    <rect x="952" y="324" width="196" height="124" rx="14" fill="#71c69a" stroke="#71c69a"/>
    <text x="970" y="362" fill="#143224" font-size="20" font-weight="700">Publish</text>
    <text x="970" y="392" fill="#143224" font-size="14">to the audience roles,</text>
    <text x="970" y="414" fill="#143224" font-size="14">if every card passes</text>
  </g>
  <g fill="none" stroke="#90adc2" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M242 222 H263"/>
    <path d="M456 222 H477"/>
    <path d="M670 222 H691"/>
    <path d="M792 284 V321"/>
    <path d="M890 386 C920 386 925 222 949 222"/>
    <path d="M1050 284 V321"/>
  </g>
</svg>
