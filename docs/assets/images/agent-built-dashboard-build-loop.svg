<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Build and verify an agent-created dashboard</title>
  <desc id="desc">A four-step loop: define the approved metric contract, inspect it through a read-only MCP tool, build the API and dashboard, then compare values and review the interface before release.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#142337"/><stop offset="1" stop-color="#0b1522"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#90adc2" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <text x="47" y="56" fill="#f6f9fc" font-family="system-ui,sans-serif" font-size="28" font-weight="700">The agent gets a build loop, not a blank SQL console</text>
  <text x="47" y="85" fill="#a9bdd0" font-family="system-ui,sans-serif" font-size="16">Every step has an artifact a person can check.</text>
  <g font-family="system-ui,sans-serif">
    <rect x="43" y="147" width="248" height="190" rx="18" fill="#1d3d45" stroke="#53dfdc"/>
    <circle cx="81" cy="186" r="22" fill="#53dfdc"/><text x="75" y="193" fill="#10212b" font-size="19" font-weight="700">1</text>
    <text x="68" y="235" fill="#fff" font-size="20" font-weight="700">Metric contract</text>
    <text x="68" y="267" fill="#c1e5e5" font-size="15">Names, grain, units,</text>
    <text x="68" y="292" fill="#c1e5e5" font-size="15">freshness, allowed filters</text>
    <rect x="332" y="147" width="248" height="190" rx="18" fill="#4c3d2b" stroke="#e3ad5a"/>
    <circle cx="370" cy="186" r="22" fill="#e3ad5a"/><text x="364" y="193" fill="#2b2015" font-size="19" font-weight="700">2</text>
    <text x="357" y="235" fill="#fff" font-size="20" font-weight="700">MCP inspection</text>
    <text x="357" y="267" fill="#f1d7aa" font-size="15">Schema and bounded</text>
    <text x="357" y="292" fill="#f1d7aa" font-size="15">sample queries</text>
    <rect x="621" y="147" width="248" height="190" rx="18" fill="#263e5b" stroke="#75a8d5"/>
    <circle cx="659" cy="186" r="22" fill="#75a8d5"/><text x="653" y="193" fill="#132538" font-size="19" font-weight="700">3</text>
    <text x="646" y="235" fill="#fff" font-size="20" font-weight="700">API + UI code</text>
    <text x="646" y="267" fill="#c8dbee" font-size="15">Stable JSON, charts,</text>
    <text x="646" y="292" fill="#c8dbee" font-size="15">responsive HTML</text>
    <rect x="910" y="147" width="248" height="190" rx="18" fill="#294a40" stroke="#71c69a"/>
    <circle cx="948" cy="186" r="22" fill="#71c69a"/><text x="942" y="193" fill="#143224" font-size="19" font-weight="700">4</text>
    <text x="935" y="235" fill="#fff" font-size="20" font-weight="700">Review + release</text>
    <text x="935" y="267" fill="#c7ead6" font-size="15">Match SQL totals;</text>
    <text x="935" y="292" fill="#c7ead6" font-size="15">check mobile and access</text>
  </g>
  <g stroke="#90adc2" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M293 242h30"/><path d="M582 242h30"/><path d="M871 242h30"/><path d="M1035 342v59H166v-55"/></g>
  <text x="495" y="393" fill="#a9bdd0" font-family="system-ui,sans-serif" font-size="15">Revise the contract or chart when review finds a mismatch</text>
</svg>
