<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Local and AWS Parquet ELT flow</title>
  <desc id="desc">A market data source moves through dlt Raw storage, a health gate, DuckDB and dbt Bronze, Silver, and Gold Parquet layers, then an API and UI. Local disk and S3 provide the same logical lake path.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#15233a"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#91a8c5" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <text x="48" y="56" fill="#f7fafc" font-family="system-ui,sans-serif" font-size="27" font-weight="700">One pipeline, two storage locations</text>
  <text x="48" y="85" fill="#a9bad0" font-family="system-ui,sans-serif" font-size="16">The job order and SQL stay the same. The data root and credentials change.</text>
  <rect x="35" y="125" width="1130" height="188" rx="20" fill="#101c2f" stroke="#354d69"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <rect x="55" y="166" width="126" height="103" rx="14" fill="#263953" stroke="#547095"/>
    <text x="118" y="206" fill="#ffffff" font-size="18" font-weight="700">Exchange</text><text x="118" y="231" fill="#b8cbe0" font-size="14">API batch</text>
    <rect x="218" y="166" width="128" height="103" rx="14" fill="#1e4b55" stroke="#4ca7a7"/>
    <text x="282" y="204" fill="#ffffff" font-size="18" font-weight="700">Raw</text><text x="282" y="230" fill="#bce5e4" font-size="14">dlt · Parquet</text>
    <rect x="383" y="166" width="137" height="103" rx="14" fill="#51402c" stroke="#dfad5f"/>
    <text x="452" y="204" fill="#ffffff" font-size="18" font-weight="700">Health gate</text><text x="452" y="230" fill="#f2d9aa" font-size="14">accept / hold</text>
    <rect x="557" y="166" width="128" height="103" rx="14" fill="#27445c" stroke="#5b9fd4"/>
    <text x="621" y="204" fill="#ffffff" font-size="18" font-weight="700">Bronze</text><text x="621" y="230" fill="#bddcf2" font-size="14">accepted</text>
    <rect x="722" y="166" width="128" height="103" rx="14" fill="#29475a" stroke="#5b9fd4"/>
    <text x="786" y="204" fill="#ffffff" font-size="18" font-weight="700">Silver</text><text x="786" y="230" fill="#bddcf2" font-size="14">dbt · DuckDB</text>
    <rect x="887" y="166" width="128" height="103" rx="14" fill="#284d43" stroke="#64bb91"/>
    <text x="951" y="204" fill="#ffffff" font-size="18" font-weight="700">Gold</text><text x="951" y="230" fill="#c0edd8" font-size="14">published</text>
    <rect x="1052" y="166" width="92" height="103" rx="14" fill="#3b3760" stroke="#a394e5"/>
    <text x="1098" y="204" fill="#ffffff" font-size="18" font-weight="700">API</text><text x="1098" y="230" fill="#d2caf7" font-size="14">UI</text>
  </g>
  <g stroke="#91a8c5" stroke-width="2.2" fill="none" marker-end="url(#arrow)"><path d="M183 218h27"/><path d="M348 218h27"/><path d="M522 218h27"/><path d="M687 218h27"/><path d="M852 218h27"/><path d="M1017 218h27"/></g>
  <g font-family="system-ui,sans-serif" font-size="16">
    <rect x="143" y="345" width="408" height="53" rx="12" fill="#1e344d" stroke="#4b7397"/><text x="166" y="379" fill="#d8e8f6">Laptop: <tspan fill="#ffffff" font-weight="600">file:///.../lake</tspan></text>
    <rect x="649" y="345" width="408" height="53" rx="12" fill="#1e344d" stroke="#4b7397"/><text x="672" y="379" fill="#d8e8f6">AWS: <tspan fill="#ffffff" font-weight="600">s3://private-bucket/lake</tspan></text>
  </g>
</svg>
