<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mage, Iceberg, Athena, and Terraform lakehouse architecture</title>
  <desc id="desc">A dark architecture diagram showing GitHub and Terraform deploying a Mage runtime in a private VPC. Mage moves data through S3 raw, quarantine, bronze, silver, and gold Iceberg layers, registered in Glue Catalog and queried by Athena and BI tools.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .bg{fill:#0b1220}.panel{fill:#111c2e;stroke:#2a3b54;stroke-width:2}.vpc{fill:#0d1727;stroke:#48627d;stroke-width:2;stroke-dasharray:10 8}.box{fill:#17263b;stroke:#587692;stroke-width:2}.lake{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.managed{fill:#201f3b;stroke:#8877c9;stroke-width:2}.bi{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.softline{stroke:#667d96;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="text" x="70" y="70" font-size="36" font-weight="700">Proposed S3 Iceberg lakehouse</text>
  <text class="small" x="70" y="105">Mage validates ingestion, Iceberg stores table state, Athena executes SQL, Terraform owns the environment.</text>

  <rect class="panel" x="70" y="155" width="260" height="145" rx="16" filter="url(#shadow)"/>
  <text class="label" x="100" y="195">SOURCE CONTROL</text><text class="text" x="100" y="235">GitHub</text><text class="small" x="100" y="270">pipeline code · dbt · Terraform</text>
  <path class="line" d="M330 228 L420 228"/>
  <rect class="panel" x="420" y="155" width="260" height="145" rx="16" filter="url(#shadow)"/>
  <text class="label" x="450" y="195">PROVISIONING</text><text class="text" x="450" y="235">Terraform</text><text class="small" x="450" y="270">dev and prod environments</text>
  <path class="softline" d="M550 300 L550 375"/>

  <rect class="vpc" x="365" y="350" width="460" height="390" rx="22"/>
  <text class="label" x="395" y="390">AWS VPC · PRIVATE SUBNETS</text>
  <rect class="box" x="405" y="430" width="380" height="115" rx="14" filter="url(#shadow)"/>
  <text class="label" x="435" y="468">ORCHESTRATION</text><text class="text" x="435" y="505">Mage runtime</text><text class="small" x="435" y="532">ingest · health checks · promotion</text>
  <rect class="box" x="405" y="585" width="180" height="105" rx="14"/><text class="text" x="430" y="625">dbt-athena</text><text class="small" x="430" y="655">models</text>
  <rect class="box" x="605" y="585" width="180" height="105" rx="14"/><text class="text" x="630" y="625">CloudWatch</text><text class="small" x="630" y="655">logs and alerts</text>

  <rect class="lake" x="900" y="155" width="350" height="585" rx="20" filter="url(#shadow)"/>
  <text class="label" x="930" y="195">S3 DATA LAKE</text>
  <rect class="box" x="930" y="225" width="290" height="72" rx="12"/><text class="text" x="965" y="270">Raw Parquet</text>
  <rect class="box" x="930" y="320" width="290" height="72" rx="12"/><text class="text" x="965" y="365">Quarantine</text>
  <rect class="lake" x="930" y="415" width="290" height="72" rx="12"/><text class="text" x="965" y="460">Bronze Iceberg</text>
  <rect class="lake" x="930" y="510" width="290" height="72" rx="12"/><text class="text" x="965" y="555">Silver Iceberg</text>
  <rect class="lake" x="930" y="605" width="290" height="72" rx="12"/><text class="text" x="965" y="650">Gold Iceberg</text>
  <path class="line" d="M825 475 L900 260"/><path class="line" d="M825 475 L900 356"/><path class="line" d="M825 475 L900 451"/><path class="line" d="M825 638 L900 546"/><path class="line" d="M825 638 L900 641"/>

  <rect class="managed" x="1290" y="205" width="230" height="120" rx="16" filter="url(#shadow)"/><text class="label" x="1320" y="245">CATALOG</text><text class="text" x="1320" y="282">Glue Catalog</text><text class="small" x="1320" y="307">Iceberg metadata</text>
  <path class="softline" d="M1250 450 L1350 325"/>
  <rect class="managed" x="1290" y="400" width="230" height="120" rx="16" filter="url(#shadow)"/><text class="label" x="1320" y="440">QUERY</text><text class="text" x="1320" y="477">Athena</text><text class="small" x="1320" y="502">SQL over Iceberg</text>
  <path class="line" d="M1250 641 L1290 462"/>
  <rect class="bi" x="1290" y="590" width="230" height="120" rx="16" filter="url(#shadow)"/><text class="label" x="1320" y="630">CONSUMERS</text><text class="text" x="1320" y="667">BI tools</text><text class="small" x="1320" y="692">Metabase · QuickSight</text>
  <path class="line" d="M1405 520 L1405 590"/>

  <rect class="panel" x="70" y="790" width="1450" height="70" rx="14"/><text class="small" x="100" y="833">Security boundary: prefer IAM roles and GitHub OIDC. Use Secrets Manager only for credentials that cannot use role-based access.</text>
</svg>
