<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Markdown workflow records feed a read-only Trinary Agents dashboard</title>
  <desc id="desc">A dark diagram shows a project workspace containing an approved feature plan, task READMEs with YAML status and dependencies, and append-only handoffs. The project manager edits canonical Markdown records. A dashboard generator reads them to create a local HTML dashboard displaying lanes, dependency graph, progress, and handoff timeline. The dashboard does not write back to records.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53dfdc"/></marker><style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#edf4fb}.title{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#a9bacd}.head{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:15px;fill:#d0dbea}.muted{font-size:14px;fill:#9aacc0}.panel{fill:#101b27;stroke:#293b50;stroke-width:2}.record{fill:#15302f;stroke:#53dfdc;stroke-width:2}.view{fill:#172538;stroke:#6ca7ff;stroke-width:2}.generated{fill:#29243a;stroke:#b79bff;stroke-width:2}.line{stroke:#53dfdc;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashline{stroke:#a0b4ca;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
  </style></defs>
  <rect width="1400" height="780" rx="28" fill="#0b121a"/>
  <text x="52" y="58" class="title">Markdown is the record. The dashboard is a projection.</text>
  <text x="52" y="88" class="sub">The project manager changes canonical files; the generator turns them into a convenient read-only overview.</text>

  <rect x="42" y="125" width="620" height="540" rx="20" class="panel"/>
  <text x="76" y="170" class="head">Canonical records · trinary-workspace/</text>
  <rect x="82" y="203" width="540" height="92" rx="14" class="record"/>
  <text x="108" y="240" class="label">Feature README</text><text x="108" y="268" class="small">Human-approved scope, decisions and acceptance</text>
  <rect x="82" y="320" width="540" height="116" rx="14" class="record"/>
  <text x="108" y="358" class="label">Task README files</text><text x="108" y="387" class="small">YAML frontmatter: status + depends_on</text><text x="108" y="414" class="small">Body: task brief, exclusions and acceptance checks</text>
  <rect x="82" y="461" width="540" height="104" rx="14" class="record"/>
  <text x="108" y="500" class="label">Timestamped handoffs</text><text x="108" y="529" class="small">Worker, reviewer, project-manager and human notes</text>
  <text x="82" y="610" class="muted">Project manager updates status; earlier handoffs stay intact.</text>

  <path d="M665 395H778" class="line"/>
  <rect x="790" y="319" width="220" height="150" rx="16" class="generated"/>
  <text x="818" y="358" class="label">Dashboard</text><text x="818" y="390" class="small">generator</text><text x="818" y="423" class="muted">reads Markdown</text>
  <path d="M1012 395H1118" class="line"/>
  <rect x="1128" y="203" width="232" height="362" rx="18" class="view"/>
  <text x="1154" y="246" class="label">Local HTML view</text>
  <rect x="1154" y="270" width="180" height="48" rx="9" fill="#243b55"/><text x="1170" y="300" class="small">Task lanes</text>
  <rect x="1154" y="330" width="180" height="48" rx="9" fill="#243b55"/><text x="1170" y="360" class="small">Dependencies</text>
  <rect x="1154" y="390" width="180" height="48" rx="9" fill="#243b55"/><text x="1170" y="420" class="small">Progress</text>
  <rect x="1154" y="450" width="180" height="48" rx="9" fill="#243b55"/><text x="1170" y="480" class="small">Handoff timeline</text>
  <text x="1154" y="530" class="muted">Read-only snapshot</text>
  <rect x="790" y="597" width="570" height="52" rx="12" fill="#182532" stroke="#40566e"/>
  <text x="816" y="630" class="small">No writes back: regenerate after status, dependency or handoff changes.</text>
</svg>
