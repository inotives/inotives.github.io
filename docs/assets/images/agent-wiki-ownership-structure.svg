<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Agent wiki ownership and repository structure</title>
  <desc id="desc">A dark repository diagram showing domain folders, page owners, shared rules, and agent contribution boundaries in a team wiki.</desc>
  <defs><style>.bg{fill:#0b1220}.root{fill:#17263b;stroke:#587692;stroke-width:2}.domain{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.rule{fill:#332b1d;stroke:#e2b866;stroke-width:2}.agent{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.branch{stroke:#667d96;stroke-width:3;fill:none}</style></defs>
  <rect class="bg" width="1600" height="820"/><text class="text" x="65" y="68" font-size="36" font-weight="700">Ownership makes a shared wiki navigable</text><text class="small" x="65" y="103">A folder is useful when it answers who maintains the knowledge inside it.</text>
  <rect class="root" x="65" y="190" width="300" height="430" rx="20"/><text class="label" x="105" y="235">SHARED WIKI</text><text class="text" x="105" y="285">knowledge/</text><text class="small" x="140" y="330">domains/</text><text class="small" x="140" y="370">projects/</text><text class="small" x="140" y="410">decisions/</text><text class="small" x="140" y="450">runbooks/</text><text class="small" x="140" y="490">glossary/</text><text class="small" x="105" y="560">shared rules and templates</text>
  <path class="branch" d="M365 300 L470 300 M365 400 L470 400 M365 500 L470 500"/>
  <rect class="domain" x="470" y="170" width="330" height="180" rx="16"/><text class="label" x="510" y="215">DOMAIN A</text><text class="text" x="510" y="260">Owner: team A</text><text class="small" x="510" y="300">pages · glossary · decisions</text>
  <rect class="domain" x="470" y="370" width="330" height="180" rx="16"/><text class="label" x="510" y="415">DOMAIN B</text><text class="text" x="510" y="460">Owner: team B</text><text class="small" x="510" y="500">pages · glossary · decisions</text>
  <rect class="rule" x="470" y="570" width="330" height="180" rx="16"/><text class="label" x="510" y="615">CROSS-CUTTING</text><text class="text" x="510" y="660">Owner: platform group</text><text class="small" x="510" y="700">templates · links · lifecycle</text>
  <path class="branch" d="M800 260 L900 260 M800 460 L900 460 M800 660 L900 660"/>
  <rect class="agent" x="900" y="170" width="310" height="180" rx="16"/><text class="label" x="940" y="215">AGENT CONTRIBUTION</text><text class="text" x="940" y="260">Scoped work</text><text class="small" x="940" y="300">propose · link · summarize</text>
  <rect class="agent" x="900" y="370" width="310" height="180" rx="16"/><text class="label" x="940" y="415">REVIEW ROUTE</text><text class="text" x="940" y="460">Owner checks</text><text class="small" x="940" y="500">correctness · scope · status</text>
  <rect class="agent" x="900" y="570" width="310" height="180" rx="16"/><text class="label" x="940" y="615">SEARCH ROUTE</text><text class="text" x="940" y="660">Agents reuse</text><text class="small" x="940" y="700">only shared, discoverable pages</text>
  <rect class="root" x="1280" y="300" width="250" height="250" rx="18"/><text class="label" x="1320" y="345">PAGE METADATA</text><text class="small" x="1320" y="390">owner</text><text class="small" x="1320" y="425">status</text><text class="small" x="1320" y="460">scope</text><text class="small" x="1320" y="495">last review</text>
</svg>
