<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Animated Docker Agent team loop</title>
  <desc id="desc">An animated dark SVG showing an AgentRig task routed to a Docker Agent investigator, fixer, and reviewer, with a result returning to the project task.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.rig{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.docker{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.agent{fill:#17263b;stroke:#587692;stroke-width:2}.review{fill:#332b1d;stroke:#e2b866;stroke-width:2}.text{fill:#e7eef6;font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.pulse{fill:#7ee0d1}.flow{stroke:#7ee0d1;stroke-width:4;fill:none;stroke-dasharray:12 14;animation:move 2.8s linear infinite}@keyframes move{to{stroke-dashoffset:-52}}</style></defs>
  <rect class="bg" width="1600" height="820"/><text class="text" x="65" y="68" font-size="36" font-weight="700">A real-time specialist team around an AgentRig task</text><text class="small" x="65" y="103">The moving dots represent work and status events; the project workspace remains the durable record.</text>
  <rect class="rig" x="65" y="275" width="280" height="180" rx="18"/><text class="label" x="105" y="320">AGENTRIG</text><text class="text" x="105" y="365">Project task</text><text class="small" x="105" y="405">brief · context · approval</text>
  <rect class="docker" x="535" y="160" width="530" height="500" rx="22"/><text class="label" x="575" y="205">DOCKER AGENT TEAM</text><rect class="agent" x="575" y="250" width="210" height="115" rx="14"/><text class="text" x="610" y="295">Investigator</text><text class="small" x="610" y="330">diagnose</text><rect class="agent" x="815" y="250" width="210" height="115" rx="14"/><text class="text" x="850" y="295">Fixer</text><text class="small" x="850" y="330">implement</text><rect class="review" x="695" y="445" width="210" height="115" rx="14"/><text class="text" x="730" y="490">Reviewer</text><text class="small" x="730" y="525">check result</text><path class="line" d="M785 365 L785 445"/>
  <rect class="review" x="1240" y="275" width="280" height="180" rx="18"/><text class="label" x="1280" y="320">AGENTRIG</text><text class="text" x="1280" y="365">Handoff result</text><text class="small" x="1280" y="405">findings · patch · decision</text>
  <path class="flow" d="M345 365 C420 365 450 300 535 300"/><path class="flow" d="M1065 560 C1150 560 1160 365 1240 365"/><circle class="pulse" r="9"><animateMotion dur="2.8s" repeatCount="indefinite" path="M345 365 C420 365 450 300 535 300"/></circle><circle class="pulse" r="9"><animateMotion dur="2.8s" repeatCount="indefinite" path="M1065 560 C1150 560 1160 365 1240 365"/></circle>
  <rect class="rig" x="65" y="570" width="425" height="120" rx="16"/><text class="small" x="100" y="615">AgentRig owns task state and durable handoffs.</text><text class="small" x="100" y="650">Docker Agent owns specialist delegation.</text>
</svg>
