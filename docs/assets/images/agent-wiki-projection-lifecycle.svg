<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Agent wiki projection lifecycle</title>
  <desc id="desc">A dark lifecycle diagram showing a reviewed wiki change producing updated vector and graph projections, with retrieval using the projections and answers citing the canonical page.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.wiki{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.review{fill:#332b1d;stroke:#e2b866;stroke-width:2}.derived{fill:#17263b;stroke:#587692;stroke-width:2}.graph{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.text{fill:#e7eef6;font:23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}.yellow{stroke:#e2b866;stroke-width:3;fill:none;marker-end:url(#arrow)}.purple{stroke:#ba79c7;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="780"/><text class="text" x="65" y="68" font-size="36" font-weight="700">Retrieval indexes are projections, not competing wikis</text><text class="small" x="65" y="103">A reviewed page changes first. The vector and graph views follow it.</text>
  <rect class="review" x="65" y="250" width="250" height="145" rx="16"/><text class="label" x="100" y="290">CHANGE</text><text class="text" x="100" y="330">Reviewed page</text><text class="small" x="100" y="365">status and owner known</text>
  <rect class="wiki" x="420" y="250" width="250" height="145" rx="16"/><text class="label" x="455" y="290">CANONICAL</text><text class="text" x="455" y="330">Wiki update</text><text class="small" x="455" y="365">source of truth</text>
  <path class="yellow" d="M315 322 L420 322"/>
  <rect class="derived" x="800" y="150" width="280" height="145" rx="16"/><text class="label" x="840" y="190">REBUILD</text><text class="text" x="840" y="230">Vector chunks</text><text class="small" x="840" y="265">embeddings and metadata</text>
  <rect class="graph" x="800" y="440" width="280" height="145" rx="16"/><text class="label" x="840" y="480">REBUILD</text><text class="text" x="840" y="520">Graph edges</text><text class="small" x="840" y="555">entities and provenance</text>
  <path class="line" d="M670 295 L800 225"/><path class="purple" d="M670 350 L800 510"/>
  <rect class="derived" x="1190" y="150" width="280" height="145" rx="16"/><text class="label" x="1230" y="190">RETRIEVE</text><text class="text" x="1230" y="230">Precise passages</text><text class="small" x="1230" y="265">vector_search_tool</text>
  <rect class="graph" x="1190" y="440" width="280" height="145" rx="16"/><text class="label" x="1230" y="480">RETRIEVE</text><text class="text" x="1230" y="520">Relationships</text><text class="small" x="1230" y="555">graph_search_tool</text>
  <path class="line" d="M1080 225 L1190 225"/><path class="purple" d="M1080 510 L1190 510"/>
  <rect class="wiki" x="540" y="650" width="520" height="60" rx="14"/><text class="small" x="580" y="688">Rebuild after approved changes; never hand-edit derived indexes.</text>
</svg>
