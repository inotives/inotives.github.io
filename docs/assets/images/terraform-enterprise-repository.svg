<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Terraform repository structure</title>
  <desc id="desc">A dark repository tree showing reusable modules, environment root modules for dev staging and prod, global resources, policies, and GitHub workflows.</desc>
  <defs><style>.bg{fill:#0b1220}.folder{fill:#17263b;stroke:#587692;stroke-width:2}.env{fill:#13283a;stroke:#2c9c9c;stroke-width:2}.policy{fill:#332b1d;stroke:#e2b866;stroke-width:2}.ci{fill:#2a2038;stroke:#ba79c7;stroke-width:2}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.branch{stroke:#667d96;stroke-width:3;fill:none}</style></defs>
  <rect class="bg" width="1600" height="860"/><text class="text" x="65" y="68" font-size="36" font-weight="700">A repository that separates reuse from environments</text><text class="small" x="65" y="103">Modules define patterns. Root modules decide what each environment actually deploys.</text>
  <rect class="folder" x="65" y="180" width="300" height="540" rx="18"/><text class="label" x="100" y="225">terraform/</text><text class="text" x="100" y="275">modules/</text><text class="small" x="130" y="315">networking/</text><text class="small" x="130" y="350">lakehouse/</text><text class="small" x="130" y="385">iam/</text><text class="small" x="130" y="420">mage-runtime/</text><text class="small" x="130" y="455">athena/</text><text class="text" x="100" y="510">environments/</text><text class="small" x="130" y="550">dev/</text><text class="small" x="130" y="585">staging/</text><text class="small" x="130" y="620">prod/</text><text class="small" x="100" y="675">global/ · policies/</text>
  <path class="branch" d="M365 330 L470 330 M365 555 L470 555"/>
  <rect class="env" x="470" y="180" width="300" height="175" rx="16"/><text class="label" x="505" y="220">ENVIRONMENT ROOT</text><text class="text" x="505" y="265">dev/</text><text class="small" x="505" y="300">main.tf · dev.tfvars</text><text class="small" x="505" y="330">dev state + account</text>
  <rect class="env" x="470" y="390" width="300" height="175" rx="16"/><text class="label" x="505" y="430">ENVIRONMENT ROOT</text><text class="text" x="505" y="475">staging/</text><text class="small" x="505" y="510">main.tf · staging.tfvars</text><text class="small" x="505" y="540">staging state + account</text>
  <rect class="env" x="470" y="600" width="300" height="175" rx="16"/><text class="label" x="505" y="640">ENVIRONMENT ROOT</text><text class="text" x="505" y="685">prod/</text><text class="small" x="505" y="720">main.tf · prod.tfvars</text><text class="small" x="505" y="750">prod state + account</text>
  <path class="branch" d="M770 267 L875 267 M770 477 L875 477 M770 687 L875 687"/>
  <rect class="policy" x="875" y="180" width="290" height="175" rx="16"/><text class="label" x="910" y="220">GLOBAL</text><text class="text" x="910" y="265">Identity and state</text><text class="small" x="910" y="300">OIDC · backend · audit</text><text class="small" x="910" y="330">shared foundations</text>
  <rect class="policy" x="875" y="390" width="290" height="175" rx="16"/><text class="label" x="910" y="430">POLICIES</text><text class="text" x="910" y="475">Guardrails</text><text class="small" x="910" y="510">naming · regions · cost</text><text class="small" x="910" y="540">security checks</text>
  <rect class="ci" x="875" y="600" width="290" height="175" rx="16"/><text class="label" x="910" y="640">GITHUB</text><text class="text" x="910" y="685">Actions workflows</text><text class="small" x="910" y="720">plan · approval · apply</text><text class="small" x="910" y="750">OIDC role assumption</text>
  <rect class="folder" x="1245" y="280" width="290" height="310" rx="18"/><text class="label" x="1280" y="325">ONE MARKET DATA STACK</text><text class="text" x="1280" y="370">S3 + Iceberg</text><text class="small" x="1280" y="405">Raw · Bronze · Silver · Gold</text><text class="text" x="1280" y="460">Athena + Glue</text><text class="small" x="1280" y="495">workgroups and catalog</text><text class="text" x="1280" y="550">Mage runtime</text>
</svg>
