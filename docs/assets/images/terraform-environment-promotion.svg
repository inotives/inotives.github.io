<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Terraform dev staging production promotion</title>
  <desc id="desc">A dark promotion flow from a GitHub pull request through plan, dev apply, staging approval, production plan, and production apply, with separate state and cloud boundaries for each environment.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa4bf"/></marker><style>.bg{fill:#0b1220}.step{fill:#17263b;stroke:#587692;stroke-width:2}.dev{fill:#17343a;stroke:#2c9c9c;stroke-width:2}.stage{fill:#332b1d;stroke:#e2b866;stroke-width:2}.prod{fill:#30202b;stroke:#df7b86;stroke-width:2}.text{fill:#e7eef6;font:24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#9eb1c5;font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#7ee0d1;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:700}.line{stroke:#8aa4bf;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="760"/><text class="text" x="65" y="68" font-size="36" font-weight="700">Promote the same design through isolated environments</text><text class="small" x="65" y="103">The code is shared. State, accounts, credentials, and data locations are not.</text>
  <rect class="step" x="65" y="235" width="210" height="135" rx="16"/><text class="label" x="95" y="275">GITHUB</text><text class="text" x="95" y="315">Pull request</text><text class="small" x="95" y="345">reviewed HCL</text>
  <rect class="step" x="350" y="235" width="210" height="135" rx="16"/><text class="label" x="380" y="275">CHECK</text><text class="text" x="380" y="315">Validate + plan</text><text class="small" x="380" y="345">fmt · validate · policy</text>
  <rect class="dev" x="635" y="235" width="210" height="135" rx="16"/><text class="label" x="665" y="275">DEV</text><text class="text" x="665" y="315">Apply</text><text class="small" x="665" y="345">smoke test stack</text>
  <rect class="stage" x="920" y="235" width="210" height="135" rx="16"/><text class="label" x="950" y="275">STAGING</text><text class="text" x="950" y="315">Approval + apply</text><text class="small" x="950" y="345">integration checks</text>
  <rect class="prod" x="1205" y="235" width="270" height="135" rx="16"/><text class="label" x="1235" y="275">PRODUCTION</text><text class="text" x="1235" y="315">Reviewed plan + apply</text><text class="small" x="1235" y="345">explicit approval</text>
  <path class="line" d="M275 302 L350 302"/><path class="line" d="M560 302 L635 302"/><path class="line" d="M845 302 L920 302"/><path class="line" d="M1130 302 L1205 302"/>
  <rect class="dev" x="140" y="510" width="330" height="125" rx="16"/><text class="label" x="175" y="550">DEV BOUNDARY</text><text class="text" x="175" y="590">dev account + state</text><text class="small" x="175" y="618">dev S3 and Glue catalog</text>
  <rect class="stage" x="635" y="510" width="330" height="125" rx="16"/><text class="label" x="670" y="550">STAGING BOUNDARY</text><text class="text" x="670" y="590">staging account + state</text><text class="small" x="670" y="618">staging data and roles</text>
  <rect class="prod" x="1130" y="510" width="330" height="125" rx="16"/><text class="label" x="1165" y="550">PRODUCTION BOUNDARY</text><text class="text" x="1165" y="590">prod account + state</text><text class="small" x="1165" y="618">prod data and roles</text>
  <path class="line" d="M740 370 L305 510"/><path class="line" d="M1025 370 L800 510"/><path class="line" d="M1340 370 L1295 510"/>
  <rect class="step" x="65" y="685" width="1410" height="45" rx="12"/><text class="small" x="95" y="715">GitHub Actions assumes a short-lived role through OIDC. No environment shares a Terraform state file or production credentials.</text>
</svg>
